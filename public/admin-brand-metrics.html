<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Host and brand retention · Pottery Lab</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/teams-intel.css"><link rel="stylesheet" href="/teams-panel.css"></head>
<body class="bb ti tp"><main class="bb-wrap" id="main" aria-busy="true"><div class="ti-skel" aria-label="Loading"><i class="k"></i><i class="h"></i><i class="t"></i></div></main>
<script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, money, $ } = BB, main = $("#main");
  const row = (label, x, note = "") => `<li><span>${esc(label)}${note ? `<small class="bb-meta" style="display:block;margin:0">${esc(note)}</small>` : ""}</span><b>${esc(x.text)}${x.pct != null ? ` (${x.pct}%)` : ""}</b></li>`;
  (async () => { let d; try { d = await api("/api/admin/brand-metrics"); } catch (e) { main.removeAttribute("aria-busy"); main.innerHTML = `<section class="bb-xhead"><h1>Not found</h1></section>`; return; }
    main.removeAttribute("aria-busy");
    main.innerHTML = `<header class="ti-head"><div><p class="bb-kicker">Internal · admins only</p><h1>Host and brand retention</h1><p class="ti-sub">The evidence behind the moat: do hosts keep getting booked, do brands come back, and how much of a host's room their own following fills. Every number shows what it's out of.</p></div></header>
      <div class="tp-grid two"><section class="tp-box"><h2>Brands</h2><ul class="tp-den">${row("Brands that booked again", d.brandRebook)}${row("Brands that rebooked the same host", d.sameHostRebook)}</ul></section>
        <section class="tp-box"><h2>Hosts</h2><ul class="tp-den"><li><span>Repeat revenue per host<small class="bb-meta" style="display:block;margin:0">Average across ${d.hosts} hosts with team bookings</small></span><b>${money(d.repeatRevenuePerHostCents)}</b></li>${row("Hosts with repeat revenue", d.repeatHosts)}${row("Host-sourced team seats from their followers", d.teamSeatsFromFollowers)}${row("Guests at hosts' own events who follow them", d.ownEventsFromFollowers)}</ul></section></div>
      <section class="tp-box"><h2>Host cohorts</h2><p class="ti-sub">Hosts grouped by the month of their first team booking.</p>${d.cohorts.length ? `<div class="tp-scroll"><table class="tp-tbl"><thead><tr><th>First booked</th><th>Hosts</th><th>Booked again within 3 months</th><th>Booked again at all</th></tr></thead><tbody>${d.cohorts.map((c) => `<tr><td>${esc(new Date(c.cohort + "-15T12:00:00Z").toLocaleDateString("en-US", { month: "short", year: "numeric", timeZone: "UTC" }))}</td><td class="n">${c.hosts}</td><td class="n">${c.again90} (${c.again90Pct}%)</td><td class="n">${c.againAny} (${c.againAnyPct}%)</td></tr>`).join("")}</tbody></table></div>` : `<p class="ti-sub">No team bookings yet.</p>`}</section>`;
  })();
})();
</script></body></html>
