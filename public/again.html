<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Same table next time · Pottery Lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" id="gfonts"><script>addEventListener("load",()=>{document.getElementById("gfonts").media="all"})</script>
<style>
/* "Same table next time?", from the note a guest gets within a day of an event (/again/<event>?rid=..&code=..).
   One tap replies I'm in to the next date, or holds the spot until the host sets it (server/tables.js). Opening the page
   changes nothing; only the button does. */
:root{--paper:#F7F1E8;--ink:#1F1A17;--smoke:#665A51;--ember:#C94A30;--ember-d:#A63A22;--line:#E4D9C8;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
a{color:var(--ember-d)}main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 40px}
.top{display:flex;align-items:center;margin:4px 0 18px}.brand{display:flex;gap:8px;align-items:center;font:700 20px Fredoka,system-ui;text-decoration:none;color:var(--ink)}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;font-variant-numeric:tabular-nums}
.eyebrow{margin:0 0 6px;font:600 11px/1.3 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke)}
h1{font:700 30px/1.12 Fredoka,system-ui;margin:0 0 8px}.muted{color:var(--smoke)}p{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}
.next{display:grid;gap:2px;margin:0 0 14px}.next b{font-size:18px}
.go{width:100%;min-height:52px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 16px "Instrument Sans",system-ui,sans-serif;cursor:pointer}.go:disabled{opacity:.6}
.go:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.done{font-size:18px;font-weight:600}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><a class="brand" href="/"><img src="/favicon.svg" alt="" width="24" height="24">pottery lab</a></div>
<div id="m"><p class="muted">Opening…</p></div>
</main>
<script>
(function () {
  const id = (location.pathname.match(/^\/again\/([A-Za-z0-9_-]{2,80})/) || [])[1], Q = new URLSearchParams(location.search), rid = Q.get("rid") || "", code = Q.get("code") || "";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]), m = document.getElementById("m");
  const day = (d) => { const x = new Date(String(d || "") + "T12:00:00"); return isNaN(x) ? "" : x.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); };
  const clock = (t) => { const r = /^(\d{2}):(\d{2})$/.exec(t || ""); if (!r) return ""; let h = +r[1]; const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}${r[2] === "00" ? "" : ":" + r[2]}${ap}`; };
  const and = (L) => (L.length <= 1 ? L.join("") : L.length === 2 ? `${L[0]} and ${L[1]}` : `${L.slice(0, -1).join(", ")} and ${L[L.length - 1]}`);
  let gk = ""; try { gk = localStorage.getItem("encore.gkey") || ""; if (!gk) { gk = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""); localStorage.setItem("encore.gkey", gk); } } catch {}
  const fail = (t) => { m.innerHTML = `<h1>This link isn't working</h1><p class="muted">${esc(t || "Open the one from your email.")}</p>`; };
  if (!id) return fail();
  fetch(`/api/public/again/${encodeURIComponent(id)}?rid=${encodeURIComponent(rid)}&code=${encodeURIComponent(code)}`).then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) return fail(j.message); show(j); }).catch(() => fail("Check your connection and try again."));
  function show(j) {
    const host = and(j.hosts || []), nx = j.next, inAlready = nx && nx.response === "going";
    document.title = `Same table next time? ${j.title} · Pottery Lab`;
    m.innerHTML = `<p class="eyebrow">${esc(j.title)}${j.date ? ` · <span class="mono">${esc(day(j.date))}</span>` : ""}</p><h1>Same table next time${j.name ? `, ${esc(j.name)}` : ""}?</h1>
      <p class="muted">${host ? `${esc(host)} ${(j.hosts || []).length > 1 ? "host" : "hosts"} it again` : "It happens again"}${nx ? "." : `. ${host ? esc((j.hosts || [])[0]) : "The host"} hasn't set the next date yet. Tap now and you're in once it's up.`}</p>
      <div class="card">${nx ? `<div class="next"><span class="eyebrow">Next one</span><b><span class="mono">${esc(day(nx.date))}${nx.startTime ? ` · ${esc(clock(nx.startTime))}` : ""}</span></b></div>` : ""}
        <div id="act">${inAlready ? `<p class="done">You're in for ${esc(day(nx.date))}.</p><p><a href="/e/${encodeURIComponent(nx.id)}">Open the invite</a></p>` : j.pledged ? `<p class="done">You're in once the next date is set.</p>` : `<button class="go" id="go" type="button">I'm in</button>`}</div></div>
      <p class="muted" style="font-size:14px">Not this time? You don't need to do anything.</p>`;
    const b = document.getElementById("go"); if (!b) return;
    b.onclick = async () => { b.disabled = true; b.textContent = "One moment…";
      const r = await fetch(`/api/public/again/${encodeURIComponent(id)}`, { method: "POST", headers: { "Content-Type": "application/json", "x-encore-key": gk }, body: JSON.stringify({ rid, code }) }).catch(() => null), x = r ? await r.json().catch(() => ({})) : {};
      const act = document.getElementById("act"); if (!r || !r.ok) { b.disabled = false; b.textContent = "I'm in"; act.insertAdjacentHTML("beforeend", `<p class="muted">${esc(x.message || "Couldn't save that. Try again.")}</p>`); return; }
      if (x.next && x.rid && x.code && x.state !== "order") { try { localStorage.setItem("encore-rsvp-" + x.next.id, JSON.stringify({ rid: x.rid, code: x.code, name: x.name || "", gi: -1, response: x.state === "waitlist" ? "waitlist" : x.state === "requested" ? "requested" : "going", wall: false, eventId: x.next.id, data: {} })); } catch {} }
      act.innerHTML = x.state === "pledged" ? `<p class="done">You're in once the next date is set.</p><p class="muted">We'll email you when it's up.</p>`
        : x.state === "order" ? `<p class="done">The next one is up. Pick what you'd like on the invite.</p><p><a href="/e/${encodeURIComponent(x.next.id)}">Open the invite to order</a></p>`
        : x.state === "requested" ? `<p class="done">You asked to join ${esc(day(x.next.date))}. The host lets each guest in, and you'll get an email when you're in.</p><p><a href="/e/${encodeURIComponent(x.next.id)}">Open the invite</a></p>`
        : x.state === "waitlist" ? `<p class="done">It's full, so you're on the waitlist for ${esc(day(x.next.date))}.</p><p><a href="/e/${encodeURIComponent(x.next.id)}">Open the invite</a></p>`
        : `<p class="done">You're in for ${esc(day(x.next.date))}.</p><p><a href="/e/${encodeURIComponent(x.next.id)}">Open the invite</a></p>`; };
  }
})();
</script>
</body></html>
