<style>

.hist{font-size:13px;color:var(--smoke);margin-top:12px}
a{color:var(--ember, #C94A30)}</style></head><body><div class="wrap"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#C4532F"/><circle cx="19" cy="9" r="3.2" fill="#F2D48F"/></svg>encore</a><a href="/requests" style="float:right;margin-top:6px;font-weight:600;font-size:14px">All your requests →</a><div id="m">Loading…</div></div>
<script src="/community.js"></script><script src="/avatars.js"></script>
<script>
const money = (s) => { const n = parseFloat(String(s || "").replace(/[^0-9.]/g, "")); return isFinite(n) ? n : null; };
/** The event's date from free text like "Wed Mar 4, 6-8pm" or "March 12" (this year, or next if it's passed). */
function eventDate(when) { const w = String(when || ""), m = w.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?/i) || w.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?(?:,?\s*(\d{4}))?/i); if (!m) return null;
  const [mon, day] = /\d/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]], mi = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"].indexOf(mon.slice(0, 3).toLowerCase()); let y = +m[3] || new Date().getFullYear(); let d = new Date(y, mi, +day, 12); if (!m[3] && d < Date.now() - 864e5) d = new Date(y + 1, mi, +day, 12); return d; }

  return k === "day" ? { date: ev, label: "on the day" } : k === "before7" ? { date: new Date(ev.getTime() - 7 * 864e5), label: "7 days before the event" } : k === "now" ? { date: new Date(), label: "now" } : { date: new Date(ev.getTime() + 7 * 864e5), label: "7 days after the event" }; };
/** Start and end from "Thu Mar 4, 6-8pm"; all-day when there's no time. */
function calSpan(b) { const d = eventDate(b.when), w = String(b.when || ""), m = w.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*[-–to]+\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i) || w.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  const ymd = (x) => `${x.getFullYear()}${String(x.getMonth() + 1).padStart(2, "0")}${String(x.getDate()).padStart(2, "0")}`; if (!m) return { g: `${ymd(d)}/${ymd(new Date(d.getTime() + 864e5))}`, s: null };
  const ap2 = (m[6] || m[3] || "").toLowerCase(), ap1 = (m[3] || ap2).toLowerCase(), hr = (h, ap) => (+h % 12) + (ap === "pm" ? 12 : 0); const s = new Date(d); s.setHours(hr(m[1], ap1), +(m[2] || 0), 0, 0); const e = new Date(s); if (m[4]) e.setHours(hr(m[4], ap2), +(m[5] || 0), 0, 0); else e.setHours(s.getHours() + 2); if (e <= s) e.setHours(s.getHours() + 2);
  const t = (x) => `${ymd(x)}T${String(x.getHours()).padStart(2, "0")}${String(x.getMinutes()).padStart(2, "0")}00`; return { g: `${t(s)}/${t(e)}`, s: t(s), e: t(e) }; }
const weekdayNote = (when) => { const ev = eventDate(when), m = String(when || "").match(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/i); if (!ev || !m) return ""; const real = ev.toLocaleDateString("en-US", { weekday: "short" }); return real.slice(0, 3).toLowerCase() === m[1].slice(0, 3).toLowerCase() ? "" : `${ev.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })} is a ${ev.toLocaleDateString("en-US", { weekday: "long" })}. Check the date with the host.`; };
const balance = (q) => { const T = money(q.total), D = money(q.deposit); return T != null && D != null && T > D ? "$" + (T - D).toLocaleString("en-US", { maximumFractionDigits: 2 }) : ""; };

  const { jsPDF } = window.jspdf, d = new jsPDF({ unit: "pt", format: "letter" }), q = b.quote || {}, L = 56; let y = 70; const line = (t, opt = {}) => { d.setFont("helvetica", opt.bold ? "bold" : "normal"); d.setFontSize(opt.size || 11); d.setTextColor(opt.muted ? 117 : 31, opt.muted ? 104 : 26, opt.muted ? 95 : 23); const parts = d.splitTextToSize(String(t || ""), opt.w || 500); d.text(parts, opt.x || L, y); y += (opt.size || 11) * 1.4 * parts.length; };

  d.setFont("helvetica", "bold"); d.setFontSize(12); d.setTextColor(...rgb); d.text(h.name || "", L, 46); d.setTextColor(31, 26, 23); y = 84;
  line("Invoice", { bold: true, size: 26 }); line(`${q.invoiceNo || ""}  ·  Issued ${new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}`, { muted: true });

  y += 8; d.line(L, y, 556, y); y += 22; const row = (k, v, bold) => { d.setFont("helvetica", bold ? "bold" : "normal"); d.setFontSize(bold ? 13 : 11); d.text(k, L, y); d.text(String(v), 556, y, { align: "right" }); y += 20; };
  row("Total", q.total || "", true); if (q.deposit) { row(`Deposit${b.depositPaid ? " (received)" : " (due now)"}`, q.deposit, !b.depositPaid); const bal = balance(q); if (bal) row(`Balance due ${due} (${dueLabel})`, bal, !!b.depositPaid); }
  y += 16; if (h.terms) line(`Terms: ${h.terms}`, { muted: true }); if (q.payUrl && !b.depositPaid) line(`Pay the deposit online: ${q.payUrl}`, { muted: true }); line("Booked through Encore.", { muted: true });
  d.save(`${(q.invoiceNo || "invoice")}-${String(b.company || "booking").replace(/[^A-Za-z0-9]+/g, "-")}.pdf`); }
(async function () { const esc = window.EncoreCommunity.esc, A = window.EncoreAvatars, id = location.pathname.split("/").pop(), t = new URLSearchParams(location.search).get("t") || "", _rem = (() => { try { const L = JSON.parse(localStorage.getItem("encore.bookings") || "[]"); if (t && !L.some((x) => x.id === location.pathname.split("/").pop())) { L.unshift({ id: location.pathname.split("/").pop(), link: location.pathname + location.search, at: Date.now() }); localStorage.setItem("encore.bookings", JSON.stringify(L.slice(0, 30))); } } catch {} })(), m = document.getElementById("m");
  async function draw() { let j; try { const r = await fetch(`/api/public/booking/${encodeURIComponent(id)}?t=${encodeURIComponent(t)}`); j = await r.json(); if (!r.ok) throw new Error(j.message); } catch (e) { m.innerHTML = `<p>${esc(e.message || "This link isn't valid.")}</p>`; return; }
    const b = j.booking, h = j.host; try { const L = JSON.parse(localStorage.getItem("encore.bookings") || "[]"), e = L.find((x) => x.id === id); if (e) { e.title = `${b.experience?.name || (b.kind === "gift" ? "A gift order" : "A booking")} · ${h.name}`; e.when = b.when || ""; e.status = b.status; localStorage.setItem("encore.bookings", JSON.stringify(L)); } } catch {} const st = b.status, dep = !!b.quote?.deposit, idx = b.kind === "gift" ? { requested: 1, quoted: 2, booked: 3, done: 4, declined: 0 }[st] : dep ? { requested: 1, quoted: 2, booked: !b.depositPaid ? 3 : 4, done: 4, declined: 0 }[st] : { requested: 1, quoted: 2, booked: 3, done: 3, declined: 0 }[st], LAB = b.kind === "gift" ? ["Requested", "Quoted", "Ordered", "Delivered"] : dep ? ["Requested", "Quoted", "Deposit", "Booked"] : ["Requested", "Quoted", "Booked"];
    const head = { requested: `${esc(h.name)} has your request`, quoted: `${esc(h.name)} sent a quote`, booked: b.quote?.deposit && !b.depositPaid ? "Accepted: pay the deposit to lock it in" : "You're booked 🎉", done: "That's a wrap", declined: `${esc(h.name)} can't take this one` }[st];
    m.innerHTML = `<span class="eyebrow">${b.kind === "gift" ? "Your gift order" : "Your booking"}${b.company ? ` for ${esc(b.company)}` : ""}</span><h1 style="font-size:40px;line-height:1.05;margin-top:6px">${head}</h1>
      <div class="steps" style="grid-template-columns:repeat(${LAB.length},1fr)">${LAB.map((l, i) => `<span class="${idx > i + 1 || idx === LAB.length ? "done" : idx === i + 1 ? "on" : ""}" title="${l}"></span>`).join("")}</div><div class="steplabs" style="grid-template-columns:repeat(${LAB.length},1fr)">${LAB.map((l, i) => `<small class="${idx >= i + 1 ? "on" : ""}">${l}</small>`).join("")}</div>
