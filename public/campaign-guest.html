<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your invite · Pottery Lab</title><meta name="description" content="Reply to an invite, or ask to join, and choose what you share."><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/teams-intel.css"><link rel="stylesheet" href="/teams-panel.css"></head>
<body class="bb ti"><header class="bb-top"><div class="in"><a class="bb-logo" href="/"><svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.2h8M11.1 4.2v1.7c0 1.2-.9 1.8-.9 2.9 0 1.3-5.5 3.2-5.5 8.9 0 4.5 4.1 7.3 9.3 7.3s9.3-2.8 9.3-7.3c0-5.7-5.5-7.6-5.5-8.9 0-1.1-.9-1.7-.9-2.9V4.2M12.7 19.2c.8.55 1.8.55 2.6 0"/></svg><span>Pottery Lab</span></a></div></header>
<main class="bb-wrap bb-narrow" id="main"><p class="bb-meta" style="padding-top:24px">Loading…</p></main>
<script src="/eventart.js"></script><script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, icon, $ } = BB, main = $("#main"), p = location.pathname.split("/").filter(Boolean), cid = p[1], token = p[3] || "";
  const day = (d) => (d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" }) : "Date to come");
  const oops = (e) => (main.innerHTML = `<section class="bb-xhead"><h1>This link doesn't work</h1><p class="bb-lede">${esc(e.message)}</p></section>`);
  const evCard = (e) => `<div class="ti-card" style="margin:16px 0"><p class="ti-k">${esc(day(e.date))}</p><h2>${esc(e.name)}</h2><p class="ti-sub">With ${esc(e.host)}${e.area ? ` in ${esc(e.area)}` : ""} · a small group of about ${e.headcount}. The exact place comes once you're in.</p>${e.photos ? `<p class="ti-sub">${esc(e.photos)}</p>` : ""}</div>`;
  async function rsvp() { let d; try { d = await api(`/api/cg/${cid}/r/${token}`); } catch (e) { return oops(e); }
    const E = d.event, U = new URLSearchParams(location.search), one = U.get("r");
    if (d.past && d.checkedIn) return feedback(d);
    // one tap from the email: "I'm in" or "Can't go" lands here and is saved straight away
    if ((one === "yes" || one === "no") && !d.past && d.status !== one) { try { await api(`/api/cg/${cid}/r/${token}`, { reply: one }); history.replaceState(null, "", location.pathname); return rsvp(); } catch {} }
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">${esc(d.company)} invited you</p><h1>${d.name ? `${esc(d.name)}, are you <em>in?</em>` : "Are you <em>in?</em>"}</h1></section>
      ${d.from ? `<figure class="tp-from"><p>${esc(d.from.note || `I'd love you to come.`)}</p><small>${esc(d.from.name)}${d.from.title ? `, ${esc(d.from.title)}` : ""}, ${esc(d.company)}</small></figure>` : ""}
      ${d.status === "yes" ? `<p class="bb-note">${icon("check")} You're in. See you there.</p>` : d.status === "no" ? `<p class="bb-note">Thanks for letting ${esc(d.company)} know.</p>` : ""}
      ${E ? evCard(E) : ""}
      <div class="ti-actions"><button class="bb-btn ${d.status === "yes" ? "ink" : "primary"} lg" data-r="yes" aria-pressed="${d.status === "yes"}">${d.status === "yes" ? icon("check") : ""}I'm in</button><button class="bb-btn quiet lg" data-r="no" aria-pressed="${d.status === "no"}">Can't go</button></div>
      <label class="ti-card quiet" style="display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin-top:16px"><input type="checkbox" id="share" ${d.consent ? "checked" : ""} style="width:22px;height:22px;margin-top:2px"><span><b>Share my name and email with ${esc(d.company)}</b><br><span class="bb-meta">So they can follow up after the event. Leave it off and they won't get your details from Pottery Lab. You can change this any time with this link.</span></span></label>
      <p class="bb-meta" id="msg" role="status"></p>
      ${d.prefs && !d.past ? `<form class="ti-card quiet" id="prefs" style="margin-top:16px"><p class="ti-k">Optional</p>
        <p class="tp-q">${esc(d.prefs.part)}</p><div class="tp-yn" role="radiogroup" aria-label="${esc(d.prefs.part)}">${Object.entries(d.prefs.parts).map(([k, v]) => `<label><input type="radio" name="part" value="${esc(k)}"${d.prefs.mine?.part === k ? " checked" : ""}> ${esc(v)}</label>`).join("")}</div>
        <p class="tp-q">${esc(d.prefs.intros)}</p><div class="tp-yn" role="radiogroup" aria-label="${esc(d.prefs.intros)}">${Object.entries(d.prefs.intros).map(([k, v]) => `<label><input type="radio" name="intros" value="${esc(k)}"${d.prefs.mine?.intros === k ? " checked" : ""}> ${esc(v)}</label>`).join("")}</div>
        <p class="tp-note">${esc(d.prefs.note)}</p></form>` : ""}`;
    $("#prefs")?.addEventListener("change", async (e) => { const n = e.target.name; if (!["part", "intros"].includes(n)) return; try { await api(`/api/cg/${cid}/r/${token}`, { [n]: e.target.value }); BB.toast("Saved for the host"); } catch (er) { BB.toast(er.message); } });
    main.querySelectorAll("[data-r]").forEach((b) => (b.onclick = async () => { try { await api(`/api/cg/${cid}/r/${token}`, { reply: b.dataset.r, consent: $("#share").checked }); $("#msg").textContent = b.dataset.r === "yes" ? "You're in. See you there." : "Thanks for letting them know."; setTimeout(rsvp, 900); } catch (e) { $("#msg").textContent = e.message; } }));
    $("#share").onchange = async (e) => { try { await api(`/api/cg/${cid}/r/${token}`, { consent: e.target.checked }); $("#msg").textContent = e.target.checked ? `${d.company} can see your name and email.` : `${d.company} won't get your details from us.`; } catch {} };
  }
  function feedback(d) {
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">Thanks for coming</p><h1>How was <em>${esc(d.event?.name || "it")}</em>?</h1><p class="bb-lede">${esc(d.company)} sees your answers only as totals, mixed with everyone else's.</p>${d.survey ? `<p><a class="bb-btn primary" href="${esc(d.survey)}">Four quick questions, and stay in touch with people you met</a></p>` : ""}</section>
      <form id="fb" class="ti-card"><p class="ti-k">Would you go again?</p><div class="ti-actions" style="margin-top:0"><label class="bb-chip"><input type="radio" name="again" value="yes" ${d.again === true ? "checked" : ""}> Yes</label><label class="bb-chip"><input type="radio" name="again" value="no" ${d.again === false ? "checked" : ""}> Not really</label></div>
      <label class="bb-field"><span>What stood out? (optional)</span><textarea name="said" rows="3" maxlength="600" placeholder="The people, the food, what you made…"></textarea></label>
      <label style="display:flex;gap:8px;align-items:flex-start;margin:0 0 14px"><input type="checkbox" name="quoteOk" ${d.quoteOk ? "checked" : ""} style="margin-top:4px"><span>OK to quote me, with my first name</span></label>
      <button class="bb-btn primary" type="submit">Send</button><p class="bb-meta" id="msg" role="status"></p></form>`;
    $("#fb").onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target); try { await api(`/api/cg/${cid}/r/${token}`, { again: f.get("again") === "yes" ? true : f.get("again") === "no" ? false : null, said: f.get("said") || "", quoteOk: !!f.get("quoteOk") }); $("#msg").textContent = "Thank you. That helps the next one."; } catch (er) { $("#msg").textContent = er.message; } };
  }
  async function join() { let d; try { d = await api(`/api/cg/${cid}`); } catch (e) { return oops(e); }
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">${esc(d.company)}</p><h1>${esc(d.title)}</h1><p class="bb-lede">Small, hosted events. Ask to join and ${esc(d.company)} will send you an invite if there's room.</p></section>
      ${d.events.map(evCard).join("")}
      <form id="jf" class="ti-card"><label class="bb-field"><span>Your name</span><input name="name" required autocomplete="name"></label><label class="bb-field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
      <div class="bb-row"><label class="bb-field"><span>Company</span><input name="company" autocomplete="organization"></label><label class="bb-field"><span>Title</span><input name="title" autocomplete="organization-title"></label></div>
      ${d.events.length > 1 ? `<label class="bb-field"><span>Which one?</span><select name="event">${d.events.map((e) => `<option value="${esc(e.id)}">${esc(e.name)}, ${esc(day(e.date))}</option>`).join("")}</select></label>` : d.events[0] ? `<input type="hidden" name="event" value="${esc(d.events[0].id)}">` : ""}
      <label style="display:flex;gap:8px;align-items:flex-start;margin:0 0 14px"><input type="checkbox" name="consent" style="margin-top:4px"><span>Share my name and email with ${esc(d.company)}, so they can follow up<small class="bb-meta" style="display:block">Optional. Leave it off and they only see your first name.</small></span></label>
      <button class="bb-btn primary block lg" type="submit">Ask to join</button><p class="bb-meta" id="msg" role="status"></p></form>`;
    $("#jf").onsubmit = async (e) => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); try { await api(`/api/cg/${cid}/join`, { ...f, consent: !!f.consent }); main.innerHTML = `<section class="bb-xhead"><h1>Thanks, <em>you've asked</em></h1><p class="bb-lede">${esc(d.company)} will email you an invite if there's room.</p></section>`; } catch (er) { $("#msg").textContent = er.message; } };
  }
  p[2] === "join" ? join() : rsvp();
})();
</script></body></html>
