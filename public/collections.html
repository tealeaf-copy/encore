<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/calm.js"></script><script src="/authguard.js"></script>
<title>Collections · Pottery Lab</title>
<meta name="description" content="Small events and hosts, grouped by feel: quiet and nerdy, good for going solo, this weekend near you.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lists.css">
<style>
/* /collections and /c/<id>: one shelf per page, or every shelf. Tokens only (public/system.css) */
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--pl-page);color:var(--pl-ink);font:16px/1.5 var(--sys-sans)}
a{color:inherit}
.crumb{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--pl-accent-text);font:600 14px var(--sys-sans);text-decoration:none;margin:0 0 4px}
.crumb:hover{text-decoration:underline;text-underline-offset:3px}
.idx h1{font:400 var(--fs-28-40,28px)/1.08 var(--sys-display);letter-spacing:-.015em;margin:0}.idx>p{margin:8px 0 20px;color:var(--pl-soft);max-width:60ch}
</style><script src="/eventtypes.js"></script><script src="/eventart.js"></script><script src="/mascot.js"></script><script src="/avatars.js"></script></head><body>
<main class="ls-wrap" id="m">
  <a class="crumb" href="/discover"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Discover</a>
  <div id="c" data-calm="collection"></div>
</main>
<script src="/collections.js"></script>
<script>
(function () {
  const el = document.getElementById("c"), m = location.pathname.match(/^\/c\/([a-z0-9-]{2,40})$/);
  if (m) { window.PLCollections.page(el, m[1]); return; }
  // /collections: every shelf, with a line on what they are
  el.innerHTML = `<div class="idx"><h1>Collections</h1><p>Small events and hosts, grouped by feel. Each one fills itself from what's on.</p><div id="sh"></div></div>`;
  window.PLCollections.shelves(document.getElementById("sh"));
})();
</script>
<script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
