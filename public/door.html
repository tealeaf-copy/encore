<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Check-in · Encore</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--paper:#FFF8EE;--ink:#1F1A17;--smoke:#6B5F56;--ember:#C94A30;--line:#E4D9C8;--ok:#1E7A4C;--okbg:#E8F6EE}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}h1{font:700 24px/1.15 Fredoka,system-ui;margin:4px 0}.m{color:var(--smoke);font-size:14px}
.count{display:flex;align-items:baseline;gap:8px;margin:12px 0}.count b{font:700 44px/1 Fredoka,system-ui}.bar{height:10px;border-radius:6px;background:#EFE5D6;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--ok)}
.tools{position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:2;display:grid;grid-template-columns:1fr auto;gap:8px}input{width:100%;padding:12px 14px;border:1px solid #DCCFBE;border-radius:14px;font:inherit;font-size:17px;background:#fff;min-width:0}
.btn{padding:12px 16px;border-radius:999px;border:0;background:var(--ember);color:#fff;font:600 15px inherit;cursor:pointer;white-space:nowrap}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.g{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}.g.in{background:var(--okbg);border-color:#BFE3CE}
.g b{display:block;font-size:17px}.g small{display:block;color:var(--smoke);font-size:13.5px}.g .diet{color:#7A4E12}.tick{min-width:116px;padding:12px 14px;border-radius:999px;border:0;font:600 15px inherit;cursor:pointer;background:var(--ink);color:#fff}.g.in .tick{background:#fff;color:var(--ok);border:1px solid #BFE3CE}
.flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);z-index:5}.flash.warn{background:#7A4E12}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0}summary{cursor:pointer;font-weight:600}form.walk{display:grid;gap:8px;margin-top:10px}.err{color:#A3402B}</style></head><body>
<div class="wrap" id="app"><p class="m">Loading the guest list…</p></div>
<script src="/authguard.js"></script><script>
(function () { const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const id = location.pathname.split("/").pop(), t = new URLSearchParams(location.search).get("t") || ""; let D = null, q = "";
  const api = async (path, body) => { const r = await fetch(`/api/public/booking/${encodeURIComponent(id)}/${path}${body ? "" : "?t=" + encodeURIComponent(t)}`, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t, ...body }) } : {}); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || "That didn't work."); return j; };
  const flash = (txt, warn) => { document.querySelector(".flash")?.remove(); const f = document.createElement("div"); f.className = "flash" + (warn ? " warn" : ""); f.textContent = txt; document.body.appendChild(f); setTimeout(() => f.remove(), 2200); };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function list() { const want = norm(q).trim(), code = q.toUpperCase().replace(/[^A-Z0-9]/g, ""); const L = D.guests.filter((g) => !want || norm(`${g.name} ${g.company}`).includes(want) || (code.length >= 3 && g.code.startsWith(code)));
    $("#list").innerHTML = L.length ? L.map((g) => `<div class="g${g.checkedInAt ? " in" : ""}"><div><b>${esc(g.name || "Guest")}</b><small>${esc([g.title, g.company].filter(Boolean).join(", "))}${g.walkIn ? " · walk-in" : ""}${g.response === "requested" ? " · asked to come" : ""}</small>${g.diet ? `<small class="diet">🍽 ${esc(g.diet)}</small>` : ""}</div><button class="tick" data-r="${esc(g.rid)}">${g.checkedInAt ? "✓ " + new Date(g.checkedInAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "Check in"}</button></div>`).join("")
      : `<p class="m">Nobody matches “${esc(q)}”. ${code.length === 6 ? "If it's a ticket code, press Check in by code." : "Add them as a walk-in below."}</p>`;
    document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = async () => { const g = D.guests.find((x) => x.rid === b.dataset.r); try { const j = await api("door", { rid: g.rid, undo: !!g.checkedInAt }); D = j; flash(g.checkedInAt ? `${g.name} unchecked` : `✓ ${g.name} checked in`); draw(); } catch (x) { flash(x.message, true); } })); }
  function draw() { const pct = D.guests.length ? Math.round((100 * D.checkedIn) / D.guests.length) : 0;
    if (!$("#list")) { $("#app").innerHTML = `<p class="m">Check-in · ${esc(D.date ? new Date(D.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) : "")}${D.time ? " · " + esc(new Date("2000-01-01T" + D.time).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })) : ""}</p><h1>${esc(D.title)}</h1>${D.where ? `<p class="m" style="margin:0">${esc(D.where)}</p>` : ""}
        <div class="count"><b id="cn"></b><span class="m" id="cd"></span></div><div class="bar"><i id="cb"></i></div>
        <div class="tools"><input id="q" placeholder="Search a name, company or ticket code" autocomplete="off" autocapitalize="off"><button class="btn" id="byCode">Check in by code</button></div>
        <div id="list"></div>
        <div id="nudge"></div>
        <details><summary>Add a walk-in</summary><form class="walk" id="walk"><input name="name" placeholder="Name" required><input name="company" placeholder="Company"><input name="title" placeholder="Title"><input name="email" type="email" placeholder="Email (optional)"><button class="btn">Check them in</button><p class="err" id="we"></p></form></details>
        <p class="m">Share this page's link with anyone helping at the door; it updates for everyone every few seconds. Check-ins count toward the event's results.</p>`;
      $("#q").oninput = (e) => { q = e.target.value; list(); };
      $("#byCode").onclick = async () => { const code = q.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (code.length !== 6) { flash("Ticket codes are 6 characters", true); return; } try { const j = await api("door", { code }); D = j; flash(j.already ? `${j.name} was already checked in` : `✓ ${j.name} checked in`, j.already); q = ""; $("#q").value = ""; draw(); } catch (x) { flash(x.message, true); } };
      $("#walk").onsubmit = async (e) => { e.preventDefault(); const F = e.target; try { D = await api("door/walkin", Object.fromEntries(new FormData(F))); flash(`✓ ${F.name.value} added and checked in`); F.reset(); $("#we").textContent = ""; draw(); } catch (x) { $("#we").textContent = x.message; } }; }
    const nz = $("#nudge"); if (nz && !nz.dataset.done) { nz.innerHTML = D.sms && D.phones ? `<details><summary>Text the ${D.phones} who haven't arrived</summary><form id="nf" style="display:grid;gap:8px;margin-top:8px"><input name="text" maxlength="200" placeholder="Optional note, e.g. We're on the 3rd floor, take the side door"><button class="btn">Send the texts</button><small class="m">Each guest gets their own check-in code. Anyone who replied STOP is skipped.</small></form></details>` : ""; const nf = $("#nf"); if (nf) nf.onsubmit = async (e) => { e.preventDefault(); try { const j = await api("door/nudge", { text: e.target.text.value }); nz.dataset.done = "1"; nz.innerHTML = `<p class="m">✓ Texted ${j.sent}${j.noPhone ? `, ${j.noPhone} without a number` : ""}${j.stopped ? `, ${j.stopped} opted out` : ""}.</p>`; } catch (x) { flash(x.message, true); } }; }
    $("#cn").textContent = D.checkedIn; $("#cd").textContent = `of ${D.guests.length} on the list checked in${D.expected && D.expected !== D.guests.length ? ` · ${D.expected} expected` : ""}`; $("#cb").style.width = pct + "%"; list(); }
  async function load() { try { D = await api("door"); draw(); } catch (x) { $("#app").innerHTML = `<h1>Check-in isn't available</h1><p class="m">${esc(x.message)}</p>`; return false; } return true; }
  load().then((ok) => ok && setInterval(async () => { if (document.hidden || document.activeElement?.closest?.("#walk")) return; try { D = await api("door"); draw(); } catch {} }, 8000)); })();
</script></body></html>
