<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/authguard.js"></script><script src="/place.js"></script>
<title>Events · Pottery Lab</title>
<meta name="description" content="Supper clubs, run clubs, workshops and pop-ups that hosts made public, coming up and from their scrapbooks. With what guests said.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lists.css">
<style>
:root{--paper:var(--pl-page);--linen:var(--pl-raised);--ink:var(--pl-ink);--smoke:var(--pl-soft);--ember:var(--pl-accent);--ember-d:var(--pl-accent-text);--butter:var(--pl-sand);--line:var(--pl-line)}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-top{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}.hd-top .brand{display:flex;gap:8px;align-items:center;font:700 20px var(--sys-display);text-decoration:none;color:var(--ink)}
.hd-cta{background:var(--ember);color:#fff;text-decoration:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
@media (min-width:861px){.hd-top{display:none}}@media (max-width:860px){body{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}}
#more{display:flex;margin:32px auto 0}
dialog{width:min(560px,calc(100vw - 32px));max-height:min(80vh,720px);border:1.5px solid var(--line);border-radius:6px;padding:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sheet,0 18px 48px -18px rgba(31,26,23,.45))}
dialog::backdrop{background:rgba(31,26,23,.45)}
.dl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 8px}.dl-h h2{margin:0;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.dl-h button{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#FFFCF7;cursor:pointer;color:var(--ink)}
.dl-b{padding:0 20px 20px;overflow:auto}.dl-b .sum{color:var(--smoke);margin:0 0 16px;font-size:14px}
.kq{margin:0 0 16px;padding:0 0 0 12px;border-left:2px solid var(--butter)}.kq p{margin:0 0 2px;overflow-wrap:anywhere}.kq small{color:var(--smoke);font-size:13px}
.dl-go{display:inline-flex;align-items:center;min-height:44px;color:var(--ember-d);font-weight:600}
</style><script src="/mascot.js"></script><script src="/eventart.js"></script></head><body>
<div class="ls-wrap">
  <header class="top hd-top"><a class="brand" href="/"><svg viewBox="0 0 48 48" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg>pottery lab</a><a class="hd-cta" href="/signup?mode=friends">Start your page</a></header>
  <main>
  <section class="ls-head"><div><h1>Find an event</h1>
    <p class="ls-what">Dinners, runs and classes hosts made public. Tap one to see the details and save a spot.</p></div></section>
  <label class="sr" for="q">Search events</label><input class="ls-search" id="q" type="search" placeholder="Try “dinner”, “dance class” or a host" autocomplete="off">
  <div class="ls-filters" role="group" aria-label="Filter events">
    <button type="button" class="ls-chip" data-s="upcoming" aria-pressed="true">Coming up</button><button type="button" class="ls-chip" data-s="past" aria-pressed="false">Past</button><button type="button" class="ls-chip" data-s="all" aria-pressed="false">All</button>
    <span class="ls-sep" aria-hidden="true"></span>
    <button type="button" class="ls-chip" id="city" aria-haspopup="dialog" aria-label="City: Anywhere. Change city"><span id="cityName">Anywhere</span> <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg></button>
    <label class="sr" for="format">Kind of event</label><select class="ls-chip" id="format"><option value="">Any kind</option></select>
    <button type="button" class="ls-chip" id="spk" aria-pressed="false">Talks</button>
  </div>
  <p class="ls-count" id="count" aria-live="polite">Loading events…</p>
  <div class="ls-grid" id="grid" style="margin-top:16px"></div>
  <button type="button" class="ls-btn" id="more" hidden>Show more events</button>
  </main>
  <p class="ls-foot">Agents and builders: <a href="/api/v1/openapi.json">use the API</a> or <a href="/llms.txt">read llms.txt</a>.</p>
</div>
<dialog id="dlg" aria-labelledby="dlT"><div class="dl-h"><h2 id="dlT"></h2><button type="button" id="dlX" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div><div class="dl-b" id="dlB"></div></dialog>
<script>
(() => {
  const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = new URLSearchParams(location.search), st = { q: P.get("q") || "", city: P.get("city") || "", format: P.get("format") || "", status: ["upcoming", "past", "all"].includes(P.get("status")) ? P.get("status") : "upcoming", type: P.get("type") === "speaking" ? "speaking" : "" };
  const yr = new Date().getFullYear();
  const day = (d) => { if (!d) return "Date to come"; const x = new Date(d + "T12:00:00"); if (isNaN(x)) return d; const o = { weekday: "short", month: "short", day: "numeric" }; if (x.getFullYear() !== yr) { delete o.weekday; o.year = "numeric"; } return x.toLocaleDateString("en-US", o); };
  const when = (e) => [day(e.start), e.time].filter(Boolean).join(" · ");
  // a class that repeats or a course: "Every Tue · 7pm", "8 Wednesdays, Jan 6 to Feb 24 · 7pm"; a repeating class also says when the next one is
  const whenLine = (e) => e.when && e.status === "upcoming" ? e.when : when(e);
  const nextLine = (e) => e.when && e.status === "upcoming" && !e.sessions && e.start ? `Next one ${day(e.start)}` : "";
  // brand kit words: no "Meetup" (community events)
  const LABEL = { other: "Other", meetup: "Community", "pop-up": "Pop-up", "game night": "Game night", "book club": "Book club" };
  const label = (f) => LABEL[f] || f.charAt(0).toUpperCase() + f.slice(1);
  const revLine = (r) => r && r.count ? `${r.count} review${r.count === 1 ? "" : "s"}${r.would_go_again_pct != null ? ` · ${r.would_go_again_pct}% would go again` : ""}` : "";
  const src = (u) => /partiful\.com/i.test(u) ? "From Partiful" : /lu\.ma|luma\.com/i.test(u) ? "From Luma" : /eventbrite\./i.test(u) ? "From Eventbrite" : "";
  let cursor = null, hostRev = {}, shown = [];
  // a drawn cover when the host has no photo (EventArt), never an emoji
  const cover = (e) => e.cover ? `<img src="${esc(e.cover)}" alt="" loading="lazy">` : window.EventArt ? EventArt.cover({ id: e.id, title: e.title, activity: e.format || "" }, { title: "", label: "" }) : "";
  // one quiet status word at most: Past, Full, a few spots left, or Ask to join
  const statusOf = (e) => e.status === "past" ? "Past" : e.spots_left === 0 ? "Full" : e.spots_left != null && e.spots_left <= 5 ? `${e.spots_left} spot${e.spots_left === 1 ? "" : "s"} left` : e.ask_to_join ? "Ask to join" : "";
  function card(e, seen) {
    const place = [e.area, e.city].filter(Boolean).join(", "), st = statusOf(e);
    const meta = [st ? `<b>${esc(st)}</b>` : "", e.format && e.format !== "other" ? esc(label(e.format)) : "", e.status === "upcoming" && e.price ? esc(e.price) : "", esc(src(e.original_link))].filter(Boolean).join(" · ");
    // the event's own reviews: one quote and the guest's first name (the card is already about this event); otherwise the
    // host's numbers, once per host in the list (on that host's first card)
    const R = e.reviews || {}, H = !seen.has(e.host.handle) && hostRev[e.host.handle], q = (R.items || []).find((k) => k.text);
    const first = (n) => String(n || "").trim().split(/\s+/)[0];
    const rv = R.count ? (q ? `<blockquote class="ls-quote"><p>“${esc(q.text.length > 110 ? q.text.slice(0, 107).replace(/\s+\S*$/, "") + "…" : q.text)}”</p><cite>${esc(first(q.name))}</cite></blockquote>` : `<p class="ls-sub">${esc(revLine(R))}</p>`)
      : H && H.count ? `<p class="ls-sub">Host: ${esc(revLine(H))}</p>` : "";
    if (!R.count && H && H.count) seen.add(e.host.handle);
    // a talk: what it was about and who ran it; the recording and slides go behind More
    const S = e.speaking, listen = S && (e.format === "podcast" || /spotify\.com|podcasts\.apple\.com/i.test(S.recording || ""));
    const talk = S ? `${S.topic ? `<p class="ls-sub">${esc(S.topic)}</p>` : ""}${S.organizer || S.role ? `<p class="ls-sub">${esc([S.role, S.organizer ? "at " + S.organizer : ""].filter(Boolean).join(" "))}</p>` : ""}` : "";
    const menu = [R.count ? `<button type="button" class="ls-mi rv-btn" data-id="${esc(e.id)}">Read ${R.count} review${R.count === 1 ? "" : "s"}</button>` : "", S && S.recording ? `<a class="ls-mi" href="${esc(S.recording)}" target="_blank" rel="noopener noreferrer">${listen ? "Listen" : "Watch"} the recording</a>` : "", S && S.slides ? `<a class="ls-mi" href="${esc(S.slides)}" target="_blank" rel="noopener noreferrer">See the slides</a>` : "", `<a class="ls-mi" href="/@${esc(e.host.handle)}">More from ${esc(e.host.name)}</a>`].filter(Boolean);
    const extra = nextLine(e) || (e.companies && e.companies.length ? `With ${e.companies.slice(0, 3).join(", ")}${e.companies.length > 3 ? ` and ${e.companies.length - 3} more` : ""}` : "");
    return `<article class="ls-card ev"><div class="ls-media">${cover(e)}</div>
      <div class="ls-body">${meta ? `<p class="ls-meta">${meta}</p>` : ""}<p class="ls-when">${esc(whenLine(e))}</p><a class="ls-title" href="${esc(e.url)}">${esc(e.title)}</a><p class="ls-sub">by ${esc(e.host.name)}${place ? " · " + esc(place) : ""}</p>
      ${extra ? `<p class="ls-sub">${esc(extra)}</p>` : ""}${talk}${rv}
      <div class="ls-acts"><a class="ls-btn${e.status === "upcoming" ? " primary" : ""}" href="${esc(e.url)}" aria-label="See the event: ${esc(e.title)}">See the event</a><details class="ls-more"><summary aria-label="More for ${esc(e.title)}"><span aria-hidden="true"></span></summary><div class="ls-menu">${menu.join("")}</div></details></div></div></article>`;
  }
  const qs = (extra = {}) => { const u = new URLSearchParams(); for (const [k, v] of Object.entries({ q: st.q, city: st.city, format: st.format, type: st.type, status: st.status, ...extra })) if (v) u.set(k, v); return u.toString(); };
  async function load(more) {
    if (!more) { cursor = null; shown = []; $("#count").textContent = "Loading events…"; }
    const j = await (await fetch("/api/v1/events?" + qs({ limit: 24, cursor: more ? cursor : "" }))).json().catch(() => null);
    if (!j) { $("#count").textContent = "Couldn't load events. Refresh to try again."; return; }
    shown = more ? shown.concat(j.data) : j.data; cursor = j.next_cursor;
    { const seen = new Set(); $("#grid").innerHTML = shown.length ? shown.map((e) => card(e, seen)).join("") : ""; }
    $("#count").textContent = j.total ? `${j.total} event${j.total === 1 ? "" : "s"}` : "";
    if (!j.total) { const up = st.status === "upcoming"; $("#grid").innerHTML = `<div class="ls-empty">${window.Potto ? `<span class="ls-potto" aria-hidden="true">${Potto.svg("think", 64, "")}</span>` : ""}<b>${up ? "Nothing coming up here yet." : "No events match that."}</b><p>${up ? "See what hosts have done before, or look in another city." : "Try fewer words, or another city or kind of event."}</p><button type="button" class="ls-btn" id="emptyGo">${up ? "See past events" : "Clear filters"}</button></div>`;
      $("#emptyGo").onclick = () => { if (up) { st.status = "all"; } else { st.q = ""; st.city = ""; st.format = ""; st.type = ""; $("#q").value = ""; $("#format").value = ""; } paint(); load(); }; }
    $("#more").hidden = !cursor;
    history.replaceState(null, "", location.pathname + (qs() && qs() !== "status=upcoming" ? "?" + qs() : ""));
  }
  async function facets() {
    const j = await (await fetch("/api/v1/formats?status=all")).json().catch(() => null); if (!j) return;
    const opt = (v, t, sel) => `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(t)}</option>`;
    const C = j.cities.map((c) => c.city); if (st.city && !C.includes(st.city)) C.unshift(st.city);
    // one city picker (public/place.js): a bottom sheet on phones, a popover on desktop; a pick applies at once
    const CS = j.cities.map((c) => ({ city: c.city, n: c.count || c.n || 0 }));
    $("#city").onclick = () => { const PL = window.EncorePlace; if (!PL?.sheet) return; PL.sheet({ anchor: $("#city"), current: st.city, cities: CS.slice(0, 10), title: "Events where?", onPick: (c) => { st.city = (c && (C.find((x) => x.toLowerCase() === c.toLowerCase()) || C.find((x) => PL.near(x, c, 30)))) || c; paint(); load(); } }); };
    const F = j.formats.map((f) => f.format).filter((f) => f !== "other"); if (st.format && !F.includes(st.format)) F.unshift(st.format);
    $("#format").innerHTML = opt("", "Any kind", st.format) + F.map((f) => opt(f, label(f), st.format)).join("");
  }
  async function hosts() { const j = await (await fetch("/api/v1/hosts?limit=100")).json().catch(() => null); if (j) for (const h of j.data) hostRev[h.handle] = h.reviews; }
  async function reviews(id) {
    const d = $("#dlg"); $("#dlT").textContent = "Reviews"; $("#dlB").innerHTML = "<p>Loading…</p>"; d.showModal();
    const j = await (await fetch("/api/v1/events/" + encodeURIComponent(id))).json().catch(() => null), e = j && j.data;
    if (!e) { $("#dlB").innerHTML = "<p>Couldn't load the reviews. Try again.</p>"; return; }
    const R = e.reviews;
    $("#dlT").textContent = e.title;
    $("#dlB").innerHTML = `<p class="sum">${esc(whenLine(e))} · by ${esc(e.host.name)}<br>${esc(revLine(R))}</p>
      ${R.items.filter((k) => k.text).map((k) => `<blockquote class="kq"><p>“${esc(k.text)}”</p><small>${esc(String(k.name || "").trim().split(/\s+/)[0])}</small></blockquote>`).join("")}
      <a class="dl-go" href="${esc(e.url)}">${e.source === "hosted" ? "Open the event" : "See the host's page"}</a>`;
  }
  $("#q").value = st.q;
  // the filter row: the active choice is filled, a picked city or kind too
  const paint = () => { document.querySelectorAll("[data-s]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.s === st.status))); $("#spk").setAttribute("aria-pressed", String(st.type === "speaking")); $("#city").classList.toggle("on", !!st.city); $("#cityName").textContent = st.city || "Anywhere"; $("#city").setAttribute("aria-label", `City: ${st.city || "Anywhere"}. Change city`); $("#format").classList.toggle("on", !!st.format); };
  document.querySelectorAll("[data-s]").forEach((b) => { b.onclick = () => { st.status = b.dataset.s; paint(); load(); }; });
  let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(() => { st.q = $("#q").value.trim(); load(); }, 250); };
  $("#format").onchange = () => { st.format = $("#format").value; paint(); load(); };
  $("#more").onclick = () => load(true);
  $("#spk").onclick = () => { st.type = st.type === "speaking" ? "" : "speaking"; if (st.type && st.status === "upcoming") st.status = "all"; paint(); load(); };
  paint();
  $("#grid").addEventListener("click", (ev) => { const b = ev.target.closest(".rv-btn"); if (b) { b.closest("details")?.removeAttribute("open"); reviews(b.dataset.id); } });
  $("#dlX").onclick = () => $("#dlg").close();
  $("#dlg").addEventListener("click", (ev) => { if (ev.target === $("#dlg")) $("#dlg").close(); });
  Promise.all([facets(), hosts()]).finally(() => load());
})();
</script>
<script src="/lists.js"></script><script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
