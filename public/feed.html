body.tab-feed .fgrid,body.pub-feed .fgrid{grid-template-columns:minmax(0,960px)!important}
/* before the feed is drawn the page already has its one wide column, so the first cards never slide sideways */

body:is(.tab-feed,.pub-feed){background-color:var(--pl-page)}
/* tabs: words with a line under the one you're on, not four pills */

.tabs button{border:0;background:none;border-radius:0;padding:0 12px;min-height:44px;font:500 15px "IBM Plex Sans",system-ui;color:var(--pl-soft);box-shadow:inset 0 -2px 0 transparent}

/* the composer waits as one quiet line in Your people until you start */
.composer{box-shadow:none;border:1.5px solid var(--pl-line);border-radius:16px;padding:6px 12px;margin:0;background:var(--pl-surface)}.composer textarea{min-height:44px;height:44px;font-size:16px}
body.pc-has-fab.tab-feed .composer{display:none!important}
.composer:not(.open) .cbar,.composer:not(.open) .clink{display:none}.composer.open{padding:12px 14px}.composer.open textarea{height:auto;min-height:72px}
.composer .ib{min-height:44px;padding:0 14px}.composer .cbar .btn{min-height:44px}

  const doingLine = (d) => `<li><a href="${esc(d.url)}"><span class="fr-k">${d.kind === "hosting" ? "Hosting" : d.kind === "going" ? (d.together ? "Going, you too" : "Going to") : "Sent kudos"}</span> <b>${esc(d.title)}</b>${d.kind === "kudos" && d.love ? `<small>"${esc(d.love)}"</small>` : d.date ? `<small>${esc([dayWords(d.date), d.city].filter(Boolean).join(" · "))}</small>` : ""}</a></li>`;
  async function drawFriends(m, { msg = "" } = {}) {
    if (!m.querySelector(".fr")) m.innerHTML = `<div class="empty" data-calm-wait>Loading…</div>`;
    let FR; try { FR = await api("/api/me/friends"); } catch (e) { m.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } if (tab !== "friends") return;
    const sug = (F.suggestions || []).filter((p) => !FR.friends.some((f) => f.key === p.key) && !FR.requests.some((r) => r.key === p.key));
    const FIND = `<div class="card fr-find"><h3>Find friends</h3><label for="pq" class="wt-lab">Search by first name or @handle</label><input id="pq" type="search" placeholder="Name or @handle" autocomplete="off" enterkeyhint="search"><div class="people" id="pres" aria-live="polite"></div>
        <a class="fr-more" href="/people"><b>More ways to find people</b><small>Suggested for you, your contacts, and your QR code</small></a></div>
      ${sug.length ? `<div class="card"><h3>You've been to things together</h3><div class="people">${sug.map((p) => `<div class="person">${pav(p)}<div><b>${nm(p)}</b><small>${p.together} event${p.together === 1 ? "" : "s"} together</small></div><button type="button" class="btn" data-add="${esc(p.key)}">Add</button></div>`).join("")}</div></div>` : ""}`;
    m.innerHTML = `<section class="fr" aria-labelledby="frH"><header class="wt-head"><h2 id="frH">Friends</h2><p>See what your friends are going to and hosting. Add people you've met at events.</p></header>
      ${FR.requests.length ? `<div class="card fr-req"><h3>Added you <span class="fr-n">${FR.requests.length}</span></h3><p class="fr-sub">Add them back and you'll see each other's plans.</p><div class="people">${FR.requests.map((p) => `<div class="person">${pav(p)}<div><b>${nm(p)}</b><small>${p.together ? `${p.together} event${p.together === 1 ? "" : "s"} together` : p.handle ? "@" + esc(p.handle) : "Wants to be friends"}</small></div><span class="fr-btns"><button type="button" class="btn" data-accept="${esc(p.key)}">Add back</button><button type="button" class="btn ghost" data-ignore="${esc(p.key)}">Not now</button></span></div>`).join("")}</div></div>` : ""}
      ${FR.friends.length ? "" : FIND}
      <div class="card fr-list"><h3>Your friends${FR.friends.length ? ` <span class="fr-n">${FR.friends.length}</span>` : ""}</h3>
        ${FR.friends.length ? `<div class="people">${FR.friends.map((p) => `<div class="person fr-p">${pav(p)}<div><b>${p.handle ? `<a href="/@${esc(p.handle)}">${nm(p)}</a>` : nm(p)}</b><small>${p.mutual ? "Friends" : "Waiting for them to add you back"}</small>${p.doing.length ? `<ul class="fr-doing">${p.doing.map(doingLine).join("")}</ul>` : `<small class="fr-quiet">Nothing coming up yet.</small>`}</div></div>`).join("")}</div>`
          : `<div class="fr-empty"><p><b>No friends here yet.</b> Add people you've been to things with, or share your code so they can add you.</p><a class="btn" href="/people">Find people</a></div>`}</div>${FR.friends.length ? FIND : ""}</section>`;
    if (msg) toast(msg);
    let t; $("#pq").oninput = () => { clearTimeout(t); t = setTimeout(async () => { const q = $("#pq").value.trim(); if (q.length < 2) { $("#pres").innerHTML = ""; return; }
      const j = await api("/api/me/people/search?q=" + encodeURIComponent(q)).catch(() => ({ people: [] })); if ($("#pq")?.value.trim() !== q) return;
      $("#pres").innerHTML = j.people.length ? j.people.map((p) => { const have = FR.friends.some((f) => f.key === p.key); return `<div class="person">${pav(p)}<div><b>${nm(p)}</b><small>${esc([p.handle ? "@" + p.handle : "", p.place].filter(Boolean).join(" · "))}</small></div>${have ? `<span class="fr-have">Friends</span>` : `<button type="button" class="btn" data-add="${esc(p.key)}">Add</button>`}</div>`; }).join("")
        : `<p class="muted fr-none">Nobody by that name yet. <a href="/people">Invite them or share your code</a>.</p>`; wireAdd(m); }, 250); };
    wireAdd(m);
    $$("[data-accept]", m).forEach((b) => (b.onclick = () => addFriend(m, b, b.dataset.accept, "Friends now. You'll see each other's plans.")));
    $$("[data-ignore]", m).forEach((b) => (b.onclick = async () => { b.disabled = true; try { await post("/api/me/friends/ignore", { key: b.dataset.ignore }); drawFriends(m); } catch (e) { toast(e.message); b.disabled = false; } })); }
  async function addFriend(m, b, key, done) { b.disabled = true; try { await post("/api/me/friends", { key }); C.oink && C.oink(); b.textContent = "Added"; F = await api("/api/me/feed").catch(() => F); drawRail(); drawFriends(m, { msg: done }); } catch (e) { toast(e.message); b.disabled = false; } }
  function wireAdd(m) { $$("[data-add]", m).forEach((b) => (b.onclick = () => addFriend(m, b, b.dataset.add, "Added. They'll see a request to add you back."))); }
  // ---- notifications ----
  $("#bell").onclick = async () => { const j = await api("/api/me/inbox").catch(() => ({ items: [] })); const el = document.createElement("div"); el.className = "notes";
    // "Needs you" first and never hidden (things only you can answer), then everything else, then Potto says you're done
    const NEED = new Set(["friend", "msg", "faq", "kudos", "prep", "itson", "request", "pledge"]), row = (n) => `<a class="note-i ${n.read ? "" : "unread"}" href="${esc(n.link || "#")}">${esc(n.text)}<small>${ago(n.at)} ago</small></a>`;
    const need = j.items.filter((n) => !n.read && NEED.has(n.kind)), rest = j.items.filter((n) => !need.includes(n));
    el.innerHTML = `<div><div style="display:flex;justify-content:space-between;align-items:center"><h3>Notifications</h3><button class="x" aria-label="Close">✕</button></div>${need.length ? `<h4 class="nt-h">Needs you <span>${need.length}</span></h4>${need.map(row).join("")}` : ""}${rest.length ? `${need.length ? `<h4 class="nt-h">Everything else</h4>` : ""}${rest.map(row).join("")}` : ""}${need.length ? "" : `<div class="nt-done">${C.pipSVG("happy", 44)}<p>${j.items.length ? "You're all caught up." : "Nothing yet."}</p></div>`}</div>`;
    document.body.appendChild(el); el.onclick = (e) => { if (e.target === el || e.target.classList.contains("x")) el.remove(); }; post("/api/me/inbox/read").then(() => { F.unread = 0; drawBell(); }).catch(() => {}); };
  // the bell lives in the top bar on phones; the desktop rail hides that bar, so it moves next to the tabs
  const placeBell = () => { const b = $("#bell"), top = document.querySelector("header.top"), tabs = document.querySelector(".tabs"); if (!b || !top || !tabs) return; const hidden = getComputedStyle(top).display === "none"; const fp = $(".fpw"); if (hidden && b.parentElement !== tabs) { b.classList.add("bell-d"); tabs.appendChild(b); if (fp) tabs.insertBefore(fp, b); } else if (!hidden && b.parentElement === tabs) { b.classList.remove("bell-d"); top.querySelector("nav")?.prepend(b); if (fp) b.after(fp); } };
  fetch("/api/signup/config").then((r) => r.json()).then((c) => { window.__inviteOnly = !!c?.inviteOnly; }).catch(() => {});
  placeBell(); setTimeout(placeBell, 400); setTimeout(placeBell, 1500); addEventListener("resize", placeBell);
  if (location.hash === "#bell") setTimeout(() => $("#bell")?.click(), 300);
  load();
})();
</script><script>(async () => { try { if (localStorage.getItem("encore.city") !== null) return; const W = await (await fetch("/api/workspace", { credentials: "same-origin" })).json(); if (W?.city && window.EncorePlace) { window.EncorePlace.setManual(W.city); if (!sessionStorage.getItem("encore.feedCity")) { sessionStorage.setItem("encore.feedCity", "1"); if (window.PLFeedReload) window.PLFeedReload(); else location.reload(); } } } catch {} })();</script>
