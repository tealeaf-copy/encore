<style>

<div class="wrap">
  <div class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 3.2h8.8" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/></svg>pottery lab</a><a href="/hosts/book">Book a host</a></div>
  <div class="hero"><div><h1 id="hTitle">Gift the <em>moment</em>.</h1><p class="lede" id="hLede">Launching something? Closing a round? Tell Potto. It reads up on your news, works out who should get a gift, suggests gifts that tell the story, and writes a campaign you can run next week. With makers who can make them.</p></div><div class="pt" id="heroPotto"></div></div>
  <form class="ask" id="ask">

    <div class="row"><label>How big is this moment?<select name="tier" style="padding:12px 14px;border:1px solid #DCCFBE;border-radius:14px;font:inherit;font-weight:400;background:#FFFCF7"><option value="">Not sure</option><option>Major launch</option><option>Feature launch</option><option>Funding or milestone</option><option>Holiday or thank-you</option></select></label><label>Target accounts (optional)<textarea name="accounts" rows="2" maxlength="12000" placeholder="One company per line, or paste a column from your CRM"></textarea></label></div>

    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="go" id="go">Plan my gifts with Potto</button><a href="/gifts/plan/example" id="exLink" style="font-weight:600;color:var(--ember)">See an example plan →</a></div><p class="src" id="err" role="alert" style="margin:0;min-height:0"></p>
  </form>

</div>

<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  $("#heroPotto").innerHTML = window.Potto ? Potto.svg("carry", 160, "Potto carrying a gift") : "";
  document.querySelectorAll("[data-eg]").forEach((b) => (b.onclick = () => { const [c, w, m] = b.dataset.eg.split("|"); const f = $("#ask"); f.company.value = c; f.website.value = w; f.moment.value = m; f.moment.focus(); }));
  const STEPS = ["Reading up on the news", "Working out who it's for", "Finding the story in it", "Picking gifts that tell it", "Finding makers on Pottery Lab", "Writing your playbook"];
  let timer = 0;

    clearInterval(timer); const tick = () => { document.querySelectorAll("[data-s]").forEach((li) => li.classList.toggle("on", +li.dataset.s === Math.min(i, STEPS.length - 1))); i++; }; tick(); timer = setInterval(tick, 9000); }
  async function poll(id) { for (let n = 0; n < 120; n++) { let d; try { d = await (await fetch("/api/public/giftplan/" + id + (() => { try { const k = localStorage.getItem("encore.giftkey." + id); return k ? "?k=" + encodeURIComponent(k) : ""; } catch { return ""; } })())).json(); } catch { d = null; } if (d?.status === "ready") { clearInterval(timer); return show(d); } if (d?.status === "failed" || d?.code) { clearInterval(timer); viewing(false); $("#out").innerHTML = `<div class="card">${window.Potto ? Potto.svg("sleep", 90) : ""}<p>${esc(d.error || d.message || "That didn't work.")}</p></div>`; return; } await new Promise((r) => setTimeout(r, n < 5 ? 1500 : 3000)); } }
  const md = (d) => { const p = d.plan, b = p.playbook; return [`# Gift the moment: ${p.company} · ${p.moment.title}`, "", p.moment.what, "", `## The idea: ${p.theme.name}`, p.theme.idea, `> ${p.theme.line}`, "", "## Who it's for", p.audience.summary, ...p.audience.segments.map((s) => `- **${s.who}**${s.count ? ` (${s.count})` : ""}: ${s.why}${s.job ? ` Job: ${s.job}. Measure: ${s.kpi}. Owner: ${s.owner}. Follow up: ${s.followUpBy}.` : ""}${s.sendNote ? ` ${s.sendNote}` : ""}`), "", "## Gifts",
      ...p.gifts.flatMap((g) => [`### ${g.name} (${g.perPerson})`, g.tieIn, ...g.whatsInside.map((x) => `- ${x}`), `Personalise: ${g.personalize}`, `Lead time: ${g.leadTime}. Best for: ${g.bestFor}.`, (g.makers || []).length ? `Makers: ${g.makers.map((m) => `${m.name} (${location.origin}/@${m.handle})`).join(", ")}` : "", ""]),
      "## Playbook", `Goal: ${b.goal}`, `List: ${b.list.who} (${b.list.howMany}). ${b.list.howToPick}`, "", "### Timeline", ...b.timeline.map((t) => `- **${t.when}**: ${t.step}${t.owner ? ` (${t.owner})` : ""}`), "", ...((b.message.notes || []).length ? ["### The notes", ...b.message.notes.flatMap((n) => [`For ${n.segment}:`, n.note, ""])] : ["### The note", b.message.note]), "", `### Email: ${b.message.subject}`, b.message.email, "", "### Social post", b.message.social, "", "### Unboxing", b.unboxing, "", "### Follow-up", ...b.followUp.map((x) => `- ${x}`), "", "### Measure", ...b.measure.map((x) => `- ${x}`), "", `### Budget: ${b.budget.perPerson} per person, ${b.budget.total} total`, b.budget.note, "", "### Watch out for", ...b.risks.map((x) => `- ${x}`), "", ...((b.sends || []).length ? ["### Sends", ...b.sends.map((w) => `- **${w.wave}** (${w.when}): ${w.what}. ${w.why}`)] : []), ...((b.triggers || []).length ? ["", "### Triggers", ...b.triggers.map((t) => `- ${t.signal} → ${t.send} (${t.segment})`)] : []),
      ...(b.prove?.holdout ? ["", "### Prove it", b.prove.cfo ? `For finance: ${b.prove.cfo}` : "", `Agree first: ${b.prove.target}`, `Holdout: ${b.prove.holdout}`, ...(b.prove.lines || []).map((x) => `- ${x.name}: ${x.how}`), b.prove.caveat] : []), ...((b.approvals || []).length ? ["", "### Approvals", ...b.approvals.map((x) => `- [ ] ${x.gate} (${x.who})`)] : []),
      ...((b.budgetLines || []).length ? ["", "| Who | People | Gift | Gift cost | Maker | Shipping | Total |", "|---|---|---|---|---|---|---|", ...b.budgetLines.map((x) => `| ${x.segment} | ${x.people} | ${x.gift} | ${x.giftCost} | ${x.makerFee} | ${x.shipping} | ${x.total} |`)] : []), "", ...(p.moment.sources || []).map((s) => `Source: ${s.title} ${s.url}`), "", `Plan: ${location.origin}/gifts/plan/${d.id}`].join("\n"); };
  // A campaign sheet for Salesforce or HubSpot: one row per segment to fill with contacts, with the gift, owner, trigger and follow-up rule
  const cell = (v) => { const t = String(v ?? ""); return /[",\n]/.test(t) || /^[=+\-@]/.test(t) ? `"${(/^[=+\-@]/.test(t) ? "'" : "") + t.replace(/"/g, '""')}"` : t; };
  function holdoutOf(d) { const A = d.input?.accounts || [], n = A.length - Math.round(A.length * 0.8), h = (t) => { let x = 2166136261; for (const ch of String(d.id) + "|" + t.toLowerCase()) x = Math.imul(x ^ ch.charCodeAt(0), 16777619) >>> 0; return x; };
    return new Set([...A].sort((a, b) => h(a) - h(b)).slice(0, n)); }
  // the per-person cost the budget lines add up to for a segment (gift + maker + shipping), as a plain number for the CRM
