<style>

.sum{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}.box{background:#fff;border:1.5px solid var(--line);border-radius:var(--pl-r-md,6px);padding:18px}.box h2{margin:0 0 8px;font:600 20px var(--pl-font-text);color:var(--ink)}

.read{font-size:14px;color:var(--smoke);margin:8px 0 0;padding-left:18px}

.dl h2{font:700 20px var(--pl-font-text);margin:0 0 8px}.dlrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.dlrow .btn{width:100%;text-align:center}.dl .src{margin:8px 0 0}

details.fold{background:#fff;border:1.5px solid var(--line);border-radius:var(--pl-r-md,6px)}details.fold.pf{background:var(--leaf);border-color:#B9D3AE}
details.fold>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:12px 18px;min-height:56px;border-radius:var(--pl-r-md,6px)}details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";grid-column:2;grid-row:1/3;width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin:0 6px 4px;transition:transform .2s}details.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.ft{grid-column:1;font:700 20px/1.25 var(--pl-font-text);margin:0}.fh{grid-column:1;font-size:14px;color:var(--smoke)}.fb{padding:2px 18px 18px}.fb>p:first-child{margin-top:0}
h3.sub{font:700 16px var(--sys-title);margin:14px 0 6px}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.seg{border:1px dashed var(--line);border-radius:var(--pl-r-md,6px);padding:12px}.seg b{display:block}.seg dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:8px 0 0;font-size:14px}.seg dt{color:var(--smoke)}.seg dd{margin:0;font-weight:600}.seg .sn{background:#FFF6D8;border-radius:var(--pl-r-md,6px);padding:6px 9px;font-size:14px;margin-top:8px}
.tl{list-style:none;margin:10px 0 0;padding:0}.tl li{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line)}.tl li b{color:var(--ember)}.tl small{color:var(--smoke)}
.copy{position:relative;background:var(--pl-surface);border:1px solid var(--line);border-radius:var(--pl-r-md,6px);padding:50px 14px 12px;white-space:pre-wrap;font-size:16px}.copy .cp{position:absolute;right:6px;top:6px}
.warn{background:#FFE3D6;border:2px solid var(--ember);border-radius:var(--pl-r-md,6px);padding:12px 16px;margin:0 0 14px;font-size:16px}.warn .btn{margin-top:8px}.tl li.past b{color:var(--ember)}
.note{white-space:pre-line;font:600 20px/1.25 Caveat,cursive;background:#FFF6D8;border-radius:6px;padding:14px 16px;transform:rotate(-.6deg);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.two>*{min-width:0}
table.bt{width:100%;border-collapse:collapse;font-size:14px}table.bt th,table.bt td{text-align:left;padding:8px 6px;border-top:1px dashed var(--line);vertical-align:top}table.bt th{font-size:13px;color:var(--smoke);text-transform:uppercase;letter-spacing:.04em;border-top:0}.btw{overflow-x:auto}
.gates{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}.gates li{display:flex;gap:8px}.gates li::before{content:"☐";font-size:16px;line-height:1.3}.gates small{color:var(--smoke)}
.next{background:var(--pl-sand-soft);border:2px solid var(--ink);border-radius:var(--pl-r-md,6px);padding:22px;display:grid;gap:8px;justify-items:start}.next h2{margin:0;font:700 28px var(--sys-display)}.next p{margin:0;color:var(--smoke)}
a:focus-visible,button:focus-visible,summary:focus-visible,.btw:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
body.viewing h1{font-size:var(--fs-28-40,28px)}body.viewing .hero{grid-template-columns:1fr}body.viewing .hero .pt{display:none}body.viewing .lede{margin-bottom:4px}.ask[hidden]{display:none}
@media (max-width:860px){html body.es-has-tabs{padding-bottom:calc(84px + env(safe-area-inset-bottom))}.sum{grid-template-columns:1fr}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .pt{display:none}.row,.row3,.two{grid-template-columns:1fr}.tl li{grid-template-columns:1fr;gap:2px}.dlrow{grid-template-columns:1fr}.intro{grid-template-columns:56px minmax(0,1fr)}.intro p{font-size:16px}
  .btw{overflow:visible}table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}table.stack tr{border:1px solid var(--line);border-radius:var(--pl-r-md,6px);padding:10px 12px;margin-bottom:10px;background:var(--pl-surface)}table.stack td{display:grid;grid-template-columns:40% minmax(0,1fr);gap:8px;border:0;padding:3px 0}table.stack td::before{content:attr(data-label);color:var(--smoke);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}table.stack td:first-child{display:block;font-weight:700;padding-bottom:6px}table.stack td:first-child::before{display:none}}
@media print{header.top,.ask,.dl,.quote,.next,.hero .pt,.cp,.es-tabs,.es-rail,.gift .btn{display:none!important}details.fold>summary::after{display:none}body{background:#fff}}
</style></head><body data-audience="brand">
<div class="wrap">
  <header class="top"><a class="brand" href="/"><svg viewBox="0 0 48 48" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg>pottery lab</a><nav><a href="/gifts">Gifts</a><a href="/hosts/book">For brands</a></nav></header>
  <div class="hero"><div><h1 id="hTitle">Plan your <em>gifts</em></h1><p class="lede" id="hLede"></p></div><div class="pt" id="heroPotto"></div></div>
  <form class="ask" id="ask">
    <div class="row"><label>Brand<input name="company" required maxlength="100" placeholder="e.g. Exa" autocomplete="organization"></label><label>Website <small>(optional)</small><input name="website" maxlength="200" placeholder="exa.ai"></label></div>
    <label>What's happening?<input name="moment" required maxlength="200" placeholder="e.g. Launching Snapshot"></label>
    <div class="eg" aria-label="Examples"><span class="src">Try one:</span><button type="button" data-eg='{"company":"Exa","website":"exa.ai","moment":"We are launching Snapshot","kind":"b2b","audience":"40 key contacts, 10 journalists, 15 design partners"}'>A product launch</button><button type="button" data-eg='{"company":"Lantern Coffee","moment":"Thanking our wholesale cafés for a great year","kind":"retail","audience":"60 wholesale cafés","people":"60","budget":"$55"}'>Thank our cafés</button><button type="button" data-eg='{"company":"Orbit Labs","moment":"Remote new-hire welcome","kind":"employees","audience":"40 new hires","people":"40","budget":"$60"}'>Welcome new hires</button><button type="button" data-eg='{"company":"Patchwork","moment":"Thank-you to the speakers at Patchwork Conf","kind":"community","audience":"18 speakers, 6 co-organizers","budget":"$50"}'>Thank our speakers</button></div>
    <fieldset class="kind"><legend>Which is closest?</legend><div class="pills" id="kinds"></div></fieldset>
    <div class="row3"><label>Who's it for?<textarea name="audience" rows="2" maxlength="600" placeholder="e.g. 40 customers, 10 journalists"></textarea></label><label id="pplL">How many people <small id="pplN" hidden>(counted from your groups)</small><input name="people" maxlength="20" inputmode="numeric" placeholder="70"></label><label>Budget a person, all-in<input name="budget" maxlength="40" placeholder="$120"></label></div>
    <div class="row3"><label>Arrive by <small>(optional)</small><input name="date" type="date"></label><label>Average deal or order <small>(optional)</small><input name="dealSize" maxlength="40" placeholder="$40,000"></label><label>Where they are <small>(optional)</small><input name="city" maxlength="60" placeholder="Brooklyn"></label></div>
    <details class="list" id="listFold"><summary>Add your list <span class="src" style="font-weight:400;margin-left:6px">(optional)</span></summary>
      <div class="row"><label>Your list <small>One company a line, or paste a CSV</small><textarea name="accounts" rows="5" maxlength="40000" placeholder="account,contact,email,role,tier,stage,owner&#10;Globex,Ada Moss,ada@globex.com,VP Finance,1,Evaluation,Sam"></textarea></label><label>Always gift <small>One company a line. Never held back to compare.</small><textarea name="protect" rows="5" maxlength="4000" placeholder="Globex"></textarea></label></div></details>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="go" id="go">Plan my gifts</button><a href="/gifts/plan/example" class="lnk">See an example →</a></div><p class="src" id="err" role="alert" style="margin:0"></p>
  </form>
  <div id="out"></div>
</div>
<script src="/mascot.js"></script><script src="/giftart.js"></script>
<script>
(function () {
  const LEDE = "Tell me who it's for and your budget. I'll pick a gift for each group.";
  const $ = (s, el = document) => el.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const KINDS = [["", "Not sure", "I'll work it out"], ["b2b", "Product launch", "Customers, partners, investors"], ["press", "Press and analysts", "Before the news goes out"], ["creators", "Creators", "People who post about you"], ["retail", "Stores and stockists", "Thanks, and the next order"], ["customers", "Customer thank-you", "Your best customers"], ["employees", "Team and new hires", "Welcomes, anniversaries, thanks"], ["community", "Community thank-you", "Speakers, co-organizers, contributors"]];
  $("#kinds").innerHTML = KINDS.map(([v, l, h], i) => `<label><input type="radio" name="kind" value="${v}"${i ? "" : " checked"}><span>${esc(l)}<small>${esc(h)}</small></span></label>`).join("");
  $("#heroPotto").innerHTML = window.Potto ? Potto.svg("carry", 140, "Potto carrying a gift") : "";
  $("#hLede").textContent = LEDE;
  const F = $("#ask"), setForm = (o) => { for (const [k, v] of Object.entries(o)) { if (k === "kind") { const r = F.querySelector(`input[name=kind][value="${v}"]`); if (r) r.checked = true; } else if (F.elements[k]) F.elements[k].value = v; } };
  const pplSync = () => { const has = /\d/.test(F.audience.value); $("#pplN").hidden = !has; F.people.disabled = has; }; F.audience.addEventListener("input", pplSync);
  document.querySelectorAll("[data-eg]").forEach((b) => (b.onclick = () => { F.reset(); setForm(JSON.parse(b.dataset.eg)); pplSync(); F.moment.focus(); }));
  { const Q = new URLSearchParams(location.search), o = {}; for (const k of ["company", "website", "moment", "kind", "audience", "people", "budget", "date", "dealSize", "city"]) if (Q.get(k)) o[k] = Q.get(k).slice(0, 600); setForm(o); pplSync(); }
  const STEPS = ["Reading your brief", "Counting people", "Picking a gift for each group", "Finding makers", "Writing your plan"];
  let timer = 0;
  function thinking(company) { let i = 0; $("#out").innerHTML = `<div class="think card">${window.Potto ? Potto.svg("think", 110, "Potto thinking") : ""}<b>${company ? `Potto's planning for ${esc(company)}` : "Planning"}</b><ol>${STEPS.map((s, k) => `<li data-s="${k}">${esc(s)}…</li>`).join("")}</ol></div>`;
    clearInterval(timer); const tick = () => { document.querySelectorAll("[data-s]").forEach((li) => li.classList.toggle("on", +li.dataset.s === Math.min(i, STEPS.length - 1))); i++; }; tick(); timer = setInterval(tick, 9000); }
  const keyFor = (id) => { try { return localStorage.getItem("encore.giftkey." + id) || ""; } catch { return ""; } };
  async function poll(id) { for (let n = 0; n < 120; n++) { let d; try { const k = keyFor(id); d = await (await fetch("/api/public/giftplan/" + id + (k ? "?k=" + encodeURIComponent(k) : ""))).json(); } catch { d = null; } if (d?.status === "ready") { clearInterval(timer); return show(d); } if (d?.status === "failed" || d?.code) { clearInterval(timer); viewing(false); $("#out").innerHTML = ""; if (d.code) history.replaceState(null, "", "/gifts/plan"); $("#hLede").textContent = d.error || d.message || "I dropped that one. Try again?"; window.scrollTo({ top: 0 }); return; } await new Promise((r) => setTimeout(r, n < 5 ? 1200 : 3000)); } }
  const save = (text, name, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 300); };
  // copy without a dialog: the clipboard, then a hidden text field; false when both are blocked
