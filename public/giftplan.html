<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/authguard.js"></script>
<title>Gift planner · Pottery Lab</title>
<meta name="description" content="Tell Potto who it's for and your budget. Get a gift per group from local makers, with dates and costs.">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,wght@1,600&family=Fredoka:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF8EE;--ink:#1F1A17;--smoke:#6B5F56;--ember:#B04A30;--red:#C4532F;--line:#E4D9C8;--butter:#FFE08A;--leaf:#EEF4EA}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:18px 18px 80px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}header.top .brand{text-decoration:none;font:700 20px Fredoka,system-ui;display:flex;gap:8px;align-items:center;min-height:44px}header.top nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;color:var(--smoke);text-decoration:none;font-weight:600}
h1{font:700 var(--fs-28-40,28px)/1.06 Fredoka,system-ui;margin:6px 0 8px}h1 em,h2 em{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;color:var(--ember)}
.lede{color:var(--smoke);font-size:16px;max-width:660px;margin:0 0 16px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:center}.hero .pt{justify-self:center}
.ask{background:#fff;border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 0 0 5px #fff,0 14px 30px -20px rgba(31,26,23,.5);padding:18px;display:grid;gap:14px}
.ask label{display:grid;gap:5px;font-weight:600;font-size:14px}.ask label small{font-weight:400;color:var(--smoke);font-size:13px}
.ask input,.ask textarea{min-height:46px;padding:11px 14px;border:1px solid #DCCFBE;border-radius:14px;font:inherit;font-weight:400;background:#FFFCF7;min-width:0;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;align-items:end}
fieldset.kind{border:0;padding:0;margin:0;display:grid;gap:8px}fieldset.kind legend{font-weight:600;font-size:14px;padding:0;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}.pills label{position:relative;display:block}.pills input{position:absolute;opacity:0;width:1px;height:1px}
.pills span{display:inline-flex;flex-direction:column;justify-content:center;min-height:44px;padding:6px 14px;border:1.5px solid #DCCFBE;border-radius:14px;background:#FFFCF7;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}.pills span small{font-weight:400;color:var(--smoke);font-size:13px}
.pills input:checked+span{border-color:var(--ink);background:var(--ink);color:#fff}.pills input:checked+span small{color:#E9DFD2}.pills input:focus-visible+span{outline:3px solid var(--ember);outline-offset:2px}
.eg{display:flex;flex-wrap:wrap;gap:8px}.eg button{min-height:44px;border:1.5px dashed #CDBFAE;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;color:var(--smoke)}
details.list{border:1px dashed #CDBFAE;border-radius:16px;padding:0 14px}details.list>summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer}details.list[open]{padding-bottom:14px}details.list .row{margin-top:4px}
.go{min-height:48px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:12px 22px;font:700 16px "Instrument Sans",system-ui;box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.go:disabled{opacity:.6}
.lnk{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--ember)}
.think{display:grid;justify-items:center;gap:6px;padding:30px 10px;text-align:center}.think ol{list-style:none;padding:0;margin:0;color:var(--smoke)}.think li{opacity:.35;transition:opacity .4s}.think li.on{opacity:1;color:var(--ink);font-weight:600}
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:20px}
.plan{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}.plan>*{min-width:0}
.label{border-radius:14px;padding:10px 14px;font-size:14px;background:#FFF1D2;border:1px solid #F0D9A8}.label b{display:block}.label button{margin-top:8px}
.intro{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}.intro p{margin:0;font:600 20px/1.35 "Instrument Sans",system-ui}.intro .src{font:400 14px/1.5 "Instrument Sans",system-ui;margin-top:4px}
.src{font-size:14px;color:var(--smoke)}.src a{color:var(--ember)}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:18px}
.gift{background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 0 0 4px #fff,0 4px 0 4px rgba(31,26,23,.14);overflow:hidden;display:flex;flex-direction:column}
.gift .art{line-height:0;background:#F6EFE6;border-bottom:2px solid var(--ink)}.gift .art svg{width:100%;height:auto;display:block}
.gift .bd{padding:16px;display:grid;gap:8px}.gift h3{margin:0;font:700 20px/1.15 Fredoka,system-ui}
.gift .for{font-size:14px;color:var(--smoke)}.gift .for b{color:var(--ink)}
.gift .price{font:700 28px/1.1 Fredoka,system-ui}.gift .price small{display:block;font:500 14px "Instrument Sans",system-ui;color:var(--smoke);margin-top:2px}
.gift .tie{font:600 16px/1.4 "Instrument Sans",system-ui,sans-serif;color:#3E5C3A}.gift ul{margin:0;padding-left:18px;font-size:14px}
.late{background:#FBE3DA;color:#7A2E1C;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600}
.makers{font-size:14px}.makers a{display:inline-flex;align-items:center;min-height:44px;margin:4px 6px 0 0;padding:0 12px;border-radius:999px;background:#F3ECE2;text-decoration:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:600 16px "Instrument Sans",system-ui;text-decoration:none;cursor:pointer}.btn.dark{background:var(--ink);color:#fff}
details.sub{border-top:1px dashed var(--line);font-size:14px}details.sub>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}details.sub dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 6px}details.sub dt{color:var(--smoke)}details.sub dd{margin:0}
.sum{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}.box{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px}.box h2{margin:0 0 8px;font:700 13px "Instrument Sans",system-ui;color:var(--smoke);text-transform:uppercase;letter-spacing:.06em}
.wgw{list-style:none;margin:0;padding:0;display:grid;gap:10px}.wgw li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border-bottom:1px dashed var(--line);padding-bottom:8px}.wgw li span{color:var(--smoke);font-size:14px;grid-column:1}.wgw li i{font-style:normal;font-weight:700;grid-column:2;grid-row:1/3;align-self:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font:700 28px Fredoka,system-ui}.total small{font:400 14px "Instrument Sans",system-ui;color:var(--smoke)}
.fin{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:16px}.fin b{display:block;font-size:13px;color:var(--smoke);text-transform:uppercase;letter-spacing:.05em}
.comp{background:var(--leaf);border:1.5px solid #B9D3AE;border-radius:16px;padding:12px 14px;font-size:16px}.comp b{margin-right:4px}
.read{font-size:14px;color:var(--smoke);margin:8px 0 0;padding-left:18px}
.quote{background:#FFF1D2;border:2px solid var(--ink);border-radius:22px;padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.quote p{margin:0;max-width:560px}.quote b{font:700 20px Fredoka,system-ui;display:block}
.dl h2{font:700 20px Fredoka,system-ui;margin:0 0 8px}.dlrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.dlrow .btn{width:100%;text-align:center}.dl .src{margin:8px 0 0}
.folds{display:grid;gap:10px}
details.fold{background:#fff;border:1.5px solid var(--line);border-radius:18px}details.fold.pf{background:var(--leaf);border-color:#B9D3AE}
details.fold>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:12px 18px;min-height:56px;border-radius:16px}details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";grid-column:2;grid-row:1/3;width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin:0 6px 4px;transition:transform .2s}details.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.ft{grid-column:1;font:700 20px/1.25 Fredoka,system-ui;margin:0}.fh{grid-column:1;font-size:14px;color:var(--smoke)}.fb{padding:2px 18px 18px}.fb>p:first-child{margin-top:0}
h3.sub{font:700 16px Fredoka,system-ui;margin:14px 0 6px}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.seg{border:1px dashed var(--line);border-radius:16px;padding:12px}.seg b{display:block}.seg dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:8px 0 0;font-size:14px}.seg dt{color:var(--smoke)}.seg dd{margin:0;font-weight:600}.seg .sn{background:#FFF6D8;border-radius:10px;padding:6px 9px;font-size:14px;margin-top:8px}
.tl{list-style:none;margin:10px 0 0;padding:0}.tl li{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line)}.tl li b{color:var(--ember)}.tl small{color:var(--smoke)}
.copy{position:relative;background:#FFFCF7;border:1px solid var(--line);border-radius:14px;padding:50px 14px 12px;white-space:pre-wrap;font-size:16px}.copy .cp{position:absolute;right:6px;top:6px}
.warn{background:#FFE3D6;border:2px solid var(--ember);border-radius:16px;padding:12px 16px;margin:0 0 14px;font-size:16px}.warn .btn{margin-top:8px}.tl li.past b{color:var(--ember)}
.note{white-space:pre-line;font:600 20px/1.25 Caveat,cursive;background:#FFF6D8;border-radius:6px;padding:14px 16px;transform:rotate(-.6deg);box-shadow:0 8px 18px -12px rgba(0,0,0,.4)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.two>*{min-width:0}
table.bt{width:100%;border-collapse:collapse;font-size:14px}table.bt th,table.bt td{text-align:left;padding:8px 6px;border-top:1px dashed var(--line);vertical-align:top}table.bt th{font-size:13px;color:var(--smoke);text-transform:uppercase;letter-spacing:.04em;border-top:0}.btw{overflow-x:auto}
.gates{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}.gates li{display:flex;gap:8px}.gates li::before{content:"☐";font-size:16px;line-height:1.3}.gates small{color:var(--smoke)}
.next{background:#FFF1D2;border:2px solid var(--ink);border-radius:22px;padding:22px;display:grid;gap:8px;justify-items:start}.next h2{margin:0;font:700 28px Fredoka,system-ui}.next p{margin:0;color:var(--smoke)}
a:focus-visible,button:focus-visible,summary:focus-visible,.btw:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
body.viewing h1{font-size:var(--fs-28-40,28px)}body.viewing .hero{grid-template-columns:1fr}body.viewing .hero .pt{display:none}body.viewing .lede{margin-bottom:4px}.ask[hidden]{display:none}
@media (max-width:860px){html body.es-has-tabs{padding-bottom:calc(84px + env(safe-area-inset-bottom))}.sum{grid-template-columns:1fr}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .pt{display:none}.row,.row3,.two{grid-template-columns:1fr}.tl li{grid-template-columns:1fr;gap:2px}.dlrow{grid-template-columns:1fr}.intro{grid-template-columns:56px minmax(0,1fr)}.intro p{font-size:16px}
  .btw{overflow:visible}table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}table.stack tr{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:#FFFCF7}table.stack td{display:grid;grid-template-columns:40% minmax(0,1fr);gap:8px;border:0;padding:3px 0}table.stack td::before{content:attr(data-label);color:var(--smoke);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}table.stack td:first-child{display:block;font-weight:700;padding-bottom:6px}table.stack td:first-child::before{display:none}}
@media print{header.top,.ask,.dl,.quote,.next,.hero .pt,.cp,.es-tabs,.es-rail,.gift .btn{display:none!important}details.fold>summary::after{display:none}body{background:#fff}}
</style></head><body data-audience="brand">
<div class="wrap">
  <header class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 3.2h8.8" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/></svg>pottery lab</a><nav><a href="/gifts">Gifts</a><a href="/hosts/book">Book a host</a></nav></header>
  <div class="hero"><div><h1 id="hTitle">Plan the <em>gifts</em>.</h1><p class="lede" id="hLede">Tell me who and how much. I'll pick a gift per group.</p></div><div class="pt" id="heroPotto"></div></div>
  <form class="ask" id="ask">
    <div class="row"><label>Brand<input name="company" required maxlength="100" placeholder="e.g. Exa" autocomplete="organization"></label><label>Website <small>(optional)</small><input name="website" maxlength="200" placeholder="exa.ai"></label></div>
    <label>What's happening<input name="moment" required maxlength="200" placeholder="e.g. Launching Snapshot"></label>
    <div class="eg" aria-label="Examples"><span class="src">Try one:</span><button type="button" data-eg='{"company":"Exa","website":"exa.ai","moment":"We are launching Snapshot","kind":"b2b","audience":"40 champions, 10 journalists, 15 design partners"}'>Product launch</button><button type="button" data-eg='{"company":"Lantern Coffee","moment":"Thanking our wholesale cafés for a great year","kind":"retail","audience":"60 wholesale cafés","people":"60","budget":"$55"}'>Thank our cafés</button><button type="button" data-eg='{"company":"Orbit Labs","moment":"Remote new-hire welcome","kind":"employees","audience":"40 new hires","people":"40","budget":"$60"}'>Welcome new hires</button><button type="button" data-eg='{"company":"Patchwork","moment":"Thank-you to the speakers at Patchwork Conf","kind":"community","audience":"18 speakers, 6 co-organizers","budget":"$50"}'>Thank our speakers</button></div>
    <fieldset class="kind"><legend>Who's it for?</legend><div class="pills" id="kinds"></div></fieldset>
    <div class="row3"><label>Groups and counts<textarea name="audience" rows="2" maxlength="600" placeholder="40 customers, 12 journalists"></textarea></label><label>Total people<input name="people" maxlength="20" inputmode="numeric" placeholder="70"></label><label>Budget a person <small>Including shipping</small><input name="budget" maxlength="40" placeholder="$120"></label></div>
    <div class="row3"><label>Arrive by <small>(optional)</small><input name="date" type="date"></label><label>Average deal size <small>(optional)</small><input name="dealSize" maxlength="40" placeholder="$40,000"></label><label>Their city <small>(optional)</small><input name="city" maxlength="60" placeholder="Brooklyn"></label></div>
    <details class="list" id="listFold"><summary>Add your list <span class="src" style="font-weight:400;margin-left:6px">(optional)</span></summary>
      <div class="row"><label>Your list <small>One company per line, or paste a CSV</small><textarea name="accounts" rows="5" maxlength="40000" placeholder="account,contact,email,role,tier,stage,owner&#10;Globex,Ada Moss,ada@globex.com,VP Finance,1,Evaluation,Sam"></textarea></label><label>Never leave out <small>Names that always get a gift</small><textarea name="protect" rows="5" maxlength="4000" placeholder="Globex"></textarea></label></div></details>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="go" id="go">Plan my gifts</button><a href="/gifts/plan/example" class="lnk">See an example →</a></div><p class="src" id="err" role="alert" style="margin:0"></p>
  </form>
  <div id="out"></div>
</div>
<script src="/mascot.js"></script><script src="/giftart.js"></script>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const KINDS = [["", "Not sure", "Potto will guess"], ["b2b", "Product launch", "Customers, early users, investors"], ["press", "Press and analysts", "Before the news goes out"], ["creators", "Creators", "People who post about you"], ["retail", "Stores and stockists", "Thank them, get the reorder"], ["customers", "Customer thank-you", "Your best customers"], ["employees", "Your team", "Welcome, anniversary, thank-you"], ["community", "Community thank-you", "Speakers, co-organizers, contributors"]];
  $("#kinds").innerHTML = KINDS.map(([v, l, h], i) => `<label><input type="radio" name="kind" value="${v}"${i ? "" : " checked"}><span>${esc(l)}<small>${esc(h)}</small></span></label>`).join("");
  $("#heroPotto").innerHTML = window.Potto ? Potto.svg("carry", 140, "Potto carrying a gift") : "";
  const F = $("#ask"), setForm = (o) => { for (const [k, v] of Object.entries(o)) { if (k === "kind") { const r = F.querySelector(`input[name=kind][value="${v}"]`); if (r) r.checked = true; } else if (F.elements[k]) F.elements[k].value = v; } };
  document.querySelectorAll("[data-eg]").forEach((b) => (b.onclick = () => { F.reset(); setForm(JSON.parse(b.dataset.eg)); F.moment.focus(); }));
  { const Q = new URLSearchParams(location.search), o = {}; for (const k of ["company", "website", "moment", "kind", "audience", "people", "budget", "date", "dealSize", "city"]) if (Q.get(k)) o[k] = Q.get(k).slice(0, 600); setForm(o); }
  const STEPS = ["Reading up", "Checking your groups and counts", "Picking a gift for each group", "Finding makers on Pottery Lab", "Writing your plan"];
  let timer = 0;
  function thinking(company) { let i = 0; $("#out").innerHTML = `<div class="think card">${window.Potto ? Potto.svg("think", 110, "Potto thinking") : ""}<b>${company ? `Planning for ${esc(company)}` : "Planning"}</b><ol>${STEPS.map((s, k) => `<li data-s="${k}">${esc(s)}…</li>`).join("")}</ol><small class="src">Potto's on it.</small></div>`;
    clearInterval(timer); const tick = () => { document.querySelectorAll("[data-s]").forEach((li) => li.classList.toggle("on", +li.dataset.s === Math.min(i, STEPS.length - 1))); i++; }; tick(); timer = setInterval(tick, 9000); }
  const keyFor = (id) => { try { return localStorage.getItem("encore.giftkey." + id) || ""; } catch { return ""; } };
  async function poll(id) { for (let n = 0; n < 120; n++) { let d; try { const k = keyFor(id); d = await (await fetch("/api/public/giftplan/" + id + (k ? "?k=" + encodeURIComponent(k) : ""))).json(); } catch { d = null; } if (d?.status === "ready") { clearInterval(timer); return show(d); } if (d?.status === "failed" || d?.code) { clearInterval(timer); viewing(false); $("#out").innerHTML = ""; if (d.code) history.replaceState(null, "", "/gifts/plan"); $("#hLede").textContent = d.error || d.message || "I dropped that one. Try again."; window.scrollTo({ top: 0 }); return; } await new Promise((r) => setTimeout(r, n < 5 ? 1200 : 3000)); } }
  const save = (text, name, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 300); };
  const up = (t) => String(t || "").replace(/^\s*([a-z])/, (_, c) => c.toUpperCase());
  const ab = (v) => String(v || "").replace(/^(about|approx\.?|~|est\.?)\s*/i, "");
  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const longDate = (s) => new Date(s + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  // the playbook as Markdown
  function md(d) { const p = d.plan, b = p.playbook, F2 = b.finance || {}; return [`# Gift plan: ${p.company} · ${p.moment.title}`, d.example ? "Example: Fernlight and its accounts are made up." : p.source === "draft" ? "Draft from your answers." : "", "", `Who it's for: ${p.kindLabel}`, ...(p.date ? [`Date: ${longDate(p.date)}`] : []), "", `## The idea: ${p.theme.name}`, p.theme.idea, p.theme.line ? `> ${p.theme.line}` : "", "",

  F.onsubmit = (e) => { e.preventDefault(); const body = Object.fromEntries(new FormData(F)); body.accounts = String(body.accounts || "").split(/\r?\n/).map((x) => x.trim()).filter(Boolean).slice(0, 301); submit(body); };
  // a plan page leads with the plan: the request form steps aside
  function viewing(on, ex) { document.body.classList.toggle("viewing", on); F.hidden = on; $("#hTitle").innerHTML = on ? (ex ? "An example <em>gift plan</em>" : "Your <em>gift plan</em>") : "Plan the <em>gifts</em>."; $("#hLede").textContent = on ? "" : "Tell me who and how much. I'll pick a gift per group."; }
  const m = location.pathname.match(/^\/gifts\/plan\/([a-f0-9]{8,16}|example)$/); if (m) { viewing(true, m[1] === "example"); thinking(""); poll(m[1]); }
  let shut = []; addEventListener("beforeprint", () => { shut = [...document.querySelectorAll("details.fold:not([open]),details.sub:not([open])")]; shut.forEach((x) => (x.open = true)); }); addEventListener("afterprint", () => { shut.forEach((x) => (x.open = false)); shut = []; });
