<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/calm.js"></script><script src="/authguard.js"></script>
<title>Guides for hosts · Pottery Lab</title>
<meta name="description" content="Short programs for hosts: your first supper club, a booked table for friends, a monthly game night, a class, a drop, a weekend away, a small summit, growing your regulars.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lists.css">
<style>
/* /guides and /guides/<id> (public/guides.js draws them). Tokens only (public/system.css) */
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--pl-page);color:var(--pl-ink);font:16px/1.5 var(--sys-sans)}
a{color:inherit}
.crumb{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--pl-accent-text);font:600 14px var(--sys-sans);text-decoration:none;margin:0 0 4px}
.crumb:hover{text-decoration:underline;text-underline-offset:3px}
</style><script src="/mascot.js"></script></head><body>
<main class="ls-wrap" id="m">
  <a class="crumb" href="/?app=1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Home</a>
  <div id="g" data-calm="guide"></div>
</main>
<script src="/guides.js"></script>
<script>
(function () {
  const el = document.getElementById("g"), m = location.pathname.match(/^\/guides\/([a-z0-9-]{2,40})$/);
  if (!/(?:^|;\s*)encore_in=1/.test(document.cookie)) { const c = document.querySelector(".crumb"); c.href = "/discover"; c.lastChild.textContent = "Discover"; }
  if (m) window.PLGuides.page(el, m[1]); else window.PLGuides.list(el);
})();
</script>
<script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
