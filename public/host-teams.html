<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookable for teams · Pottery Lab</title><meta name="description" content="Set up packages for teams, answer requests, get verified and see payouts.">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/teams-intel.css"><link rel="stylesheet" href="/teams-panel.css"><style>.ht-steps{margin-top:20px}.ht-steps li{border-top:3px solid var(--pl-line,#CFC8B9);padding-right:8px}.ht-steps li[aria-current=step]{border-top-color:var(--pl-accent,#29489A)}.ht-steps button{all:unset;cursor:pointer;display:block;width:100%;padding:2px 0;font:inherit;color:inherit}.ht-steps button:focus-visible{outline:3px solid var(--bb-focus,rgba(41,72,154,.3));outline-offset:2px}</style></head>
<body class="bb"><main class="bb-wrap" id="main" style="max-width:960px"><p class="bb-meta" style="padding-top:24px">Loading…</p></main>
<script src="/eventart.js"></script><script src="/photosheet.js"></script><script src="/brandbook.js"></script><script src="/teams-panel.js"></script><script src="/teams-panel2.js"></script>
<script>
(function () {
  const { esc, api, icon, money, $, $$ } = BB; BB.top("teams", "host");
  const main = $("#main"); let D = null, REQ = [], BR = {}, tab = (location.hash || "#inbox").slice(1);
  const day = (d) => (d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }) : "");
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  async function load() { try { D = await api("/api/bb/host/setup"); REQ = (await api("/api/bb/host/requests")).requests; try { BR = Object.fromEntries((await api("/api/bb/host/confirm")).events.map((e) => [e.id, e])); } catch {} } catch (e) { main.innerHTML = e.status === 401 ? `<h1>Sign in to set up team bookings</h1><a class="bb-btn primary lg" href="/login?next=/host/teams">Sign in</a>` : `<h1>First, your host page</h1><p class="bb-lede">${esc(e.message)}</p><a class="bb-btn primary" href="/?app=1">Set up your page</a>`; return; } draw(); }
  function draw() { const open = REQ.filter((r) => ["requested", "question"].includes(r.status) && !(r.status === "question" && r.respondedAt)).length, s = D.stats;
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">${esc(D.host.name)}</p><h1>Bookable for <em>teams</em></h1><p class="bb-lede">Companies book hosts for offsites, client dinners and celebrations. Set your packages once, then answer requests here.</p>
      <div class="bb-badges">${D.setup.on ? `<span class="bb-badge">${icon("check")}Listed for teams</span>` : `<span class="bb-badge">${icon("minus")}Not listed yet</span>`}${s.trusted ? BB.trustedBadge() : ""}<span class="bb-badge">Quality score <b class="bb-mono">&nbsp;${s.quality}</b></span></div></section>
      <div class="bb-tabs" role="tablist">${[["inbox", `Requests${open ? ` (${open})` : ""}`], ["confirm", "Confirm"], ["earnings", "Earnings"], ["followers", "Followers"], ["setup", "Setup"], ["trust", "Trust"], ["payouts", "Payouts"]].map(([k, t]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${t}</button>`).join("")}</div><div id="pane"></div><div id="pane2" class="tp"></div>`;
    $$("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, "", "#" + tab); draw(); }));
    ({ inbox, setup, trust, payouts, confirm: () => { window.TP?.hostConfirm($("#pane")); window.TP2?.hostExtras($("#pane2")); }, earnings: () => window.TP?.hostEarnings($("#pane")), followers: () => window.TP2?.hostFollowers($("#pane")) }[tab] || inbox)(); }

  // ---- the request inbox: accept, suggest a change, decline ----
  function inbox() { const P = $("#pane");
    const groups = [["Questions", REQ.filter((r) => r.status === "question")], ["New", REQ.filter((r) => r.status === "requested")], ["Waiting on the team", REQ.filter((r) => ["countered", "accepted"].includes(r.status))], ["Booked", REQ.filter((r) => r.status === "booked")], ["Past events", REQ.filter((r) => r.status === "done")], ["Closed", REQ.filter((r) => ["declined", "cancelled"].includes(r.status))]];
    const toReview = REQ.filter((r) => r.status === "done" && !r.reviews.mine).length;
    P.innerHTML = REQ.length ? groups.filter(([, L]) => L.length).map(([t, L]) => t === "Past events" || t === "Closed" ? `<section class="bb-sec"><details><summary><h2 style="display:inline">${t} <span class="bb-meta">(${L.length}${t === "Past events" && toReview ? `, ${toReview} to review` : ""})</span></h2></summary><div class="bb-list">${L.map(row).join("")}</div></details></section>` : `<section class="bb-sec"><h2>${t}</h2><div class="bb-list">${L.map(row).join("")}</div></section>`).join("") : `<div class="bb-empty" style="margin-top:16px"><p>No requests yet. ${D.setup.on ? "Teams find you through Discover. A few clear photos help most." : "Turn on team bookings in Setup to be found."}</p><button class="bb-btn primary" data-tab2="setup">Go to Setup</button></div>`;
    $("[data-tab2]")?.addEventListener("click", () => { tab = "setup"; draw(); });
    P.onclick = async (e) => { const b = e.target.closest("[data-act]"); if (!b) return; const r = REQ.find((x) => x.id === b.dataset.id), a = b.dataset.act;
      if (a === "accept" && r.date) return act(r.id, { action: "accept" });
      if (a === "accept") return BB.sheet(`Pick a date in ${r.flexText.replace(/^Any /, "")}`, `<p>${esc(r.company)} asked for <b>${esc(r.flexText.toLowerCase())}</b>.</p><label class="bb-field"><span>Date</span><input type="date" id="ad" min="${r.flex.month}-01" max="${r.flex.month}-31"></label><div class="ft"><span></span><button class="bb-btn primary" id="ago">Accept this date</button></div>`, { onOpen: (bg, close) => (bg.querySelector("#ago").onclick = () => { close(); act(r.id, { action: "accept", date: bg.querySelector("#ad").value }); }) });
      if (a === "counter") return BB.sheet("Suggest a change", `<p class="bb-meta">They asked for ${esc(r.date ? day(r.date) : r.flexText)} at ${money(r.price.perPersonCents)} a person. Change one or both.</p><div class="bb-row"><label class="bb-field"><span>New date</span><input type="date" id="cd"></label><label class="bb-field"><span>Price a person</span><input id="cp" inputmode="decimal" placeholder="${(r.price.perPersonCents / 100).toFixed(0)}"></label></div><label class="bb-field"><span>A note</span><textarea id="cn" maxlength="600" placeholder="Thursdays work better for my kitchen."></textarea></label><div class="ft"><span></span><button class="bb-btn primary" id="cgo">Send suggestion</button></div>`, { onOpen: (bg, close) => (bg.querySelector("#cgo").onclick = () => { const v = bg.querySelector("#cp").value.replace(/[^\d.]/g, ""); close(); act(r.id, { action: "counter", date: bg.querySelector("#cd").value, perPersonCents: v ? Math.round(+v * 100) : "", note: bg.querySelector("#cn").value }); }) });
      if (a === "decline") return BB.sheet("Decline this request", `<p>${esc(r.company)}'s deposit is released right away.</p><label class="bb-field"><span>A kind note (optional)</span><textarea id="dn" maxlength="600" placeholder="I'm away that week. I'd love to host you another time."></textarea></label><div class="ft"><span></span><button class="bb-btn primary" id="dgo">Decline</button></div>`, { onOpen: (bg, close) => (bg.querySelector("#dgo").onclick = () => { close(); act(r.id, { action: "decline", note: bg.querySelector("#dn").value }); }) });
      if (a === "done") { try { await api(`/api/bb/host/requests/${r.id}/done`, {}); load(); } catch (er) { BB.toast(er.message); } }
      if (a === "thread") { const el = $(`#t-${r.id}`); el.classList.toggle("bb-hide"); }
      if (a === "review") { const el = $(`#rv-${r.id}`); el.classList.toggle("bb-hide"); } };
    P.onsubmit = async (e) => { e.preventDefault(); const f = e.target, id = f.dataset.id; try { if (f.dataset.kind === "msg") { const x = await api(`/api/bb/requests/${id}/messages`, { text: f.querySelector("input").value }); if (x.hidden) BB.toast("Contact details are hidden until they're booked."); } else { await api(`/api/bb/requests/${id}/review`, { rating: +f.querySelector("select").value, text: f.querySelector("textarea").value }); BB.toast("Thanks. Only their team sees it."); } load(); } catch (er) { BB.toast(er.message); } }; }
  async function act(id, body) { try { await api(`/api/bb/host/requests/${id}`, body); BB.toast("Sent"); load(); } catch (e) { BB.toast(e.message); } }
  function row(r) { const fresh = ["requested", "countered"].includes(r.status), mins = Math.round((Date.now() - r.createdAt) / 60000);
    return `<div class="bb-req"><div><span class="bb-status ${r.status}">${esc(r.statusText)}</span>${r.instant ? ` <span class="bb-badge instant">${icon("bolt")}Instant</span>` : ""}
      <h3 style="margin-top:8px">${esc(r.company)} · ${esc(r.pkgName)}</h3><p class="bb-meta">${r.status === "question" ? "" : `${icon("cal")} ${esc(r.date ? day(r.date) : r.flexText)} · `}${icon("people")} ${r.headcount} · <b class="bb-mono">${money(r.price.totalCents)}</b> total${r.occasion ? ` · ${esc(r.occasion)}` : ""}</p>
      ${r.diets.length || r.access.length ? `<p class="bb-meta">${esc([...r.diets, ...r.access].join(", "))}</p>` : ""}${r.notes ? `<p style="margin:4px 0">“${esc(r.notes)}”</p>` : ""}
      ${BR[r.id]?.briefLines?.length ? `<details class="bb-panel" style="margin:8px 0"${r.status === "requested" ? " open" : ""}><summary><b>The brief</b> <span class="bb-meta">${esc(BR[r.id].briefState.line)}${r.status === "requested" ? ". Accepting agrees to it; to change it, open Confirm." : ""}</span></summary><ul class="tp-lines">${BR[r.id].briefLines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></details>` : ""}
      ${r.status === "requested" ? `<p class="bb-meta">${icon("clock")} Asked ${mins < 60 ? mins + " min" : Math.round(mins / 60) < 48 ? Math.round(mins / 60) + " hours" : Math.round(mins / 1440) + " days"} ago. Replying within a day keeps you on track for Trusted host.</p>` : ""}
      ${r.status === "countered" ? `<p class="bb-meta">You suggested ${r.counter.date ? day(r.counter.date) : ""}${r.counter.perPersonCents != null ? ` ${money(r.counter.perPersonCents)} a person` : ""}. Waiting on them.</p>` : ""}
      ${r.contact ? `<p class="bb-meta">${icon("mail")} ${esc(r.contact.name)}, <a href="mailto:${esc(r.contact.email)}">${esc(r.contact.email)}</a>${r.contact.phone ? " · " + esc(r.contact.phone) : ""}</p>` : ""}
      <div id="t-${r.id}" class="${r.status === "question" ? "" : "bb-hide"}"><div class="bb-thread">${r.messages.map((m) => `<div class="bb-msg ${m.from === "host" ? "me" : ""}">${esc(m.text)}<small>${esc(m.name)}</small></div>`).join("") || '<p class="bb-meta">No messages yet.</p>'}</div><form class="bb-compose" data-kind="msg" data-id="${r.id}"><input maxlength="1000" placeholder="Message ${esc(r.contactName || r.company)}" aria-label="Message"><button class="bb-btn">Send</button></form></div>
      ${r.status === "done" && !r.reviews.mine ? `<form id="rv-${r.id}" class="bb-hide bb-panel" data-kind="review" data-id="${r.id}"><p class="bb-meta">Private: only ${esc(r.company)} sees this, after they've reviewed you or after 14 days.</p><label class="bb-field"><span>Rating</span><select>${[5, 4, 3, 2, 1].map((n) => `<option>${n}</option>`).join("")}</select></label><label class="bb-field"><span>How was this team to host?</span><textarea maxlength="1200"></textarea></label><button class="bb-btn primary">Send</button></form>` : ""}
      ${r.reviews?.theirs ? `<p class="bb-meta">Their review: ${BB.stars(r.reviews.theirs.rating)} “${esc(r.reviews.theirs.text)}”</p>` : ""}</div>
      <div class="acts">${fresh && r.status === "requested" ? `<button class="bb-btn primary" data-act="accept" data-id="${r.id}">Accept</button><button class="bb-btn" data-act="counter" data-id="${r.id}">Suggest a change</button><button class="bb-btn quiet" data-act="decline" data-id="${r.id}">Decline</button>` : ""}
        <button class="bb-btn quiet" data-act="thread" data-id="${r.id}">${icon("chat")} ${r.messages.length || ""}</button>${r.status === "booked" && r.date && r.date < new Date().toISOString().slice(0, 10) ? `<button class="bb-btn" data-act="done" data-id="${r.id}">Mark done</button>` : ""}${r.status === "done" && !r.reviews.mine ? `<button class="bb-btn" data-act="review" data-id="${r.id}">Review this team</button>` : ""}</div></div>`; }

  // ---- setup: packages, pricing, capacity, lead time, availability, policy ----
  function setup() { const S = D.setup, P = $("#pane");
    if (!S.packages.length) S.packages = D.suggest.length ? D.suggest.map((x) => ({ ...x, perPersonCents: 0, minimumCents: 0, leadDays: 14, moods: [], weekdays: [1, 2, 3, 4, 5], time: "evening", depositPct: 25, photos: [], on: true })) : [{ name: "", story: "", perPersonCents: 0, minimumCents: 0, minGuests: 6, maxGuests: 14, leadDays: 14, moods: [], includes: [], diets: [], access: [], weekdays: [1, 2, 3, 4, 5], time: "evening", depositPct: 25, photos: [], on: true }];
    // review 16: four short steps instead of one long form. Every step stays in the page (hidden), so Save reads them all.
    const STEPS = [["pkgs", "Packages"], ["about", "About you"], ["policy", "Cancellation"], ["live", "Go live"]];
    P.innerHTML = `<ol class="bb-steps ht-steps" aria-label="Setup steps">${STEPS.map(([k, t], i) => `<li data-sk="${k}"><button type="button" data-goto="${i}">${t}</button></li>`).join("")}</ol>
      <div data-step="pkgs"><section class="bb-sec"><h2>Your packages</h2><p class="bb-meta">What a team can book: a name, photos, a price and who it suits. Most hosts start with one.</p></section><div id="pkgs"></div><button class="bb-btn" type="button" id="addP">${icon("plus")} Add a package</button></div>
      <div data-step="about" hidden><section class="bb-sec"><h2>About you and where you host</h2><label class="bb-field"><span>Your story for teams</span><textarea id="story" maxlength="2000" placeholder="Why you host, what a night with you feels like">${esc(S.story)}</textarea></label>
        <div class="bb-row"><label class="bb-field"><span>Hosting since</span><input id="since" inputmode="numeric" value="${S.since || ""}" placeholder="2019"></label><label class="bb-field"><span>Neighbourhood</span><input id="area" list="areasL" value="${esc(S.area)}"><datalist id="areasL">${D.areas.map((a) => `<option value="${esc(a)}">`).join("")}</datalist><small>Teams see this area on a map, never your address.</small></label></div>
        <div class="bb-row"><label class="bb-field"><span>Address (private)</span><input id="addr" value="${esc(S.address)}"><small>${icon("lock")} Shared only with a team once they're booked.</small></label><label class="bb-field"><span>Phone (private)</span><input id="phone" value="${esc(S.phone)}"><small>Shared only after booking.</small></label></div>
        <label class="bb-field"><span>Tax ID for invoices (optional)</span><input id="taxid" value="${esc(S.taxId)}"></label></section></div>
      <div data-step="policy" hidden><section class="bb-sec"><h2>Cancellation</h2><div class="bb-list">${Object.entries(D.policies).map(([k, t]) => `<label class="bb-panel" style="display:grid;grid-template-columns:24px 1fr;gap:8px;margin:6px 0;cursor:pointer"><input type="radio" name="pol" value="${k}" ${S.policy === k ? "checked" : ""}><span><b>${esc(t.label)}</b>${BB.termsList(t).replace(/<p class="bb-meta">.*<\/p>/, "")}</span></label>`).join("")}</div></section></div>
      <div data-step="live" hidden><section class="bb-sec"><label style="display:flex;gap:12px;align-items:center;font-weight:600"><input type="checkbox" id="on" ${S.on ? "checked" : ""} style="width:22px;height:22px"> List me for team bookings</label><p class="bb-meta">Teams see your packages in Discover. You approve every request unless you turn on Instant book.</p></section><div id="htSum" class="bb-panel" style="margin-top:12px"></div></div>
      <div class="ht-nav" style="display:flex;gap:12px;justify-content:space-between;margin:24px 0 8px"><button class="bb-btn" type="button" id="htBack">Back</button><button class="bb-btn primary" type="button" id="htNext">Next</button></div>
      <div class="bb-bar save" style="display:flex"><div class="t"><b>Save your changes</b><small>Teams see them right away</small></div><button class="bb-btn primary" id="save">Save</button></div><div style="height:72px"></div>`;
    let step = Math.max(0, STEPS.findIndex(([k]) => k === (sessionStorage.getItem("ht.step") || "pkgs")));
    const sumUp = () => { read(); const n = S.packages.filter((x) => x.on !== false && x.name).length, pol = (P.querySelector("[name=pol]:checked") || {}).value || "standard", miss = [];
      if (!n) miss.push("a package with a name"); if (!S.packages.some((x) => x.perPersonCents > 0 || x.minimumCents > 0)) miss.push("a price"); if (!$("#story").value.trim()) miss.push("your story"); if (!$("#area").value.trim()) miss.push("your neighbourhood");
      $("#htSum").innerHTML = `<h3 style="margin:0 0 6px">Your listing</h3><p style="margin:0">${n} ${n === 1 ? "package" : "packages"} bookable · ${esc(D.policies[pol]?.label || "Standard")} cancellation${$("#area").value.trim() ? " · " + esc($("#area").value.trim()) : ""}</p>${miss.length ? `<p class="bb-meta" style="margin:8px 0 0">Still to add: ${esc(miss.join(", "))}. Teams book hosts with these filled in far more often.</p>` : `<p class="bb-meta" style="margin:8px 0 0">Everything teams look for is filled in.</p>`}`; };
    const go = (i) => { step = Math.max(0, Math.min(STEPS.length - 1, i)); try { sessionStorage.setItem("ht.step", STEPS[step][0]); } catch {}
      $$("[data-step]", P).forEach((el) => (el.hidden = el.dataset.step !== STEPS[step][0])); $$("[data-sk]", P).forEach((li, j) => (j === step ? li.setAttribute("aria-current", "step") : li.removeAttribute("aria-current")));
      $("#htBack").style.visibility = step ? "visible" : "hidden"; $("#htNext").style.display = step === STEPS.length - 1 ? "none" : ""; $("#htNext").textContent = step === STEPS.length - 2 ? "Review and go live" : "Next";
      if (STEPS[step][0] === "live") sumUp(); };
    $$("[data-goto]", P).forEach((b) => (b.onclick = () => { read(); go(+b.dataset.goto); P.scrollIntoView({ block: "start" }); }));
    $("#htBack").onclick = () => { read(); go(step - 1); P.scrollIntoView({ block: "start" }); }; $("#htNext").onclick = () => { read(); go(step + 1); P.scrollIntoView({ block: "start" }); };
    const pk = $("#pkgs"); const drawP = () => { pk.innerHTML = S.packages.map(pkgForm).join(""); wireP(); }; drawP(); go(step);
    $("#addP").onclick = () => { S.packages.push({ name: "", story: "", perPersonCents: 0, minimumCents: 0, minGuests: 6, maxGuests: 14, leadDays: 14, moods: [], includes: [], diets: [], access: [], weekdays: [1, 2, 3, 4, 5], time: "evening", depositPct: 25, photos: [], on: true }); drawP(); };
    function read() { $$("[data-p]", pk).forEach((f) => { const i = +f.dataset.p, p = S.packages[i], v = (n) => f.querySelector(`[name=${n}]`);
      Object.assign(p, { name: v("name").value.trim(), story: v("story").value.trim(), perPersonCents: Math.round(+v("pp").value.replace(/[^\d.]/g, "") * 100) || 0, minimumCents: Math.round(+v("min").value.replace(/[^\d.]/g, "") * 100) || 0, minGuests: +v("ming").value || 1, maxGuests: +v("maxg").value || 1, leadDays: +v("lead").value || 0, length: v("len").value.trim(), includes: v("inc").value.split(",").map((x) => x.trim()).filter(Boolean),
        moods: $$("[data-mood][aria-pressed=true]", f).map((b) => b.dataset.mood), diets: $$("[data-diet][aria-pressed=true]", f).map((b) => b.dataset.diet), access: $$("[data-acc][aria-pressed=true]", f).map((b) => b.dataset.acc), weekdays: $$("[data-wd][aria-pressed=true]", f).map((b) => +b.dataset.wd), time: v("time").value, depositPct: +v("dep").value, taxBps: Math.round(+v("tax").value * 100) || 0, remote: v("remote").checked, instant: v("instant").checked, on: v("pon").checked, venue: v("venue").value }); }); }
    function wireP() {
      $$(".bb-toggles [aria-pressed]", pk).forEach((b) => (b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));
      $$("[data-preview]", pk).forEach((el) => { const f = el.closest("[data-p]"), upd = () => { const pp = +f.querySelector("[name=pp]").value.replace(/[^\d.]/g, "") || 0, mn = +f.querySelector("[name=min]").value.replace(/[^\d.]/g, "") || 0, n = 12; el.innerHTML = pp ? `A team of ${n} sees <b class="bb-mono">${money(Math.max(pp * n, mn) * 100)} total</b>, ${money(Math.max(pp * n, mn) * 100 / n)} a person, before any tax.` : "Add a price to see what teams see."; }; f.querySelectorAll("[name=pp],[name=min]").forEach((x) => (x.oninput = upd)); upd(); });
      $$("[data-addphoto]", pk).forEach((b) => (b.onclick = () => { read(); const p = S.packages[+b.dataset.addphoto]; if (!window.PhotoSheet) return BB.toast("Photo upload isn't available here.");
        window.PhotoSheet.open({ for: "cover", onChange: async (c) => { if (!c?.url) return; const im = new Image(); im.src = c.url; await im.decode().catch(() => {}); p.photos.push({ url: c.url, w: im.naturalWidth, h: im.naturalHeight, caption: "" }); drawP(); } }); }));
      $$("[data-rmphoto]", pk).forEach((b) => (b.onclick = () => { read(); const [i, j] = b.dataset.rmphoto.split(":").map(Number); S.packages[i].photos.splice(j, 1); drawP(); }));
      $$("[data-rmpkg]", pk).forEach((b) => (b.onclick = () => { read(); S.packages.splice(+b.dataset.rmpkg, 1); drawP(); })); }
    $("#save").onclick = async () => { read(); const body = { on: $("#on").checked, packages: S.packages, policy: (P.querySelector("[name=pol]:checked") || {}).value || "standard", story: $("#story").value, since: +$("#since").value || 0, area: $("#area").value, city: S.city, address: $("#addr").value, phone: $("#phone").value, taxId: $("#taxid").value };
      try { const r = await api("/api/bb/host/setup", body); D.setup = r.setup; D.stats = r.stats; BB.toast("Saved. Teams see it now."); draw(); } catch (e) { BB.toast(e.message); } }; }
  function pkgForm(p, i) { const T = (arr, on, k, lab = (x) => x[0].toUpperCase() + x.slice(1)) => `<div class="bb-toggles">${arr.map((x) => `<button type="button" class="bb-chip" data-${k}="${esc(x.id ?? x)}" aria-pressed="${on.includes(x.id ?? x)}">${x.id ? icon(x.id) : ""}${esc(x.label ?? lab(x))}</button>`).join("")}</div>`;
    const good = (x) => x.w >= 1200 && x.h >= 700, nGood = p.photos.filter(good).length;
    return `<section class="bb-panel" data-p="${i}" style="margin:16px 0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">${esc(p.name || "New package")}</h2><label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" name="pon" ${p.on !== false ? "checked" : ""}> Bookable</label></div>
      <label class="bb-field" style="margin-top:12px"><span>Name</span><input name="name" maxlength="80" value="${esc(p.name)}" placeholder="Supper club for your team"></label>
      <label class="bb-field"><span>What teams will do</span><textarea name="story" maxlength="1200" placeholder="Six courses at one long table. I cook, you talk.">${esc(p.story)}</textarea></label>
      <h3>Photos</h3><div class="bb-guide"><div>${icon("sun")}Daylight</div><div>${icon("people")}Real guests</div><div>${icon("table")}The table set</div></div>
      <p class="bb-meta">Three or more wide photos, 1200px or bigger, lead your listing edge to edge. Until then we show one of our drawn covers.</p>
      <div class="bb-photos">${p.photos.map((x, j) => `<figure><img src="${esc(x.url)}" alt=""><figcaption>${good(x) ? "Sharp" : "Small"}</figcaption><button type="button" data-rmphoto="${i}:${j}" aria-label="Remove photo">${icon("x")}</button></figure>`).join("")}</div>
      <p><button class="bb-btn quiet" type="button" data-addphoto="${i}">${icon("camera")} Add a photo</button> <span class="bb-meta">${nGood >= 2 ? `${nGood} good photos. Your photos lead.` : `${nGood} of 2 good photos so far.`}</span></p>
      <h3 style="margin-top:16px">Moods</h3>${T(D.moods.filter((m) => m.id !== "under50"), p.moods || [], "mood")}
      <h3 style="margin-top:16px">Price</h3><div class="bb-row3"><label class="bb-field"><span>A person ($)</span><input name="pp" inputmode="decimal" value="${p.perPersonCents ? p.perPersonCents / 100 : ""}"></label><label class="bb-field"><span>Group minimum ($)</span><input name="min" inputmode="decimal" value="${p.minimumCents ? p.minimumCents / 100 : ""}"><small>Optional</small></label><label class="bb-field"><span>Sales tax %</span><input name="tax" inputmode="decimal" value="${p.taxBps ? p.taxBps / 100 : ""}" placeholder="0"><small>0 if it's in the price</small></label></div>
      <p class="bb-note" data-preview></p>
      <div class="bb-row3"><label class="bb-field"><span>Deposit</span><select name="dep">${[25, 50, 100].map((d) => `<option value="${d}" ${p.depositPct === d ? "selected" : ""}>${d}%</option>`).join("")}</select></label><label class="bb-field"><span>Fewest people</span><input name="ming" inputmode="numeric" value="${p.minGuests}"></label><label class="bb-field"><span>Most people</span><input name="maxg" inputmode="numeric" value="${p.maxGuests}"></label></div>
      <div class="bb-row3"><label class="bb-field"><span>Notice (days)</span><input name="lead" inputmode="numeric" value="${p.leadDays}"></label><label class="bb-field"><span>How long</span><input name="len" value="${esc(p.length || "")}" placeholder="3 hours"></label><label class="bb-field"><span>Where</span><select name="venue"><option value="host" ${p.venue === "host" ? "selected" : ""}>My space</option><option value="brand" ${p.venue === "brand" ? "selected" : ""}>Their office</option><option value="venue" ${p.venue === "venue" ? "selected" : ""}>A venue I book</option></select></label></div>
      <label class="bb-field"><span>Included</span><input name="inc" value="${esc((p.includes || []).join(", "))}" placeholder="Ingredients, venue, service"></label>
      <h3>Availability</h3>${T([1, 2, 3, 4, 5, 6, 0].map(String), (p.weekdays || []).map(String), "wd", (x) => WD[+x])}<label class="bb-field" style="margin-top:8px"><span>Time of day</span><select name="time"><option value="evening" ${p.time === "evening" ? "selected" : ""}>Evenings</option><option value="daytime" ${p.time === "daytime" ? "selected" : ""}>Daytime</option><option value="any" ${p.time === "any" ? "selected" : ""}>Either</option></select></label>
      <h3>Dietary needs you can cook for</h3>${T(D.diets, p.diets || [], "diet")}<h3 style="margin-top:12px">Accessibility</h3>${T(D.access, p.access || [], "acc")}
      <label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" name="remote" ${p.remote ? "checked" : ""}> Works for remote teams (a kit in the mail, me on the call)</label>
      <label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input type="checkbox" name="instant" ${p.instant ? "checked" : ""} ${D.stats.trusted ? "" : "disabled"}> <span><b>Instant book</b><br><small class="bb-meta">${D.stats.trusted ? "Open dates are confirmed as soon as a team pays the deposit." : "For Trusted hosts. See Trust for what's left."}</small></span></label>
      <p><button class="bb-link" type="button" data-rmpkg="${i}">Remove this package</button></p></section>`; }

  // ---- trust: the badge criteria, verification, insurance ----
  function trust() { const s = D.stats, V = D.verify, P = $("#pane");
    P.innerHTML = `<section class="bb-sec"><h2>Trusted host</h2><p class="bb-meta">Earned, never bought. The same rules for everyone, <a href="/teams/trusted">published here</a>.</p><ul class="bb-checks">${s.checks.map((c) => `<li class="${c.met ? "ok" : "no"}">${icon(c.met ? "check" : "minus")}<span>${esc(c.label)}<small>${esc(c.have)}</small></span></li>`).join("")}</ul></section>
      <section class="bb-sec"><h2>Quality score</h2><div class="bb-score"><b>${s.quality}</b><span class="bb-meta">of 100</span></div><p class="bb-meta">It shapes where you show in Discover: reviews, how fast you reply, teams who book again, good photos and verification. Cancelling lowers it.</p></section>
      <section class="bb-sec"><h2>Verification</h2><ul class="bb-checks">
        <li class="${s.emailVerified ? "ok" : "no"}">${icon(s.emailVerified ? "check" : "minus")}<span>Email<small>${s.emailVerified ? "Verified when you signed up" : "Check your inbox for the link"}</small></span></li>
        <li class="${s.phoneVerified ? "ok" : "no"}">${icon(s.phoneVerified ? "check" : "minus")}<span>Phone<small>${s.phoneVerified ? esc(V.phone.number) + ", verified" : `<span class="bb-compose" style="margin-top:6px"><input id="ph" placeholder="+1 718 555 0100" value="${esc(V.phone?.number || "")}"><button class="bb-btn" id="phS">Text me a code</button></span><span class="bb-compose bb-hide" id="phC" style="margin-top:6px"><input id="code" inputmode="numeric" placeholder="6-digit code"><button class="bb-btn" id="phOk">Confirm</button></span>`}</small></span></li>
        <li class="${s.idChecked ? "ok" : "no"}">${icon(s.idChecked ? "check" : "minus")}<span>ID check<small>${s.idChecked ? "Checked" : V.id.state === "pending" ? "With our team now. We check within 2 working days." : V.id.state === "declined" ? "We couldn't confirm it. Reply to our email and we'll sort it out." : `<span class="bb-compose" style="margin-top:6px"><input id="legal" placeholder="Your full legal name"><button class="bb-btn" id="idGo">Ask for an ID check</button></span>A person on our team checks it for now.`}</small></span></li></ul></section>
      <section class="bb-sec"><h2>Insurance</h2><p class="bb-meta">Many companies ask for a certificate of insurance (COI). Upload yours once; teams can open it after they book.</p>
        ${V.coi?.onFile ? `<p>${icon("doc")} <b>${esc(V.coi.name)}</b>${V.coi.insurer ? ` from ${esc(V.coi.insurer)}` : ""}${V.coi.expires ? `, valid until ${day(V.coi.expires)}` : ""}</p>` : ""}
        <div class="bb-row"><label class="bb-field"><span>Insurer</span><input id="ins"></label><label class="bb-field"><span>Valid until</span><input id="exp" type="date"></label></div><label class="bb-field"><span>Certificate (PDF, JPEG or PNG)</span><input id="coi" type="file" accept="application/pdf,image/jpeg,image/png"></label><button class="bb-btn" id="coiGo">Upload</button></section>`;
    $("#phS")?.addEventListener("click", async () => { try { const r = await api("/api/bb/host/verify/phone", { phone: $("#ph").value }); BB.toast(r.message); $("#phC").classList.remove("bb-hide"); } catch (e) { BB.toast(e.message); } });
    $("#phOk")?.addEventListener("click", async () => { try { await api("/api/bb/host/verify/phone/confirm", { code: $("#code").value }); load(); } catch (e) { BB.toast(e.message); } });
    $("#idGo")?.addEventListener("click", async () => { try { const r = await api("/api/bb/host/verify/id", { legalName: $("#legal").value }); BB.toast(r.message); load(); } catch (e) { BB.toast(e.message); } });
    $("#coiGo").onclick = async () => { const f = $("#coi").files[0]; if (!f) return BB.toast("Pick the file first."); const r = await fetch(`/api/bb/host/coi?insurer=${encodeURIComponent($("#ins").value)}&expires=${$("#exp").value}&name=${encodeURIComponent(f.name)}`, { method: "POST", body: f, credentials: "same-origin" }); const j = await r.json().catch(() => ({})); if (!r.ok) return BB.toast(j.message || "Upload didn't work."); BB.toast("Certificate on file"); load(); }; }

  // ---- payouts ----
  async function payouts() { const P = $("#pane"); const d = await api("/api/bb/host/payouts");
    P.innerHTML = `<div class="bb-panel ink" style="margin-top:16px"><h2>${icon("card")} Payouts</h2><p>${esc(d.note)}</p>${d.test ? `<p class="bb-meta">Payments are in test mode here. No real money moves.</p>` : ""}</div>
      ${d.lines.length ? `<table class="bb-lines"><thead><tr><th>Booking</th><th>Date</th><th class="n">Paid so far</th><th>Status</th></tr></thead><tbody>${d.lines.map((l) => `<tr><td>${esc(l.company)}<small>${esc(l.pkgName)}</small></td><td>${day(l.date)}</td><td class="n">${money(l.paidCents)}<small>of ${money(l.totalCents)}</small></td><td>${esc(l.state)}</td></tr>`).join("")}</tbody></table>` : '<p class="bb-meta">Nothing paid yet. Deposits show here once a team books.</p>'}`; }
  load();
})();
</script></body></html>
