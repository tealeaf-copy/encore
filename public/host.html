<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host · Encore</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/community.css">
<style>
.cover{height:150px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#fff),color-mix(in srgb,var(--c) 22%,var(--bg)));margin-top:4px}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:end;margin-top:-48px;padding:0 20px}
.av{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:var(--card);border:4px solid var(--bg);box-shadow:0 10px 30px -16px rgba(43,33,28,.5)}
.head h1{font-size:clamp(26px,5vw,36px)}.handle{color:var(--soft);font-size:14px}
.stats{display:flex;gap:16px;color:var(--soft);font-size:14px;margin-top:6px}.stats b{color:var(--ink)}
.bio{font-size:16px;max-width:620px;margin:18px 20px 0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:24px}
.side .card+.card{margin-top:12px}.side h3{font-size:18px;margin-bottom:6px}
.fform{display:grid;gap:8px;margin-top:10px}.fform .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}.chips input{display:none}.chips input:checked+span{font-weight:600;color:var(--brand2)}
.chips label:has(input:checked){border-color:var(--brand);background:var(--pink)}
.done{display:flex;gap:10px;align-items:center}
.perk{font-size:14px;color:var(--soft);margin:4px 0 10px}
h2.sec{font-size:22px;margin:4px 0 10px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}.kq{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative}.kq p{font:600 16px/1.35 "Fraunces",Georgia,serif;margin:6px 0}.kq small{color:var(--soft)}.kq .t{font-size:18px;letter-spacing:2px}
.kq:nth-child(3n+1){transform:rotate(-.6deg)}.kq:nth-child(3n+2){transform:rotate(.5deg)}
.vibe{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.vibe span{padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--card));font-weight:600;font-size:14px}.vibe span b{opacity:.6;font-weight:500;margin-left:4px}
.strip{display:flex;gap:16px;flex-wrap:wrap;color:var(--soft);font-size:14px;margin:8px 0 0}.strip b{color:var(--ink);font-size:20px;font-family:"Fraunces",Georgia,serif;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr));gap:6px}.gal img,.gal video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.hire{border:2px solid var(--c);border-radius:20px;padding:18px;margin-top:22px;background:color-mix(in srgb,var(--c) 6%,var(--card))}.hire h2{font-size:22px}.hire form{display:grid;gap:8px;margin-top:10px}.hire .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.hire textarea{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:90px}
.tips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:760px){.hire .row2{grid-template-columns:minmax(0,1fr)}}
/* storefront */
body.store{font-family:var(--body)}body.store h1,body.store h2,body.store h3,body.store .top .brand{font-family:var(--head)}body.store .btn,body.store .top nav a.cta{border-radius:var(--radius);color:var(--on-brand)}body.store .btn.ghost{color:var(--ink)}body.store input,body.store textarea{border-radius:min(var(--radius),12px)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}.av{overflow:hidden}
.store-tag{font-size:16px;color:var(--soft);margin-top:2px}.store-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.store-links a{font-size:13px;font-weight:600;padding:5px 12px;border-radius:var(--radius,999px);border:1px solid var(--line);text-decoration:none;background:var(--card)}
body.no-past .s-past,body.no-kudos .s-kudos,body.no-photos .s-photos,body.no-hire #hire,body.no-tips .s-tips,body.no-profile .s-profile{display:none}
.store-fab{position:fixed;right:16px;bottom:16px;z-index:30;border:0;border-radius:999px;padding:12px 18px;font:600 14px "DM Sans",system-ui;background:#2B211C;color:#fff;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);cursor:pointer}
.store-pane{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:40;background:#fff;color:#2B211C;box-shadow:-20px 0 50px -20px rgba(0,0,0,.35);overflow:auto;padding:16px 18px 90px;font:14px/1.45 "DM Sans",system-ui,sans-serif;box-sizing:border-box}
.store-pane h4{margin:16px 0 6px;font:600 13px "DM Sans",system-ui;color:#75685F;text-transform:uppercase;letter-spacing:.04em}.sp-head{display:flex;justify-content:space-between;align-items:center;font-size:17px}.sp-x{border:0;background:none;font-size:20px;cursor:pointer}
.sp-url{background:#F6F1EA;border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0 0;font-weight:600;word-break:break-all}.sp-url button{border:0;background:#2B211C;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
.sws{display:flex;flex-wrap:wrap;gap:6px}.sw{border:2px solid transparent;background:#F6F1EA;border-radius:12px;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:#2B211C;min-width:44px}.sw[aria-pressed=true]{border-color:#2B211C}.sw i{display:block;width:28px;height:28px;border-radius:50%}.sws.covers .sw i,.sws:not(.fonts) .sw i[style*=border]{border-radius:8px;width:44px}.sw small{font-size:11px}.sw span{font-size:20px}.sw .bt{font-size:12px;background:#2B211C;color:#fff;padding:4px 10px}
.sp-up{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.sp-btn{border:1px solid #E6DDD2;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font:inherit;font-size:13px}
.store-pane input:not([type=checkbox]):not([type=file]){width:100%;box-sizing:border-box;border:1px solid #E6DDD2;border-radius:10px;padding:8px 10px;font:inherit;background:#fff;color:#2B211C}.sp-link{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px;margin-bottom:6px}
.sp-tog{display:flex;flex-direction:column;gap:4px}.sp-note{font-size:12px;color:#75685F}.sp-actions{position:fixed;bottom:0;right:0;width:min(380px,100%);box-sizing:border-box;background:#fff;border-top:1px solid #EEE4D8;padding:12px 18px;display:flex;gap:10px;align-items:center}.sp-save{border:0;background:#C2553A;color:#fff;border-radius:999px;padding:10px 18px;font:600 14px "DM Sans",system-ui;cursor:pointer}#sp-msg{font-size:13px;color:#75685F}
.tr{display:flex;gap:10px;align-items:center;padding:6px 0}.tr .e{font-size:26px;width:34px;text-align:center}.tr small{display:block;color:var(--soft)}.past .ev{opacity:.85}
@media (max-width:760px){.head{grid-template-columns:minmax(0,1fr);text-align:left;padding:0 4px}.av{width:88px;height:88px;font-size:44px}.cols{grid-template-columns:minmax(0,1fr)}.bio{margin:14px 4px 0}.fform .row{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<div class="wrap">
  <header class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#C2553A"/><circle cx="19" cy="9" r="3.2" fill="#E9C98C"/></svg>encore</a>
    <nav><a href="/discover">Discover</a><a class="cta" href="/signup?mode=friends">Host something</a></nav></header>
  <main id="m"><div class="empty">Loading…</div></main>
</div>
<footer>Hosted on Encore · <a href="/discover">Find more hosts</a></footer>
<script src="/community.js"></script>
<script src="/storefront.js"></script>
<script>
(async function () {
  const C = window.EncoreCommunity, esc = C.esc, handle = decodeURIComponent(location.pathname.split("/").pop() || "").replace(/^@/, ""), m = document.getElementById("m");
  let d; try { const r = await fetch("/api/public/host/" + encodeURIComponent(handle)); if (!r.ok) throw 0; d = await r.json(); } catch { m.innerHTML = `<div class="empty" style="margin-top:40px">No host by that name. <a href="/discover">See who's hosting</a>.</div>`; return; }
  const h = d.host, first = (h.name || handle).split(/[\s']/)[0];
  document.title = `${h.name || "@" + h.handle} · Encore`; document.body.style.setProperty("--c", h.color || "#E26D8E");
  const followed = (() => { try { return JSON.parse(localStorage.getItem("encore.following") || "[]").includes(h.handle); } catch { return false; } })();
  const tastes = (h.tags || []).slice(0, 5);
  m.innerHTML = `<div class="cover"></div>
  <div class="head"><span class="av">${esc(h.emoji || "🎉")}</span><div><h1>${esc(h.name || "@" + h.handle)}</h1><div class="handle">@${esc(h.handle)}${h.hood || h.city ? " · " + esc([h.hood, h.city].filter(Boolean).join(", ")) : ""}</div>
    <div class="stats"><span><b id="fc">${d.followers}</b> follower${d.followers === 1 ? "" : "s"}</span><span><b>${d.past.length}</b> hosted</span><span><b>${d.upcoming.length}</b> coming up</span></div></div>
    <a class="btn" href="#follow" id="topFollow">${followed ? "Following ✓" : "Follow"}</a></div>
  ${h.bio ? `<p class="bio">${esc(h.bio)}</p>` : ""}
  ${tastes.length ? `<div class="tags" style="margin:10px 20px 0">${tastes.map((t) => `<i>${esc(t)}</i>`).join("")}</div>` : ""}
  <div class="cols"><div>
    <h2 class="sec">Coming up</h2><div class="grid">${d.upcoming.length ? d.upcoming.map((e) => C.eventCard(e)).join("") : `<div class="empty">Nothing on the calendar yet. Follow ${esc(first)} and you'll hear about the next one first.</div>`}</div>
    ${d.past.length ? `<div class="s-past"><h2 class="sec" style="margin-top:22px">Past gatherings</h2><div class="grid past">${d.past.map((e) => C.eventCard(e)).join("")}</div></div>` : ""}
    <div id="extras"></div>
  </div><aside class="side"><div id="sideExtras"></div>
    <div class="card" id="follow"><h3>Join ${esc(first)}'s regulars</h3><p class="muted" style="margin:0;font-size:14px">Get a note when ${esc(first)} hosts something. No account needed. One tap to leave.</p>
      <form class="fform" id="ff"><div class="row"><input name="name" placeholder="First name" autocomplete="given-name"><input name="email" type="email" placeholder="Email" required autocomplete="email"></div>
      ${tastes.length ? `<div class="chips" aria-label="What you'd come for">${tastes.map((t) => `<label><input type="checkbox" name="t" value="${esc(t)}"><span>${esc(t)}</span></label>`).join("")}</div>` : ""}
      <button class="btn" type="submit">Follow ${esc(first)}</button><small class="muted" id="ferr" role="alert"></small></form></div>
    ${h.fanclubUrl || h.supportUrl ? `<div class="card"><h3>Support ${esc(first)}</h3>${h.fanclubPerks ? `<p class="perk">${esc(h.fanclubPerks)}</p>` : `<p class="perk">Hosting costs ingredients and time. Chip in if you've enjoyed one.</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap">${h.fanclubUrl ? `<a class="btn" href="${esc(h.fanclubUrl)}" target="_blank" rel="noopener nofollow">Join the fan club</a>` : ""}${h.supportUrl ? `<a class="btn ghost" href="${esc(h.supportUrl)}" target="_blank" rel="noopener nofollow">Tip ${esc(first)}</a>` : ""}</div></div>` : ""}
    <div class="card"><div class="done">${C.pipSVG("happy", 40)}<div style="font-size:14px">Want to host your own? Encore is invite-only. Ask ${esc(first)} for a code, or <a href="/signup?mode=friends">join the waitlist</a>.</div></div></div>
  </aside></div>`;
  // kudos wall, what they host, the vibe, their event profile, photos
  fetch("/api/public/profile/" + encodeURIComponent(h.handle)).then((r) => r.json()).then((x) => { const S = x.strengths || {}, P = x.profile || {}, W = { run: "Runs", hike: "Hikes", bike: "Bike rides", cook: "Cooking nights", potluck: "Potlucks", games: "Game nights", movie: "Movie nights", concert: "Concerts", cafe: "Café mornings", bake: "Bakes and giveaways", picnic: "Picnics", book: "Book club", club: "Club meetups" };
    const ex = document.getElementById("extras"), se = document.getElementById("sideExtras");
    ex.innerHTML = `${S.kudosCount || S.guests ? `<h2 class="sec" style="margin-top:22px">The vibe</h2><div class="strip"><span><b>${S.guests || 0}</b>${S.guests === 1 ? "person has" : "people have"} come</span><span><b>${S.returning || 0}</b>came back</span><span><b>${S.kudosCount || 0}</b>kudos</span></div>${S.tags?.length ? `<div class="vibe">${S.tags.slice(0, 6).map((t) => `<span>${t.emoji} ${esc(t.label)}<b>×${t.n}</b></span>`).join("")}</div>` : ""}${S.kinds?.length ? `<p class="muted" style="margin:6px 0 0">Hosts mostly: ${S.kinds.slice(0, 4).map((k) => esc(W[k.kind] || k.kind) + ` (${k.n})`).join(", ")}</p>` : ""}` : ""}
      ${S.kudos?.length ? `<div class="s-kudos"><h2 class="sec" style="margin-top:22px">Kudos wall</h2><div class="wall">${S.kudos.filter((k) => k.love || k.tags.length).slice(0, 18).map((k) => `<div class="kq"><div class="t">${(k.tags || []).map((t) => ({ food: "🍜", welcome: "🤗", vibe: "✨", organized: "📋", met: "👋", fun: "😂", spot: "📍", again: "🔁" })[t] || "").join("")}</div>${k.love ? `<p>"${esc(k.love)}"</p>` : ""}<small>${esc(k.name)}${k.event ? ` · ${esc(k.event)}` : ""}</small></div>`).join("")}</div></div>` : ""}
      ${S.moments?.length ? `<div class="s-photos"><h2 class="sec" style="margin-top:22px">Photos</h2><div class="gal">${S.moments.map((m) => m.type === "video" ? `<video src="${esc(m.url)}" muted playsinline controls preload="metadata"></video>` : `<img src="${esc(m.url)}" alt="${esc(m.caption || "")}" loading="lazy">`).join("")}</div></div>` : ""}`;
    if (h.forHire) { const hire = document.createElement("section"); hire.className = "hire"; hire.id = "hire";
      hire.innerHTML = `<small class="muted">Open to paid work</small><h2>Work with ${esc(first)}</h2>${h.services ? `<p style="font-size:16px;margin:6px 0">${esc(h.services)}</p>` : ""}<div class="strip"><span><b>${S.events || 0}</b>events hosted</span><span><b>${S.guests || 0}</b>guests</span><span><b>${S.guests ? Math.round(100 * (S.returning || 0) / S.guests) : 0}%</b>came back</span><span><b>${S.kudosCount || 0}</b>kudos</span></div>
        <form id="inqF"><div class="row2"><input name="name" placeholder="Your name" autocomplete="name"><input name="company" placeholder="Brand or company"></div><div class="row2"><input name="email" type="email" placeholder="Work email" required autocomplete="email"><input name="when" placeholder="When (roughly)"></div><textarea name="message" placeholder="What do you have in mind? Who's it for, how many people, and what would make it a win?" required></textarea><input name="budget" placeholder="Budget (optional)"><button class="btn" type="submit">Send ${esc(first)} a note</button><small class="muted" id="inqM"></small></form>`;
      ex.prepend(hire); document.getElementById("inqF").onsubmit = async (ev) => { ev.preventDefault(); const b = Object.fromEntries(new FormData(ev.target)); try { const r = await fetch("/api/public/inquiry/" + encodeURIComponent(h.handle), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json(); if (!r.ok) throw new Error(j.message); C.oink(); ev.target.innerHTML = `<p><b>Sent.</b> ${esc(first)} gets it by email and in Encore, and will reply to you directly.</p>`; } catch (err) { document.getElementById("inqM").textContent = err.message; } }; }
    if (h.venmo || h.paypal || h.cashapp) { const t = document.createElement("div"); t.className = "card s-tips"; t.style.marginBottom = "12px"; const L = (a) => [h.venmo && ["Venmo", `https://venmo.com/${encodeURIComponent(h.venmo)}?txn=pay&amount=${a}&note=${encodeURIComponent("Thank you for hosting!")}`], h.paypal && ["PayPal", `https://paypal.me/${encodeURIComponent(h.paypal)}/${a}`], h.cashapp && ["Cash App", `https://cash.app/$${encodeURIComponent(h.cashapp)}/${a}`]].filter(Boolean)[0];
      t.innerHTML = `<h3>💛 Tip ${esc(first)}</h3><p class="muted" style="margin:0;font-size:14px">${S.tippers ? `${S.tippers} ${S.tippers === 1 ? "person has" : "people have"} said thanks this way.` : "Hosting takes hours. A few dollars says you noticed."}</p><div class="tips">${[3, 5, 10, 20].map((a) => `<a class="btn ghost" href="${esc(L(a)[1])}" target="_blank" rel="noopener nofollow">$${a}</a>`).join("")}</div>`; se.before(t); }
    if (P.traits?.length) se.innerHTML = `<div class="card s-profile" style="margin-bottom:12px"><h3>${esc(first)}'s event profile</h3><p class="muted" style="margin:0 0 6px;font-size:13px">${P.attended} get-together${P.attended === 1 ? "" : "s"} as a guest · ${P.hosted} hosted</p>${P.traits.slice(0, 4).map((t) => `<div class="tr"><span class="e">${t.emoji}</span><div><b>${esc(t.name)}</b><small>${esc(t.line)}</small></div></div>`).join("")}</div>`;
  }).catch(() => {});
  window.EncoreStore?.apply(h); window.EncoreStore?.editor(h); if (location.pathname.startsWith("/h/")) history.replaceState(null, "", "/@" + h.handle + location.search + location.hash);
  const ff = document.getElementById("ff"), fe = document.getElementById("ferr");
  if (followed) ff.innerHTML = `<div class="done">${C.pipSVG("happy", 34)}<b>You follow ${esc(first)}.</b></div>`;
  ff.addEventListener?.("submit", async (e) => { e.preventDefault(); fe.textContent = ""; const fd = new FormData(ff);
    try { const j = await C.follow({ handle: h.handle, email: fd.get("email"), name: fd.get("name"), tastes: fd.getAll("t"), via: new URLSearchParams(location.search).get("via") || "page" });
      C.oink(); document.getElementById("fc").textContent = j.followers; document.getElementById("topFollow").textContent = "Following ✓";
      try { const L = JSON.parse(localStorage.getItem("encore.following") || "[]"); if (!L.includes(h.handle)) L.push(h.handle); localStorage.setItem("encore.following", JSON.stringify(L)); } catch {}
      ff.innerHTML = `<div class="done"><span class="hop">${C.pipSVG("happy", 40)}</span><div><b>You're in.</b><div class="muted" style="font-size:14px">${esc(first)} can now tell you about the next one first.</div></div></div>`;
    } catch (err) { fe.textContent = err.message; } });
})();
</script></body></html>
