<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/authguard.js"></script>
<title>Hosts · Pottery Lab</title>
<meta name="description" content="Run clubs, supper clubs, bakers, artists and the people behind the best small events. Follow one to hear about the next one.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF8EE;--ink:#1F1A17;--smoke:#6B5F56;--ember:#C94A30;--line:#E4D9C8}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 70px}
h1{font:700 var(--fs-28-40,28px)/1.08 Fredoka,system-ui;margin:0 0 8px}.lede{color:var(--smoke);max-width:620px;margin:0 0 18px}
.bar{display:grid;gap:10px;margin:0 0 18px}.search{width:100%;max-width:520px;padding:12px 14px;border:1px solid #DCCFBE;border-radius:14px;font:inherit;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}@media (max-width:760px){.bar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}.bar .chips>*{flex:none}}.chips button,.chips select{white-space:nowrap;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 14px "Instrument Sans",system-ui,sans-serif;cursor:pointer;color:var(--ink)}.chips select{appearance:none;-webkit-appearance:none;padding-right:30px;background:#FFF1D2 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 stroke=%27%231F1A17%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E") no-repeat right 12px center}.chips button:focus-visible,.chips select:focus-visible,.search:focus-visible,.more:focus-visible{outline:3px solid var(--ink);outline-offset:2px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}.chips>*{flex:none}.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{color:var(--smoke);font-size:14px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.h{position:relative;display:grid;grid-template-rows:auto 1fr auto;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-radius .45s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.h .top{position:relative;height:96px;background:var(--bg,#F6EBDD)}@media (max-width:760px){.h .top{height:54px}.h .av{width:52px!important;height:52px!important;bottom:-22px!important}}.h .av{position:absolute;left:16px;bottom:-30px;width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:28px}.h .av svg,.h .av img{width:100%;height:100%;object-fit:cover}
.h .bd{padding:38px 16px 10px}.h b{display:block;font-size:16px;line-height:1.2}.h .tl{display:block;color:var(--smoke);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.h .meta span{font-size:13px;line-height:1.4;background:#F6EFE6;border-radius:999px;padding:2px 8px}.h .meta .ex{background:#FFF1D2;font-weight:700}.h .meta .nx{background:#FFF1D2}
.h .hl{color:inherit;text-decoration:none}.h .hl::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0}.h .hl:focus-visible{outline:none}.h:has(.hl:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
.h .facts{display:block;color:var(--smoke);font-size:13px;margin-top:6px}
/* one card shape: name in Fredoka on one line, the line under it always takes two lines, facts on one line, so names, facts and Follow sit at the same height across a row */
.h b{font:600 18px/1.25 Fredoka,"Fredoka Fallback",system-ui,sans-serif!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h .tl{min-height:calc(2 * 1.5em)}.h .facts{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .ft{display:flex;gap:8px;align-items:center;padding:0 16px 16px;min-height:16px}.h .ft a{position:relative;z-index:1}
.h .ft .fo{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px;font-family:inherit;border:1.5px solid var(--ember);color:#A63A22;background:#fff;text-decoration:none}.h .ft .fo:hover{background:#FFF1EC}.h .ft .fo:focus-visible,.h .ft .ig:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.h .ft .ig{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:#A63A22;text-decoration:underline;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (hover:hover){.h:hover{transform:translateY(-3px);border-color:#1F1A17}}@media (prefers-reduced-motion:reduce){.h:hover{transform:none}}
.empty{color:var(--smoke);padding:30px 0}.more{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:18px 0 0;padding:10px 22px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:600 16px "Instrument Sans",system-ui,sans-serif;cursor:pointer}.more[hidden]{display:none}.near-h{grid-column:1/-1;margin:8px 0 -4px;font:700 20px/1.2 Fredoka,system-ui}
.h .meta .bdg{background:#FFF1D2;font-weight:600}.h .meta .bdg.super{background:#1F1A17;color:#FFE08A}.teams{margin-top:30px;padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--smoke)}
.h .why{display:block;margin-top:6px;font-weight:500;font-size:13px;color:#3E5C3A;background:#EEF5EA;border-radius:10px;padding:5px 8px}.thinking{color:#665A51}
.hd-top{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.hd-top .brand{display:flex;gap:8px;align-items:center;font:700 20px Fredoka,system-ui;text-decoration:none;color:var(--ink)}@media (max-width:860px){body.es-has-tabs,body{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}}
.hd-cta{background:var(--ember);color:#fff;text-decoration:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}@media (min-width:861px){.hd-top{display:none}}
</style><script src="/mascot.js"></script></head><body>
<div class="wrap">
  <header class="top hd-top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 3.2h8.8" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/></svg>pottery lab</a><a class="hd-cta" href="/signup?mode=friends">Start your page</a></header>
  <h1>Find a host</h1>
  <p class="lede">Bakers, potters, run crews and cooks.</p>
  <div class="bar"><input class="search" id="q" type="search" placeholder="Try “pottery for 20” or a city" aria-label="Search hosts by what they host or where"><div class="chips" role="group" aria-label="Filter hosts"><label class="sr" for="city">City</label><select id="city"><option value="">Anywhere</option></select><span id="kinds" style="display:contents"></span></div></div>
  <p class="count" id="count" style="min-height:1.5em">Loading hosts…</p>
  <div class="grid" id="grid" style="min-height:40vh"></div>
  <button type="button" class="more" id="more" hidden></button>
  <p class="teams">Booking for a brand? <a href="/hosts/book">Request a date</a>.</p>
</div>
<script src="/eventart.js"></script><script src="/avatars.js"></script><script src="/place.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  // the same four lanes as Discover, so a host and their events sit under one name
  const KINDS = [["all", "Everything"], ["move", "🏃 Move"], ["make", "🍰 Make & taste"], ["gather", "☕ Gather"], ["discover", "🧭 Somewhere new"]];
  const GROUP = { dinner: "gather", cook: "make", bake: "make", potluck: "gather", brunch: "gather", picnic: "gather", wine: "gather", turkey: "make", coffee: "gather", tea: "gather", run: "move", hike: "move", walk: "move", bike: "move", yoga: "move", swim: "move", craft: "make", paint: "make", garden: "make", pottery: "make", music: "discover", games: "gather", movie: "gather", party: "gather", book: "gather", workshop: "discover", talk: "discover", tech: "discover" };
  const OLD = { food: "make", coffee: "gather", art: "make", music: "discover", learn: "discover" }; // links shared before the lanes matched Discover
  const FIRST = 6, STEP = 12; // design review: six first, then "See all" reveals twelve at a time
  const U = new URLSearchParams(location.search); let H = [], kind = OLD[U.get("type")] || U.get("type") || "all", city = U.get("city") || "", q = (U.get("q") || "").toLowerCase(), shown = FIRST;
  let mine = ""; try { mine = localStorage.getItem("encore.city") || ""; } catch {}
  const sync = () => { const P = new URLSearchParams(); if (kind !== "all") P.set("type", kind); if (city) P.set("city", city); if (q) P.set("q", q); history.replaceState(null, "", "/hosts" + (P.toString() ? "?" + P : "")); };
  const groupsOf = (h) => { const words = { title: [h.name, h.tagline, (h.tags || []).join(" "), (h.experiences || []).map((x) => x.name).join(" ")].join(" "), why: h.bio || "" }; const K = window.EventArt ? window.EventArt.kindsOf(words) : []; return new Set(K.map((k) => GROUP[k]).filter(Boolean)); };
  const cityOf = (h) => String(h.city || "").trim();
  const nearMe = (h) => { if (!mine) return false; const c = cityOf(h); if (!c) return false; return window.EncorePlace ? window.EncorePlace.near(c, mine) : c.toLowerCase() === mine.toLowerCase(); };
  // complete profiles first: people browsing want to see who a host is before they follow
  const done = (h) => (h.tagline || h.bio ? 2 : 0) + ((h.theme && (h.theme.avatarArt || h.theme.avatarUrl)) || (h.gallery || []).length ? 2 : 0) + ((h.tags || []).length ? 1 : 0) + ((h.experiences || []).length ? 1 : 0) + (cityOf(h) ? 1 : 0);
  const activity = (h) => (h.hosted || 0) + (h.upcoming || 0) * 2 + (h.followers || 0);
  const avatar = (h) => { const g = (h.gallery || [])[0], t = h.theme || {}; if (t.avatarUrl) return `<img src="${esc(t.avatarUrl)}" alt="">`; if (t.avatarArt && window.EncoreAvatars) return window.EncoreAvatars.svg(t.avatarArt, t.accent || h.color || "#E26D8E", 64); if (g) return `<img src="${esc(g)}" alt="">`; return esc(h.emoji || "🎉"); };
  const tint = (h) => { const a = (h.theme && h.theme.accent) || h.color || "#E0A030"; return `color-mix(in srgb, ${a} 28%, #FFF8EE)`; };
  // at most two small pills, and only ones that tell hosts apart ("New host" and "Takes bookings" were on nearly every card)
  const pills = (h) => { const b = (BADGES[h.handle] || []).filter((x) => !/^m-/.test(x.id) && x.id !== "new")[0], P = [];
    if (h.sample) P.push(`<span class="ex">Example</span>`);
    if (b) P.push(`<span class="bdg${b.id === "super" ? " super" : ""}" title="${esc(b.why)}">${b.emoji} ${esc(b.label)}</span>`);
    if (h.showcase) P.push(`<span>Not on Pottery Lab yet</span>`);
    return P.slice(0, 2).join(""); };
  const facts = (h) => [[h.hood, cityOf(h)].filter(Boolean).join(", "), h.followers ? `${h.followers} ${h.followers === 1 ? "follower" : "followers"}` : "", h.hosted ? `${h.hosted} ${h.hosted === 1 ? "event" : "events"}` : ""].filter(Boolean).map(esc).join(" · ");
  // "Next: Sunrise 5K, Sat, Nov 28", the same line Discover's host cards show
  let EVS = []; const nextOf = (h) => { const n = EVS.filter((e) => e.host?.handle === h.handle && e.stage !== "interest" && e.date).sort((a, b) => String(a.date).localeCompare(String(b.date)))[0]; if (!n) return ""; const d = new Date(n.date + "T12:00"); return `Next: ${n.title}${isNaN(d) ? "" : ", " + d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}`; };
  const igOf = (h) => ((h.links || []).find((l) => /^https:\/\/(www\.)?instagram\.com\//i.test(l.url || "")) || {}).url || "";
  const cardOf = (h) => `<div class="h"><span class="top" style="--bg:${tint(h)}"><span class="av">${avatar(h)}</span></span>
      <span class="bd"><a class="hl" href="/@${encodeURIComponent(h.handle)}"><b>${esc(h.name)}</b></a><span class="tl">${esc(h.tagline || h.bio || "Hosts small events")}</span>${nextOf(h) ? `<span class="nx-l" style="display:block;font-weight:600;color:#2B211C;margin:4px 0 2px">${esc(nextOf(h))}</span>` : ""}${h._why ? `<span class="why">${esc(h._why)}</span>` : ""}${facts(h) ? `<span class="facts">${facts(h)}</span>` : ""}${pills(h) ? `<span class="meta">${pills(h)}</span>` : ""}</span>
      <span class="ft">${h.showcase ? (igOf(h) ? `<a class="ig" href="${esc(igOf(h))}" target="_blank" rel="noopener">Instagram<span class="sr"> for ${esc(h.name)} (opens in a new tab)</span></a>` : "") : `<a class="fo" href="/@${encodeURIComponent(h.handle)}#follow">Follow<span class="sr"> ${esc(h.name)}</span></a>`}</span></div>`;
  function draw() { sync();
    const pass = (h) => (kind === "all" || h._g.has(kind)) && (!city || cityOf(h) === city), hay = (h) => `${h.name} ${h.tagline || ""} ${h.bio || ""} ${(h.tags || []).join(" ")} ${h.city || ""} ${h.hood || ""} ${(h.experiences || []).map((x) => x.name).join(" ")}`.toLowerCase();
    const smart = ai && ai.q === q && ai.matches.length ? ai.matches.map((m) => { const h = H.find((x) => x.handle === m.handle); return h && pass(h) ? { ...h, _why: m.why } : null; }).filter(Boolean) : null;
    // typed words: a host matches if it mentions any of them, most mentions first (the smart results replace this a moment later)
    const tw = q.split(/\s+/).filter((w) => w.length > 2), kw = (h) => tw.filter((w) => hay(h).includes(w)).length;
    let L = smart && smart.length ? smart : H.filter((h) => pass(h) && (!q || hay(h).includes(q) || kw(h) > 0)).sort((a, b) => (q ? kw(b) - kw(a) : 0));
    // no city picked: hosts near the visitor first (when we know where they are), example hosts always after real ones
    const exact = (h) => cityOf(h).toLowerCase() === mine.toLowerCase() || String(h.hood || "").toLowerCase() === mine.toLowerCase() ? 1 : 0;
    const local = !city && !q && mine ? L.filter(nearMe).sort((a, b) => exact(b) - exact(a) || (b.upcoming || 0) - (a.upcoming || 0) || activity(b) - activity(a) || done(b) - done(a)) : [];
    if (local.length && !(smart && smart.length)) { const set = new Set(local); L = [...local, ...L.filter((h) => !set.has(h))]; }
    if (!(smart && smart.length)) L = [...L.filter((h) => !h.sample), ...L.filter((h) => h.sample)];
    $("#count").innerHTML = smart && smart.length ? `Best matches for “${esc(q)}”` : L.length ? `${L.length} ${L.length === 1 ? "host" : "hosts"}${local.length ? ` · near ${esc(mine)} first` : ""}${aiBusy ? ` <span class="thinking">· finding the best fits…</span>` : ""}` : aiBusy ? `<span class="thinking">Finding the best fits…</span>` : "";
    const V = L.slice(0, shown);
    $("#grid").innerHTML = V.length ? V.map(cardOf).join("") : `<p class="empty">No hosts match. Try another city or word.</p>`;
    const m = $("#more"), left = L.length - V.length;
    m.hidden = left <= 0; if (left > 0) m.textContent = `Show ${Math.min(STEP, left)} more`;
  }
  $("#more").onclick = () => { const first = $("#grid").children.length; shown += STEP; draw(); const next = $("#grid").children[first]; if (next) next.querySelector("a")?.focus({ preventScroll: true }); };
  function chips(el, list, cur, set) { el.innerHTML = list.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${v === cur}">${esc(l)}</button>`).join(""); el.onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; set(b.dataset.v); shown = FIRST; el.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); draw(); }; }
  let ai = null, aiBusy = false, aiT = 0, aiSeq = 0;
  const askAI = async () => { const asked = q; if (asked.length < 3) { aiBusy = false; draw(); return; } const n = ++aiSeq; aiBusy = true; draw();
    try { const r = await fetch("/api/public/hosts/search?q=" + encodeURIComponent(asked)); const j = await r.json(); if (n !== aiSeq) return; ai = { q: asked, matches: j.matches || [] }; } catch {} if (n === aiSeq) { aiBusy = false; draw(); } };
  $("#q").value = U.get("q") || ""; $("#q").oninput = (e) => { q = e.target.value.trim().toLowerCase(); shown = FIRST; clearTimeout(aiT); aiT = setTimeout(askAI, 650); draw(); };
  $("#q").onkeydown = (e) => { if (e.key === "Enter") { clearTimeout(aiT); askAI(); } };
  let BADGES = {};
  fetch("/api/public/hosts/showcase").then((r) => r.json()).then((j) => { BADGES = j.badges || {}; if (H.length) draw(); }).catch(() => {});
  fetch("/api/public/discover").then((r) => r.json()).then((d) => { EVS = d.events || [];
    // one card per display name (demo data has several "Claire's Run Crew"): a real host always wins over an example; then the one with more going on
    const best = new Map(); for (const h of (d.hosts || []).filter((h) => h.handle && h.name && !/[<>]/.test(h.name))) { const k = h.name.trim().toLowerCase(), cur = best.get(k); if (!cur || (cur.sample && !h.sample) || (!!cur.sample === !!h.sample && (activity(h) > activity(cur) || (activity(h) === activity(cur) && done(h) > done(cur))))) best.set(k, h); }
    H = [...best.values()].map((h) => ({ ...h, _g: groupsOf(h) }))
      .sort((a, b) => (!!a.sample - !!b.sample) || done(b) - done(a) || (b.upcoming || 0) - (a.upcoming || 0) || (b.followers || 0) - (a.followers || 0) || String(a.name).localeCompare(b.name));
    chips($("#kinds"), KINDS.filter(([k]) => k === "all" || H.some((h) => h._g.has(k))), kind, (v) => (kind = v));
    const C = {}; for (const h of H) { const c = cityOf(h); if (c) C[c] = (C[c] || 0) + 1; }
    const sel = $("#city"), cities = Object.entries(C).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([c]) => c);
    if (city && !cities.includes(city)) cities.unshift(city);
    sel.innerHTML = `<option value="">Anywhere</option>` + cities.map((c) => `<option value="${esc(c)}"${c === city ? " selected" : ""}>${esc(c)}</option>`).join("");
    sel.onchange = () => { city = sel.value; shown = FIRST; draw(); };
    draw(); if (q) askAI();
  }).catch(() => { $("#count").textContent = "Couldn't load hosts. Refresh to try again."; });
})();
</script>
<script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
