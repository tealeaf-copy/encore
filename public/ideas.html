<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/authguard.js"></script>
<title>Ideas · Pottery Lab</title>
<meta name="description" content="Supper clubs, run clubs, workshops and pop-ups other hosts run. Pick one and host your own.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lists.css">
<style>
:root{--paper:var(--pl-page);--linen:var(--pl-raised);--ink:var(--pl-ink);--smoke:var(--pl-soft);--ember:var(--pl-accent);--line:var(--pl-line)}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
.feature{margin:0 0 32px;max-width:320px}.feature>p{margin:0 0 8px;font-size:13px;color:var(--smoke)}
</style><script src="/mascot.js"></script><script src="/eventart.js"></script><script src="/color.js"></script><script src="/looks.js"></script></head><body>
<main class="ls-wrap" id="m">
  <section class="ls-head"><div><h1>Ideas to <em>try</em></h1>
    <p class="ls-what">Formats other hosts run. Tap one to start your own.</p></div><span class="ls-potto" id="potto" aria-hidden="true"></span></section>
  <div class="ls-bar"><div class="ls-filters" id="chips" role="group" aria-label="Filter ideas"></div>
    <div class="ls-count"><span id="count" aria-live="polite"></span><button type="button" class="ls-link" id="pickBtn" hidden>Pick what you're into</button><button type="button" class="ls-link" id="editMe" hidden>Change what I'm into</button></div></div>
  <div id="feature"></div>
  <div class="ls-grid compact" id="wall" aria-live="polite"></div>
  <div id="sentinel" style="height:1px"></div>
  <div class="ls-end" id="end" hidden><span class="ls-potto" id="endP" aria-hidden="true"></span><b>That's every idea, for now.</b><span>The next one might be yours.</span><a class="ls-btn primary" href="/?app=1&amp;new=1#studio" id="endGo">Host something</a></div>
</main>
<script src="/save.js"></script><script src="/inspo.js"></script><script src="/interests.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const potto = (pose) => (window.Potto ? Potto.svg(pose, 64, "") : "");
  $("#potto").innerHTML = potto("carry"); $("#endP").innerHTML = potto("sleep");
  if (!/(?:^|;\s*)encore_in=1/.test(document.cookie)) $("#endGo").href = "/signup?mode=friends&from=ideas";
  let INT = [], me = { interests: [], city: "" }, tag = new URLSearchParams(location.search).get("tag") || "", cursor = "", busy = false, done = false, shown = 0, total = 0, gen = 0;
  const nameOf = (t) => INT.find((i) => i.id === t)?.label || t;
  // the filters: plain labels in one row; the active one is filled
  function chips() { const mine = me.interests.length;
    $("#chips").innerHTML = `<button type="button" class="ls-chip" data-t="" aria-pressed="${!tag}">${mine ? "For you" : "Everything"}</button>` + INT.map((i) => `<button type="button" class="ls-chip" data-t="${esc(i.id)}" aria-pressed="${tag === i.id}">${esc(i.label)}</button>`).join("");
    $("#chips").querySelectorAll(".ls-chip").forEach((b) => (b.onclick = () => setTag(b.dataset.t)));
    $("#chips").querySelector('[aria-pressed="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
    $("#pickBtn").hidden = !!mine; $("#editMe").hidden = !mine; }
  function setTag(t) { tag = t; const u = new URL(location.href); t ? u.searchParams.set("tag", t) : u.searchParams.delete("tag"); history.replaceState(null, "", u); chips(); reset(); scrollTo({ top: Math.min(scrollY, $(".ls-bar").offsetTop), behavior: "smooth" }); }
  const skel = () => Array.from({ length: innerWidth >= 700 ? 4 : 2 }, () => `<div class="ls-skel" aria-hidden="true"></div>`).join("");
  function reset() { gen++; cursor = ""; done = false; shown = 0; $("#wall").innerHTML = skel(); $("#end").hidden = true; $("#count").textContent = "Loading ideas…"; more(); }
  // nothing for this filter: say so, and offer one way out
  function empty() { $("#wall").innerHTML = `<div class="ls-empty"><span class="ls-potto" aria-hidden="true">${potto("think")}</span><b>No ${esc(tag ? nameOf(tag).toLowerCase() : "ideas")} yet.</b><p>${tag ? "Nobody has shared one of these yet. Look through everything, or host the first one." : "Ideas show up here as hosts share them. Check back soon."}</p>${tag ? `<button type="button" class="ls-btn" id="seeAll">See every idea</button>` : ""}</div>`; const b = $("#seeAll"); if (b) b.onclick = () => setTag(""); }
  async function more() { if (busy || done) return; busy = true; const g = gen;
    try { const q = new URLSearchParams({ interests: me.interests.join(","), city: me.city || "", tag, cursor, limit: "18" });
      const j = await (await fetch("/api/public/inspo?" + q)).json(); if (g !== gen) { busy = false; return more(); } $("#wall").querySelectorAll(".ls-skel").forEach((s) => s.remove());
      total = j.total || 0; const frag = document.createDocumentFragment();
      for (const x of j.data || []) { const t = document.createElement("template"); t.innerHTML = PLInspo.card(x, { fade: true }).trim(); const el = t.content.firstElementChild; if (!el) continue; el.dataset.n = shown++; frag.appendChild(el); }
      $("#wall").appendChild(frag);
      cursor = j.next_cursor || ""; done = !cursor; $("#end").hidden = !done || !shown;
      if (!shown) empty();
      $("#count").textContent = total ? (tag ? `${total} ${total === 1 ? "idea" : "ideas"} for ${nameOf(tag)}` : me.interests.length ? `${total} ideas, what you're into first` : `${total} ideas`) : "";
    } catch { $("#wall").querySelectorAll(".ls-skel").forEach((s) => s.remove()); $("#count").textContent = "Couldn't load ideas. Refresh to try again."; } finally { busy = false; }
    if (!done && document.getElementById("sentinel").getBoundingClientRect().top < innerHeight + 600) setTimeout(more, 50); }
  let inited = false; new IntersectionObserver((en) => { if (inited && en.some((e) => e.isIntersecting)) more(); }, { rootMargin: "900px 0px" }).observe($("#sentinel"));
  const pick = () => PLInterests.open({ onClose: async () => { me = await PLInterests.get(); chips(); reset(); } });
  $("#pickBtn").onclick = pick; $("#editMe").onclick = pick;
  // an idea linked straight (/ideas#idea-…): show it first
  async function feature() { const id = decodeURIComponent(location.hash.slice(1)); if (!/^[A-Za-z0-9_-]{3,120}$/.test(id)) return; const j = await (await fetch("/api/public/inspo/item?id=" + encodeURIComponent(id))).json().catch(() => null); if (j?.data) $("#feature").innerHTML = `<div class="feature"><p>The idea you opened</p>${PLInspo.card(j.data)}</div>`; }
  (async () => { const [L, m] = await Promise.all([PLInterests.list(), PLInterests.get()]); INT = L; PLInspo.setInterests(L); me = m; if (tag && !L.some((i) => i.id === tag)) { tag = ""; const u = new URL(location.href); u.searchParams.delete("tag"); history.replaceState(null, "", u); } chips(); feature(); inited = true; reset(); })();
})();
</script>
<script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
