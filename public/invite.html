<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--META-->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The invite, on its own: what a guest needs to say yes, in a page small enough to open instantly on a phone.
   Anything more involved (approvals, paid seats, polls, the group chat) opens the full invite at /g#rsvp-<id>. */
:root{--paper:#FFF8EE;--ink:#1F1A17;--smoke:#5E534B;--ember:#C94A30;--ember-d:#A8441F;--line:#E4D9C8;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
a{color:var(--ember-d)}main{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.brand{display:flex;gap:8px;align-items:center;font:700 20px Fredoka,system-ui;text-decoration:none;color:var(--ink)}
.cov{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--ink);box-shadow:0 0 0 4px #fff,0 10px 24px -16px rgba(31,26,23,.5);aspect-ratio:16/10;background:#F3ECE2}.cov img{width:100%;height:100%;object-fit:cover;display:block}.cov .ea-cover{position:absolute!important;inset:0!important;height:100%!important;width:100%!important;border-radius:0!important}
h1{font:700 var(--fs-28-40,28px)/1.08 Fredoka,system-ui;margin:16px 0 6px}
.facts{display:grid;gap:4px;margin:6px 0 10px;font-size:16px}.facts b{font-weight:600}.muted{color:var(--smoke)}
.host{display:flex;gap:10px;align-items:center;margin:10px 0}.host .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);font-size:20px;overflow:hidden}
.why{white-space:pre-wrap;margin:8px 0 14px}
.going{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.going span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}
form{background:#fff;border:2px solid var(--ink);border-radius:22px;padding:16px;display:grid;gap:12px;box-shadow:0 0 0 4px #fff,0 12px 28px -20px rgba(31,26,23,.55)}
.resp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.resp label{display:grid;place-items:center;border:1.5px solid var(--line);border-radius:14px;padding:11px 6px;font-weight:600;cursor:pointer;text-align:center}.resp input{position:absolute;opacity:0;pointer-events:none}.resp label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}.resp label:has(input:focus-visible){outline:3px solid var(--ember);outline-offset:2px}
label.f{display:grid;gap:5px;font-weight:600;font-size:16px}label.f small{font-weight:400;color:var(--smoke)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:13px 14px;border:1.5px solid #DCCFBE;border-radius:14px;font:inherit;font-size:16px;background:#FFFCF7;color:var(--ink)}
.go{background:var(--ember);color:#fff;border:1px solid var(--ember);border-radius:999px;min-height:52px;padding:0 20px;font:600 16px "Instrument Sans",system-ui,sans-serif;cursor:pointer;width:100%}.go:disabled{opacity:.6}
.err{color:#A8341A;font-weight:600;min-height:0;margin:0}
.ticket{background:#fff;border:2px dashed var(--ink);border-radius:22px;padding:18px;text-align:center;display:grid;gap:8px}.ticket h2{font:700 28px Fredoka,system-ui;margin:0}.ticket .code{font:700 28px/1 Fredoka,system-ui;letter-spacing:.12em;background:#FFE08A;border-radius:12px;padding:8px 14px;justify-self:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{border:1px solid #D9CCBB;background:#fff;border-radius:999px;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-weight:600;font-size:16px;font-family:inherit;text-decoration:none;color:var(--ink)}.btn.main{background:var(--ink);color:#fff}
.stick[hidden]{display:none!important}.stick{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,560px);bottom:0;background:rgba(255,248,238,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(6px)}.stick b{font-weight:600;font-size:16px;font-family:inherit}
.stick a{background:var(--ember);color:#fff;border:1px solid var(--ember);border-radius:999px;min-height:44px;display:inline-flex;align-items:center;padding:0 18px;font:600 16px "Instrument Sans",system-ui,sans-serif;text-decoration:none}
.full{display:block;text-align:center;margin:18px 0 0;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ini{font:700 20px Fredoka,system-ui;color:var(--ink)}</style><link rel="stylesheet" href="/system.css"></head><body>
<main id="m" aria-live="polite"><div class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/></svg>pottery lab</a></div><p class="muted">Opening your invite…</p></main>
<script src="/eventart.js"></script><script src="/questions.js" defer></script>
<script>
(function () {
  const id = (location.pathname.match(/^\/e\/([A-Za-z0-9_-]{2,80})/) || [])[1], full = "/g#rsvp-" + encodeURIComponent(id || "");
  const go = () => location.replace(full), $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  if (!id) return go();
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  // already answered on this device: the full invite shows their ticket, the chat and who's coming
  if (ls.get("encore-rsvp-" + id)) return go();
  const gkey = () => { let k = ls.get("encore.gkey"); if (!k) { k = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""); ls.set("encore.gkey", k); } return k; };
  const today = new Date().toISOString().slice(0, 10);
  const FOODY = /giveaway|bake|cake|cook|potluck|friendsgiving|thanksgiving|feast|caf[eé]|coffee|brunch|picnic|supper|dinner|lunch|breakfast|tasting|dumpling|taco|pizza|bbq|cookout|tea|matcha|wine|food|eat|bread|pastr|cookie|pie/i;
  const when = (e) => { const d = e.date ? new Date(e.date + "T12:00:00") : null; const day = d && !isNaN(d) ? d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) : ""; const t = /^\d{2}:\d{2}$/.test(e.startTime || "") ? new Date("2000-01-01T" + e.startTime).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""; return [day, t].filter(Boolean).join(" · "); };
  Promise.all([fetch("/api/db/doc?path=" + encodeURIComponent("events/" + id), { headers: { "x-encore-guest": "1" } }).then((r) => (r.ok ? r.json() : null)), fetch("/api/public/event-host/" + encodeURIComponent(id)).then((r) => (r.ok ? r.json() : null)).catch(() => null), fetch("/api/public/attendees/" + encodeURIComponent(id)).then((r) => (r.ok ? r.json() : null)).catch(() => null)])
    .then(([doc, H, A]) => { const e = doc?.data, ws = doc?.workspace;
      // only the plain case lives here; everything else opens the full invite
      if (!e || !ws || e.sample || !e.casual || e.approvalRequired || (e.price && e.price !== "chip") || e.stage === "interest" || !e.date || e.date < today || (e.slots || []).length || e.chipIn || e.payUrl || +e.plusOnes > 0) return go();
      render(e, ws, H || {}, A || {}); })
    .catch(go);

  function render(e, ws, H, A) {
    const h = H.host || {}, first = String(h.name || "your host").split(" ")[0], title = e.pubTitle || e.name || "You're invited", left = A.seats ? Math.max(0, A.seats - (A.count || 0)) : null, foody = FOODY.test(`${e.activity || ""} ${e.name || ""} ${e.pubTitle || ""} ${e.why || ""}`);
    document.title = `${title} · Pottery Lab`;
    const cover = /^\/_blob\/[A-Za-z0-9_-]{6,80}$/.test(e.coverPhoto || "") || /^https:\/\/[^\s"'<>()]+$/.test(e.coverPhoto || "") ? `<img src="${esc(e.coverPhoto)}" alt="">` : window.EventArt ? (window.EventArt.ensureCss?.(), window.EventArt.cover(e, { title: "", label: "" })) : "";
    const where = [e.meetPoint || e.venueName, e.hood || e.city].filter(Boolean).join(" · ");
    const av = h.avatarUrl ? `<img src="${esc(h.avatarUrl)}" alt="" width="40" height="40">` : (h.emoji ? esc(h.emoji) : `<span class="ini">${esc(String(h.name || "?").trim().charAt(0).toUpperCase())}</span>`);
    const names = (A.attendees || []).slice(0, 8).map((a) => `<span>${esc(a.emoji ? a.emoji + " " : "")}${esc(a.name)}</span>`).join("");
    const full = left === 0;
    $("#m").innerHTML = $("#m .top").outerHTML + `<div class="cov">${cover}</div><h1>${esc(title)}</h1>
      <div class="facts"><div><b>${esc(when(e))}</b></div>${where ? `<div class="muted">📍 ${esc(where)}${e.addrHidden ? `<span id="addrNote"> · address once you're in</span>` : ""}</div>` : ""}${A.seats ? `<div class="muted">👥 ${full ? "Full. Join the waitlist." : left === A.seats ? `${A.seats} spot${A.seats === 1 ? "" : "s"}` : `${left} of ${A.seats} spot${A.seats === 1 ? "" : "s"} left`}</div>` : ""}</div>
      ${h.name ? `<div class="host"><span class="av">${av}</span><span>Hosted by <b>${h.handle ? `<a href="/@${encodeURIComponent(h.handle)}">${esc(h.name)}</a>` : esc(h.name)}</b></span></div>` : ""}
      ${e.why ? `<p class="why">${esc(e.why)}</p>` : ""}
      ${A.count ? `<p style="margin:14px 0 4px;font-weight:600">${A.count} going</p><div class="going">${names}</div>` : ""}
      <form id="f" novalidate><div class="resp" role="radiogroup" aria-label="Your answer"><label><input type="radio" name="r" value="going" checked> ${esc(e.rsvpWords?.yes || "I'm in")}</label>${e.noMaybe ? "" : `<label><input type="radio" name="r" value="maybe"> Maybe</label>`}<label><input type="radio" name="r" value="no"> Can't go</label></div>
        <label class="f">Your name<input type="text" id="nm" autocomplete="name" maxlength="80" required></label>
        <label class="f">Email or phone <small>Optional. For ${esc(first)}'s reminders.</small><input type="text" id="ct" autocomplete="email" inputmode="email" maxlength="120"></label>
        ${foody ? `<label class="f">Anything you don't eat?<input type="text" id="dt" maxlength="120" placeholder="Nothing, I eat everything"></label>` : ""}
        <div id="qs"></div><p class="err" id="er" role="alert"></p><button class="go" id="send">${esc(e.qStyle?.button || "Send")}</button></form>
      ${A.count ? `<a class="full" id="fullLink">See who's coming</a>` : ""}`;
    if ($("#fullLink")) $("#fullLink").href = "/g#rsvp-" + encodeURIComponent(e.id || id);
    const stick = document.createElement("div"); stick.className = "stick"; stick.innerHTML = `<span><b>${esc(when(e).split(" · ")[0] || title)}</b><br><small class="muted">${esc(e.hood || e.city || "")}</small></span><a href="#f">${esc(e.rsvpWords?.yes || "I'm in")}</a>`; document.body.appendChild(stick); stick.hidden = true;
    { const target = $("#f .resp") || $("#f"); if (target && "IntersectionObserver" in window) { let seen = false; new IntersectionObserver(([en]) => { if (en.isIntersecting) seen = true; const below = en.boundingClientRect.top > innerHeight; stick.hidden = en.isIntersecting || (!below && seen) || !!document.getElementById("tk"); }).observe(target); } }
    // the host's own questions, one at a time (questions.js arrives a moment later)
    const answers = {}; let Qf = null; const Q = (e.questions || []).filter((q) => q && q.q);
    const startQ = () => { if (Q.length && window.Questions && !Qf) Qf = window.Questions.flow($("#qs"), e, answers, {}); }; startQ(); $("#f").addEventListener("change", (ev) => { if (ev.target.name === "r" && $("#qs")) $("#qs").hidden = ev.target.value === "no"; }); if (Q.length && !window.Questions) addEventListener("load", startQ);
    $("#f").onsubmit = async (ev) => { ev.preventDefault(); const er = $("#er"); er.textContent = "";
      const name = $("#nm").value.trim().replace(/[<>]/g, "").slice(0, 80); if (!name) { er.textContent = `Add your name so ${first} knows who's coming.`; $("#nm").focus(); return; }
      const resp = (new FormData($("#f")).get("r") || "going"); if (resp === "going" && Qf?.missing?.()) { er.textContent = "One more answer first."; return; }
      const c = $("#ct").value.trim(), email = /@/.test(c) ? c : "", phone = !email && c ? c.replace(/[^\d+]/g, "") : "";
      const code = (String(e.id || id).slice(0, 2) + [...name].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 46656, 7).toString(36)).toUpperCase().padEnd(5, "X").slice(0, 5);
      const data = { eventId: e.id || id, response: resp, name, email, ...(phone ? { phone, contactVia: "sms" } : email ? { contactVia: "email" } : {}), dietary: $("#dt")?.value.trim().slice(0, 120) || "", ...(Q.length && resp !== "no" ? { answers: { ...answers } } : {}), code, createdAt: Date.now(), via: "invite-lite" };
      $("#send").disabled = true;
      try { const r = await fetch("/api/db/collection?path=rsvps", { method: "POST", headers: { "Content-Type": "application/json", "x-encore-guest": "1", "x-encore-key": gkey(), "x-encore-workspace": ws }, body: JSON.stringify(data) }); const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || "Didn't send. Try again.");
        const rid = String(j.id || j.doc?.id || "").split("/").pop();
        const saved = j.data?.response || j.doc?.data?.response || j.response; if (saved) data.response = saved; else if (resp === "going" && left === 0) data.response = "waitlist";
        ls.set("encore-rsvp-" + (e.id || id), JSON.stringify({ rid, code, name, gi: -1, response: data.response, wall: false, eventId: e.id || id, data: {} }));
        done(e, h, data, rid, code); }
      catch (err) { er.textContent = err.message; $("#send").disabled = false; } };
  }

  async function done(e, h, data, rid, code) {
    document.querySelector(".stick")?.remove(); document.getElementById("fullLink")?.remove(); const yes = data.response === "going", wait = data.response === "waitlist";
    const pad = (n) => String(n).padStart(2, "0"), d = e.date ? e.date.replace(/-/g, "") : "", t = /^\d{2}:\d{2}$/.test(e.startTime || "") ? e.startTime.replace(":", "") + "00" : "";
    let where = [e.meetPoint || e.venueName, e.hood || e.city].filter(Boolean).join(", ");
    const f = $("#f"); f.outerHTML = `<div class="ticket" id="tk"><h2>${yes ? "You're in 🎉" : wait ? "You're on the waitlist" : data.response === "maybe" ? "Noted as a maybe" : "Maybe next time"}</h2>${wait ? `<p class="muted" style="margin:0">We'll tell you if a spot opens.</p>` : ""}
      ${yes ? `<p class="muted" style="margin:0">Your door code</p><div class="code">${esc(code)}</div>` : ""}<p id="addr" class="muted" style="margin:0"></p>
      ${e.qStyle?.thanks && yes ? `<p style="font:600 20px/1.3 Caveat,cursive,system-ui;margin:0">${esc(e.qStyle.thanks)}</p>` : ""}
      <div class="btns">${yes ? `<a class="btn" id="cal" target="_blank" rel="noopener">Add to calendar</a>` : ""}<a class="btn main" href="/g#rsvp-${encodeURIComponent(e.id || id)}">See who's coming</a></div></div>`;
    document.getElementById("tk").scrollIntoView({ behavior: "smooth", block: "center" });
    if (yes) { try { const a = await (await fetch(`/api/public/address/${encodeURIComponent(e.id || id)}?rid=${encodeURIComponent(rid)}&code=${encodeURIComponent(code)}`)).json(); if (a?.ok) { const addr = [a.meetPoint || a.venueName, a.venueAddr].filter(Boolean).join(" · "); if (addr) { $("#addr").textContent = "📍 " + addr; $("#addrNote")?.remove(); where = addr.replace(" · ", ", "); } } } catch {}
      const cal = $("#cal"); if (cal && d) cal.href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.pubTitle || e.name || "")}&dates=${d}${t ? "T" + t : ""}/${d}${t ? "T" + pad(Math.min(23, +t.slice(0, 2) + 2)) + t.slice(2) : ""}&location=${encodeURIComponent(where)}&details=${encodeURIComponent(location.origin + "/g#rsvp-" + (e.id || id))}`; }
  }
})();
</script>
</body></html>
