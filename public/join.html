<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join your team · Pottery Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px "Instrument Sans",system-ui,sans-serif;background:var(--pl-page);color:var(--pl-ink)}
  form{background:#fff;padding:30px;border-radius:18px;border:1px solid var(--pl-line);box-shadow:0 1px 2px rgba(43,33,28,.05),0 18px 40px -24px rgba(43,33,28,.3);width:min(360px,calc(100vw - 32px));box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:8px;font:700 20px var(--sys-display);margin-bottom:18px}
  h1{margin:0 0 4px;font:600 28px/1.15 var(--sys-display)}.sub{margin:0 0 18px;color:var(--pl-soft);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;color:var(--pl-ink);margin-bottom:12px}
  input,button{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border-radius:12px}
  input{border:1px solid var(--pl-line);margin:6px 0 0;background:#fff;font-weight:400}input:focus{outline:2px solid #E8C3B5;outline-offset:1px}
  button{border:0;background:var(--pl-accent);color:#fff;font-weight:600;cursor:pointer;margin-top:6px}button:hover{background:var(--pl-accent-text)}button:disabled{opacity:.6;cursor:default}
  .err{color:#A93A3A;margin:0 0 12px;font-size:13px}.err:empty{display:none}p{margin:0 0 12px}
  a{display:block;margin-top:14px;text-align:center;color:var(--pl-accent-text);font-size:13px;text-decoration:none}
  /* system pass: fields at 44px, the main action is a full-width ember pill, secondary buttons are outlined pills */
  input{min-height:44px}
  form button:not([type=button]):not([role=tab]){border-radius:999px!important;min-height:48px;background:var(--pl-accent)}
  form button:not([type=button]):not([role=tab]):hover{background:var(--pl-accent-text)}
  .err a,.sub a{display:inline;margin:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
  a.go-in{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--pl-accent);color:#fff;font-weight:600;font-size:15px;margin-top:6px}

</style><link rel="stylesheet" href="/playful.css">
</head><body>
<form id="f" novalidate><div class="brand"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true" fill="currentColor"><path d="M10 4.2h8M11.1 4.2v1.7c0 1.2-.9 1.8-.9 2.9 0 1.3-5.5 3.2-5.5 8.9 0 4.5 4.1 7.3 9.3 7.3s9.3-2.8 9.3-7.3c0-5.7-5.5-7.6-5.5-8.9 0-1.1-.9-1.7-.9-2.9V4.2M12.7 19.2c.8.55 1.8.55 2.6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="11.3" cy="16.4" r="1"/><circle cx="16.7" cy="16.4" r="1"/></svg>pottery lab</div>
  <h1>Join your team</h1>
  <p class="err" id="err" role="alert"></p>
  <label>Your name<input name="name" autocomplete="name" required></label>
  <label>Password (10+ characters)<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
  <button type="submit" id="go">Join</button>
</form>
<script src="/authguard.js"></script><script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  const token = location.hash.slice(1);
  if (!/^[a-f0-9]{48}$/.test(token)) { err.className = "sub"; err.removeAttribute("role"); err.textContent = "This link looks cut off. Open the one in your email, or sign in."; f.querySelectorAll("label, button").forEach((x) => x.remove()); f.insertAdjacentHTML("beforeend", '<a class="go-in" href="/login">Sign in</a>'); }
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const body = { ...Object.fromEntries(new FormData(f)), token };
    if (String(body.password || "").length < 10) { err.textContent = "Password needs 10+ characters."; return; }
    go.disabled = true;
    try {
      const r = await fetch("/api/join", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = j.message || "Couldn't join. Try again."; if (r.status === 400 || r.status === 404 || r.status === 410) err.insertAdjacentHTML("beforeend", ' <a href="/login">Sign in</a>'); go.disabled = false; return; }
      history.replaceState(null, "", "/join"); location.href = j.redirect || "/?welcome=1";
    } catch { err.textContent = "Can't reach Pottery Lab. Check your connection."; go.disabled = false; }
  });
</script><script src="/help.js" defer></script></body></html>
