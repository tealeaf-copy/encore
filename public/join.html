<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join your team · Encore</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px "DM Sans",system-ui,sans-serif;background:#FAF7F2;color:#2B211C}
  form{background:#fff;padding:30px;border-radius:18px;border:1px solid #E9E1D6;box-shadow:0 1px 2px rgba(43,33,28,.05),0 18px 40px -24px rgba(43,33,28,.3);width:min(360px,calc(100vw - 32px));box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:8px;font:600 20px "Fraunces",Georgia,serif;margin-bottom:18px}
  h1{margin:0 0 4px;font:600 24px "Fraunces",Georgia,serif}.sub{margin:0 0 18px;color:#75685F;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;color:#2B211C;margin-bottom:12px}
  input,button{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border-radius:12px}
  input{border:1px solid #E9E1D6;margin:6px 0 0;background:#fff;font-weight:400}input:focus{outline:2px solid #E8C3B5;outline-offset:1px}
  button{border:0;background:#C2553A;color:#fff;font-weight:600;cursor:pointer;margin-top:6px}button:hover{background:#A9462E}button:disabled{opacity:.6;cursor:default}
  .err{color:#A93A3A;margin:0 0 12px;font-size:13px}.err:empty{display:none}p{margin:0 0 12px}
  a{display:block;margin-top:14px;text-align:center;color:#A9462E;font-size:13px;text-decoration:none}
</style><link rel="stylesheet" href="/playful.css">
</head><body>
<form id="f" novalidate><div class="brand"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#C2553A"/><circle cx="19" cy="9" r="3.2" fill="#E9C98C"/></svg>encore</div>
  <h1>Join your team on Encore</h1>
  <p class="err" id="err" role="alert"></p>
  <label>Your name<input name="name" placeholder="Your name" autocomplete="name" required></label>
  <label>Choose a password (10+ characters)<input name="password" type="password" placeholder="Choose a password (10+ characters)" autocomplete="new-password" minlength="10" required></label>
  <button type="submit" id="go">Join</button>
</form>
<script src="/authguard.js"></script><script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  const token = location.hash.slice(1);
  if (!/^[a-f0-9]{48}$/.test(token)) { err.textContent = "This invite link looks incomplete. Open the full link from your invite."; go.disabled = true; }
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const body = { ...Object.fromEntries(new FormData(f)), token };
    if (String(body.password || "").length < 10) { err.textContent = "Use a password of at least 10 characters."; return; }
    go.disabled = true;
    try {
      const r = await fetch("/api/join", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = j.message || "Couldn't join. Try again."; go.disabled = false; return; }
      history.replaceState(null, "", "/join"); location.href = j.redirect || "/?welcome=1";
    } catch { err.textContent = "Can't reach Encore. Check your connection."; go.disabled = false; }
  });
</script></body></html>
