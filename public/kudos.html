<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Leave kudos · Pottery Lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" id="gfonts"><script>addEventListener("load",()=>{document.getElementById("gfonts").media="all"})</script>
<style>
/* One-tap kudos, from the link in the morning-after text or email (/k/<event>?rid=..&code=..). The reply id and code
   prove it's a guest who replied, the same proof POST /api/public/kudos checks. Small on purpose: it opens instantly. */
:root{--paper:var(--pl-page);--linen:var(--pl-raised);--ink:var(--pl-ink);--smoke:var(--pl-soft);--ember:var(--pl-accent);--ember-d:var(--pl-accent-text);--butter:var(--pl-sand);--sage:var(--pl-sage);--line:var(--pl-line);--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:var(--ember-d)}main{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 40px}
.top{display:flex;align-items:center;margin:4px 0 14px}.brand{display:flex;gap:8px;align-items:center;font:700 20px var(--sys-display);text-decoration:none;color:var(--ink)}
h1{font:700 30px/1.1 var(--sys-display);margin:6px 0 4px}h2{font:600 20px/1.2 var(--pl-font-text);margin:0 0 10px}
.muted{color:var(--smoke)}.sub{margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 0 0 4px #fff,0 12px 28px -20px rgba(31,26,23,.55);display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--pl-surface);color:var(--ink);border-radius:999px;min-height:44px;padding:0 14px;font:600 15px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.again{background:var(--butter);border-color:var(--ink);border-width:2px}.chip.again[aria-pressed=true]{background:var(--ink);color:#fff}
.chip:focus-visible,.go:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
label.f{display:grid;gap:5px;font-weight:600}label.f small{font-weight:400;color:var(--smoke)}
textarea,input[type=email]{width:100%;padding:12px 14px;border:1.5px solid var(--pl-line-strong);border-radius:14px;font:inherit;font-size:16px;background:var(--pl-surface);color:var(--ink)}textarea{resize:vertical;min-height:72px}
.go{background:var(--ember);color:#fff;border:1px solid var(--ember);border-radius:999px;min-height:52px;padding:0 20px;font:600 17px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;width:100%}.go:disabled{opacity:.6}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;min-height:46px;padding:0 18px;font:600 16px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.on{background:var(--sage);border-color:var(--sage);color:#fff}
.err{color:#A8341A;font-weight:600;margin:0}.err:empty{display:none}
.thanks{text-align:center;display:grid;gap:12px;justify-items:center}.thanks .pot{width:56px;height:56px}
.follow{display:grid;gap:8px;width:100%}.follow form{display:flex;gap:8px}.follow form input{flex:1}
.more{margin-top:22px}.ev{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;text-decoration:none;color:var(--ink);margin-bottom:10px}
.ev .im{width:64px;height:64px;border-radius:14px;background:var(--linen) center/cover no-repeat;display:grid;place-items:center;font:700 22px var(--pl-font-text);color:var(--smoke)}
.ev b{display:block;font:600 16px/1.25 var(--sys-title)}.ev small{color:var(--smoke);font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- kudos nudges: faster kudos. Big chips, two to a row on phones; Send lights up after one chip ---- */
#tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{min-height:54px;padding:6px 16px;font-size:17px;line-height:1.2;border-width:2px;justify-content:flex-start;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip span[aria-hidden]{font-size:20px}
.go:disabled{opacity:.45;cursor:default}
/* the group kudos link: who are you? */
.gform{display:grid;gap:10px}.gform input{width:100%;padding:14px;border:1.5px solid var(--pl-line-strong);border-radius:14px;font:inherit;font-size:17px;background:var(--pl-surface);color:var(--ink)}
.gform input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
/* ---- end kudos nudges ---- */
/* ---- visual feed: add photos from the night (they become moments on the event's page, the host's scrapbook and the feed) ---- */
.addph{display:grid;gap:8px;width:100%;justify-items:center;border-top:1.5px dashed var(--line);padding-top:14px}.addph p{margin:0;font-size:14px}
.phgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:6px 0}.phg{position:relative;width:92px;background:#fff;border:2px solid var(--ink);border-radius:5px;padding:5px 5px 18px;box-shadow:2px 3px 0 var(--ink);transform:rotate(var(--r))}
.phg img,.phg video{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--linen)}.phg b{position:absolute;left:0;right:0;bottom:1px;text-align:center;font:600 11px "IBM Plex Sans",system-ui}.phg.err{border-color:#A8341A}.phg.err b{color:#A8341A}
.phg::before{content:"";position:absolute;top:-7px;left:50%;width:40px;height:13px;margin-left:-20px;background:var(--butter);opacity:.9;transform:rotate(-4deg)}
/* ---- end visual feed ---- */
/* ---- round 11 UX pass: the app's tokens (public/system.css). Tags are soft tiles (16px corners, so two-line labels
   don't sit in a squashed pill), the emoji in a small round well, one line weight, Potto's brown on the card frame ---- */
.card{border:1.5px solid var(--pl-frame);border-radius:24px;padding:20px 16px;box-shadow:0 1px 2px rgba(31,26,23,.06),0 10px 28px -16px rgba(31,26,23,.28);gap:16px}
.chips{gap:8px}
#tags{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{border-width:1.5px;border-color:var(--pl-line-strong);background:#fff;border-radius:16px;min-height:56px;padding:8px 12px 8px 8px;gap:10px;font-size:15px;font-weight:600;line-height:1.2}
.chip span[aria-hidden]{flex:none;width:36px;height:36px;border-radius:50%;background:var(--linen);display:grid;place-items:center;font-size:18px;line-height:1}
.chip[aria-pressed=true] span[aria-hidden]{background:rgba(255,255,255,.14)}
.chips:first-child .chip.again,.chip.again{width:100%;background:#FFF6E2;border-color:var(--pl-frame);border-width:1.5px}
.chip.again span[aria-hidden]{background:var(--butter);color:var(--ink)}
.chip.again[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}.chip.again[aria-pressed=true] span[aria-hidden]{background:var(--butter)}
@media (hover:hover){.chip:not([aria-pressed=true]):hover{border-color:var(--pl-frame)}}
textarea,input[type=email]{border-radius:12px;border-color:var(--pl-line-strong);background:#fff;font-weight:400}
textarea:focus,input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(201,74,48,.18)}
.go:disabled{opacity:1;background:var(--linen);border-color:var(--linen);color:var(--pl-muted)}
h1{font-weight:600;letter-spacing:-.01em}
@media (max-width:340px){#tags{grid-template-columns:1fr}}
</style></head><body>
<main id="m" aria-live="polite"><div class="top"><a class="brand" href="/"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg>pottery lab</a></div>
<div id="body"><p class="muted">Opening…</p></div></main>
<script src="/momentupload.js" defer></script><!-- visual feed: Add photos -->
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const id = (location.pathname.match(/^\/k\/([A-Za-z0-9_-]{2,80})/) || [])[1] || "", q = new URLSearchParams(location.search), rid = q.get("rid") || "", code = q.get("code") || "";
  const proof = `rid=${encodeURIComponent(rid)}&code=${encodeURIComponent(code)}`, body = $("#body");
  const day = (d) => (/^\d{4}-\d{2}-\d{2}$/.test(d || "") ? new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) : "");
  const pot = `<svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg>`;
  const sub = (j) => [day(j.date), j.place ? `at ${j.place}` : j.hostFirst ? `with ${j.hostFirst}` : ""].filter(Boolean).join(" · ");
  const stop = (h, p) => { body.innerHTML = `<h1>${esc(h)}</h1><p class="muted">${esc(p)}</p>`; };
  /* ---- kudos nudges: the group kudos link (/k/<event>?g=<token>) and Send after one chip ---- */
  if (id && !rid && q.get("g")) return groupStart(q.get("g"));
  sendReady();
  /* ---- end kudos nudges ---- */
  if (!id || !rid) return stop("This link isn't working", "Open the link from your text or email.");

  fetch(`/api/public/kudos-page/${encodeURIComponent(id)}?${proof}`).then(async (r) => ({ ok: r.ok, j: await r.json().catch(() => ({})) })).then(({ ok, j }) => {
    if (!ok) return stop("This link isn't working", j.message || "Open the link from your text or email.");
    const host = j.hostFirst || "your host";
    if (!j.open) return stop(`${j.title}`, "Kudos open once it's happened.");
    if (j.sent) return thanks(j);
    // review round 7: "Would go again" first; the subtitle is the place ("at Prospect Park") or "with Marcus"
    body.innerHTML = `<h1>How was ${esc(j.title)}?</h1><p class="muted sub">${esc(sub(j))}</p>
      <div class="card"><div><h2>Tap what you loved</h2><div class="chips"><button type="button" class="chip again" data-k="${esc(j.again.k)}" aria-pressed="false"><span aria-hidden="true" class="ki"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5a5.5 5.5 0 0 1 9.6-3.6L14.5 7M15 9.5a5.5 5.5 0 0 1-9.6 3.6L3.5 11"/><path d="M14.7 3.2v3.9h-3.9M3.3 14.8v-3.9h3.9"/></svg></span>${esc(j.again.label)}</button></div><div class="chips" id="tags" style="margin-top:8px">${j.tags.map((t) => `<button type="button" class="chip" data-k="${esc(t.k)}" aria-pressed="false"><span aria-hidden="true">${esc(t.emoji)}</span>${esc(t.label)}</button>`).join("")}</div></div>
      <label class="f">A short note <small>Optional. It shows on ${esc(host)}'s page with your first name.</small><textarea id="love" maxlength="280" rows="2" placeholder="The food, the people, the moment it got loud"></textarea></label>
      <p class="err" id="err"></p><button class="go" id="send" type="button">Send</button></div>`;
    $$(".chip[data-k]").forEach((b) => (b.onclick = () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))));
    $("#send").onclick = async () => {
      const tags = $$(".chip[aria-pressed=true]").map((b) => b.dataset.k), love = $("#love").value.trim();
      if (!tags.length && !love) { $("#err").textContent = "Tap a chip or write a line first."; return; }
      const b = $("#send"); b.disabled = true; $("#err").textContent = "";
      try { const r = await fetch("/api/public/kudos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ eventId: id, rid, code, tags, love, via: "ask" }) });
        const x = await r.json().catch(() => ({})); if (!r.ok) throw new Error(x.message || "That didn't send. Try again.");
        try { localStorage.setItem("encore-kudos-" + id, "1"); } catch {}
        thanks(j);
      } catch (e) { $("#err").textContent = e.message; b.disabled = false; }
    };
  }).catch(() => stop("Couldn't load this", "Check your connection and try again."));

  function thanks(j) {
    const host = j.hostFirst || "Your host";
    body.innerHTML = `<div class="card thanks">${pot}<h1 style="margin:0">Thanks. ${esc(host)} will see this.</h1>
      ${j.host ? `<div class="follow" id="fol"><button class="btn" type="button" id="follow">Follow ${esc(j.hostFirst || j.host.name)}</button><p class="muted" style="margin:0;font-size:14px">Hear first about the next one.</p></div>` : ""}
      <div class="addph" id="addPh"><button class="btn" type="button" id="phBtn">📷 Add photos</button><p class="muted">Up to 6 photos or short videos from the night. ${esc(host)} and the guests see them on the event's page.</p><div class="phgrid" id="phGrid" aria-live="polite"></div></div>
      <p class="muted yourturn" id="yourTurn" style="margin:6px 0 0;font-size:14px"><a href="/signup?mode=friends&amp;ref=${encodeURIComponent(id)}">Your turn? Hosting friends is free.</a></p></div>
      <section class="more" id="more" hidden aria-labelledby="moreH"><h2 id="moreH">More like this</h2><div id="moreL"></div></section>`;
    const fb = $("#follow"); if (fb) fb.onclick = () => follow(j);
    // review round 7: following survives a reload (the server knows; this device remembers a tap it made)
    { let mine = false; try { mine = !!(j.host && localStorage.getItem("encore-follow-" + j.host.handle)); } catch {}
      const f = j.following || (mine ? true : false); if (f && $("#fol")) $("#fol").innerHTML = f === "pending" ? `<p class="muted" role="status" style="margin:0">Check your email to confirm you're following ${esc(j.hostFirst || j.host.name)}.</p>` : `<span class="btn on" role="status">Following ${esc(j.hostFirst || j.host.name)}</span>`; }
    // ---- visual feed: photos from guests, proved by the same reply link as the kudos ----
    const pb = $("#phBtn"); if (pb) pb.onclick = () => { if (!window.MomentUpload) return; const grid = $("#phGrid"), R = [-3, 2, -1.5, 2.5, -2, 1.5]; let n0 = grid.children.length;
      window.MomentUpload.pick({ q: { eventId: id, rid, code }, onStart: (fs, extra) => { pb.disabled = true; fs.forEach((f, i) => { const u = URL.createObjectURL(f), v = /^video\//.test(f.type); grid.insertAdjacentHTML("beforeend", `<span class="phg" style="--r:${R[(n0 + i) % 6]}deg" data-i="${n0 + i}">${v ? `<video src="${u}" muted playsinline></video>` : `<img src="${u}" alt="">`}<b>Adding…</b></span>`); }); if (extra) grid.insertAdjacentHTML("afterend", `<p class="muted" style="margin:0">The first 6 went up. Add more in a moment.</p>`); },
        onEach: (f, r, err, i) => { const el = grid.querySelector(`[data-i="${n0 + i}"]`); if (!el) return; el.classList.toggle("err", !!err); el.querySelector("b").textContent = err ? "Didn't add" : "Added"; if (err) el.title = err.message; },
        onDone: (n, total) => { pb.disabled = false; n0 = grid.children.length; pb.textContent = "📷 Add more"; if (n < total) { const e = document.createElement("p"); e.className = "err"; e.textContent = n ? `${n} of ${total} added. The others were too big, too long or not a photo.` : "Those didn't add. Photos, or videos up to 15 seconds."; $("#addPh").appendChild(e); } } }); };
    fetch(`/api/public/kudos-more/${encodeURIComponent(id)}?${proof}`).then((r) => (r.ok ? r.json() : { events: [] })).then((m) => {
      next = m.next || null; const L = (m.events || []).slice(0, 3); if (!L.length) return noMore();
      $("#moreL").innerHTML = L.map((e) => `<a class="ev" href="${esc(e.url)}"><span class="im" ${e.cover ? `style="background-image:url('${esc(e.cover)}')"` : ""}>${e.cover ? "" : esc((e.title || "?").slice(0, 1))}</span><span><b>${esc(e.title)}</b><small>${esc([day(e.start), e.area || e.city, e.price].filter(Boolean).join(" · "))}</small><br><small>by ${esc(e.host?.name || "")}</small></span></a>`).join("");
      if (next) $("#moreL").insertAdjacentHTML("afterbegin", nextHTML()); $("#more").hidden = false; }).catch(noMore);
  }
  // nothing similar coming up: point at everything else instead of an empty space
  let next = null;
  // review round 7: the series' own next date first ("Next one: Thu, Dec 3 · 6:30pm"), else "Nothing like it coming up yet"
  function nextHTML() { const t = /^\d{2}:\d{2}$/.test(next.startTime || "") ? new Date("2000-01-01T" + next.startTime).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/:00(?=\s)/, "").replace(/\s([AP]M)$/, (_, x) => x.toLowerCase()) : "";
    const w = [day(next.date), t].filter(Boolean).join(" · "); return next.id ? `<a class="ev" id="nextDate" href="/e/${encodeURIComponent(next.id)}"><span class="im">🔁</span><span><b>${next.course ? "Next class" : "Next one"}: ${esc(w)}</b><small>Same plan, new date. Are you in?</small></span></a>` : `<p class="muted" id="nextDate" style="margin:0 0 8px">${next.course ? "Next class" : "Next one"}: ${esc(w)}. ${esc("It opens the morning after.")}</p>`; }
  function noMore() { const m = $("#more"); if (!m) return; $("#moreL").innerHTML = next ? nextHTML() : `<p class="muted" style="margin:0">Nothing like it coming up yet. <a href="/discover">See what's on</a></p>`; m.hidden = false; }
  async function follow(j, email = "") {
    const b = $("#follow"); if (b) b.disabled = true;
    try { const r = await fetch("/api/public/follow", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ handle: j.host.handle, eventId: id, rid, code, via: "kudos", ...(email ? { email } : {}) }) });
      const x = await r.json().catch(() => ({}));
      if (r.status === 401 && x.code === "email_required") { // a reply with no email: ask for one, right here
        $("#fol").innerHTML = `<form id="ff"><input type="email" id="fe" required autocomplete="email" placeholder="Your email" aria-label="Your email"><button class="btn" type="submit">Follow</button></form><p class="err" id="fErr">${email ? esc(x.message || "") : ""}</p>`;
        $("#ff").onsubmit = (ev) => { ev.preventDefault(); follow(j, $("#fe").value.trim()); }; return; }
      if (!r.ok) throw new Error(x.message || "That didn't work. Try again.");
      try { localStorage.setItem("encore-follow-" + j.host.handle, x.pending ? "pending" : "1"); } catch {}
      $("#fol").innerHTML = x.pending ? `<p class="muted" role="status" style="margin:0">Check your email to confirm you're following ${esc(j.hostFirst || j.host.name)}.</p>` : `<span class="btn on" role="status">Following ${esc(j.hostFirst || j.host.name)}</span>`;
    } catch (e) { if (b) { b.disabled = false; } const p = document.createElement("p"); p.className = "err"; p.textContent = e.message; $("#fol")?.appendChild(p); }
  }
  /* ---- kudos nudges ----
     The group kudos link: someone who wasn't sent their own link types the email or phone they replied with. On a match
     the server hands back a kudos-only code for that reply and the page opens as if from a personal link. */
  function groupStart(g) {
    fetch(`/api/public/kudos-group/${encodeURIComponent(id)}?g=${encodeURIComponent(g)}`).then(async (r) => ({ ok: r.ok, j: await r.json().catch(() => ({})) })).then(({ ok, j }) => {
      if (!ok) return stop("This link isn't working", j.message || "Ask your host for a new one.");
      if (!j.open) return stop(`${j.title}`, "Kudos open once it's happened.");
      const here = !!j.here && q.get("here") === "1"; // review round 8: scanned at the event, the code on the host's phone skips the email
      body.innerHTML = `<h1>How was ${esc(j.title)}?</h1><p class="muted sub">${esc(sub(j))}</p>
        <form class="card gform" id="gf" novalidate><label class="f" for="gc">Your email or phone <small>The one you replied with, so ${esc(j.hostFirst || "your host")} knows it's you.</small></label>
        <input id="gc" name="contact" type="text" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="you@example.com or (555) 123-4567" required>
        ${here ? `<label class="f" for="gat">Code on ${esc(j.hostFirst ? j.hostFirst + "'s" : "your host's")} phone <small>4 digits. It changes every few minutes.</small></label><input id="gat" name="at" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="1234">` : ""}
        <p class="err" id="gErr" role="alert"></p><button class="go" id="gGo" type="submit">Continue</button></form>`;
      const f = $("#gf"), b = $("#gGo");
      f.onsubmit = async (ev) => { ev.preventDefault(); const contact = $("#gc").value.trim(); if (!contact) { $("#gErr").textContent = "Add the email or phone you replied with."; return; }
        b.disabled = true; $("#gErr").textContent = "";
        try { const r = await fetch(`/api/public/kudos-group/${encodeURIComponent(id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ g, contact, ...(here && $("#gat")?.value.trim() ? { at: $("#gat").value.trim() } : {}) }) });
          const x = await r.json().catch(() => ({})); if (!r.ok) throw new Error(x.message || "That didn't work. Try again.");
          // the server answers the same way whether or not it found the reply; it sends the link there, or hands the page on
          if (x.next && /^\/k\//.test(x.next)) return location.replace(x.next);
          f.innerHTML = `<p role="status" style="margin:0">${esc(x.message || "Thanks. If that's the email or phone you replied with, your kudos link is on its way there.")}</p>`;
        } catch (e) { $("#gErr").textContent = e.message; b.disabled = false; } };
    }).catch(() => stop("Couldn't load this", "Check your connection and try again."));
  }
  /* Send stays off until one chip is tapped (or a line is written), then lights up. Nothing is preselected. */
  function sendReady() {
    const sync = () => { const s = $("#send"); if (!s) return; const any = $$(".chip[aria-pressed=true]").length > 0 || !!($("#love") && $("#love").value.trim()); s.disabled = !any; };
    body.addEventListener("click", (e) => { const t = e.target && e.target.closest ? e.target : null; if (t && t.closest(".chip[data-k]")) sync(); });
    body.addEventListener("input", sync);
    if (window.MutationObserver) new MutationObserver(sync).observe(body, { childList: true });
  }
  /* ---- end kudos nudges ---- */
})();
