<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/authguard.js"></script>
<title>Your library · Pottery Lab</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Your library (server/library.js): smart lists, your lists, lists friends share with you, and the host library.
   /saved opens this page too. /l/<token> is a shared list's public view. */
*{box-sizing:border-box}[hidden]{display:none!important}html,body{overflow-x:clip}
body{margin:0;background:var(--pl-page);color:var(--pl-ink);font:16px/1.5 var(--pl-font-text,"IBM Plex Sans"),system-ui,sans-serif}
a{color:inherit}button{font:inherit;color:inherit}
.lb{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(140px + env(safe-area-inset-bottom))}
.lb-k{display:block;font:500 12px/1.4 var(--pl-font-mono,"IBM Plex Mono"),ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--pl-soft)}
/* header: the title, search and + at right */
.lb-top{display:flex;align-items:center;gap:4px;margin:20px 0 12px}.lb-top h1{flex:1;margin:0;font:600 28px/1.15 var(--pl-font-display,"IBM Plex Sans"),system-ui,sans-serif;letter-spacing:-.02em}
.ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:6px;background:none;color:var(--pl-ink);cursor:pointer;text-decoration:none}
.ic svg{width:24px;height:24px}@media (hover:hover){.ic:hover{background:var(--pl-raised)}}.ic[aria-pressed=true]{background:var(--pl-ink);color:var(--pl-page)}
.lb-search{position:relative;margin:0 0 12px}.lb-search input{width:100%;min-height:46px;padding:0 14px 0 42px;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-surface);font:16px var(--pl-font-text,"IBM Plex Sans"),system-ui;color:var(--pl-ink)}
.lb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--pl-soft)}.lb-search input:focus{outline:3px solid var(--pl-focus);outline-offset:1px}
/* chips: one row that scrolls inside itself */
.lb-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}.lb-chips::-webkit-scrollbar{display:none}
.lb-chip{flex:none;min-height:44px;padding:0 14px;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-surface);font:500 14px var(--pl-font-text,"IBM Plex Sans"),system-ui;cursor:pointer;white-space:nowrap}
.lb-chip[aria-pressed=true]{background:var(--pl-ink);color:var(--pl-page)}.lb-chip .x{margin-left:6px}
.lb-sort{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px;min-height:44px}
.lb-sortbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:none;font:500 14px var(--pl-font-text,"IBM Plex Sans"),system-ui;cursor:pointer}.lb-sortbtn svg{width:16px;height:16px}
/* rows */
.lb-rows{list-style:none;margin:0;padding:0}.lb-rows li>.lb-row{flex:1;min-width:0}
.lb-row{display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 0;border-bottom:1px solid var(--pl-line);text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.lb-row .tx{flex:1;min-width:0}.lb-row b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row small{display:flex;align-items:center;gap:6px;color:var(--pl-soft);font-size:14px;line-height:1.35;overflow:hidden;white-space:nowrap}.lb-row small span{overflow:hidden;text-overflow:ellipsis}
.pin{flex:none;width:13px;height:13px;color:var(--pl-accent)}
@media (hover:hover){a.lb-row:hover b{text-decoration:underline;text-underline-offset:3px}}
.lb-more{flex:none;width:44px;height:44px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--pl-soft)}.lb-more svg{width:20px;height:20px}
/* tiles: smart lists get a drawing, your lists a 2x2 collage of their covers */
.tile{display:block;position:relative;flex:none;width:56px;height:56px;border:1.5px solid var(--pl-ink);border-radius:6px;overflow:hidden;background:var(--pl-raised)}
.tile svg.d{position:absolute;inset:0;width:100%;height:100%}.tile svg.d *{vector-effect:non-scaling-stroke}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile .ea-cover .ea-txt{display:none}
.tile.col{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.5px;background:var(--pl-ink)}.tile.col>span{position:relative;overflow:hidden;background:var(--pl-raised)}.tile.col>span:only-child{grid-column:1/-1;grid-row:1/-1}
.tile.col>span:nth-child(1):nth-last-child(2),.tile.col>span:nth-child(2):nth-last-child(1){grid-row:1/-1}
.tile.col>span:nth-child(1):nth-last-child(3){grid-row:1/-1}
.t-going{background:var(--pl-sand)}.t-saved{background:var(--pl-accent-soft)}.t-hosts{background:var(--pl-success-soft)}.t-clubs{background:var(--pl-danger-soft)}.t-went{background:var(--pl-raised)}.t-host{background:var(--pl-sand-soft)}.t-empty{background:var(--pl-surface)}
.tile.round{border-radius:50%}
/* grid */
.lb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;margin-top:8px}@media (min-width:560px){.lb-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lb-card{display:block;text-decoration:none;color:inherit;min-width:0}.lb-card .tile{width:100%;height:auto;aspect-ratio:1}.lb-card b{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-weight:600;overflow:hidden;white-space:nowrap}.lb-card b span{overflow:hidden;text-overflow:ellipsis}
.lb-card small{display:block;color:var(--pl-soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sec{margin:28px 0 4px;font:600 18px/1.3 var(--pl-font-text,"IBM Plex Sans"),system-ui}
.lb-empty{margin:20px 0;padding:20px;border:1.5px dashed var(--pl-line-strong);border-radius:6px;background:var(--pl-surface)}.lb-empty b{display:block;font-size:17px}.lb-empty p{margin:6px 0 12px;color:var(--pl-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-surface);color:var(--pl-ink);font:600 15px var(--pl-font-text,"IBM Plex Sans"),system-ui;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--pl-ink);color:var(--pl-page)}.btn svg{width:18px;height:18px}.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.link{min-height:44px;padding:0;border:0;background:none;color:var(--pl-accent-text);font:600 15px var(--pl-font-text,"IBM Plex Sans"),system-ui;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn:focus-visible,.link:focus-visible,.ic:focus-visible,.lb-row:focus-visible,.lb-chip:focus-visible,.lb-card:focus-visible,.lb-more:focus-visible{outline:3px solid var(--pl-focus);outline-offset:2px}
/* one list */
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:8px 0 0 -6px;padding:0 6px;color:var(--pl-ink);font-weight:500;text-decoration:none;border-radius:6px}.back svg{width:20px;height:20px}
.lh{display:flex;gap:16px;align-items:flex-end;margin:12px 0 0}.lh .tile{width:120px;height:120px}.lh .tx{flex:1;min-width:0}
.lh h1{margin:4px 0 2px;font:600 28px/1.15 var(--pl-font-display,"IBM Plex Sans"),system-ui,sans-serif;letter-spacing:-.02em;overflow-wrap:anywhere}.lh p{margin:0;color:var(--pl-soft);font-size:14px}
.lnote{margin:14px 0 0;padding:0 0 0 12px;border-left:3px solid var(--pl-sand);font-size:16px;color:var(--pl-ink)}
.lacts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.lacts .ic{border:1.5px solid var(--pl-ink)}
.hl{background:var(--pl-sand);padding:0 3px;border-radius:2px}
/* shared view */
.by{margin:2px 0 0;font-size:15px}.sharebar{margin:18px 0 0;padding:14px 16px;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sharebar p{margin:0;flex:1;min-width:200px;font-size:15px}
/* public lists: notes and I'd go again under an item, the preview before Public */
.lb-x{list-style:none;padding:0 0 12px 70px;border-bottom:1px solid var(--pl-line);margin-top:-1px}.lb-why{margin:0;padding:0 0 0 10px;border-left:3px solid var(--pl-sand);font-size:15px}.lb-why span{color:var(--pl-soft);font-size:13px}.lb-x .pll-again{margin:8px 0 0}
.pv-card{margin:12px 0;padding:12px 14px;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-page)}.pv-name{display:block;margin:2px 0 0;font:600 24px/1.2 var(--pl-font-serif,"IBM Plex Serif"),Georgia,serif}.pv-card>small{color:var(--pl-soft);font-size:14px}
/* host library */
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:2px 16px 6px;scroll-snap-type:x proximity}.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:228px;scroll-snap-align:start;display:flex;flex-direction:column;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-surface);overflow:hidden}
.hcard .cv{position:relative;aspect-ratio:3/2;background:var(--pl-raised);border-bottom:1.5px solid var(--pl-ink);overflow:hidden}.hcard .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hcard .cv .ea-cover .ea-txt{display:none}
.hcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}.hcard .bd b{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.hcard .bd small{color:var(--pl-soft);font-size:14px}
.hcard .bd ul{margin:4px 0 0;padding:0 0 0 16px;font-size:14px;color:var(--pl-ink)}.hcard .acts{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.hcard.sq{width:150px}.hcard.sq .cv{aspect-ratio:1;border-bottom:0}.hcard.sq .bd{padding:8px 10px 10px}
.hsec{display:flex;align-items:baseline;gap:8px;margin:28px 0 0}.hsec h2{margin:0;font:600 18px/1.3 var(--pl-font-text,"IBM Plex Sans"),system-ui}.hsec span{color:var(--pl-soft);font-size:14px}
.hlede{margin:4px 0 0;color:var(--pl-soft);font-size:15px}
.keep{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 16px;padding:14px 16px;border:1.5px solid var(--pl-ink);border-radius:6px;background:var(--pl-surface)}.keep p{margin:0;flex:1;min-width:200px}
.wk{display:grid;gap:10px}
@media (min-width:861px){.lb{padding-top:28px}.lb-top h1,.lh h1{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  const IC = { search: SV('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'), plus: SV('<path d="M12 5v14M5 12h14"/>'), grid: SV('<rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/>'),

  // the drawn tiles for the smart lists (and the host library): thin ink lines on one calm colour each

  const SHARE_WORD = { private: "Private", link: "Link", friends: "Friends", public: "Public" };
  const KIND_WORD = { event: "Event", host: "Host", club: "Fan club", idea: "Idea", place: "Place", collection: "Collection", drop: "Drop" };
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      + sec("Past events", H.past.length, "", H.past.map((e) => `<article class="hcard">${cv(e)}<div class="bd"><b>${esc(e.title)}</b><small>${esc([when(e.date), e.guests ? plural(e.guests, "guest") : ""].filter(Boolean).join(" · "))}</small><div class="acts">${start("event", e.id, "Copy as a new event")}<button type="button" class="link" data-tpl="${esc(e.id)}" data-name="${esc(e.title)}" style="font-size:14px">Save as a template</button></div></div></article>`).join(""))
      + sec("Templates", H.templates.length, "", H.templates.map((t) => `<article class="hcard">${cv(t)}<div class="bd"><b>${esc(t.title)}</b><small>Template</small><div class="acts">${start("template", t.id)}<button type="button" class="link" data-drop="${esc(t.id)}" style="font-size:14px">Remove</button></div></div></article>`).join(""))
      + sec("Menus", H.menus.length, "", H.menus.map((m) => `<article class="hcard"><div class="bd"><span class="lb-k">From ${esc(m.title)}</span><ul>${m.lines.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><div class="acts">${start("menu", m.id)}</div></div></article>`).join(""))
      + sec("Playlists", H.playlists.length, "", H.playlists.map((p) => `<article class="hcard"><div class="bd"><b>${esc(p.title)}</b><small>${esc(p.host)}</small><div class="acts"><a class="link" style="font-size:14px;display:inline-flex;align-items:center" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Open playlist</a>${start("playlist", p.id)}</div></div></article>`).join(""))
      + sec("Guest lists", H.guests.length, "Who came before, ready to invite again.", H.guests.map((g) => `<article class="hcard"><div class="bd"><b>${esc(g.title)}</b><small>${esc([plural(g.count, "guest"), when(g.date)].filter(Boolean).join(" · "))}</small><small>${esc(g.names.join(", "))}${g.count > g.names.length ? " and more" : ""}</small><div class="acts">${start("guests", g.id)}</div></div></article>`).join(""))
      + sec("Covers", H.covers.length, "", H.covers.map((c) => `<article class="hcard sq">${cv(c)}<div class="bd"><small>${esc(c.title)}</small><div class="acts">${start("cover", c.id)}</div></div></article>`).join(""))
      + sec("Photos", H.photos.length, "Your own photos from your events and your page.", H.photos.map((p) => `<article class="hcard sq"><div class="cv"><img src="${esc(safeImg(p.img))}" alt="" loading="lazy"></div><div class="bd"><small>${esc(p.title || "")}</small><div class="acts">${start("photo", p.id)}</div></div></article>`).join(""))
      + (!H.past.length && !H.templates.length && !H.menus.length && !H.photos.length ? `<div class="lb-empty"><b>Nothing to reuse yet.</b><p>After your first event, its menu, playlist, photos and guest list show up here.</p></div>` : "");
    $$("[data-start]").forEach((b) => (b.onclick = async () => { b.disabled = true; const r2 = await api("/api/host/library/start", { method: "POST", body: { from: b.dataset.start, id: b.dataset.id } }); if (r2.ok && safeUrl(r2.j.open)) location.href = r2.j.open; else { b.disabled = false; window.PLSave?.toast?.(esc(r2.j.message || "Couldn't start it. Try again.")); } }));
    $$("[data-tpl]").forEach((b) => (b.onclick = async () => { const name = prompt("Name the template", b.dataset.name); if (name === null) return; const r2 = await api("/api/host/library/templates", { method: "POST", body: { eventId: b.dataset.tpl, name } }); if (r2.ok) drawHost(); }));
    $$("[data-drop]").forEach((b) => (b.onclick = async () => { await api("/api/host/library/templates/" + encodeURIComponent(b.dataset.drop), { method: "DELETE" }); drawHost(); })); }

  // ---------- signed out ----------
  function drawOut() { const L = window.PLSave?.local?.() || [];
    M.innerHTML = `<div class="lb-top"><h1>Your library</h1></div><div class="keep"><p>${L.length ? `<b>${plural(L.length, "save")} on this phone.</b> ` : ""}Make a free account to keep saves, make lists and share them with friends.</p><a class="btn primary" href="/signup?mode=friends&amp;from=saves">Make a free account</a></div>
      ${L.length ? `<ul class="lb-rows">${L.map((i) => itemRow({ ...i, sub: KIND_WORD[i.kind] || "" }, false)).join("")}</ul>` : `<div class="lb-empty"><b>Nothing saved yet.</b><p>Tap the heart on an event, an idea or a host and it lands here.</p><a class="btn" href="/discover">Find something</a></div>`}`; }
  // this weekend near you (the weekend digest links to /saved#weekend)
  async function weekend() { if (location.hash !== "#weekend" || $("#wkSec")) return; await new Promise((ok) => { if (window.PLInterests) return ok(); const t = document.createElement("script"); t.src = "/interests.js"; t.onload = ok; t.onerror = ok; document.head.appendChild(t); }); if (!window.PLInterests) return;
    const me = await PLInterests.get(), saved = (D?.items || []).filter((i) => i.kind === "event").map((i) => i.ref), q2 = `interests=${encodeURIComponent((me.interests || []).join(","))}&city=${encodeURIComponent(me.city || "")}&saved=${encodeURIComponent(saved.join(","))}`;
    const W = (await api("/api/public/suggest/weekend?" + q2)).j; if (!W?.events?.length) return; PLInterests.css(); const sec = document.createElement("section"); sec.id = "wkSec"; sec.innerHTML = `<h2 class="lb-sec">This weekend near you</h2><div class="wk">${W.events.map(PLInterests.eventCard).join("")}</div>`; M.prepend(sec); }

  // ---------- public lists (server/curation.js, public/listpublic.js) ----------
  let ST = null, FOL = null;
  /** Under an item: the curator's note, and "5 would go again, including Maya" (with I'd go again when you went). */
  const whyRow = (i, by = "") => { const ag = i.again && window.PLLists ? PLLists.again(i.again, i.kind, i.ref) : ""; if (!i.why && !ag) return "";
    return `<li class="lb-x">${i.why ? `<p class="lb-why">${esc(i.why)}${by ? ` <span>${esc(by)}</span>` : ""}</p>` : ""}${ag}</li>`; };
  /** Home, top: the curator's strip once anything is shared, and the one nudge. */
  const homeLists = () => { if (!ST || chip || q.trim()) return ""; const n = ST.nudge, any = ST.publicLists || ST.followers || ST.saves;
    return (any && window.PLLists ? PLLists.strip(ST) + (ST.handle && ST.publicLists ? `<p class="hlede" style="margin:-4px 0 8px"><a style="display:inline-block;padding:12px 0;margin:-12px 0" href="/@${esc(ST.handle)}/lists">See your page</a></p>` : "") : "")
      + (n ? `<div class="pll-nudge" data-nudge="${esc(n.id)}"><p>${esc(n.line)}</p><a class="btn sm primary" href="#list-${esc(n.id)}">See how it looks</a><button type="button" class="link" data-nudge-no style="font-size:14px">Not now</button></div>` : ""); };
  const followedHtml = () => (chip || q.trim() || !FOL?.lists?.length ? "" : `<h2 class="lb-sec">Lists you follow</h2><ul class="lb-rows">${FOL.lists.map((l) => entryRow({ href: l.url, name: l.name, sub: `${l.by}'s list · ${plural(l.count, "thing")}${l.following ? "" : " · Saved"}`, tile: () => collage(l.covers) })).join("")}</ul>`);
  /** On your own shared list: followers, your page, and the nudge for this list. */
  const pubBar = (l) => { const n = ST?.nudge?.id === l.id ? ST.nudge : null;
    return (l.share === "public" ? `<p class="hlede" style="margin-top:10px">Public${ST?.handle ? ` · <a href="/@${esc(ST.handle)}/lists">On your page</a>` : ""}${l.link ? ` · <a href="${esc(l.link)}">See it as others do</a>` : ""}</p>` : "")
      + (n ? `<div class="pll-nudge" data-nudge="${esc(n.id)}"><p>${esc(n.line)}</p><button type="button" class="btn sm primary" data-nudge-go>Make it public</button><button type="button" class="link" data-nudge-no style="font-size:14px">Not now</button></div>` : ""); };
  function pubWire(l) { $("[data-nudge-go]") && ($("[data-nudge-go]").onclick = () => confirmPublic(l)); }
  document.addEventListener("click", async (e) => { const b = e.target.closest?.("[data-nudge-no]"); if (!b) return; const box = b.closest("[data-nudge]"); await api("/api/me/lists/nudge", { method: "POST", body: { id: box.dataset.nudge } }); if (ST) ST.nudge = null; box.remove(); });
  /** Before Public: exactly what a stranger will see, then one tap. */
  async function confirmPublic(l) { const r = await api(`/api/me/library/lists/${encodeURIComponent(l.id)}/preview`); if (!r.ok) return; const P = r.j;
    const rows = P.items.map((i) => `<div class="psl-it"><span class="psl-tile one">${pic(i)}</span><span style="min-width:0"><b>${esc(i.title)}</b>${i.why ? `<small>${esc(i.why)}</small>` : ""}</span></div>`).join("");
    const s = S.sheet({ title: "Make it public?", body: `<p class="psl-note" style="margin-top:12px">This is how it will look to anyone on Pottery Lab. It goes on your page, on Discover and in your followers' feeds.</p>
      <div class="pv-card"><span class="lb-k">Public list${P.by ? " · by " + esc(P.by) : ""}</span><b class="pv-name">${esc(P.name)}</b><small>${plural(P.count, "thing")}</small>${rows || `<p class="psl-note">Nothing public on it yet.</p>`}${P.count > P.items.length ? `<p class="psl-note">And ${P.count - P.items.length} more.</p>` : ""}</div>
      ${P.hidden ? `<p class="psl-note">${P.hidden === 1 ? "1 thing stays hidden" : P.hidden + " things stay hidden"}: private and link-only events never show on a public list.</p>` : ""}<p class="psl-note">You can make it private again any time.</p>`,
      foot: `<button type="button" class="psl-btn" data-close>Not now</button><button type="button" class="psl-btn primary" id="pvGo">Make it public</button>` });
    s.$("[data-close]").onclick = s.close;
    s.$("#pvGo").onclick = async () => { s.$("#pvGo").disabled = true; const u = await api("/api/me/library/lists/" + encodeURIComponent(l.id), { method: "POST", body: { share: "public" } }); s.close(); if (!u.ok) { window.PLLists?.toast(u.j.message || "Couldn't make it public. Try again."); return; }
      if (ST?.nudge?.id === l.id) ST.nudge = null; ST && (ST.publicLists = (ST.publicLists || 0) + 1);
      window.PLLists?.toast("It's public. People can follow it now.", async () => { await api("/api/me/library/lists/" + encodeURIComponent(l.id), { method: "POST", body: { share: l.share } }); drawList(l.id); }); drawList(l.id); }; }
  function noteSheet(l, i) { const s = S.sheet({ title: i.why ? "Edit your note" : "Add a note", body: `<label class="psl-k" for="wyIn">Why it's on ${esc(l.name)}</label><input type="text" id="wyIn" maxlength="120" value="${esc(i.why || "")}" placeholder="Order the dumplings, sit at the bar" autocomplete="off"><p class="psl-note">Shows under it wherever the list shows.</p><p class="psl-err" hidden></p>`, foot: `<button type="button" class="psl-btn primary" id="wyGo">Save</button>` });
    s.$("#wyGo").onclick = async () => { const r = await api(`/api/me/library/lists/${encodeURIComponent(l.id)}/note`, { method: "POST", body: { kind: i.kind, ref: i.ref, why: s.$("#wyIn").value } }); if (!r.ok) { const e = s.$(".psl-err"); e.hidden = false; e.textContent = r.j.message || "Couldn't save it. Try again."; return; } s.close(); drawList(l.id); }; }

  // ---------- routing ----------
  async function route() { const tok = /^\/l\/([A-Za-z0-9_-]{24})$/.exec(location.pathname); if (tok) return drawShared(tok[1]);
    if (!signed) return drawOut();
    const h = location.hash, m = /^#(?:list|board)-([A-Za-z0-9]+)$/.exec(h);
    if (location.pathname === "/library/host" || h === "#host") return drawHost();
    if (m) { if (!D) loadHome(); return drawList(m[1]); }
    await loadHome(); cur = null; if (!D) { M.innerHTML = `<div class="lb-empty" style="margin-top:40px"><b>Couldn't load your library.</b><p>Check your connection and try again.</p><button type="button" class="btn" onclick="location.reload()">Try again</button></div>`; return; } drawHome(); }
  window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });
  window.addEventListener("pl:lists", async () => { await loadHome(); route(); });
  (async () => { if (window.PLSave?.ready) await window.PLSave.ready; route(); })();
})();
</script>
<script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
