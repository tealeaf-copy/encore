<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Host path · Pottery Lab</title>
<meta name="description" content="From a dinner for four to a weekend away: the Host path, with a short guide for every step.">
<script src="/authguard.js"></script>
<style>
/* /path: the Host path, warmth points with the monthly goal ring, the streak and badges (server/hostloop.js).
   Brand tokens only (public/system.css). Each node's guide lives here until a guides module lands (see PATH in server/hostloop.js). */
*{box-sizing:border-box}[hidden]{display:none!important}html,body{overflow-x:clip}
body{margin:0;background:var(--pl-page);color:var(--pl-ink);font:16px/1.5 var(--pl-font-text);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--pl-soft);text-decoration:none;font-size:15px}
.eyebrow{display:block;font:500 12px/1.4 var(--pl-font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pl-soft);margin:8px 0 8px}
h1{font:400 34px/1.08 var(--pl-font-display);letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
main h2{font:500 12px/1.3 var(--pl-font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pl-soft);margin:0 0 12px}
.lede{color:var(--pl-soft);margin:0 0 20px}
.box{background:var(--pl-surface);border:1px solid var(--pl-line-strong);border-radius:6px;padding:16px;margin:0 0 16px}
.warm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.warm .n{font:400 40px/1 var(--pl-font-display)}.warm .n small{font:500 13px var(--pl-font-mono);color:var(--pl-soft)}
.parts{list-style:none;margin:10px 0 0;padding:0;font:400 13px/1.35 var(--pl-font-mono)}.parts li{margin:0 0 6px;color:var(--pl-soft)}.parts b{color:var(--pl-ink);font-weight:500}
.streak{display:flex;gap:14px;align-items:center}.streak .n{font:400 40px/1 var(--pl-font-display);min-width:48px;text-align:center}
.pass{width:18px;height:18px;border:1.5px solid var(--pl-ink);border-radius:4px;display:inline-grid;place-items:center;font:500 10px var(--pl-font-mono);margin-right:4px;vertical-align:-4px}.pass.off{border-style:dashed;border-color:var(--pl-line-strong)}
/* the path: a dashed ruling with a node per step */
ol.path{list-style:none;margin:0;padding:0;position:relative}
ol.path::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:1.5px dashed var(--pl-line-strong)}
.node{position:relative;padding:0 0 4px 44px}
.node .dot{position:absolute;left:4px;top:12px;width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--pl-line-strong);background:var(--pl-page);display:grid;place-items:center;color:var(--pl-surface)}
.node.done .dot{background:var(--pl-ink);border:1.5px solid var(--pl-ink)}.node.next .dot{border:2px solid var(--pl-accent);background:var(--pl-surface)}
.node .dot svg{width:14px;height:14px}
.node button.head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:48px;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.node .title{font:600 20px/1.25 var(--pl-font-text)}.node.later .title{color:var(--pl-soft)}
.tag{font:500 11px var(--pl-font-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--pl-line-strong);border-radius:6px;padding:2px 6px;color:var(--pl-soft);white-space:nowrap}
.node.next .tag{border-color:var(--pl-accent);color:var(--pl-accent-text)}.node.done .tag{border-color:var(--pl-ink);color:var(--pl-ink)}
.guide{padding:2px 0 14px}.guide ol{margin:0 0 12px;padding-left:20px;color:var(--pl-ink)}.guide li{margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--pl-ink);background:var(--pl-surface);color:var(--pl-ink);font:600 15px var(--pl-font-text);text-decoration:none;cursor:pointer}
.btn.pri{background:var(--pl-accent);border-color:var(--pl-accent);color:var(--pl-on-accent)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{border:1.5px solid var(--pl-ink);border-radius:6px;padding:8px 10px;max-width:100%;transform:rotate(-1deg);background:var(--pl-surface)}
.badge:nth-child(2n){transform:rotate(.8deg)}.badge b{display:block;font:600 13px var(--pl-font-mono);letter-spacing:.04em;text-transform:uppercase}.badge span{display:block;font-size:13px;color:var(--pl-soft)}
.empty{color:var(--pl-soft);font-size:15px;margin:0}
</style>
</head><body data-shell="tabs">
<main>
  <a class="back" href="/?app=1">‹ Home</a>
  <span class="eyebrow">Host path</span>
  <h1>From dinner for four to a weekend away.</h1>
  <p class="lede" id="lede">Every step has a short guide and a template. Go in any order. Small counts.</p>
  <section class="box" id="warmBox" hidden aria-labelledby="hW"><h2 id="hW">Warmth this month</h2><div class="warm"><div id="ring"></div><div><div class="n"><span id="wPts">0</span> <small id="wGoal"></small></div><ul class="parts" id="parts"></ul></div></div></section>
  <section class="box" id="streakBox" hidden aria-labelledby="hS"><h2 id="hS">Your streak</h2><div class="streak"><div class="n" id="sN"></div><div><p style="margin:0" id="sLine"></p><div id="sPass" style="margin-top:6px;font:500 12px var(--pl-font-mono);color:var(--pl-soft)"></div></div></div></section>
  <section class="box" aria-labelledby="hP"><h2 id="hP">The path</h2><ol class="path" id="path"></ol></section>
  <section class="box" id="badgeBox" hidden aria-labelledby="hB"><h2 id="hB">Badges</h2><div class="badges" id="badges"></div></section>
</main>
<script src="/mascot.js"></script><script src="/fx.js"></script><script src="/hostloop.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";"), fx = window.HostLoop?.fx || {};
  const GUIDE = { dinner4: "first-supper", table8: "first-supper", ticketed: "first-supper", regular: "game-night", series: "grow-regulars", soldout: "grow-regulars" }; // GUIDE_OF in server/hostloop.js
  // the same nodes as PATH in server/hostloop.js, for people who aren't signed in
  const BASE = [["dinner4", "Dinner for 4", ["Pick a night two weeks out.", "Ask three people you'd like at the same table.", "Cook one thing well. Buy the rest."]], ["table8", "A table of 8", ["Invite ten; eight will say yes.", "Seat people next to someone new.", "Send a reminder the day before."]],
    ["regular", "A regular night", ["Same day, same time, every month.", "Say the next date out loud at the end.", "Let a regular bring a friend."]], ["ticketed", "Your first ticketed event", ["Price to cover costs, then a little.", "Say what the money pays for.", "Keep a few spots for people you know."]],
    ["series", "A series", ["Give it a name people can say.", "Number the episodes.", "Your regulars hear first."]], ["soldout", "A sold-out night", ["Fewer seats than you think.", "Turn on the waitlist.", "Tell the waitlist first next time."]],
    ["weekend", "A weekend away", ["Book the place before the people.", "Share a rough plan, not a schedule.", "Collect money early."]], ["summit", "A summit", ["Start with five speakers you know.", "A host for every room.", "Leave the hallway time long."]]]
    .map(([id, title, steps], i) => ({ id, title, steps, state: i ? "later" : "next", template: "/start?t=" + id, guideHref: GUIDE[id] ? "/guides/" + GUIDE[id] : "" }));
  let S = null; try { S = await HostLoop.api.get("/api/me/hostloop?peek=1"); if (S.off) S = null; } catch {}
  const nodes = S?.path || BASE, check = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  $("#path").innerHTML = nodes.map((n) => `<li class="node ${n.state}" id="guide-${esc(n.id)}"><span class="dot">${n.state === "done" ? check : ""}</span>
    <button type="button" class="head" aria-expanded="${n.state === "next"}" aria-controls="g-${esc(n.id)}"><span class="title">${esc(n.title)}</span><span class="tag">${n.state === "done" ? "Done" : n.state === "next" ? "Next" : "Later"}</span></button>
    <div class="guide" id="g-${esc(n.id)}"${n.state === "next" ? "" : " hidden"}><ol>${n.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol><a class="btn${n.state === "next" ? " pri" : ""}" href="${esc(n.template)}">Start from this</a>${/^\/guides\/[a-z0-9-]+$/.test(n.guideHref || "") ? ` <a class="btn" href="${esc(n.guideHref)}">Read the guide</a>` : ""}</div></li>`).join("");
  $("#path").onclick = (e) => { const b = e.target.closest("button.head"); if (!b) return; const g = document.getElementById(b.getAttribute("aria-controls")), open = g.hidden; g.hidden = !open; b.setAttribute("aria-expanded", String(open)); fx.haptic?.("light"); };
  if (location.hash.startsWith("#guide-")) { const el = document.querySelector(location.hash); if (el) { el.querySelector(".guide").hidden = false; setTimeout(() => el.scrollIntoView({ block: "center" }), 60); } }
  if (!S) { $("#lede").innerHTML = `Every step has a short guide and a template. <a href="/start" style="color:var(--pl-accent-text);font-weight:600">Plan a dinner</a> to start, no account needed.`; return; }
  const w = S.warmth, r = 52, c = 2 * Math.PI * r;
  $("#warmBox").hidden = false; $("#ring").innerHTML = `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${w.points} of ${w.goal} warmth points"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--pl-line-strong)" stroke-width="6" stroke-dasharray="3 4"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--pl-accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 ${c}" transform="rotate(-90 60 60)" id="arc" style="transition:stroke-dasharray .8s ease-out"/></svg>`;
  requestAnimationFrame(() => setTimeout(() => { $("#arc").setAttribute("stroke-dasharray", `${(c * w.pct) / 100} ${c}`); fx.tick?.($("#wPts"), w.points, 700); }, 80));
  $("#wGoal").textContent = `of ${w.goal} in ${w.month}${w.met ? ". Goal met." : ""}`;
  $("#parts").innerHTML = [["Events held", w.parts.events, "10 each"], ["Guests welcomed", w.parts.guests, "2 each"], ["Would go again", w.parts.again, "3 each"], ["Small moves", w.parts.moves, "1 each, up to 20"]].map(([k, v, h]) => `<li><b>${v}</b> ${k}<br><span style="font-size:12px">${h}</span></li>`).join("");
  const s = S.streak; $("#streakBox").hidden = false; $("#sN").textContent = s.status === "none" ? "0" : s.status === "lapsed" ? "0" : s.count; $("#sLine").textContent = s.line;
  $("#sPass").innerHTML = s.status === "none" ? "Your first event earns your first rest pass." : `${Array.from({ length: s.maxPasses }, (_, i) => `<span class="pass${i < s.passes ? "" : " off"}">${i < s.passes ? "R" : ""}</span>`).join("")} ${s.passes === 1 ? "1 rest pass" : s.passes + " rest passes"} held. A quiet ${s.cadence} uses one by itself.`;
  if (S.badges?.length) { $("#badgeBox").hidden = false; $("#badges").innerHTML = S.badges.map((b) => `<div class="badge"><b>${esc(b.label)}</b><span>${esc(b.why)}</span></div>`).join(""); }
})();
</script>
<script src="/shell.js"></script>
</body></html>
