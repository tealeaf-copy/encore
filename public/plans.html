<style>
.plans{display:grid;gap:12px;margin:14px 0 28px}
.plan{display:flex;gap:14px;align-items:center;border:1.5px solid var(--pl-line-strong);border-radius:var(--pl-r-md);padding:12px 14px;background:var(--pl-surface);color:var(--pl-ink);text-decoration:none}
.plan .ic{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:var(--pl-raised);overflow:hidden}
.plan .ic svg,.plan .ic img{width:100%;height:100%;object-fit:cover}
.plan b{display:block;font-size:16px}.plan small{color:var(--pl-soft);font-size:14px}
.pill{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:4px;font-size:13px;font-weight:500;background:var(--pl-sand);color:var(--pl-ink)}
h2.sub{font:600 17px/1.3 var(--pl-font-text);margin:28px 0 0;padding-bottom:8px;border-bottom:var(--pl-rule-dashed,1px dashed var(--pl-line))}
/* Plans: a compact header, Timeline or Calendar, the timeline left and a mini calendar right on wide screens */
.pv{max-width:1040px}
.pv-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 16px;margin:18px 0 6px}
.pv-kick{margin:0 0 4px;font:500 12px/1 var(--pl-font-mono);text-transform:uppercase;letter-spacing:var(--pl-kicker-track,.06em);color:var(--pl-accent-text)}
.pv-head h1{margin:0;font:var(--pl-display-weight,600) 32px/1.1 var(--pl-font-display);letter-spacing:var(--pl-display-track,-.02em)}
.pv-seg{display:inline-flex;border:1.5px solid var(--pl-line-strong);border-radius:var(--pl-r-btn);padding:2px;background:var(--pl-surface)}
.pv-seg button{min-height:44px;padding:0 16px;border:0;border-radius:4px;background:none;font:500 15px var(--pl-font-text);color:var(--pl-ink);cursor:pointer}
.pv-seg button[aria-selected=true]{background:var(--pl-ink);color:var(--pl-surface)}
.pv-seg button:focus-visible{outline:2px solid var(--pl-accent);outline-offset:2px}
.pv-sum{margin:6px 0 10px;font:400 15px/1.45 var(--pl-font-text);color:var(--pl-soft)}.pv-sum b{color:var(--pl-ink);font-weight:500}
.pv-sync{margin:0 0 12px}
.pv-grid{display:grid;gap:24px}
.pv-aside{display:none}
@media (min-width:900px){.pv-grid{grid-template-columns:minmax(0,1fr) 272px;align-items:start}.pv-aside{display:grid;gap:14px;position:sticky;top:16px}.pv-grid.is-cal .pv-aside{display:none}.pv-grid.is-cal{grid-template-columns:minmax(0,1fr)}.pv-head h1{font-size:40px}}
.pv-load{padding:24px 0;color:var(--pl-soft)}
/* while the plans load: the kicker line keeps its height, and what sits below the plans waits unseen, so nothing jumps when they land */
.pv-kick:empty::before{content:"\00a0"}main.pv:has(.pv-load) #ppFoot,main.pv:has(.pv-load) #rpCard{visibility:hidden}
.pv-empty{margin:18px 0;padding:22px 18px;border:1.5px dashed var(--pl-line-strong);border-radius:var(--pl-r-md);background:var(--pl-surface)}
.pv-empty p{margin:0 0 14px;font:600 18px/1.4 var(--pl-font-text)}
.pv-sugg{display:flex;flex-wrap:wrap;gap:8px}
.pv-sugg a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid var(--pl-line-strong);border-radius:var(--pl-r-btn);background:var(--pl-page);color:var(--pl-ink);font:500 15px var(--pl-font-text);text-decoration:none}
.pv-sugg a:first-child{background:var(--pl-ink);border-color:var(--pl-ink);color:var(--pl-surface)}
.pv-foot{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin:18px 0 0;padding-top:12px;border-top:var(--pl-rule-dashed,1px dashed var(--pl-line))}
.pv-foot a{color:var(--pl-accent-text);font:500 15px var(--pl-font-text);min-height:44px;display:inline-flex;align-items:center}
.pv-dayh{margin:18px 0 0;font:600 17px/1.3 var(--pl-font-text)}
.pv-dayh small{display:block;font:400 14px var(--pl-font-text);color:var(--pl-soft);margin-top:2px}
.pv-calwrap{display:grid;gap:16px}#ppDay .tl-dh{display:none}
@media (min-width:900px){.pv-calwrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
</style><link rel="stylesheet" href="/playful.css">
</head><body>
<div class="wrap">
  <header class="top"><a class="brand" href="/discover">pottery lab</a>
    <nav><a href="/discover">Discover</a><a href="/plans" aria-current="page">Plans</a><a href="/requests">Requests</a><a href="/feed">Feed</a><a class="cta" href="/signup?mode=friends">Start your page</a></nav></header>
  <main class="pv">
    <header class="pv-head"><div><p class="pv-kick" id="ppKick"></p><h1 id="ppH">Your plans</h1></div>
      <div class="pv-seg" role="tablist" aria-label="How to see your plans" id="ppSeg"><button type="button" role="tab" data-view="timeline" aria-selected="true" aria-controls="ppMain">Timeline</button><button type="button" role="tab" data-view="calendar" aria-selected="false" aria-controls="ppMain">Calendar</button></div></header>

</div>

<script>
// Plans (server/plans.js, public/timeline.js): your upcoming things by day, or as a month. The replies this browser
// holds go with the request, so it works signed out too; signed in, your account's replies and your own events join.
(async function () { const T = window.PLTimeline, esc = T.esc, $ = (id) => document.getElementById(id);
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch { return ""; } })(), past = new URLSearchParams(location.search).get("past") === "1";
  const signed = /(?:^|;\s*)encore_in=1/.test(document.cookie), store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const R = [], O = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); try { if (k.startsWith("encore-rsvp-")) { const v = JSON.parse(localStorage.getItem(k)); if (v && v.rid && v.code && v.response !== "no") R.push({ id: k.slice(12), rid: v.rid, code: v.code }); } else if (k.startsWith("encore.order.")) { const v = JSON.parse(localStorage.getItem(k)); if (v) O.push({ handle: k.slice(13).split(".")[0], ...v }); } } catch {} } } catch {}
  let saved = []; try { saved = (JSON.parse(store.get("pl.saves") || "[]") || []).filter((x) => x && x.kind === "event").map((x) => x.ref); } catch {}
  let D = { items: [], undated: [], today: T.localDay(Date.now(), tz), now: Date.now(), signedIn: signed };
  try { const r = await fetch("/api/plans/timeline", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ proofs: R.slice(0, 80), saved: saved.slice(0, 100), tz, past }) }); if (r.ok) D = await r.json(); } catch {}
  const today = () => T.localDay(Date.now(), tz), all = () => D.items || [], byKey = (k) => [...all(), ...(D.undated || [])].find((i) => i.key === k);
  $("ppKick").textContent = past ? "History" : T.dayLabel(today(), today()).text;
  if (past) { $("ppH").textContent = "Past plans"; $("ppSeg").hidden = true; $("ppPast").textContent = "Back to what's coming up"; $("ppPast").href = "/plans"; document.title = "Past plans · Pottery Lab"; }
  else if ((D.items || []).length || (D.undated || []).length) window.PLAddCal?.sync($("ppSync"), { signedIn: !!D.signedIn }); // nothing to sync yet: no box

  // the line under the title: how full the week is, and what's next
  const main = all().filter((i) => i.kind !== "todo");
  if (!past && main.length) { const wk = T.addDays(today(), 6), n = main.filter((i) => i.date <= wk).length, nx = main.find((i) => (i.endMs || 0) > Date.now()) || main[0], L = T.dayLabel(nx.date, today());
    const when = (L.kicker || L.text) + (nx.time && !nx.allDay ? " at " + T.clock(nx.time) : "");
    $("ppSum").innerHTML = `${n ? `<b>${n} this week</b> · ` : ""}Next: <b>${esc(nx.title)}</b>, ${esc(when)}`; $("ppSum").hidden = false; }

  const empty = () => `<div class="pv-empty"><p>Nothing planned yet. A quiet week can be a good one.</p><div class="pv-sugg"><a href="/events?q=this%20weekend">Something this weekend?</a><a href="/discover">See what's on near you</a><a href="/?app=1&new=1#studio">Host something small</a></div></div>`;
  const undated = () => (D.undated || []).length ? `<section class="tl-day"><h3 class="tl-dh"><span class="tl-dk">Soon</span>Date to come</h3><ol class="tl-list">${D.undated.map((it) => T.rowHtml({ ...it, time: "", allDay: false }, { dim: false })).join("")}</ol></section>` : "";

  let view = past ? "timeline" : (location.hash === "#calendar" ? "calendar" : store.get("pl.plansView") === "calendar" ? "calendar" : "timeline"), ym = today().slice(0, 7), sel = today();
  const dayList = (d) => { const L = T.itemsOn(all(), d), lab = T.dayLabel(d, today()), n = L.filter((i) => i.kind !== "todo").length;
    return `<h2 class="pv-dayh">${esc(lab.kicker ? lab.kicker + " · " + lab.text : lab.text)}<small>${n ? `${n} planned` : "Nothing planned"}</small></h2>${L.length ? T.timelineHtml(L.map((i) => ({ ...i, date: d })), { now: Date.now(), today: today(), tz, nowMarker: d === today(), cal: true }) : `<div class="pv-empty" style="margin-top:10px"><p style="font-size:17px;margin:0 0 10px">A free day.</p><div class="pv-sugg"><a href="/events?q=${encodeURIComponent(d === today() ? "tonight" : "this weekend")}">${d === today() ? "Anything tonight?" : "Something this weekend?"}</a></div></div>`}`; };
  function draw() {
    const grid = $("ppGrid"), M = $("ppMain"), A = $("ppAside"); grid.classList.toggle("is-cal", view === "calendar");
    document.querySelectorAll("#ppSeg [data-view]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    if (view === "calendar") { M.innerHTML = `<div class="pv-calwrap"><div>${T.calendarHtml(ym, T.calendarDots(all(), ym), { today: today(), selected: sel })}${T.legendHtml()}</div><div id="ppDay">${dayList(sel)}</div></div>`; wireCal(M); A.innerHTML = ""; return; }
    M.innerHTML = all().length || (D.undated || []).length ? T.timelineHtml(all(), { now: Date.now(), today: today(), tz, nowMarker: !past, cal: !past }) + undated() : past ? `<div class="pv-empty"><p>Nothing here yet. Your past plans will show up here.</p></div>` : empty();
    if (!past) { A.innerHTML = T.calendarHtml(ym, T.calendarDots(all(), ym), { today: today(), selected: "", mini: true }) + T.legendHtml(); wireCal(A, true); }
  }
  function wireCal(root, mini) { root.querySelectorAll("[data-shift]").forEach((b) => b.onclick = () => { ym = T.shiftMonth(ym, +b.dataset.shift); draw(); });
    root.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => { const d = b.dataset.day;
      if (mini) { const s = document.querySelector(`#ppMain .tl-day[data-date="${d}"]`); if (s) { s.scrollIntoView({ behavior: "smooth", block: "start" }); return; } }
      sel = d; if (d.slice(0, 7) !== ym) ym = d.slice(0, 7); view = "calendar"; draw(); if (!mini) document.getElementById("ppDay")?.scrollIntoView({ behavior: "smooth", block: "nearest" }); }); }
  // Add to calendar on a row: Apple, Google, Outlook or a file (public/addcal.js)
  $("ppMain").addEventListener("click", (e) => { const b = e.target.closest("[data-addcal]"); if (!b) return; e.preventDefault(); const it = byKey(b.dataset.addcal); if (it) window.PLAddCal?.open(b, it); });
  // a tap on a row opens the peek (public/peek.js); a reply changed there updates that event's rows here, no reload
  window.PLPeek?.attach($("ppMain"), { onChange(id, items) { const mine = (i) => i.eventId === id && i.kind !== "hosting";
    D.items = [...all().filter((i) => !mine(i)), ...items.filter((i) => i.date)]; D.undated = [...(D.undated || []).filter((i) => !mine(i)), ...items.filter((i) => !i.date)]; draw(); } });
  document.querySelectorAll("#ppSeg [data-view]").forEach((b) => b.onclick = () => { view = b.dataset.view; store.set("pl.plansView", view); if (view === "calendar") ym = sel.slice(0, 7); draw(); });
  // a quiet month: open the calendar on the month of the next plan
  { const f = main[0]; if (f && f.date.slice(0, 7) > ym && f.date > T.addDays(today(), 20)) { ym = f.date.slice(0, 7); sel = f.date; } }
  draw();
  // the Now marker and dimming keep up while the page is open
  setInterval(() => { if (!document.hidden && view === "timeline") draw(); }, 5 * 60e3);
  $("ppPast").hidden = !past && !D.pastCount && !D.signedIn;

  O.sort((a, b) => (b.at || 0) - (a.at || 0));
  document.getElementById("ord").innerHTML = O.length ? O.map((o) => `<a class="plan" href="/@${encodeURIComponent(o.handle)}#shop"><span class="ic">🍰</span><span><b>${esc(o.items || "Order")}${o.host ? ` from ${esc(o.host)}` : ""}</b><small>Order ${esc(String(o.code || "").replace(/^#/, "#"))}${o.total ? ` · ${esc(o.total)}${o.payUrl ? " · pay before pickup" : " · pay at pickup"}` : ""}</small><br><small>${o.slot ? `Pickup ${esc(o.slot)}` : "Pickup details on the host's page"}${o.where ? ` · ${esc(o.where)}` : ""}</small><br><span class="pill">Show <b style="display:inline;font-size:15px;letter-spacing:.06em">#${esc(String(o.code || "").replace(/^#/, ""))}</b> at pickup</span></span></a>`).join("") : ""; document.getElementById("ordH").hidden = !O.length;
  try { const me = await fetch("/api/me"); if (me.ok) document.querySelectorAll('header.top a.cta[href^="/signup"]').forEach((a) => (a.hidden = true)); } catch {}
  try { let n = 0; try { n = JSON.parse(localStorage.getItem("encore.bookings") || "[]").length; } catch {} if (!n) { const rq = await (await fetch("/api/me/requests")).json().catch(() => null); n = (rq?.requests || []).length; } if (!n && /(?:^|;\s*)encore_in=1/.test(document.cookie) /* review round 8: signed out, no collabs call */) { const co = await (await fetch("/api/collabs")).json().catch(() => null); n = (co?.sent || []).length + (co?.incoming || []).length; } document.getElementById("reqLink").hidden = !n; } catch {}
})();
</script><script>
// hosts you follow, so you can always get back to them
(async () => { try { let L = []; try { L = JSON.parse(localStorage.getItem("encore.following") || "[]"); } catch {}
  try { const F = await (await fetch("/api/me/feed", { credentials: "same-origin" })).json(); if (Array.isArray(F?.following)) L = [...new Set([...F.following, ...L])]; } catch {}
  if (!L.length) return; const d = await (await fetch("/api/public/discover")).json().catch(() => ({})); const H = new Map((d.hosts || []).map((h) => [h.handle, h])); const E = d.events || [];
  const sec = document.createElement("section"); sec.innerHTML = `<h2 class="sub">Hosts you follow</h2><div class="plans">${L.slice(0, 12).map((h) => { const x = H.get(h) || { handle: h, name: "@" + h }; const nx = E.filter((e) => e.host?.handle === h && e.date).sort((a, b) => String(a.date).localeCompare(String(b.date)))[0];
    const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); return `<a class="plan" href="/@${esc(h)}"><span class="ic">${esc(x.emoji && x.emoji !== "🎉" ? x.emoji : (x.name || "?").trim()[0].toUpperCase())}</span><span><b>${esc(x.name)}</b><small style="display:block">${nx ? `Next: ${esc(nx.title)}` : "Nothing scheduled yet"}</small></span></a>`; }).join("")}</div>`;
  const main = document.querySelector("main") || document.body; main.insertBefore(sec, document.getElementById("rpCard")); } catch {} })();
</script>

<style>.rp-card{margin:34px 0 10px;padding:20px;border:1px solid var(--pl-line);border-radius:20px;background:#fff;max-width:620px}.rp-card h2{margin:0 0 4px;font-size:20px;display:inline}.rp-card summary{cursor:pointer;list-style:none}.rp-card summary::-webkit-details-marker{display:none}.rp-card summary::after{content:"Open ▾";float:right;font-size:13px;color:var(--pl-accent);font-weight:600}.rp-card[open] summary::after{content:"Close ▴"}.rp-card summary .rp-sub{display:block;margin-top:4px}.rp-sub{color:var(--pl-soft);margin:0 0 14px;font-size:14.5px}
#rpForm{display:grid;gap:12px}#rpForm label{display:grid;gap:4px;font-weight:600;font-size:14px}#rpForm input:not([type=checkbox]){padding:10px 12px;border:1px solid var(--pl-line-strong);border-radius:12px;font:inherit;font-weight:400}
.rp-chk{display:flex!important;align-items:center;gap:8px;font-weight:500!important;min-height:44px}.rp-chk input{width:20px;height:20px}.rp-q{display:flex;flex-wrap:wrap;gap:6px}.rp-q button{min-height:44px;border:1.5px solid var(--pl-line);background:#FBF6EF;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}.rp-q button[aria-pressed=true]{background:var(--pl-sand);border-color:#E8C65A}

<script>
// your saved RSVP details: the same ones the RSVP form fills in (this device, and your account when signed in)
(function () { const KEY = "encore.rsvpProfile", f = document.getElementById("rpForm"), msg = document.getElementById("rpMsg"), signed = /(?:^|;\s*)encore_in=1/.test(document.cookie);
  const local = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch { return null; } };
  const QS = ["Vegetarian", "Vegan", "No pork", "Gluten-free", "Dairy-free", "Nut allergy", "Shellfish allergy"], q = document.getElementById("rpQ");
  const syncQ = () => { const have = f.dietary.value.toLowerCase().split(/,\s*/); q.innerHTML = QS.map((x) => `<button type="button" data-q="${x}" aria-pressed="${have.includes(x.toLowerCase())}">${x}</button>`).join(""); };
  q.onclick = (e) => { const b = e.target.closest("[data-q]"); if (!b) return; const x = b.dataset.q, parts = f.dietary.value.split(/,\s*/).map((s) => s.trim()).filter(Boolean).filter((s) => s.toLowerCase() !== x.toLowerCase()); if (b.getAttribute("aria-pressed") !== "true") parts.push(x); f.dietary.value = parts.join(", "); syncQ(); };
  f.dietary.oninput = syncQ;
  const fill = (P) => { if (!P) return syncQ(); if (P.name || P.dietary) document.getElementById("rpCard").open = true; f.name.value = P.name || ""; f.contact.value = P.contactVia && P.contactVia !== "email" ? P.phone || "" : P.email || P.phone || ""; f.dietary.value = P.dietary || ""; f.severe.checked = !!P.severe; f.access.value = P.access || ""; syncQ(); };
  fill(local());
  if (signed) fetch("/api/me/rsvp-profile", { credentials: "same-origin" }).then((r) => (r.ok ? r.json() : {})).then((j) => { const S = j.profile, L = local(); if (S && (!L || (S.updatedAt || 0) >= (L.updatedAt || 0))) fill(S); }).catch(() => {})
    // a signed-in member never retypes their own name and email
    .finally(() => fetch("/api/me", { credentials: "same-origin" }).then((r) => (r.ok ? r.json() : null)).then((u) => { if (!u) return; if (!f.name.value.trim() && u.name) f.name.value = u.name; if (!f.contact.value.trim() && u.email) f.contact.value = u.email; }).catch(() => {}));
  const saveBtn = f.querySelector(".rp-save"); if (saveBtn) { saveBtn.disabled = true; f.addEventListener("input", () => { saveBtn.disabled = false; msg.textContent = ""; }); f.addEventListener("change", () => { saveBtn.disabled = false; }); }
  f.onsubmit = async (e) => { e.preventDefault(); const c = f.contact.value.trim(), isMail = /@/.test(c);
    if (!f.name.value.trim()) { msg.textContent = "Add your name first."; f.name.focus(); return; }
    const P = { name: f.name.value.trim(), email: isMail ? c : "", phone: isMail ? "" : c.replace(/[^\d+]/g, ""), contactVia: c ? (isMail ? "email" : "sms") : "", dietary: f.dietary.value.trim(), severe: f.severe.checked, access: f.access.value.trim(), updatedAt: Date.now() };
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {}
    if (signed) await fetch("/api/me/rsvp-profile", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(P) }).catch(() => {});
    msg.textContent = "Saved."; if (saveBtn) saveBtn.disabled = true; };
  document.getElementById("rpForget").onclick = async () => { try { localStorage.removeItem(KEY); } catch {} if (signed) await fetch("/api/me/rsvp-profile", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clear: true }) }).catch(() => {}); fill({}); msg.textContent = "Forgotten."; };
})();
</script>
