<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your plans · Encore</title>
<meta name="description" content="The seats you've asked for and the orders you've placed, in one place.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/community.css">
<style>
.plans{display:grid;gap:12px;margin:18px 0 32px}
.plan{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--card);color:var(--ink);text-decoration:none}
.plan .ic{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:24px;background:var(--pink);overflow:hidden}
.plan .ic svg,.plan .ic img{width:100%;height:100%;object-fit:cover}
.plan b{display:block;font-size:16px}.plan small{color:var(--soft);font-size:14px}
.pill{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#F3EFE8}.pill.in{background:#EAF3EC;color:#2F7A4F}
.empty{border:1px dashed var(--line);border-radius:18px;padding:22px;color:var(--soft)}
h2.sub{font-size:20px;margin-top:22px}
</style><link rel="stylesheet" href="/playful.css">
</head><body>
<div class="wrap">
  <header class="top"><a class="brand" href="/discover">encore</a>
    <nav><a href="/discover">Discover</a><a href="/plans" aria-current="page">Your plans</a><a href="/requests">Requests</a><a href="/feed">Feed</a><a class="cta" href="/signup?mode=friends">Host something</a></nav></header>
  <main>
    <h1 style="font-size:clamp(32px,6vw,48px);margin-top:18px">Your plans</h1>
    <p style="color:var(--soft);max-width:520px">Everything you're hosting, said yes to, asked for or ordered, plus the hosts you follow.</p>
    <div id="hostSec" hidden><h2 class="sub">You're hosting</h2><div class="plans" id="host"></div></div>
    <h2 class="sub">Get-togethers</h2><div class="plans" id="ev"></div>
    <p style="margin:18px 0 0"><a href="/requests" style="font-weight:600">Bookings and requests to hosts →</a></p>
    <h2 class="sub">Orders</h2><div class="plans" id="ord"></div>
  </main>
</div>
<script src="/community.js"></script>
<script src="/avatars.js"></script>
<script>
(async function () { const C = window.EncoreCommunity, esc = C.esc, A = window.EncoreAvatars;
  const R = [], O = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); try { if (k.startsWith("encore-rsvp-")) { const v = JSON.parse(localStorage.getItem(k)); if (v && v.response !== "no") R.push({ id: k.slice(12), ...v }); } else if (k.startsWith("encore.order.")) { const v = JSON.parse(localStorage.getItem(k)); if (v) O.push({ handle: k.slice(13).split(".")[0], ...v }); } } catch {} } } catch {}
  try { const j = await (await fetch("/api/me/plans")).json(); for (const p of j.plans || []) { if (p.response === "no" || R.some((x) => x.id === p.id)) continue; R.push({ id: p.id, rid: p.rid, code: p.code, response: p.response, interest: p.interest }); try { localStorage.setItem("encore-rsvp-" + p.id, JSON.stringify({ rid: p.rid, code: p.code, response: p.response, interest: p.interest })); } catch {} } } catch {}
  let cards = {}; if (R.length) { try { cards = (await (await fetch("/api/public/cards?ids=" + encodeURIComponent(R.map((x) => x.id).slice(0, 20).join(",")))).json()).cards || {}; } catch {} }
  await Promise.all(R.map(async (x) => { if (!x.rid || !x.code) return; try { const j = await (await fetch(`/api/public/rsvp-status/${encodeURIComponent(x.id)}?rid=${encodeURIComponent(x.rid)}&code=${encodeURIComponent(x.code)}`)).json(); if (j.response) x.response = j.response; x.paid = !!j.paid; } catch {} }));
  const today = new Date().toISOString().slice(0, 10), when = (c) => [c.date ? new Date(c.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "", c.startTime ? new Date("2000-01-01T" + c.startTime.padStart(5, "0")).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "", c.hood || c.city || ""].filter(Boolean).join(" · ");
  const lab = (x) => x.response === "maybe" && x.interest === "in" ? "You're in ✓ · waiting on the date" : x.response === "going" ? (x.paid ? "You're in ✓ · paid" : (cards[x.id]?.price && cards[x.id].price !== "chip" ? `You're in ✓ · pay ${cards[x.id].price} to hold it` : "You're in ✓")) : x.response === "requested" ? "Requested ✓ · waiting for the host" : x.response === "waitlist" ? "On the waitlist" : x.response === "maybe" ? "Maybe" : "Saved";

  // what you're hosting (signed in): your own upcoming events, straight to the plan
  try { const r = await fetch("/api/db/collection?path=events"); if (r.ok) { const j = await r.json(); const L = (Array.isArray(j) ? j : j.docs || j.items || []).map((d) => ({ id: d.id, ...(d.data || d) })).filter((e) => e && e.id && !e.example && !e.parentId && ((e.date && e.date >= new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10)) || (!e.date && e.stage === "interest"))).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    if (L.length) { document.getElementById("hostSec").hidden = false; document.getElementById("host").innerHTML = L.slice(0, 8).map((e) => `<a class="plan" href="/#studio" data-open="${esc(e.id)}"><span class="ic">${esc(((t) => [["taco","🌮"],["matcha","🍵"],["game","🎲"],["board","🎲"],["run","🏃"],["dumpling","🥟"],["hike","🥾"],["pizza","🍕"],["brunch","🥞"],["picnic","🧺"],["coffee","☕"],["movie","🎬"],["bake","🧁"],["cake","🎂"],["cook","🍳"],["dinner","🍽️"],["potluck","🥘"],["karaoke","🎤"],["book","📚"]].find(([k]) => t.includes(k))?.[1])(String(e.pubTitle || e.name || "").toLowerCase()) || (e.emoji && e.emoji !== "🎉" ? e.emoji : "🗓"))}</span><span><b>${esc(e.pubTitle || e.name || "Your event")}</b><small>${esc(when(e))}</small><small style="display:block;color:var(--brand2,#C94A30);font-weight:600">${e.date && e.date < today ? "Happened · see how it went" : e.published || e.stage === "interest" ? "You're hosting · open the plan" : "Draft · not shared yet"}</small></span></a>`).join("");
      document.querySelectorAll("#host [data-open]").forEach((a) => a.onclick = () => { try { localStorage.setItem("encore-open", JSON.stringify(a.dataset.open)); } catch {} }); } } } catch {}
  // the last two weeks stay here, so you can send kudos and add photos
  { const past = R.map((x) => ({ x, c: cards[x.id] || {} })).filter(({ x, c }) => c.date && c.date < today && c.date >= new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10) && x.response === "going");
    if (past.length) { const sec = document.createElement("div"); sec.innerHTML = `<h2 class="sub">Recently</h2><div class="plans">${past.map(({ x, c }) => `<a class="plan" href="/g#rsvp-${encodeURIComponent(x.id)}"><span class="ic">${esc(c.emoji || "🎉")}</span><span><b>${esc(c.title || "A get-together")}</b><small>${esc(when(c))}</small><small style="display:block;margin-top:4px;color:#C94A30;font-weight:600">💌 Send kudos · 📷 Add your photos</small></span></a>`).join("")}</div>`; document.getElementById("ev").parentElement.insertBefore(sec, document.getElementById("ord").previousElementSibling); } }
  const ev = R.map((x) => ({ x, c: cards[x.id] || {} })).filter(({ c }) => !c.date || c.date >= today).sort((a, b) => String(a.c.date || "9").localeCompare(String(b.c.date || "9")));
  document.getElementById("ev").innerHTML = ev.length ? ev.map(({ x, c }) => `<a class="plan" href="/g#rsvp-${encodeURIComponent(x.id)}"><span class="ic">${c.host?.cover ? `<img src="${esc(c.host.cover)}" alt="">` : c.host?.avatarArt && A ? A.svg(c.host.avatarArt, c.host.color, 52) : esc(c.emoji || "🎉")}</span><span><b>${esc(c.title || "A get-together")}</b><small>${esc(when(c))}${c.host?.name ? ` · with ${esc(c.host.name)}` : ""}</small><br><span class="pill ${x.response === "going" ? "in" : ""}">${esc(lab(x))}</span></span></a>`).join("") : `<div class="empty">Nothing yet. <a href="/discover">Find something this week</a>.</div>`;
  O.sort((a, b) => (b.at || 0) - (a.at || 0));
  document.getElementById("ord").innerHTML = O.length ? O.map((o) => `<a class="plan" href="/@${encodeURIComponent(o.handle)}#shop"><span class="ic">🍰</span><span><b>${esc(o.items || "Order")}${o.host ? ` from ${esc(o.host)}` : ""}</b><small>Order ${esc(String(o.code || "").replace(/^#/, "#"))}${o.total ? ` · ${esc(o.total)}${o.payUrl ? " · pay before pickup" : " · pay at pickup"}` : ""}</small><br><small>${o.slot ? `Pickup ${esc(o.slot)}` : "Pickup details on the host's page"}${o.where ? ` · ${esc(o.where)}` : ""}</small><br><span class="pill">Show <b style="display:inline;font-size:15px;letter-spacing:.06em">#${esc(String(o.code || "").replace(/^#/, ""))}</b> at pickup</span></span></a>`).join("") : `<div class="empty">No orders yet.</div>`;
})();
</script><script>
// hosts you follow, so you can always get back to them
(async () => { try { let L = []; try { L = JSON.parse(localStorage.getItem("encore.following") || "[]"); } catch {}
  try { const F = await (await fetch("/api/me/feed", { credentials: "same-origin" })).json(); if (Array.isArray(F?.following)) L = [...new Set([...F.following, ...L])]; } catch {}
  if (!L.length) return; const d = await (await fetch("/api/public/discover")).json().catch(() => ({})); const H = new Map((d.hosts || []).map((h) => [h.handle, h])); const E = d.events || [];
  const sec = document.createElement("section"); sec.innerHTML = `<h2 class="sub">Hosts you follow</h2><div class="plans">${L.slice(0, 12).map((h) => { const x = H.get(h) || { handle: h, name: "@" + h }; const nx = E.filter((e) => e.host?.handle === h && e.date).sort((a, b) => String(a.date).localeCompare(String(b.date)))[0];
    const esc = (t) => String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); return `<a class="plan" href="/@${esc(h)}"><span class="ic">${esc(x.emoji && x.emoji !== "🎉" ? x.emoji : (x.name || "?").trim()[0].toUpperCase())}</span><span><b>${esc(x.name)}</b><small style="display:block">${nx ? `Next: ${esc(nx.title)}` : "Nothing scheduled yet"}</small></span></a>`; }).join("")}</div>`;
  const main = document.querySelector("main") || document.body; main.appendChild(sec); } catch {} })();
</script>
<script src="/nav.js"></script>
<script src="/shell.js"></script>
</body></html>
