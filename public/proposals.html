<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brand proposals · Pottery Lab</title><meta name="description" content="Build a proposal for a brand in minutes, from a template, with your real numbers from Pottery Lab.">
<meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/proposals.css"></head>
<body class="pp-body"><header class="pp-bar"><a class="pp-bar__pl" href="/?app=1"><svg class="pp-mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="20.5" cy="26" r="2.2" fill="#29489A"/><circle cx="27.5" cy="26" r="2.2" fill="#29489A"/></svg><span>pottery lab</span></a>
<nav class="pp-bar__pdf" aria-label="Host"><a href="/host/teams">Team requests</a><a href="/proposals" aria-current="page">Proposals</a></nav></header>
<main class="pb" id="main"><p class="pb-lede" style="padding-top:24px">Loading…</p></main>
<script>
(function () {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const money = (c) => "$" + (Math.round(+c || 0) % 100 ? ((+c || 0) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round((+c || 0) / 100).toLocaleString("en-US"));
  const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const main = $("#main"), MARK = $(".pp-bar .pp-mark").outerHTML;
  async function api(url, body, method) { const r = await fetch(url, { method: method || (body ? "POST" : "GET"), credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(j.message || "Something went wrong. Try again."); e.status = r.status; e.code = j.code; throw e; } return j; }
  const toast = (t) => { const el = document.createElement("div"); el.className = "pb-toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 2400); };
  const day = (d) => (d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }) : "");
  const STATUS = { draft: "Draft", sent: "Sent", question: "They asked a question", accepted: "Accepted", declined: "Declined", withdrawn: "Taken down" };
  const fail = (e) => { main.innerHTML = e.status === 401 ? `<h1>Sign in to build a proposal</h1><p class="pb-lede">Proposals are for hosts. Sign in and we'll bring you back here.</p><a class="pp-btn primary" href="/login?next=${encodeURIComponent(location.pathname + location.search)}">Sign in</a>`
    : e.code === "no_page" ? `<h1>First, your host page</h1><p class="pb-lede">A proposal is built from your page: your story, your photos and your numbers. Set it up, then come back.</p><a class="pp-btn primary" href="/?app=1">Set up your page</a>` : `<h1>That didn't load</h1><p class="pb-lede">${esc(e.message)}</p><a class="pp-btn" href="/proposals">Back to proposals</a>`; };
  const path = location.pathname.replace(/\/+$/, ""), q = new URLSearchParams(location.search);

  // ---------------------------------------------------------------- the list
  async function listPage() { let D; try { D = await api("/api/proposals"); } catch (e) { return fail(e); }
    const waiting = D.requests.filter((r) => !r.proposal);
    main.innerHTML = `<h1>Brand proposals</h1><p class="pb-lede">When a brand asks for you, send a proposal they can say yes to. Start from a template; I fill in what Pottery Lab already knows about you.</p>
      ${waiting.length ? `<section><h2 class="pb-h2" style="font:600 20px/1.3 var(--pl-font-text);margin:16px 0 4px">Brands waiting on you</h2><div class="pb-list">${waiting.map((r) => `<div class="pb-row"><div><h3>${esc(r.company)}</h3><p>${esc(r.pkgName)} · ${r.headcount} guests${r.date ? " · " + esc(day(r.date)) : ""}${r.occasion ? " · " + esc(r.occasion) : ""}</p></div><a class="pp-btn primary" href="/proposals/new?request=${encodeURIComponent(r.id)}">Build a proposal</a></div>`).join("")}</div></section>` : ""}
      <section><h2 style="font:600 20px/1.3 var(--pl-font-text);margin:16px 0 4px">Your proposals</h2>${D.proposals.length ? `<div class="pb-list">${D.proposals.map((p) => `<div class="pb-row"><div><h3>${esc(p.brand || "Untitled")}${p.occasion ? ` <span style="font-weight:500;color:var(--pl-soft)">· ${esc(p.occasion)}</span>` : ""}</h3><p>${esc(STATUS[p.status] || p.status)}${p.answer?.tier ? `: ${esc(p.answer.tier)}` : ""} · ${esc(p.templateLabel)}</p>
        <p class="pb-counts">${p.sentAt ? `<span>${p.views} ${p.views === 1 ? "view" : "views"}</span><span>${p.answers.accept || 0} accepted</span><span>${p.answers.question || 0} questions</span><span>${p.answers.decline || 0} declined</span>` : `<span>${p.readiness}% ready</span>`}</p></div>
        <div class="pb-acts" style="display:flex;gap:8px;flex-wrap:wrap"><a class="pp-btn" href="/proposals/${p.id}/edit">${p.sentAt ? "Open" : "Keep going"}</a>${p.url ? `<a class="pp-btn quiet" href="${esc(p.url)}">See it as the brand</a>` : ""}</div></div>`).join("")}</div>` : `<p class="pb-lede">None yet. Your first one takes about five minutes.</p>`}</section>
      <section><h2 style="font:600 20px/1.3 var(--pl-font-text);margin:16px 0 4px">Start a new one</h2>${tplGrid(D.templates, "")}
      <form id="nf" class="pb-card" style="max-width:560px"><label class="pb-f"><span>Which brand is it for?</span><input name="brand" maxlength="120" placeholder="Fernlight" required autocomplete="organization"><small>Pitching a brand that hasn't asked yet? That works too.</small></label><input type="hidden" name="template" value="${esc(D.templates[0].id)}"><button class="pp-btn primary">Start the proposal</button></form></section>`;
    bindTpl(); $("#nf").onsubmit = async (e) => { e.preventDefault(); const f = e.target; try { const r = await api("/api/proposals", { template: f.template.value, brand: { name: f.brand.value } }); location.href = `/proposals/${r.id}/edit`; } catch (er) { toast(er.message); } }; }
  const tplGrid = (T, cur) => `<div class="pb-tpls" role="radiogroup" aria-label="Templates">${T.map((t, i) => `<div class="pb-tpl" role="radio" tabindex="0" data-tpl="${esc(t.id)}" aria-pressed="${t.id === cur || (!cur && i === 0)}" aria-checked="${t.id === cur || (!cur && i === 0)}"><b>${esc(t.label)}</b><span>${esc(t.line)}</span><span>Ideas: ${t.concepts.map(esc).join(", ")}</span>${t.example ? `<a href="${esc(t.example)}" target="_blank" rel="noopener">See an example from ${esc(t.exampleHost)}</a>` : ""}</div>`).join("")}</div>`;
  function bindTpl(onPick) { $$("[data-tpl]").forEach((b) => { const pick = (e) => { if (e.target.closest("a")) return; $$("[data-tpl]").forEach((x) => { x.setAttribute("aria-pressed", x === b); x.setAttribute("aria-checked", x === b); }); const h = $("#nf [name=template]"); if (h) h.value = b.dataset.tpl; onPick?.(b.dataset.tpl); }; b.onclick = pick; b.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(e); } }; }); }

  // ---------------------------------------------------------------- new from a request
  async function newPage() { const rid = q.get("request"); if (!rid) return listPage();
    main.innerHTML = `<p class="pb-lede" style="padding-top:24px">Filling in what I know…</p>`;
    try { const r = await api("/api/proposals", { requestId: rid }); location.replace(`/proposals/${r.id}/edit`); } catch (e) { fail(e); } }

  // ---------------------------------------------------------------- the editor
  let D = null, M = null, step = "start", saveT = 0, saving = null;
  const STEPS = [["start", "Who it's for"], ["cover", "Cover"], ["about", "About you"], ["proof", "Proof"], ["idea", "The idea"], ["plan", "The plan"], ["pricing", "Pricing"], ["terms", "Timeline and terms"], ["send", "Send"]];
  const SKIP = { about: "about", proof: "proof", idea: "idea", plan: "plan", pricing: "pricing" };
  const at = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
  const set = (o, p, v) => { const K = p.split("."); let a = o; K.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(K[i + 1]) ? [] : {}; a = a[k]; }); a[K.at(-1)] = v; };
  async function editPage(id) { try { D = await api(`/api/proposals/${encodeURIComponent(id)}`); } catch (e) { return fail(e); } M = JSON.parse(JSON.stringify({ brand: D.proposal.brand, sections: D.proposal.sections, template: D.proposal.template }));
    step = (location.hash.slice(1) && STEPS.some(([k]) => k === location.hash.slice(1))) ? location.hash.slice(1) : D.proposal.sentAt ? "send" : "start"; frame(); }
  function frame() {
    main.innerHTML = `<h1>${esc(M.brand.name ? `For ${M.brand.name}` : "New proposal")}</h1><p class="pb-lede">${D.request ? `Answering ${esc(D.request.company)}'s request for ${esc(D.request.pkgName)}.` : "A pitch to a brand. When they answer, it becomes a team booking."}</p>
      <div class="pb-edit"><div class="pb-form"><details class="pb-meter" id="meter"></details><nav class="pb-steps" id="steps" aria-label="Steps"></nav><div id="step"></div></div>
      <div class="pb-preview" id="pv"><div class="pb-prevhead"><h2>Live preview</h2><span style="display:flex;gap:4px"><a class="pb-mini" href="/api/proposals/${D.proposal.id}/pdf?pages=one" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">1-page PDF</a><a class="pb-mini" href="/api/proposals/${D.proposal.id}/pdf" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">Full PDF</a></span></div><div id="doc"></div></div></div>
      <a class="pp-btn pb-jump" href="#pv">Preview</a>`;
    chrome(); drawStep(); $("#doc").innerHTML = D.html; }
  function chrome() { const R = D.readiness;
    $("#meter").innerHTML = `<summary><span>Ready to send</span><span class="pb-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${R.pct}" aria-label="Ready to send"><i style="width:${R.pct}%"></i></span><span>${R.done} of ${R.of}</span></summary><ul class="pb-check">${R.items.map((i) => `<li class="${i.done ? "done" : ""}"><button type="button" data-go="${i.step}"><span class="box">${i.done ? "✓" : ""}</span><span>${esc(i.label)}</span></button></li>`).join("")}</ul>`;
    $("#steps").innerHTML = STEPS.map(([k, t]) => { const off = SKIP[k] && M.sections[SKIP[k]]?.on === false; return `<button type="button" data-go="${k}"${k === step ? ' aria-current="step"' : ""} class="${off ? "is-off" : ""}">${esc(t)}</button>`; }).join("");
    $$("[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go))); }
  function go(k) { step = k; history.replaceState(null, "", "#" + k); chrome(); drawStep(); $("#steps [aria-current]")?.scrollIntoView({ block: "nearest", inline: "center" }); $("#step").scrollIntoView({ block: "start", behavior: "smooth" }); }
  const tip = (t) => `<div class="pb-tip">${MARK}<p><b>Potto</b>${esc(t)}</p></div>`;
  const F = (p, label, o = {}) => { const v = at(M, p) ?? "", tag = o.area ? `<textarea data-p="${p}" maxlength="${o.max || 900}" rows="${o.rows || 4}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}>${esc(v)}</textarea>` : `<input data-p="${p}" type="${o.type || "text"}" value="${esc(v)}" maxlength="${o.max || 200}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ""}${o.min != null ? ` min="${o.min}"` : ""}>`;
    return `<label class="pb-f"><span>${esc(label)}</span>${tag}${o.help ? `<small>${esc(o.help)}</small>` : ""}</label>${o.area && o.rw !== false ? rw(p) : ""}`; };
  const rw = (p) => `<div class="pb-rw"><button type="button" data-rw="${p}" data-how="shorter">Make it shorter</button><button type="button" data-rw="${p}" data-how="warmer">Make it warmer</button></div>`;
  const LINES = (p, label, help) => `<label class="pb-f"><span>${esc(label)}</span><textarea data-lines="${p}" rows="4">${esc((at(M, p) || []).join("\n"))}</textarea><small>${esc(help || "One a line.")}</small></label>`;
  const MONEY = (p, label, help) => `<label class="pb-f"><span>${esc(label)}</span><input data-money="${p}" inputmode="decimal" value="${at(M, p) ? (at(M, p) / 100).toFixed(at(M, p) % 100 ? 2 : 0) : ""}" placeholder="0"><small>${esc(help || "In dollars.")}</small></label>`;
  const skip = (k) => `<label class="pb-skip"><input type="checkbox" data-on="sections.${k}.on"${M.sections[k].on !== false ? " checked" : ""}> Include this section</label>`;
  const nav = () => { const i = STEPS.findIndex(([k]) => k === step); return `<div class="pb-nav">${i > 0 ? `<button class="pp-btn quiet" type="button" data-go="${STEPS[i - 1][0]}">Back</button>` : "<span></span>"}${i < STEPS.length - 1 ? `<button class="pp-btn primary" type="button" data-go="${STEPS[i + 1][0]}">Next: ${esc(STEPS[i + 1][1])}</button>` : ""}</div>`; };

  function drawStep() { const S = M.sections, T = D.tips, el = $("#step"); let h = "";
    if (step === "start") { const r = D.request;
      h = `<h2>Who it's for</h2>${tip(T.start)}${r ? `<p class="pb-lede">From ${esc(r.company)}'s request: ${esc(r.pkgName)}, ${r.headcount} guests${r.date ? ", " + esc(day(r.date)) : ""}.${r.notes ? ` They said: “${esc(r.notes)}”` : ""}</p>` : ""}
        ${F("brand.name", "Brand", { ph: "Fernlight", max: 120 })}${F("brand.contact", "Their first name", { ph: "Sam", max: 60, help: "First name only. It's how the proposal greets them." })}${F("brand.occasion", "The occasion", { ph: "A thank-you night for our best customers", max: 120 })}
        <div class="pb-two">${F("brand.date", "Date", { type: "date" })}${F("brand.headcount", "Guests", { type: "number", min: 1 })}</div>${F("brand.brief", "Their brief, in their words", { area: true, max: 1200, rw: false, ph: "What they want guests to feel, and anything they asked for" })}
        <label class="pb-f"><span>Template</span><select data-tpl-sel>${(window.__TPL || []).map((t) => `<option value="${esc(t.id)}"${t.id === M.template ? " selected" : ""}>${esc(t.label)}</option>`).join("")}</select><small>Changing it keeps everything you've written. ${window.__TPL?.find((t) => t.id === M.template)?.example ? `<a href="${esc(window.__TPL.find((t) => t.id === M.template).example)}" target="_blank" rel="noopener">See an example proposal</a>` : ""}</small></label>`; }
    if (step === "cover") h = `<h2>Cover</h2>${tip(T.cover)}${F("sections.cover.title", "Title", { max: 120 })}${F("sections.cover.sub", "One line under it", { max: 160 })}<p class="pb-lede">Colours and logo come from <a href="/?app=1#brandkit">your brand kit</a>. No kit yet? It wears a clean Pottery Lab look.</p>`;
    if (step === "about") h = `<h2>About you</h2>${tip(T.about)}${skip("about")}${F("sections.about.text", "Your story, in a paragraph", { area: true, rows: 6 })}<div class="pb-rw"><button type="button" data-potto="about">Draft it again from my page</button></div>
      <p class="pb-f"><span style="font-weight:600">A photo</span></p>${D.host.photos.length ? `<div class="pb-photos">${D.host.photos.map((u) => `<button type="button" data-photo="${esc(u)}" aria-pressed="${S.about.photo === u}" aria-label="Use this photo"><img src="${esc(u)}" alt=""></button>`).join("")}<button type="button" data-photo="" aria-pressed="${!S.about.photo}" aria-label="No photo" style="font:600 14px var(--pl-font-text)">None</button></div>` : `<p class="pb-lede">Add a photo of you or your work to <a href="/?app=1">your page</a> and it shows up here. Brands look for a face.</p>`}`;
    if (step === "proof") { const P = D.proof;
      h = `<h2>Proof</h2>${tip(T.proof)}${skip("proof")}${P.stats.length ? `<p class="pb-f"><span style="font-weight:600">Your numbers on Pottery Lab</span></p><div>${P.stats.map((s) => `<label class="pb-stat"><input type="checkbox" data-hide="${esc(s.k)}"${(S.proof.hide || []).includes(s.k) ? "" : " checked"}><b>${esc(s.n)}</b><span>${esc(s.label)}</span></label>`).join("")}</div><p class="pp-src" style="margin:8px 0 14px"><span class="pp-ver">Verified by Pottery Lab</span> Counted from real events and replies. You choose which to show; you can't change them.</p>`
        : `<p class="pb-lede"><b>First brand partnership.</b> There aren't enough events on Pottery Lab yet to show numbers, so the proposal says this is your first one with a brand here. That's honest, and brands like being first.</p>`}
        ${P.quotes.length ? `<p class="pb-f"><span style="font-weight:600">Kudos from guests (pick up to 3)</span><small>Only from events on your page. Names show only for guests who let everyone see their name.</small></p>${P.quotes.map((k) => `<label class="pb-stat"><input type="checkbox" data-quote="${esc(k.id)}"${(S.proof.quotes || []).includes(k.id) ? " checked" : ""}><span>“${esc(k.text)}” <span style="color:var(--pl-soft)">${esc(k.name)}${k.event ? ", " + esc(k.event) : ""}</span></span></label>`).join("")}` : ""}
        <p class="pb-f" style="margin-top:16px"><span style="font-weight:600">What you've done off Pottery Lab <span class="pp-tag host">Host-provided</span></span><small>Past events, clients you can name, things you've run. Shown as yours, not checked by us.</small></p>
        <div class="pb-items" id="off">${(S.proof.offline || []).map((o, i) => `<div class="pb-item"><label class="pb-f"><span>What</span><input data-p="sections.proof.offline.${i}.what" value="${esc(o.what)}" maxlength="140" placeholder="Supper for a design studio's launch"></label><div class="pb-two"><label class="pb-f"><span>When</span><input data-p="sections.proof.offline.${i}.when" value="${esc(o.when)}" maxlength="40" placeholder="Spring 2025"></label><label class="pb-f"><span>How many</span><input data-p="sections.proof.offline.${i}.people" value="${esc(o.people)}" maxlength="40" placeholder="40 guests"></label></div><button class="pb-mini" type="button" data-del="sections.proof.offline.${i}">Remove</button></div>`).join("")}</div>
        <button class="pb-mini" type="button" data-add="offline">Add one</button>${F("sections.proof.note", "Anything else, in your words", { area: true, rows: 3, max: 400 })}`; }
    if (step === "idea") h = `<h2>The idea</h2>${tip(T.idea)}${skip("idea")}<div class="pb-rw"><button type="button" data-potto="concepts">Draft concepts for ${esc(M.brand.name || "this brand")}</button></div>
      <div class="pb-items">${(S.idea.concepts || []).map((c, i) => `<div class="pb-item"><label class="pb-skip"><input type="radio" name="pick" data-pick="${i}"${S.idea.pick === i ? " checked" : ""}> My pick</label>${F(`sections.idea.concepts.${i}.name`, "Name", { max: 80 })}${F(`sections.idea.concepts.${i}.line`, "One line", { max: 200 })}${F(`sections.idea.concepts.${i}.experience`, "What guests do", { area: true, rows: 3, max: 600 })}${F(`sections.idea.concepts.${i}.brand`, "How the brand shows up, tastefully", { area: true, rows: 2, max: 400 })}${S.idea.concepts.length > 1 ? `<button class="pb-mini" type="button" data-del="sections.idea.concepts.${i}">Remove this one</button>` : ""}</div>`).join("")}</div>${S.idea.concepts.length < 3 ? '<button class="pb-mini" type="button" data-add="concept">Add a concept</button>' : ""}`;
    if (step === "plan") h = `<h2>The plan</h2>${tip(T.plan)}${skip("plan")}<p class="pb-f"><span style="font-weight:600">Run of show</span></p><div class="pb-items">${S.plan.ros.map((r, i) => `<div class="pb-ros"><input data-p="sections.plan.ros.${i}.time" value="${esc(r.time)}" maxlength="20" aria-label="Time"><input data-p="sections.plan.ros.${i}.what" value="${esc(r.what)}" maxlength="160" aria-label="What happens"><button class="pb-x" type="button" data-del="sections.plan.ros.${i}" aria-label="Remove">×</button></div>`).join("")}</div><button class="pb-mini" type="button" data-add="ros">Add a row</button>
      <div style="height:14px"></div>${LINES("sections.plan.includes", "What's included")}${F("sections.plan.guests", "Guests", { type: "number", min: 1, help: "Totals are worked out for this many. Shown as an estimate." })}${LINES("sections.plan.venues", "Where it could happen", "One option a line.")}
      ${F("sections.plan.access", "Accessibility", { area: true, rows: 2, max: 400 })}${F("sections.plan.diets", "Food and dietary needs", { area: true, rows: 2, max: 400 })}
      <p class="pb-f"><span style="font-weight:600">How the brand shows up</span></p>${F("sections.plan.presence.signage", "Signage", { max: 200 })}${F("sections.plan.presence.sampling", "Product or sampling", { max: 200 })}${F("sections.plan.presence.photos", "Photos (always with guests' consent)", { max: 240 })}`;
    if (step === "pricing") { const G = D.guide;
      h = `<h2>Packages and pricing</h2>${tip(T.pricing)}${skip("pricing")}<div class="pb-guide"><h3>Pricing guide</h3>${G.own ? `<p>${esc(G.own.text)}</p>` : ""}${G.peers ? `<p>${esc(G.peers.text)}</p>` : `<p>${esc(G.start.text)}</p>`}<p style="color:var(--pl-soft)">Your price is yours. I never change it.</p></div>
        ${S.pricing.tiers.map((t, i) => `<div class="pb-item" style="margin-bottom:10px"><div class="pb-two">${F(`sections.pricing.tiers.${i}.name`, "Package", { max: 30 })}<label class="pb-f"><span>Priced</span><select data-p="sections.pricing.tiers.${i}.unit">${Object.entries(window.__UNITS || {}).map(([k, v]) => `<option value="${k}"${t.unit === k ? " selected" : ""}>${esc(v)}</option>`).join("")}</select></label></div>
          ${F(`sections.pricing.tiers.${i}.line`, "What it is", { max: 120 })}<div class="pb-two">${MONEY(`sections.pricing.tiers.${i}.cents`, "Price", D.totals[i] ? `${money(D.totals[i].totalCents)} total, ${money(D.totals[i].depositCents)} deposit` : "In dollars.")}${MONEY(`sections.pricing.tiers.${i}.minimumCents`, "Group minimum", "Optional.")}</div>
          ${t.unit === "hour" ? F(`sections.pricing.tiers.${i}.minUnits`, "Hours", { type: "number", min: 1 }) : t.unit === "table" || t.unit === "staff-day" ? F(`sections.pricing.tiers.${i}.perUnitGuests`, t.unit === "table" ? "Guests a table" : "Guests for each staffer", { type: "number", min: 1 }) : ""}
          ${LINES(`sections.pricing.tiers.${i}.includes`, "Includes")}<p class="pb-f" style="margin:0 0 6px"><span style="font-weight:600">Add-ons</span><small>Ticked ones are in the total. The rest show as optional.</small></p>
          ${(t.addOns || []).map((a, j) => `<div class="pb-ros" style="grid-template-columns:1fr 90px 44px;margin-bottom:6px"><input data-p="sections.pricing.tiers.${i}.addOns.${j}.name" value="${esc(a.name)}" aria-label="Add-on"><input data-money="sections.pricing.tiers.${i}.addOns.${j}.cents" value="${a.cents ? (a.cents / 100).toFixed(a.cents % 100 ? 2 : 0) : ""}" inputmode="decimal" aria-label="Price in dollars"><button class="pb-x" type="button" data-del="sections.pricing.tiers.${i}.addOns.${j}" aria-label="Remove">×</button></div><div style="display:flex;gap:14px;margin:0 0 8px;flex-wrap:wrap"><label class="pb-skip" style="margin:0"><input type="checkbox" data-bool="sections.pricing.tiers.${i}.addOns.${j}.on"${a.on ? " checked" : ""}> In the total</label><label class="pb-skip" style="margin:0"><input type="checkbox" data-flat="sections.pricing.tiers.${i}.addOns.${j}.per"${a.per === "flat" ? " checked" : ""}> One price, not a person</label></div>`).join("")}
          <button class="pb-mini" type="button" data-add="addon" data-i="${i}">Add an add-on</button></div>`).join("")}
        <div class="pb-two"><label class="pb-f"><span>Your pick</span><select data-num="sections.pricing.recommend">${S.pricing.tiers.map((t, i) => `<option value="${i}"${S.pricing.recommend === i ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label><label class="pb-f"><span>Deposit</span><select data-num="sections.pricing.depositPct">${[25, 30, 50, 100].map((n) => `<option value="${n}"${S.pricing.depositPct === n ? " selected" : ""}>${n}% when they accept</option>`).join("")}</select></label></div>
        ${LINES("sections.pricing.notIncluded", "Not included")}`; }
    if (step === "terms") h = `<h2>Timeline and terms</h2>${tip(T.terms)}<label class="pb-skip"><input type="checkbox" data-on="sections.timeline.on"${S.timeline.on !== false ? " checked" : ""}> Include the timeline</label>
      <div class="pb-items">${S.timeline.steps.map((s, i) => `<div class="pb-ros" style="grid-template-columns:120px 1fr 44px"><input data-p="sections.timeline.steps.${i}.when" value="${esc(s.when)}" maxlength="40" aria-label="When"><input data-p="sections.timeline.steps.${i}.what" value="${esc(s.what)}" maxlength="160" aria-label="What happens"><button class="pb-x" type="button" data-del="sections.timeline.steps.${i}" aria-label="Remove">×</button></div>`).join("")}</div><button class="pb-mini" type="button" data-add="step">Add a step</button>
      <div style="height:16px"></div><label class="pb-f"><span>Cancellation</span><select data-p="sections.terms.policy">${Object.entries(window.__POL || {}).map(([k, v]) => `<option value="${k}"${S.terms.policy === k ? " selected" : ""}>${esc(v)}</option>`).join("")}</select><small>The brand sees the full terms in plain words, the same ones as team bookings.</small></label>
      ${F("sections.terms.usage", "Using the photos", { area: true, rows: 3, max: 500 })}${F("sections.terms.insurance", "Insurance (a question to confirm, not legal advice)", { area: true, rows: 2, max: 300 })}${F("sections.terms.extra", "Anything else", { area: true, rows: 2, max: 500 })}`;
    if (step === "send") { const P = D.proposal, R = D.readiness;
      h = `<h2>Send</h2>${tip(T.send)}<p class="pb-f"><span style="font-weight:600">The one next step</span></p>${[["accept", "Accept and pay the deposit"], ["question", "Ask a question"], ["call", "Book a call"]].map(([k, t]) => `<label class="pb-skip"><input type="radio" name="primary" data-primary="${k}"${M.sections.next.primary === k ? " checked" : ""}> ${t}</label>`).join("")}
        ${M.sections.next.primary === "call" ? F("sections.next.callUrl", "Your booking link (https://)", { type: "url", max: 300, ph: "https://cal.example/you" }) : ""}<label class="pb-skip"><input type="checkbox" data-bool="sections.next.question"${M.sections.next.question !== false ? " checked" : ""}> Let them ask a question too</label>
        ${P.token ? `<div class="pb-sent"><b>${P.status === "accepted" ? `Accepted${P.answer?.tier ? ": " + esc(P.answer.tier) : ""}.` : P.status === "declined" ? "They passed this time." : P.status === "question" ? "They asked a question. Reply in Team requests." : "Sent."}</b><input readonly value="${esc(location.origin + D.url)}" aria-label="Proposal link" onclick="this.select()"><div class="pb-counts"><span>${P.views?.n || 0} ${(P.views?.n || 0) === 1 ? "view" : "views"}</span><span>${P.answers?.accept || 0} accepted</span><span>${P.answers?.question || 0} questions</span><span>${P.answers?.decline || 0} declined</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="pp-btn" type="button" id="copy">Copy link</button><a class="pp-btn quiet" href="${esc(D.url)}" target="_blank" rel="noopener">See it as the brand</a><a class="pp-btn quiet" href="${esc(D.url)}/pdf?pages=one">1-page PDF</a><a class="pp-btn quiet" href="${esc(D.url)}/pdf">Full PDF</a></div></div>` : ""}
        ${!P.token && D.request ? `<label class="pb-f"><span>A note with it, in ${esc(D.request.company)}'s thread</span><textarea id="note" maxlength="400" rows="3" placeholder="Thanks for thinking of me. Here's what I'd do."></textarea></label>` : ""}
        ${R.ready ? "" : `<p class="pb-lede">${R.of - R.done} ${R.of - R.done === 1 ? "thing" : "things"} left on the checklist. You can still send it.</p>`}
        <button class="pp-btn primary" type="button" id="send" style="width:100%">${P.token ? "Save changes to the link" : D.request ? `Send to ${esc(D.request.company)}` : "Make the link"}</button>
        <p class="pb-lede" style="margin-top:10px">${D.request ? "It goes into their request thread, and they get a note." : "You get a private link and a PDF to send. Only people with the link can open it, and search engines can't."}</p>`; }
    el.innerHTML = `<div class="pb-card">${h}${nav()}</div>`; bindStep(el); }

  // ---------------------------------------------------------------- editing
  function bindStep(el) {
    el.addEventListener("input", (e) => { const t = e.target;
      if (t.dataset.p) { set(M, t.dataset.p, t.type === "number" ? +t.value : t.value); queue(); }
      else if (t.dataset.lines) { set(M, t.dataset.lines, t.value.split("\n").map((s) => s.trim()).filter(Boolean)); queue(); }
      else if (t.dataset.money) { set(M, t.dataset.money, Math.round((parseFloat(t.value.replace(/[^\d.]/g, "")) || 0) * 100)); queue(); } });
    el.addEventListener("change", (e) => { const t = e.target;
      if (t.dataset.on) { set(M, t.dataset.on, t.checked); chrome(); queue(0); }
      else if (t.dataset.bool) { set(M, t.dataset.bool, t.checked); queue(0); }
      else if (t.dataset.flat) { set(M, t.dataset.flat, t.checked ? "flat" : "person"); queue(0); }
      else if (t.dataset.num) { set(M, t.dataset.num, +t.value); queue(0); }
      else if (t.dataset.hide) { const H = new Set(M.sections.proof.hide || []); t.checked ? H.delete(t.dataset.hide) : H.add(t.dataset.hide); M.sections.proof.hide = [...H]; queue(0); }
      else if (t.dataset.quote) { let Q = (M.sections.proof.quotes || []).filter((x) => x !== t.dataset.quote); if (t.checked) Q.push(t.dataset.quote); if (Q.length > 3) { Q = Q.slice(-3); toast("Three quotes at most."); } M.sections.proof.quotes = Q; queue(0).then(drawStep); }
      else if (t.dataset.pick) { M.sections.idea.pick = +t.dataset.pick; queue(0); }
      else if (t.dataset.primary) { M.sections.next.primary = t.dataset.primary; if (t.dataset.primary === "call" && !M.sections.next.callUrl) { drawStep(); return; } queue(0).then(drawStep); }
      else if (t.matches("[data-tpl-sel]")) { M.template = t.value; queue(0).then(() => toast("Template changed. Your words stay.")); }
      else if (t.dataset.p && t.tagName === "SELECT") { if (/\.unit$/.test(t.dataset.p)) queue(0).then(drawStep); } });
    el.addEventListener("click", async (e) => { const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.rw) { const p = b.dataset.rw, cur = at(M, p) || ""; if (!cur.trim()) return toast("Write something first."); b.disabled = true; try { const r = await api("/api/proposals/rewrite", { text: cur, how: b.dataset.how }); set(M, p, r.text); const ta = $(`[data-p="${p}"]`, el); if (ta) ta.value = r.text; await queue(0); toast(b.dataset.how === "shorter" ? "Shorter. Undo by typing over it." : "Warmer. Make it yours."); } catch (er) { toast(er.message); } b.disabled = false; return; }
      if (b.dataset.potto) { b.disabled = true; b.textContent = "Potto is drafting…"; try { const r = await api(`/api/proposals/${D.proposal.id}/potto`, { what: b.dataset.potto }); if (b.dataset.potto === "about") M.sections.about.text = r.text; else { M.sections.idea.concepts = r.concepts; M.sections.idea.pick = 0; } await queue(0); drawStep(); toast("Drafted. Edit anything."); } catch (er) { toast(er.message); b.disabled = false; } return; }
      if (b.dataset.photo != null) { M.sections.about.photo = b.dataset.photo; await queue(0); drawStep(); return; }
      if (b.dataset.del) { const K = b.dataset.del.split("."), i = +K.pop(), A = at(M, K.join(".")); A.splice(i, 1); await queue(0); drawStep(); return; }
      if (b.dataset.add) { const a = b.dataset.add, S = M.sections;
        if (a === "offline") S.proof.offline = [...(S.proof.offline || []), { what: "", when: "", people: "" }];
        if (a === "concept") S.idea.concepts.push({ name: "", line: "", experience: "", brand: "" });
        if (a === "ros") S.plan.ros.push({ time: "", what: "" }); if (a === "step") S.timeline.steps.push({ when: "", what: "" });
        if (a === "addon") S.pricing.tiers[+b.dataset.i].addOns = [...(S.pricing.tiers[+b.dataset.i].addOns || []), { name: "Add-on", cents: 0, per: "person", on: false }];
        drawStep(); if (a !== "offline" && a !== "concept") queue(); return; }
      if (b.id === "copy") { try { await navigator.clipboard.writeText(location.origin + D.url); toast("Link copied."); } catch { $("[aria-label='Proposal link']").select(); } return; }
      if (b.id === "send") { b.disabled = true; try { await queue(0); const r = await api(`/api/proposals/${D.proposal.id}/send`, { note: $("#note")?.value || "" }); D = await api(`/api/proposals/${D.proposal.id}`); toast(r.posted ? "Sent. It's in their thread." : "Your link is ready."); chrome(); drawStep(); $("#doc").innerHTML = D.html; } catch (er) { toast(er.message); b.disabled = false; } } });
  }
  function queue(ms = 450) { clearTimeout(saveT); return new Promise((ok) => { saveT = setTimeout(async () => { try { saving = api(`/api/proposals/${D.proposal.id}`, { brand: M.brand, sections: M.sections, template: M.template }, "PUT"); const r = await saving; D = { ...D, ...r }; $("#doc").innerHTML = D.html; chrome();
      if (step === "pricing") $$("[data-money$='.cents']").forEach((inp) => { const m = /tiers\.(\d+)\.cents$/.exec(inp.dataset.money); const t = m && D.totals[+m[1]]; const sm = inp.parentElement.querySelector("small"); if (t && sm) sm.textContent = `${money(t.totalCents)} total, ${money(t.depositCents)} deposit`; });
      const h1 = $("h1", main); if (h1) h1.textContent = M.brand.name ? `For ${M.brand.name}` : "New proposal"; } catch (e) { toast(e.message); } ok(); }, ms); }); }

  (async () => { try { const T = await api("/api/proposals/templates"); window.__TPL = T.templates; window.__UNITS = T.units; window.__POL = T.policies; } catch {}
    const m = /^\/proposals\/([a-f0-9]{8,24})\/edit$/.exec(path);
    if (m) editPage(m[1]); else if (path === "/proposals/new") newPage(); else listPage(); })();
})();
</script></body></html>
