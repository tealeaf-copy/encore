<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What kind of guest are you? · Pottery Lab</title>
<meta name="description" content="A 30-second quiz: find your Pottery Lab guest type, the get-togethers you light up at, and who you click with. Share it with your friends.">
<meta property="og:title" content="What kind of guest are you?"><meta property="og:description" content="Take the 30-second Pottery Lab quiz and find your guest type.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFF8EE;--ink:#1F1A17;--smoke:#6B5F56;--ember:#C94A30;--butter:#FFE08A;--pink:#FFCAD6;--sky:#C4DEFF;--lilac:#DCCBFF;--mint:#E3F1DD}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
a{color:inherit}.wrap{max-width:640px;margin:0 auto;padding:0 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.brand{display:flex;gap:8px;align-items:center;font:700 22px Fredoka,system-ui;text-decoration:none}
h1,h2,h3{font-family:Fredoka,system-ui;margin:0}h1{font-size:clamp(34px,7vw,52px);line-height:1.05}
.card{background:#fff;border:2px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 20px;font:600 16px "Instrument Sans",system-ui;text-decoration:none;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}.btn.primary{background:var(--ember);color:#fff}.btn.quiet{background:#fff!important;color:var(--ink)!important}
.bar{height:10px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:14px 0 18px}.bar i{display:block;height:100%;background:var(--butter);transition:width .25s}
.q h2{font-size:26px;margin:0 0 14px}.opts{display:grid;gap:10px}.opts button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;border:2px solid var(--ink);border-radius:16px;background:#fff;font-weight:600;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}.opts button:hover{transform:translate(-1px,-1px);background:#FFF6DE}.opts button .e{font-size:26px}
.res{text-align:center}.res .big{font-size:96px;line-height:1;margin:6px 0}.res h2{font-size:clamp(34px,7vw,48px)}.res .line{font-size:18px;color:#3A302A;max-width:460px;margin:8px auto 0}
.facts{display:grid;gap:10px;margin:20px 0;text-align:left}.fact{display:flex;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--ink);background:#FFFBF5}.fact .e{font-size:24px}.fact b{display:block}.fact small{color:var(--smoke)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}.note{color:var(--smoke);font-size:14px}
.friend{margin:0 0 16px;padding:12px 16px;border-radius:16px;background:var(--butter);border:2px solid var(--ink);font-weight:600;text-align:center}
</style><link rel="stylesheet" href="/playful.css"></head><body>
<div class="wrap">
  <header class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 3.2h8.8" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/></svg>pottery lab</a><a href="/discover" style="font-weight:600;text-decoration:none">What's on</a></header>
  <main id="m"></main>
</div>
<script src="/authguard.js"></script><script>
(function () {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  // the same types the rest of Pottery Lab uses
  const T = {
    host: { name: "The Host", emoji: "🏡", line: "Usually the one who makes it happen.", bg: "#FFE08A", thrive: "Small dinners you plan yourself", match: "connector", why: "Connectors fill your table." },
    spark: { name: "The Spark", emoji: "⚡", line: "Brings the energy. Things get louder when they arrive.", bg: "#FFCAD6", thrive: "Game nights, karaoke, anything with a bit of chaos", match: "chill", why: "The Chill One keeps you grounded." },
    chill: { name: "The Chill One", emoji: "🧘", line: "Easy company. Happy on the couch or the trail.", bg: "#C4DEFF", thrive: "Slow mornings, picnics, long walks with coffee", match: "spark", why: "Sparks drag you to the good stuff." },
    filler: { name: "The Seat Filler", emoji: "🪑", line: "Says yes at the last minute when a spot opens up. Every host's favourite.", bg: "#E3F1DD", thrive: "Spontaneous plans and 'anyone free tonight?'", match: "host", why: "Hosts always have a spot for you." },
    early: { name: "The Early Bird", emoji: "🐣", line: "Says yes first. Their yes gets everyone else moving.", bg: "#FFE08A", thrive: "Run clubs and anything that starts before 10am", match: "filler", why: "You say yes first; they fill the last seat." },
    connector: { name: "The Connector", emoji: "🔗", line: "Never comes alone. Brings the friend who needed this.", bg: "#DCCBFF", thrive: "Mixers, supper clubs, anything with new faces", match: "host", why: "Hosts love the people you bring." },
    contributor: { name: "The Contributor", emoji: "🧺", line: "Brings snacks, a dish, a speaker, the folding table.", bg: "#FFCAD6", thrive: "Potlucks, cooking nights, picnics", match: "spark", why: "Sparks make your snacks a party." },
    helper: { name: "The Helper", emoji: "🙌", line: "Stays to wash up and stack the chairs.", bg: "#E3F1DD", thrive: "Dinners at someone's place, community days", match: "host", why: "Every host needs one of you." },
  };
  const LANES = { move: ["🏃", "getting out and moving: runs, hikes, rides", "move", "Run clubs, sunrise hikes, the coffee after"], make: ["🍰", "making and tasting things", "make", "Dumpling nights, bake-offs, potlucks"], gather: ["☕", "long dinners and good talk", "gather", "Supper clubs, wine nights, brunch that runs late"], discover: ["🧭", "trying somewhere new", "discover", "Markets, gallery walks, a neighbourhood you've never been to"] };
  const Q = [
    ["lane", "A perfect Saturday is…", [["move", "🏃", "A run, then coffee"], ["make", "🥟", "Cooking something with friends"], ["gather", "🍷", "A long dinner that turns into 1am"], ["discover", "🧭", "A neighbourhood I've never been to"]]],
    ["rsvp", "Someone texts 'who's in?' You…", [["first", "🐣", "Reply YES before finishing the message"], ["planner", "📅", "Check my week, then commit"], ["last", "🪑", "Say maybe, then show up anyway"]]],
    ["room", "At a get-together you're the one who…", [["spark", "⚡", "Gets everyone going"], ["chill", "🧘", "Keeps it easy"], ["helper", "🙌", "Ends up doing the dishes"]]],
    ["bring", "You never arrive without…", [["food", "🧺", "Something to share"], ["friend", "🔗", "A plus-one"], ["self", "😊", "Just me and good vibes"]]],
    ["host", "How often are you the one who plans it?", [["often", "🏡", "It's usually me"], ["sometimes", "🔁", "Now and then"], ["rarely", "🙋", "I'd rather be invited"]]],
    ["size", "Your ideal number of people is…", [["small", "🫖", "4 to 6, real conversation"], ["mid", "🍕", "8 to 12, a proper crew"], ["big", "🎉", "The more the merrier"]]],
  ];
  const A = {}; let i = 0;
  const score = () => { const S = { host: 0, spark: 0, chill: 0, filler: 0, early: 0, connector: 0, contributor: 0, helper: 0 };
    S.host += A.host === "often" ? 3 : A.host === "sometimes" ? 1 : 0; if (A.room) S[A.room] += 3; if (A.rsvp === "first") S.early += 2.5; if (A.rsvp === "last") S.filler += 2.5; if (A.bring === "friend") S.connector += 2.5; if (A.bring === "food") S.contributor += 2.5; if (A.size === "big") { S.spark += 1; S.connector += 1; } if (A.size === "small") { S.chill += 1; S.host += .5; }
    const ranked = Object.entries(S).sort((a, b) => b[1] - a[1]); return { top: ranked[0][0], second: ranked[1][0] }; };
  const m = document.getElementById("m"), params = new URLSearchParams(location.search), shared = params.get("t"), from = (params.get("from") || "").slice(0, 30);
  function intro() { const t = T[shared];
    m.innerHTML = `${t ? `<div class="friend">${from ? esc(from) + " is" : "Your friend is"} ${esc(t.name)} ${t.emoji}. What are you?</div>` : ""}<div class="card"><p class="note" style="margin:0 0 6px">30 seconds · 6 taps · no sign-up</p><h1>What kind of guest are you?</h1><p style="font-size:18px;color:#3A302A">Find your Pottery Lab type, the get-togethers you light up at, and who you click with. Then send it to your group chat and see who's who.</p><button class="btn primary" id="go" style="margin-top:8px">Start the quiz</button></div>`;
    document.getElementById("go").onclick = () => { i = 0; ask(); }; }
  function ask() { const [k, q, opts] = Q[i];
    m.innerHTML = `<div class="card q"><small class="note">${i + 1} of ${Q.length}</small><div class="bar"><i style="width:${(i / Q.length) * 100}%"></i></div><h2>${esc(q)}</h2><div class="opts">${opts.map(([v, e, t]) => `<button data-v="${v}"><span class="e">${e}</span>${esc(t)}</button>`).join("")}</div></div>`;
    m.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => { A[k] = b.dataset.v; i++; i < Q.length ? ask() : result(); })); }
  function result() { const { top, second } = score(), t = T[top], s = T[second], lane = LANES[A.lane] || LANES.gather, mt = T[t.match];
    try { localStorage.setItem("encore.guestType", JSON.stringify({ top, second, lane: A.lane, size: A.size, at: Date.now() })); } catch {}
    const shareUrl = `${location.origin}/quiz?t=${top}`;
    m.innerHTML = `<div class="card res" style="background:${t.bg}"><small class="note" style="color:#3A302A">You're</small><div class="big">${t.emoji}</div><h2>${esc(t.name)}</h2><p class="line">${esc(t.line)}</p></div>
      <div class="facts"><div class="fact"><span class="e">${lane[0]}</span><div><b>You light up ${lane[2] === "move" ? "on the move" : "at " + esc(lane[1])}</b><small>${esc(lane[3])}. As ${esc(t.name.replace(/^The /, "a "))}, you fit right in at ${esc(lane[1].split(":")[0])}.</small></div></div>
      <div class="fact"><span class="e">${s.emoji}</span><div><b>With a streak of ${esc(s.name)}</b><small>${esc(s.line)}</small></div></div>
      <div class="fact"><span class="e">${mt.emoji}</span><div><b>You click with ${esc(mt.name)}</b><small>${esc(t.why)}</small></div></div>
      <div class="fact"><span class="e">${A.size === "small" ? "🫖" : A.size === "big" ? "🎉" : "🍕"}</span><div><b>Your table: ${A.size === "small" ? "4 to 6 people" : A.size === "big" ? "the more the merrier" : "8 to 12, a proper crew"}</b><small>Pip uses this to pick events for you.</small></div></div></div>
      <div class="acts"><a class="btn primary" href="/discover?lane=${lane[2]}">See events for ${esc(t.name.replace(/^The /, ""))}s</a><button class="btn quiet" id="story">📸 Share to your story</button><button class="btn quiet" id="send">💬 Send to friends</button></div>
      <p class="note" style="text-align:center;margin-top:16px" id="save"></p><p class="note" style="text-align:center"><a href="#" id="again">Take it again</a></p>`;
    document.getElementById("again").onclick = (e) => { e.preventDefault(); Object.keys(A).forEach((k) => delete A[k]); i = 0; ask(); };
    document.getElementById("send").onclick = async () => { const text = `I'm ${t.name} ${t.emoji} on Pottery Lab. What kind of guest are you?`; try { if (navigator.share) { await navigator.share({ title: "What kind of guest are you?", text, url: shareUrl }); return; } } catch { return; } try { await navigator.clipboard.writeText(`${text} ${shareUrl}`); } catch {} toast("Copied. Paste it in your group chat."); };
    document.getElementById("story").onclick = () => storyShare(t, lane, shareUrl);
    // signed in? keep it on your Pottery Lab profile
    fetch("/api/me/profile/self", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ host: A.host, rsvp: A.rsvp, room: A.room, bring: A.bring }) }).then((r) => { document.getElementById("save").innerHTML = r.ok ? "Saved to your Pottery Lab profile. Hosts see it next to your name in Who's coming." : `Want hosts to see it? It saves when you RSVP to your next event, or <a href="/discover">find one now</a>.`; }).catch(() => {}); }
  function toast(t) { let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#1F1A17;color:#fff;padding:10px 16px;border-radius:14px;z-index:40;max-width:90vw;font-size:14px"; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 3500); }
  async function storyShare(t, lane, url) { const W = 1080, H = 1920, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d"); try { await document.fonts?.load?.("700 80px Fredoka"); } catch {}
    x.fillStyle = "#FFF8EE"; x.fillRect(0, 0, W, H); const px = 90, py = 240, pw = W - 180, ph = 1150; x.fillStyle = "#1F1A17"; x.beginPath(); x.roundRect(px + 18, py + 18, pw, ph, 64); x.fill(); x.fillStyle = t.bg; x.beginPath(); x.roundRect(px, py, pw, ph, 64); x.fill(); x.lineWidth = 8; x.strokeStyle = "#1F1A17"; x.stroke();
    x.textAlign = "center"; x.fillStyle = "#1F1A17"; x.font = "700 56px Fredoka, system-ui"; x.fillText("MY GUEST TYPE IS", W / 2, py + 130);
    x.font = "320px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"; x.fillText(t.emoji, W / 2, py + 520);
    x.font = "700 104px Fredoka, system-ui"; x.fillText(t.name, W / 2, py + 720); x.font = "500 46px 'Instrument Sans', system-ui"; x.fillStyle = "#3A302A";
    const wrap = (s, y) => { const w = s.split(" "); let l = "", n = 0; for (const word of w) { const tt = l ? l + " " + word : word; if (x.measureText(tt).width > pw - 140 && l) { x.fillText(l, W / 2, y + n * 60); n++; l = word; } else l = tt; } x.fillText(l, W / 2, y + n * 60); return n + 1; };
    let y = py + 810; y += wrap(t.line, y) * 60 + 30; x.font = "600 46px 'Instrument Sans', system-ui"; wrap(`${lane[0]} Lights up at ${lane[1]}`, y);
    x.fillStyle = "#1F1A17"; x.font = "700 76px Fredoka, system-ui"; x.fillText("What's yours?", W / 2, py + ph + 190); x.font = "500 46px 'Instrument Sans', system-ui"; x.fillStyle = "#5E534B"; x.fillText("Take the quiz: link in my story", W / 2, py + ph + 270);
    x.save(); x.translate(W/2-215,H-186); x.scale(2.5,2.5); x.lineWidth=1.6; x.lineJoin="round"; x.fillStyle="#C4532F"; x.strokeStyle="#1F1A17"; const vp=new Path2D("M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z"); x.fill(vp); x.stroke(vp); x.strokeStyle="#F2D48F"; x.lineWidth=2.2; x.lineCap="round"; x.stroke(new Path2D("M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1")); x.restore(); x.fillStyle = "#1F1A17"; x.textAlign = "left"; x.font = "700 64px Fredoka, system-ui"; x.fillText("pottery lab",W/2-130,H-118);
    const blob = await new Promise((r) => c.toBlob(r, "image/png")), file = new File([blob], "my-encore-type.png", { type: "image/png" }); try { await navigator.clipboard.writeText(url); } catch {}
    try { if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: t.name }); toast("Pick Instagram, then add a link sticker: the quiz link is copied."); return; } } catch (e) { if (e?.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "my-encore-type.png"; document.body.appendChild(a); a.click(); a.remove(); toast("Image saved. In Instagram: Story → pick it → add a link sticker (the quiz link is copied)."); }
  intro();
})();
</script>
<script src="/shell.js"></script>
</body></html>
