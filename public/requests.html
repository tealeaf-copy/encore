<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your requests · Pottery Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/community.css">
<style>
.rq{display:grid;gap:12px;margin:14px 0 28px}
.rq a.rq-i{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--card);text-decoration:none;color:var(--ink)}
.rq-av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--pink)}
.rq-i b{display:block;font-size:16px}.rq-i small{display:block;color:var(--soft);font-size:13.5px;margin-top:2px}
.rq-st{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;border:2px solid #1F1A17}
.st-requested{background:#FFE08A}.st-quoted{background:#C4DEFF}.st-deposit{background:#DCCBFF}.st-booked,.st-going,.st-accepted{background:#BDEBCB}.st-declined,.st-no,.st-cancelled{background:#F3EDE5;color:#6F6259}.st-new,.st-waiting{background:#FFE08A}
.rq-bar{display:flex;gap:4px;margin-top:8px}.rq-bar i{flex:1;height:5px;border-radius:3px;background:#EFE6D8}.rq-bar i.on{background:#E2573A}
.rq-new{font-size:12px;font-weight:700;color:#fff;background:#E2573A;border-radius:999px;padding:2px 8px;margin-left:6px}
h2.sec{font-size:22px;margin:22px 0 4px}.muted{color:var(--soft)}
.empty{padding:20px;border-radius:20px;background:var(--card);color:var(--soft)}
@media (max-width:520px){.rq a.rq-i{grid-template-columns:44px 1fr}.rq-st{grid-column:2;justify-self:start}}
</style><link rel="stylesheet" href="/playful.css">
</head><body>
<div class="wrap">
  <header class="top"><a class="brand" href="/discover">pottery lab</a>
    <nav><a href="/discover">Discover</a><a href="/plans">Your plans</a><a href="/requests" aria-current="page">Requests</a><a href="/feed">Feed</a><a class="cta" href="/signup?mode=friends">Start your page</a></nav></header>
  <main>
    <h1 style="font-size:clamp(32px,6vw,48px);margin-top:18px">Your requests</h1>
    <p class="muted" style="max-width:560px">Everything you've asked for, with where it stands. Tap one to see the details, the quote or the messages.</p>
    <div id="out"><p class="empty">Loading…</p></div>
  </main>
</div>
<script src="/authguard.js"></script><script src="/eventart.js"></script><script src="/community.js"></script>
<script>
(async function () {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const ago = (t) => { if (!t) return ""; const d = Math.round((Date.now() - t) / 864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };
  const STAGES = ["requested", "quoted", "deposit", "booked"], LABEL = { requested: "Waiting for a quote", quoted: "Quote ready", deposit: "Deposit due", booked: "Booked", declined: "Not this time", cancelled: "Cancelled" };
  const J = async (u) => { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch { return null; } };
  const [B, Co, me] = await Promise.all([J("/api/me/requests"), J("/api/collabs"), J("/api/me")]);
  // spots asked for at approval-only events, remembered on this device
  const spots = []; try { for (const k of Object.keys(localStorage).filter((x) => x.startsWith("encore-rsvp-"))) { const M = JSON.parse(localStorage.getItem(k) || "null"), id = k.slice(12); if (!M?.rid || !M.code) continue; spots.push({ id, M }); } } catch {}
  const spotRows = (await Promise.all(spots.map(async ({ id, M }) => { const s = await J(`/api/public/rsvp-status/${encodeURIComponent(id)}?rid=${encodeURIComponent(M.rid)}&code=${encodeURIComponent(M.code)}`); const c = await J(`/api/public/cards?ids=${encodeURIComponent(id)}`); return { id, M, s, card: c?.cards?.[id] }; }))).filter((x) => x.s && ["requested", "going", "no", "waitlist"].includes(x.s.response) && (x.M.response === "requested" || x.s.decidedAt));
  let h = "";
  const bk = B?.requests || [];
  h += `<h2 class="sec">Bookings with hosts</h2>`;
  h += bk.length ? `<div class="rq">${bk.map((r) => { const st = r.status || "requested", i = STAGES.indexOf(st); return `<a class="rq-i" href="${esc(r.link)}"><span class="rq-av">${esc(r.host?.emoji || "💼")}</span><span><b>${esc(r.experience || "A booking")}${r.unread ? `<span class="rq-new">${r.unread} new</span>` : ""}</b><small>with ${esc(r.host?.name || "a host")}${r.people ? ` · ${r.people} people` : ""}${r.when ? ` · ${esc(r.when)}` : ""} · asked ${ago(r.at)}</small>${i >= 0 ? `<span class="rq-bar">${STAGES.map((x, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</span>` : ""}</span><span class="rq-st st-${esc(st)}">${esc(LABEL[st] || st)}</span></a>`; }).join("")}</div>`
    : (() => { let L = []; try { L = JSON.parse(localStorage.getItem("encore.bookings") || "[]"); } catch {} return L.length ? `<div class="rq">${L.map((x) => `<a class="rq-i" href="${esc(x.link)}"><span class="rq-av">💼</span><span><b>${esc(x.title || "A booking request")}</b><small>${x.when ? esc(x.when) + " · " : ""}asked ${ago(x.at)}</small></span><span class="rq-st st-${esc(x.status || "requested")}">${esc({ requested: "Requested", quoted: "Quote ready", booked: "Booked", done: "Done", declined: "Declined" }[x.status] || "See status")}</span></a>`).join("")}</div><p class="muted" style="font-size:13px"><a href="/results">See your results</a> · Saved on this device. <a href="/login?next=/requests">Sign in</a> to see them anywhere.</p>` : `<p class="empty">${B ? `No bookings yet. <a href="/hosts/book">Find a host for your team</a>.` : `No bookings on this device yet. <a href="/hosts/book">Find a host</a>, or <a href="/login?next=/requests">sign in</a> to see yours.`}</p>`; })();
  const sent = Co?.sent || [], inc = Co?.incoming || [];
  if (sent.length || inc.length) { h += `<h2 class="sec">Collabs</h2><div class="rq">${[...inc.map((c) => ({ ...c, dir: "in" })), ...sent.map((c) => ({ ...c, dir: "out" }))].map((c) => `<a class="rq-i" href="${c.dir === "in" ? "/?collabs=1" : `/@${esc(c.other?.handle || "")}`}"><span class="rq-av">🤝</span><span><b>${c.dir === "in" ? `${esc(c.other?.name || "A host")} wants to collab` : `You asked ${esc(c.other?.name || "a host")} to collab`}</b><small>${esc(String(c.idea || "").slice(0, 90))}${c.at ? ` · ${ago(c.at)}` : ""}</small></span><span class="rq-st st-${esc(c.status || "new")}">${esc(c.status === "accepted" ? "It's a yes" : c.status === "declined" ? "Passed" : c.dir === "in" ? "Needs your reply" : "Waiting")}</span></a>`).join("")}</div>`; }
  if (spotRows.length) { h += `<h2 class="sec">Spots you asked for</h2><div class="rq">${spotRows.map(({ id, s, card }) => `<a class="rq-i" href="/g#rsvp-${encodeURIComponent(id)}"><span class="rq-av">${esc(card?.emoji || "🎟")}</span><span><b>${esc(card?.title || "An event")}</b><small>${esc(card?.date || "")}${card?.city ? ` · ${esc(card.city)}` : ""}</small></span><span class="rq-st st-${s.response === "going" ? "going" : s.response === "no" ? "no" : "requested"}">${s.response === "going" ? "You're in" : s.response === "no" ? "Not this time" : "Waiting for the host"}</span></a>`).join("")}</div>`; }
  document.getElementById("out").innerHTML = h;
})();
</script>
<script src="/nav.js"></script>
<script src="/shell.js"></script>
</body></html>
