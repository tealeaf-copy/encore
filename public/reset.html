<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your password · Encore</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px "DM Sans",system-ui,sans-serif;background:#FAF7F2;color:#2B211C}
  form,.done{background:#fff;padding:30px;border-radius:18px;border:1px solid #E9E1D6;box-shadow:0 1px 2px rgba(43,33,28,.05),0 18px 40px -24px rgba(43,33,28,.3);width:min(380px,calc(100vw - 32px));box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:8px;font:700 20px Fredoka,system-ui;margin-bottom:18px;text-decoration:none;color:inherit}
  h1{margin:0 0 4px;font:600 24px Fredoka,system-ui}.sub{margin:0 0 18px;color:#75685F;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
  input,button{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border-radius:12px}
  input{border:1px solid #E9E1D6;margin:6px 0 0;background:#fff;font-weight:400}input:focus{outline:2px solid #E8C3B5;outline-offset:1px}
  button{border:0;background:#C2553A;color:#fff;font-weight:600;cursor:pointer;margin-top:6px}button:disabled{opacity:.6}
  .err{color:#A93A3A;margin:8px 0 0;font-size:13px}.err:empty{display:none}.ok{color:#1E4D36;background:#F1FAF4;border:1px solid #CFE6D7;border-radius:12px;padding:10px 12px;font-size:14px}
  a.alt{display:block;margin-top:14px;text-align:center;color:#A9462E;font-size:13px;text-decoration:none}
</style></head><body>
<div id="app"></div>
<script>
(function () { const app = document.getElementById("app"), token = new URLSearchParams(location.search).get("token") || "";
  const brand = `<a class="brand" href="/"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#C2553A"/><circle cx="19" cy="9" r="3.2" fill="#E9C98C"/></svg>encore</a>`;
  const post = async (u, b) => { const r = await fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || "That didn't work. Try again."); return j; };
  if (location.pathname === "/reset" && token) {
    app.innerHTML = `<form id="f">${brand}<h1>Choose a new password</h1><p class="sub">At least 8 characters. You'll be signed in, and signed out everywhere else.</p>
      <label>New password<input name="pw" type="password" autocomplete="new-password" minlength="8" required autofocus></label><label>Type it again<input name="pw2" type="password" autocomplete="new-password" minlength="8" required></label>
      <button>Save and sign in</button><p class="err" id="e"></p><a class="alt" href="/forgot">Need a new link?</a></form>`;
    document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault(); const F = ev.target, e = document.getElementById("e"); e.textContent = ""; if (F.pw.value !== F.pw2.value) { e.textContent = "The two passwords don't match."; return; }
      F.querySelector("button").disabled = true; try { await post("/api/password/reset", { token, password: F.pw.value }); location.replace("/?app=1"); } catch (x) { e.textContent = x.message; F.querySelector("button").disabled = false; } };
  } else {
    app.innerHTML = `<form id="f">${brand}<h1>Forgot your password?</h1><p class="sub">Enter the email you sign in with and we'll send a link to choose a new one.</p>
      <label>Email<input name="email" type="email" autocomplete="email" required autofocus></label><button>Send the reset link</button><p class="err" id="e"></p><a class="alt" href="/login">Back to sign in</a></form>`;
    try { const v = sessionStorage.getItem("encore.loginEmail"); if (v) document.querySelector("[name=email]").value = v; } catch {}
    document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault(); const F = ev.target, e = document.getElementById("e"); e.textContent = ""; F.querySelector("button").disabled = true;
      try { const j = await post("/api/password/forgot", { email: F.email.value }); app.innerHTML = `<div class="done">${brand}<h1>Check your email</h1><p class="ok">${j.message}</p><p class="sub" style="margin-top:12px">Nothing there after a few minutes? Check spam, or <a href="/forgot">try again</a>. If you sign in with SSO, reset through your company instead.</p><a class="alt" href="/login">Back to sign in</a></div>`; } catch (x) { e.textContent = x.message; F.querySelector("button").disabled = false; } };
  } })();
</script></body></html>
