<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campaign results · Pottery Lab</title><meta name="description" content="What your team events, client dinners and gifts on Pottery Lab did: who came, what they thought, cost a guest and the outcomes you recorded.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/playful.css">
<style>:root{--paper:var(--pl-page);--ink:var(--pl-ink);--smoke:var(--pl-soft);--ember:var(--pl-accent);--line:var(--pl-line);--linen:#F3EADC}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 70px}header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}header.top nav{display:flex;gap:14px}header.top nav a{text-decoration:none;color:var(--smoke)}.brand{display:flex;gap:8px;align-items:center;font:700 22px var(--sys-display);text-decoration:none}
h1{font:700 clamp(30px,5vw,44px)/1.1 var(--sys-display);margin:14px 0 6px}h2{font:600 20px var(--pl-font-text);margin:26px 0 8px}.lede{color:var(--smoke);margin:0 0 16px;max-width:680px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tiles div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.tiles b{display:block;font:600 30px var(--sys-display);line-height:1.1}.tiles span{display:block;font-weight:600;font-size:14px;margin-top:2px}.tiles small{display:block;color:var(--smoke);font-size:12.5px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #F0E7DA;white-space:nowrap}th{font-size:12.5px;color:var(--smoke);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.next{background:#F1FAF4;border:1px solid #CFE6D7;border-radius:16px;padding:14px 16px;margin-top:14px;color:#1E4D36}.next a{font-weight:600}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--ember);vertical-align:middle;margin-right:6px}
.btn{display:inline-block;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;text-decoration:none}.m{color:var(--smoke);font-size:13.5px}@media (max-width:640px){.tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}.tw tr:first-child{display:none}.tw tr{padding:10px 12px;border-bottom:1px solid #F0E7DA}.tw td{border:0;padding:3px 0;text-align:left!important;white-space:normal}.tw td[data-l]::before{content:attr(data-l) ": ";color:var(--smoke);font-size:12.5px}.tw td[data-l]:first-child::before{content:none}}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--smoke)}</style></head><body>
<div class="wrap"><header class="top"><a class="brand" href="/"><svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg>pottery lab</a><nav><a href="/teams">Team events</a><a href="/gifts">Gifts</a><a href="/team">Team space</a></nav></header>
<h1>Your results</h1><p class="lede">Every team event, client dinner and gift you've booked on Pottery Lab: who came, what they thought, what it cost a guest, and the outcomes you recorded.</p>
<div id="main"><p class="m">Loading…</p></div></div>
<script src="/authguard.js"></script><script src="/shell.js" defer></script>
<script>
(async function () { const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]), money = (n) => "$" + Math.round(n || 0).toLocaleString();
  const GOALS = { pipeline: "Pipeline", retention: "Retention", awareness: "Awareness", morale: "Team morale", hiring: "Hiring", community: "Community" };
  let L = []; try { L = JSON.parse(localStorage.getItem("encore.bookings") || "[]"); } catch {}
  const B = L.map((x) => { const u = new URL(x.link, location.origin), t = u.searchParams.get("t"), m = u.pathname.match(/^\/booking\/([A-Za-z0-9]+)/); return m && t ? { id: m[1], t, link: x.link } : null; }).filter(Boolean);
  const rows = (await Promise.all(B.map((b) => fetch(`/api/public/booking/${encodeURIComponent(b.id)}/results?t=${encodeURIComponent(b.t)}`).then((r) => (r.ok ? r.json() : null)).then((r) => (r ? { ...r, link: b.link } : null)).catch(() => null)))).filter(Boolean).filter((r) => r.status !== "declined" && r.approval?.state !== "declined");
  { const ids = new Set(rows.map((r) => (r.link || "").split("/").pop().split("?")[0])); for (const r of rows) if (r.partOfId && ids.has(r.partOfId)) { const p = rows.find((x) => (x.link || "").includes("/booking/" + r.partOfId + "?")); if (p) { p.cost = (p.cost || 0) + (r.cost || 0); p.costPer = p.cost && (p.past ? p.came : p.invited) ? Math.round(p.cost / (p.past ? p.came : p.invited)) : p.costPer; r.__folded = true; } } } for (let i = rows.length - 1; i >= 0; i--) if (rows[i].__folded) rows.splice(i, 1);
  let TEAM = null; try { TEAM = JSON.parse(localStorage.getItem("encore.team") || "null"); } catch {}
  if (TEAM?.id) { const tj = await fetch(`/api/public/bteam/${TEAM.id}?k=${encodeURIComponent(TEAM.k)}`).then((r) => (r.ok ? r.json() : null)).catch(() => null); if (tj) { const seen = new Set(rows.map((r) => r.link.split("?")[0])); for (const r of tj.rows) if (!seen.has(r.link.split("?")[0]) && r.status !== "declined" && !(r.partOfId && tj.rows.some((p) => p.id === r.partOfId))) rows.push(r.eventCost ? { ...r, cost: r.eventCost } : r); document.querySelector(".lede").textContent = `Results for ${tj.name}: every booking your team has made on Pottery Lab, plus any on this device.`; } }
  if (!rows.length) { $("#main").innerHTML = `<div class="empty"><b>Nothing to measure yet.</b> Book a <a href="/teams">team event</a> or order <a href="/gifts">gifts</a>. Each booking gets a guest page, and its results show here after the day. Results stay on this device, so open your booking links here, or <a href="/login?next=/results">sign in</a>.</div>`; return; }
  const isBooked = (r) => ["booked", "done"].includes(r.status), done = rows.filter((r) => r.status === "done" || (r.past && isBooked(r))), spend = rows.filter(isBooked).reduce((a, r) => a + (r.cost || 0), 0), asked = rows.filter((r) => !isBooked(r)).reduce((a, r) => a + (r.cost || 0), 0), people = done.reduce((a, r) => a + (r.came || 0), 0), rated = done.filter((r) => r.againPct != null), ratings = rated.reduce((a, r) => a + r.ratings, 0);
  const again = ratings ? Math.round(rated.reduce((a, r) => a + r.againPct * r.ratings, 0) / ratings) : null, meet = rows.reduce((a, r) => a + (r.campaign?.meetings || 0), 0), pipe = rows.reduce((a, r) => a + (r.campaign?.pipeline || 0), 0), doneSpend = done.reduce((a, r) => a + (r.cost || 0), 0);
  const show = done.filter((r) => r.showRate != null), going = show.reduce((a, r) => a + r.going, 0), cameAll = show.reduce((a, r) => a + r.came, 0);
  const tiles = [[rows.length, rows.length === 1 ? "request" : "requests", `${done.length} done, ${rows.filter(isBooked).length - done.length} booked ahead, ${rows.filter((r) => !isBooked(r)).length} open requests`], [money(spend), "booked", asked ? `plus ${money(asked)} in open requests` : "accepted quotes"], [people, "people came", going ? `${Math.round((100 * cameAll) / going)}% of those who were in` : ""], [people ? money(doneSpend / people) : "Not yet", "a guest", "on events that happened"], [again != null ? again + "%" : "Not yet", "would go again", ratings ? `${ratings} guest ratings` : "no ratings yet"]];
  const pipeSpend = rows.filter((r) => r.campaign?.pipeline).reduce((a, r) => a + (r.cost || 0), 0); if (pipe) tiles.push([money(pipe), "pipeline", pipeSpend ? `${(pipe / pipeSpend).toFixed(1)}× what those events cost` : ""]); else if (meet) tiles.push([meet, "meetings booked", people ? `${Math.round((100 * meet) / people)}% of guests` : ""]);
  // by campaign
  const C = new Map(); for (const r of rows) { const k = r.campaign?.name || "No campaign"; const c = C.get(k) || { name: k, goal: r.campaign?.goal || "", n: 0, spend: 0, came: 0, target: 0, again: 0, ratings: 0, meetings: 0, pipeline: 0 }; c.n++; if (["booked", "done"].includes(r.status)) c.spend += r.cost || 0; c.came += r.came || 0; c.target += r.campaign?.target || 0; if (r.againPct != null) { c.again += r.againPct * r.ratings; c.ratings += r.ratings; } c.meetings += r.campaign?.meetings || 0; c.pipeline += r.campaign?.pipeline || 0; C.set(k, c); }
  const camps = [...C.values()].sort((a, b) => b.spend - a.spend);
  const best = rated.filter((r) => r.ratings >= 3).sort((a, b) => b.againPct - a.againPct || (a.costPer || 1e9) - (b.costPer || 1e9))[0];
  $("#main").innerHTML = `<div class="tiles">${tiles.map(([v, l, s]) => `<div><b>${v}</b><span>${esc(l)}</span>${s ? `<small>${esc(s)}</small>` : ""}</div>`).join("")}</div>
    ${best ? `<div class="next">Best so far: <b>${esc(best.title)}</b> with ${esc(best.host)}: ${best.againPct}% would go again${best.costPer ? `, ${money(best.costPer)} a person` : ""}. <a href="${esc(best.link)}">Book it again</a> or <a href="/teams">try a different format</a>.</div>` : ""}
    <h2>By campaign</h2><div class="tw"><table><tr><th>Campaign</th><th>Goal</th><th class="n">Requests</th><th class="n">Booked spend</th><th class="n">Came</th><th class="n">vs target</th><th class="n">A guest</th><th class="n">Would go again</th><th class="n">Meetings</th><th class="n">Pipeline</th></tr>
      ${camps.map((c) => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(GOALS[c.goal] || "")}</td><td class="n">${c.n}</td><td class="n">${money(c.spend)}</td><td class="n">${c.came || "Not yet"}</td><td class="n">${c.target && c.came ? Math.round((100 * c.came) / c.target) + "%" : "Not yet"}</td><td class="n">${c.came ? money(c.spend / c.came) : "Not yet"}</td><td class="n">${c.ratings ? `<span class="bar" style="width:${Math.round(c.again / c.ratings / 2)}px"></span>${Math.round(c.again / c.ratings)}%` : "Not yet"}</td><td class="n">${c.meetings || "Not yet"}</td><td class="n">${c.pipeline ? money(c.pipeline) : "Not yet"}</td></tr>`).join("")}</table></div>
    <h2>Every booking</h2><div class="tw"><table><tr><th>What</th><th>With</th><th>Date</th><th>Campaign</th><th class="n">Came</th><th class="n">Show rate</th><th class="n">Would go again</th><th class="n">A guest</th><th class="n">Cost</th></tr>
      ${rows.sort((a, b) => String(b.date).localeCompare(String(a.date))).map((r) => `<tr><td><a href="${esc(r.link)}">${esc(r.title || (r.kind === "gift" ? "Gift order" : "Booking"))}</a></td><td>${esc(r.host)}</td><td>${esc(r.date ? new Date(r.date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "")}${r.past ? "" : r.kind === "gift" ? "" : " · upcoming"}</td><td>${esc(r.campaign?.name || "")}</td><td class="n">${r.past ? r.came : r.going ? `${r.going} yes` : "Not yet"}</td><td class="n">${r.showRate != null ? r.showRate + "%" : "Not yet"}</td><td class="n">${r.againPct != null ? r.againPct + "%" : "Not yet"}</td><td class="n">${r.costPer ? money(r.costPer) : "Not yet"}</td><td class="n">${r.cost ? money(r.cost) : "Not yet"}</td></tr>`).join("")}</table></div>
    <p style="margin-top:14px"><button class="btn" id="csv" type="button">Download CSV</button> <span class="m">Add a campaign name and outcomes on each booking's page. Guests' ratings are counted, never shown by name.</span></p>`;
  document.querySelectorAll(".tw table").forEach((t) => { const H = [...t.querySelectorAll("tr:first-child th")].map((th) => th.textContent); t.querySelectorAll("tr").forEach((tr, i) => { if (i) [...tr.children].forEach((td, j) => td.setAttribute("data-l", H[j] || "")); }); });
  $("#csv").onclick = () => { const H = ["title", "host", "date", "campaign", "goal", "kind", "said_yes", "came", "show_rate", "would_go_again", "ratings", "cost", "cost_per_attendee", "meetings", "opportunities", "pipeline"], q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = [H.join(","), ...rows.map((r) => [r.title, r.host, r.date, r.campaign?.name, r.campaign?.goal, r.kind, r.going, r.came, r.showRate, r.againPct, r.ratings, r.cost, r.costPer, r.campaign?.meetings, r.campaign?.opps, r.campaign?.pipeline].map(q).join(","))].join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "encore-results.csv"; a.click(); };
})();
</script></body></html>
