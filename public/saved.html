<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/authguard.js"></script>
<title>Saved · Pottery Lab</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lists.css">
<style>
:root{--paper:#F7F1E8;--ink:#1F1A17;--smoke:#665A51;--ember:#C94A30;--butter:#F2D48F;--line:#E4D9C8}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
a{color:inherit}
h2{font:600 var(--fs-20-28,20px)/1.2 var(--sys-display);margin:32px 0 12px}
/* signed out: one calm card that says saves live on this phone, and one way to keep them */
.keep{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;background:#FFFCF7;border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;margin:0 0 24px}
.keep b{font:600 18px var(--sys-title)}.keep p{margin:2px 0 0;color:var(--smoke);font-size:14px}.keep .ls-btn{margin-left:auto}
@media (max-width:520px){.keep .ls-btn{width:100%;margin-left:0}}
/* boards: a calm card with four thumbnails in a grid, the board's name and its count */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:24px 16px}
@media (max-width:640px){.boards{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.board{display:flex;flex-direction:column;text-align:left;background:#FFFCF7;border:1.5px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;color:inherit;font:inherit;transition:border-color .2s}
@media (hover:hover){.board:hover{border-color:#D9CCBB}}
.collage{position:relative;aspect-ratio:3/2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#EFE6D8;overflow:hidden}
.collage .t{position:relative;overflow:hidden;background:#EFE6D8}.collage .t:only-child{grid-column:1/-1;grid-row:1/-1}
.collage .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.collage .t .ea-cover .ea-txt{display:none}.collage .t .av{position:absolute;inset:0;display:grid;place-items:center;font-size:28px}
.collage .empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;color:var(--smoke);font-size:14px;text-align:center;padding:16px}
.board .nm{font:600 17px/1.25 var(--sys-title);margin:12px 14px 0;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.board .ct{color:var(--smoke);font-size:13px;margin:2px 14px 14px;display:block}
.board.new{border-style:dashed;border-color:#D9CCBB;background:transparent;justify-content:center;align-items:center;min-height:120px}.board.new .nm{margin:0;font-size:16px}.board.new .ct{margin:4px 14px 0}
.items .ls-media .ea-cover .ea-txt{display:none}.items .ls-media .av{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
.ls-menu select{width:100%;min-height:44px;border:1.5px solid #D9CCBB;border-radius:12px;background:#fff;font:inherit;font-size:15px;padding:0 10px;margin:4px 0}
.ls-menu label{display:block;padding:6px 12px 0;font-size:13px;color:var(--smoke)}
.back{display:inline-flex;align-items:center;background:none;border:0;font:600 15px "Instrument Sans",system-ui;color:#B04A30;cursor:pointer;padding:0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.bh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:8px 0 20px}.bh h2{margin:0;font:600 var(--fs-28-40,28px)/1.1 var(--sys-display)}.bh span{color:var(--smoke);font-size:14px}.bh .ls-btn{margin-left:auto}
.wk{display:grid;gap:10px;max-width:680px}
#scene{margin:0 0 8px}
</style><script src="/mascot.js"></script><script src="/eventart.js"></script></head><body>
<main class="ls-wrap" id="m">
  <section class="ls-head"><div><h1>Your <em>saves</em></h1><p class="ls-what" id="lede">Events, ideas and hosts you saved with the heart. Tap a board to see what's in it.</p></div></section>
  <div id="keep"></div>
  <div id="view"></div>
  <section id="weekend" hidden><h2>This weekend near you</h2><div class="wk" id="wk"></div></section>
  <div id="scene" hidden style="margin-top:34px"></div>
</main>
<script src="/save.js"></script><script src="/interests.js"></script><script src="/passport.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const signed = /(?:^|;\s*)encore_in=1/.test(document.cookie), hash = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  const safeImg = (u) => (/^\/_blob\/[A-Za-z0-9]{6,40}$/.test(u || "") || /^\/presets\/[A-Za-z0-9_.-]{1,80}$/.test(u || "") ? u : "");
  const safeUrl = (u) => (/^\/[A-Za-z0-9@_\-./#?=&%]*$/.test(u || "") && !/^\/\//.test(u) ? u : "");
  let data = { items: [], boards: [] }, open = null;
  const thumb = (i) => { const im = safeImg(i.img); if (im) return `<img src="${esc(im)}" alt="" loading="lazy">`; if (i.kind === "host") return `<span class="av">${esc(i.emoji || "🙂")}</span>`;
    return window.EventArt ? EventArt.cover({ id: i.ref, title: i.title, activity: i.art?.activity || "", coverArt: i.art?.kind ? { kind: i.art.kind, ...(i.art.tone ? { tone: i.art.tone } : {}) } : null }) : ""; };
  const KIND = { event: (i) => (i.status === "past" ? "Past event" : "Event"), idea: () => "Idea", host: () => "Host" };
  function collage(L) { const t = L.slice(0, 4); if (!t.length) return `<div class="collage"><span class="empty">Nothing here yet</span></div>`;
    return `<div class="collage">${t.map((i, k) => `<span class="t t${k + 1}">${thumb(i)}</span>`).join("")}</div>`; }
  function boardsView() { const all = data.items, loose = all.filter((i) => !i.board);
    if (!all.length) return `<div class="ls-empty"><b>Nothing saved yet.</b><p>Tap the heart on an event, an idea or a host (it's under More on a card) and it lands here.</p><a class="ls-btn primary" href="/ideas">Look at ideas</a><a class="ls-link" href="/discover">Or find an event</a></div>`;
    const B = [{ id: "", name: "All saves", list: all }, ...data.boards.map((b) => ({ ...b, list: all.filter((i) => i.board === b.id) }))];
    return `<div class="boards">${B.map((b, k) => `<button type="button" class="board" data-board="${esc(b.id)}">${collage(b.list)}<span class="nm">${esc(b.name)}</span><span class="ct">${b.list.length} ${b.list.length === 1 ? "save" : "saves"}</span></button>`).join("")}
      ${signed ? `<button type="button" class="board new" id="newBoard"><span class="nm">New board</span><span class="ct">e.g. Birthday ideas</span></button>` : ""}</div>`; }
  function itemCard(i) { const url = safeUrl(i.url) || (i.kind === "idea" ? "/ideas#" + i.ref : i.kind === "event" ? "/e/" + i.ref : "/@" + i.ref), title = i.title || (i.kind === "host" ? "@" + i.ref : "Saved");
    const meta = [i.example ? "<b>Example</b>" : "", esc((KIND[i.kind] || (() => ""))(i))].filter(Boolean).join(" · ");
    const move = signed && data.boards.length ? `<label for="mv-${esc(i.ref)}">Board</label><select id="mv-${esc(i.ref)}" data-move="${esc(i.kind)}:${esc(i.ref)}"><option value="">No board</option>${data.boards.map((b) => `<option value="${esc(b.id)}"${b.id === i.board ? " selected" : ""}>${esc(b.name)}</option>`).join("")}</select>` : "";
    const go = i.kind === "idea" ? `<button type="button" class="ls-btn primary" data-host-idea="${esc(i.ref)}">Host this</button>` : `<a class="ls-btn primary" href="${esc(url)}">${i.kind === "host" ? "See their page" : "See the event"}</a>`;
    return `<article class="ls-card"><div class="ls-media">${thumb(i)}</div><div class="ls-body">${meta ? `<p class="ls-meta">${meta}</p>` : ""}<a class="ls-title" href="${esc(url)}">${esc(title)}</a>${i.line ? `<p class="ls-sub">${esc(i.line)}</p>` : ""}${i.gone ? `<p class="ls-sub">This isn't on Pottery Lab any more.</p>` : ""}
      <div class="ls-acts">${go}<details class="ls-more"><summary aria-label="More for ${esc(title)}"><span aria-hidden="true"></span></summary><div class="ls-menu">${PLSave.button({ kind: i.kind, ref: i.ref, title: i.title, img: i.img })}${move}</div></details></div></div></article>`; }
  function boardView(id) { const b = id ? data.boards.find((x) => x.id === id) : { id: "", name: "All saves" }; if (!b) { open = null; return draw(); } const L = id ? data.items.filter((i) => i.board === id) : data.items;
    return `<button type="button" class="back" id="back">Back to all boards</button><div class="bh"><h2>${esc(b.name)}</h2><span>${L.length} ${L.length === 1 ? "save" : "saves"}</span>${id ? `<button type="button" class="ls-btn" id="dropB">Delete board</button>` : ""}</div>
      ${L.length ? `<div class="items ls-grid">${L.map((i) => itemCard(i)).join("")}</div>` : `<div class="ls-empty"><b>This board is empty.</b><p>Open a save in All saves, tap More, and pick this board.</p></div>`}`; }
  function draw() { $("#view").innerHTML = open === null ? boardsView() : boardView(open);
    document.querySelectorAll("[data-board]").forEach((b) => (b.onclick = () => { open = b.dataset.board; location.hash = open ? "board-" + open : "all"; draw(); $("#view").scrollIntoView({ block: "start" }); }));
    $("#back") && ($("#back").onclick = () => { open = null; history.replaceState(null, "", location.pathname); draw(); });
    $("#newBoard") && ($("#newBoard").onclick = async () => { const name = prompt("Name your board", "Birthday ideas"); if (!name) return; await fetch("/api/me/boards", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) }); await load(); });
    $("#dropB") && ($("#dropB").onclick = async () => { if (!confirm("Delete this board? The saves stay in All saves.")) return; await fetch("/api/me/boards/" + encodeURIComponent(open), { method: "DELETE", credentials: "same-origin" }); open = null; await load(); });
    document.querySelectorAll("[data-move]").forEach((s) => (s.onchange = async () => { const [kind, ...r] = s.dataset.move.split(":"); await fetch("/api/me/saves", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind, ref: r.join(":"), board: s.value }) }); await load(); }));
    document.querySelectorAll("[data-host-idea]").forEach((b) => (b.onclick = () => { const id = b.dataset.hostIdea; try { localStorage.setItem("pl.hostIdea", JSON.stringify({ id, at: Date.now() })); } catch {} location.href = signed ? "/?app=1&idea=" + encodeURIComponent(id) : "/signup?mode=friends&from=idea&idea=" + encodeURIComponent(id); })); }
  async function load() { if (signed) { const r = await fetch("/api/me/saves", { credentials: "same-origin" }).catch(() => null); if (r?.ok) data = await r.json(); }
    else { const L = PLSave.local(); data = { boards: [], items: L.map((i) => ({ ...i, line: "", status: "" })) };
      $("#keep").innerHTML = L.length ? `<div class="keep"><div><b>${L.length} ${L.length === 1 ? "save" : "saves"} on this phone</b><p>Make a free account to keep them, sort them into boards and hear before a saved event.</p></div><a class="ls-btn primary" href="/signup?mode=friends&amp;from=saves">Make a free account</a></div>` : ""; }
    const m = /^#board-([A-Za-z0-9]+)$/.exec(location.hash); if (m && open === null) open = m[1]; draw(); }
  PLSave.on(() => load());
  window.addEventListener("focus", () => { if (signed) load(); });
  (async () => { await PLSave.ready; await load();
    if (signed) PLPassport.mount($("#scene"));
    // this weekend, from what you're into and what you saved
    const me = await PLInterests.get(), saved = data.items.filter((i) => i.kind === "event").map((i) => i.ref);
    if (me.interests?.length || me.city || saved.length) { const q = `interests=${encodeURIComponent((me.interests || []).join(","))}&city=${encodeURIComponent(me.city || "")}&saved=${encodeURIComponent(saved.join(","))}`;
      const W = await (await fetch("/api/public/suggest/weekend?" + q)).json().catch(() => ({ events: [] })); if (W.events?.length) { PLInterests.css(); $("#wk").innerHTML = W.events.map(PLInterests.eventCard).join(""); $("#weekend").hidden = false; if (location.hash === "#weekend") $("#weekend").scrollIntoView(); } } })();
})();
</script>
<script src="/lists.js"></script><script src="/nav.js"></script><script src="/shell.js"></script>
</body></html>
