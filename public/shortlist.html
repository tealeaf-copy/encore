<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team vote · Pottery Lab</title><meta name="description" content="Local hosts for your team. Vote for your favorite.">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/playful.css">
<style>:root{--paper:var(--pl-page);--ink:var(--pl-ink);--smoke:var(--pl-soft);--ember:var(--pl-accent);--line:var(--pl-line)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 70px}header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.brand{display:flex;gap:8px;align-items:center;font:700 22px var(--sys-display);text-decoration:none}
h1{font:700 clamp(28px,5vw,40px)/1.1 var(--sys-display);margin:14px 0 6px}.lede{color:var(--smoke);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:14px}@media (max-width:640px){.card{grid-template-columns:1fr}}
.card h3{font:600 20px var(--pl-font-text);margin:0}.who{color:var(--smoke);font-size:14px;margin:2px 0 6px}.card p{margin:4px 0;font-size:14.5px}.price{text-align:right;min-width:170px}@media (max-width:640px){.price{text-align:left}}.price b{display:block;font:700 26px var(--sys-display)}.price small{display:block;color:var(--smoke)}
.vote{margin-top:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-weight:600;font-size:14.5px;font-family:inherit;cursor:pointer}.vote[aria-pressed=true]{background:var(--ink);color:#fff}.bar{height:8px;border-radius:6px;background:#EFE5D6;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ember)}
.btn{display:inline-block;margin-top:8px;padding:9px 16px;border-radius:999px;background:var(--ember);color:#fff;text-decoration:none;font-weight:600;font-size:14.5px}.me{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;margin:6px 0 4px}.me input{padding:8px 11px;border:1px solid var(--pl-line-strong);border-radius:10px;font:inherit}.m{color:var(--smoke);font-size:13.5px}</style></head><body>
<div class="wrap"><header class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true" fill="currentColor"><path d="M10 4.2h8M11.1 4.2v1.7c0 1.2-.9 1.8-.9 2.9 0 1.3-5.5 3.2-5.5 8.9 0 4.5 4.1 7.3 9.3 7.3s9.3-2.8 9.3-7.3c0-5.7-5.5-7.6-5.5-8.9 0-1.1-.9-1.7-.9-2.9V4.2M12.7 19.2c.8.55 1.8.55 2.6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="11.3" cy="16.4" r="1"/><circle cx="16.7" cy="16.4" r="1"/></svg>pottery lab</a></header>
<div id="main"><p class="m">Loading the vote…</p></div></div>
<script src="/authguard.js"></script><script src="/shell.js" defer></script>
<script>
(async function () { const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const id = location.pathname.split("/").pop(), key = "encore.vote." + id; let mine = ""; try { mine = localStorage.getItem(key) || ""; } catch {}
  const r = await fetch("/api/public/teams/saved/" + encodeURIComponent(id)); const d = await r.json(); if (!r.ok) { $("#main").innerHTML = `<h1>This vote has gone</h1><p class="lede">${esc(d.message || "")} <a href="/teams">Start a new one</a>.</p>`; return; }
  // examples are never bookable: drop any an older shortlist saved (new ones hold real hosts only)
  try { const hs = [...new Set(d.results.map((x) => x.host.handle))].join(","), T = hs ? (await (await fetch("/api/public/hosts/trust?handles=" + encodeURIComponent(hs))).json()).hosts || {} : {}; d.results = d.results.filter((x) => !x.example && !T[String(x.host.handle).toLowerCase()]?.example); } catch {}
  if (!d.results.length) { $("#main").innerHTML = `<h1>Nothing to vote on</h1><p class="lede">These hosts aren't bookable. <a href="/teams?${new URLSearchParams(d.query || {})}">See today's matches</a>.</p>`; return; }
  const q = d.query || {}, when = new Date(d.at).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const draw = () => { const v = d.votes || {}, tot = d.results.reduce((a, x) => a + (v[x.experience.id] || 0), 0);
    $("#main").innerHTML = `<h1>Which one are we doing?</h1><p class="lede">${d.by ? `${esc(d.by)} picked ` : "Here are "}${d.results.length === 1 ? "one option" : `${d.results.length} options`}${q.people ? ` for ${q.people} guests` : ""}${q.city ? ` in ${esc(q.city)}` : ""}. Vote for one. Everyone sees the tally.</p>
      <div class="me">Your name <input id="nm" maxlength="40" value="${esc((() => { try { return localStorage.getItem("encore.teamName") || ""; } catch { return ""; } })())}" placeholder="e.g. Sam" required></div>
      ${d.results.map((x) => { const e = x.experience, h = x.host, n = v[e.id] || 0; return `<div class="card"><div><h3>${esc(e.emoji || "✨")} ${esc(e.name)}</h3><div class="who">with ${esc(h.name)}${h.city ? ` · ${esc([h.hood, h.city].filter(Boolean).join(", "))}` : ""} · ${e.min > 1 ? `${e.min}–${e.max}` : `Up to ${e.max}`} guests${e.length ? ` · ${esc(e.length)}` : ""}</div>${e.desc ? `<p>${esc(e.desc)}</p>` : ""}${e.instant && (e.openDates || []).length ? `<p class="m">⚡ Books instantly on ${e.openDates.slice(0, 3).map((d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })).join(", ")}</p>` : ""}${[e.access && "♿ " + e.access, e.dietary && "🥗 " + e.dietary, e.hybrid && "💻 " + e.hybrid].filter(Boolean).map((t) => `<p class="m">${esc(t)}</p>`).join("")}
        <button class="vote" data-v="${esc(e.id)}" aria-pressed="${mine === e.id}">${mine === e.id ? "✓ Your pick" : "Vote"}</button><div class="bar"><i style="width:${tot ? Math.round((100 * n) / tot) : 0}%"></i></div><small class="m">${n} ${n === 1 ? "vote" : "votes"}${(d.voters || []).filter((p) => p.pick === e.id).length ? ": " + d.voters.filter((p) => p.pick === e.id).map((p) => esc(p.name)).join(", ") : ""}</small></div>
        <div class="price">${x.estimate ? `<b>$${x.estimate.total.toLocaleString()}</b><small>${x.estimate.flat ? "flat" : `Estimated total for ${q.people} · $${x.estimate.perPerson} a person`}</small>` : `<b>${esc(!e.price || /^quote/i.test(String(e.price).trim()) ? "To be quoted" : e.price)}</b>`}<a class="btn" href="/@${esc(h.handle)}?${new URLSearchParams({ exp: e.id, people: q.people || "", city: q.city || "" })}#book">Request a date</a></div></div>`; }).join("")}
      ${tot ? (() => { const S2 = d.results.slice().sort((a, b) => (v[b.experience.id] || 0) - (v[a.experience.id] || 0)), top = S2[0]; if (S2[1] && (v[S2[1].experience.id] || 0) === (v[top.experience.id] || 0)) return `<p style="margin-top:10px"><b>It's a tie</b> at ${v[top.experience.id] || 0} each. One more vote decides it.</p>`; return `<p style="margin-top:10px"><b>Leading:</b> ${esc(top.experience.name)} with ${esc(top.host.name)} (${v[top.experience.id] || 0} of ${tot}). <a class="btn" href="/@${esc(top.host.handle)}?${new URLSearchParams({ exp: top.experience.id, people: q.people || "", city: q.city || "" })}#book">Request a date</a></p>`; })() : ""}
      <p class="m">Prices from ${when}. Hosts confirm the final price. <a href="/teams?${new URLSearchParams(q)}">See today's matches</a>.</p>`;
    document.querySelectorAll("[data-v]").forEach((b) => (b.onclick = async () => { const name = $("#nm").value.trim(); if (!name && !mine) { $("#nm").focus(); $("#nm").placeholder = "Add your name first"; $("#nm").style.borderColor = "#9A4128"; let w = document.getElementById("nmW"); if (!w) { w = document.createElement("small"); w.id = "nmW"; w.style.color = "#A3402B"; $("#nm").after(w); } w.textContent = " Add your name so the team sees your pick."; return; } const j = await fetch(`/api/public/teams/saved/${encodeURIComponent(id)}/vote`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pick: b.dataset.v, prev: mine, name, who: (() => { let w = ""; try { w = localStorage.getItem("encore.voter") || ""; if (!w) { w = Math.random().toString(36).slice(2, 12); localStorage.setItem("encore.voter", w); } } catch {} return w; })() }) }).then((r) => r.json()).catch(() => null); if (j?.ok) { d.votes = j.votes; d.voters = j.voters; mine = b.dataset.v; try { localStorage.setItem(key, mine); } catch {} draw(); } })); };
  draw(); })();
</script></body></html>
