<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start your page · Pottery Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px "Instrument Sans",system-ui,sans-serif;background:#FAF7F2;color:#2B211C}
  form{background:#fff;padding:30px;border-radius:18px;border:1px solid #E9E1D6;box-shadow:0 1px 2px rgba(43,33,28,.05),0 18px 40px -24px rgba(43,33,28,.3);width:min(360px,calc(100vw - 32px));box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:8px;font:600 20px "Fraunces",Georgia,serif;margin-bottom:18px}
  h1{margin:0 0 4px;font:600 24px "Fraunces",Georgia,serif}.sub{margin:0 0 18px;color:#75685F;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;color:#2B211C;margin-bottom:12px}
  input,button{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border-radius:12px}
  input{border:1px solid #E9E1D6;margin:6px 0 0;background:#fff;font-weight:400}input:focus{outline:2px solid #E8C3B5;outline-offset:1px}
  button{border:0;background:#C2553A;color:#fff;font-weight:600;cursor:pointer;margin-top:6px}button:hover{background:#A9462E}button:disabled{opacity:.6;cursor:default}
  .err{color:#A93A3A;margin:0 0 12px;font-size:13px}.err:empty{display:none}p{margin:0 0 12px}
  a{display:block;margin-top:14px;text-align:center;color:#A9462E;font-size:13px;text-decoration:none}
.ok{display:block;font-weight:500;color:#2F7A4F;font-size:12.5px;margin-top:5px}.ok.bad{color:#A93A3A}.ok:empty{display:none}#wl .done{font-size:15px;line-height:1.5}
.modes{display:flex;gap:6px;background:rgba(0,0,0,.04);border-radius:12px;padding:4px;margin:4px 0 10px}.modes button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font:inherit;font-weight:600;cursor:pointer;color:inherit;opacity:.7}.modes button[aria-selected=true]{background:#fff;opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
[hidden]{display:none!important}
.nocode{display:block;margin-top:4px;color:#6B5F56;font-size:13px;font-weight:400}.nocode a{color:#C4532F;font-weight:600}</style><script src="/authguard.js"></script><script src="/place.js"></script>
<link rel="stylesheet" href="/playful.css">
<script src="/placesearch.js"></script>
<script src="/mascot.js"></script></head><body>
<form id="f" novalidate><div class="brand"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 3.2h8.8" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/></svg>pottery lab</div>
  <h1 id="h">Start your free trial</h1>
  <p class="sub" id="sub">14 days, every feature, no card.</p>
  <div class="modes" id="modes" hidden role="tablist" aria-label="What are you hosting?"><button type="button" role="tab" data-mode="work" aria-selected="true">For a brand</button><button type="button" role="tab" data-mode="friends" aria-selected="false">With friends</button></div>
  <p class="err" id="err" role="alert"></p>
  <label id="codeWrap" hidden><span>Host code</span><input name="code" placeholder="ABCD-EFGH" autocomplete="off" autocapitalize="characters" spellcheck="false"><small id="codeOk" class="ok"></small><small class="nocode" id="nocodeHint" hidden>No host code? Ask a host you know, or <a href="#wl" onclick="document.getElementById('f').hidden=true;document.getElementById('wl').hidden=false;return false">join the waitlist</a>.</small></label>
  <label>Your name<input name="name" placeholder="e.g. Dana Park" autocomplete="name" required></label>
  <label><span id="emL">Work email</span><input name="email" type="email" placeholder="you@example.com" autocomplete="email" required></label>
  <label id="coWrap"><span id="coL">Company</span><input name="company" placeholder="Company" autocomplete="organization"></label>
  <label id="cityWrap"><span>Your city</span><span style="display:flex;flex-direction:column;gap:6px"><input name="city" id="cityIn" list="suCities" placeholder="e.g. New York" autocomplete="address-level2" style="width:100%;box-sizing:border-box"><button type="button" id="cityGps" style="align-self:flex-start;white-space:nowrap;border:1px solid #E7DFD3;background:#fff;border-radius:12px;padding:6px 12px;font-size:14px;color:#1F1A17;font:inherit;cursor:pointer">📍 Use my location</button></span><datalist id="suCities"></datalist></label>
  <label id="webWrap"><span>Company website <small style="font-weight:400;color:#75685F">(optional)</small></span><input name="website" placeholder="e.g. fernwoodlabs.com" autocomplete="url" inputmode="url"></label>
  <input type="hidden" name="mode" value="work">
  <label>Password <small style="font-weight:400;color:#75685F">(10+ characters)</small><input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
  <button type="submit" id="go">Start free trial</button>
  <a href="/login">Already have an account? Sign in</a>
</form>
<form id="wl" hidden novalidate><div class="brand"><svg viewBox="0 0 28 28" width="24" height="24" aria-hidden="true"><path d="M10.2 3.2h7.6v1.9c0 1.3-1.1 1.9-1.1 3.3 0 1.5 5.6 3.4 5.6 9.4 0 4.6-3.7 7.4-8.3 7.4s-8.3-2.8-8.3-7.4c0-6 5.6-7.9 5.6-9.4 0-1.4-1.1-2-1.1-3.3z" fill="#C4532F" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.4 16.7c2 1.3 4.3-.9 6.8.2 2.4 1 4.5-.8 6.6.1" fill="none" stroke="#F2D48F" stroke-width="2.2" stroke-linecap="round"/><path d="M9.6 3.2h8.8" stroke="#1F1A17" stroke-width="1.8" stroke-linecap="round"/></svg>pottery lab</div>
  <h1>Join the waitlist</h1>
  <p class="sub">Hosting is invite-only for now. Tell us what you'd host.</p>
  <p class="err" id="wlErr" role="alert"></p>
  <label>Your name<input name="name" autocomplete="name"></label>
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>City<input name="city" placeholder="e.g. Oakland" autocomplete="address-level2"></label>
  <label>What would you host?<input name="wants" placeholder="e.g. a Sunday hike, cake sales from my stoop"></label>
  <button type="submit">Join the waitlist</button>
  <a href="#" id="haveCode">I have a host code</a>
</form>
<script>
  (function () { const q = new URLSearchParams(location.search), f = document.getElementById("f");
    const set = (m) => { f.mode.value = m; document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
      const fr = m === "friends", fol = fr && !!q.get("regularOf"); document.getElementById("h").textContent = fr ? (fol ? "Follow along" : "Start your page") : "Start your free trial";
      document.getElementById("sub").textContent = fr ? (fol ? "Hear about the next one." : "Free to host friends.") : "14 days, every feature, no card.";
      { const cw0 = document.getElementById("coWrap"); cw0.hidden = fol; if (fol) f.company.value = ""; }
      document.getElementById("emL").textContent = fr ? "Email" : "Work email"; document.getElementById("coL").textContent = fr ? "Group name (optional)" : "Company";
      f.company.placeholder = fr ? "e.g. Saturday Run Club" : "Company"; { const w = document.getElementById("webWrap"); w.hidden = fr; w.style.display = fr ? "none" : ""; if (fr) f.website.value = ""; } document.getElementById("go").textContent = fr ? (fol ? "Follow" : "Create my page") : "Start free trial"; };
    document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => set(b.dataset.mode));
    if (q.get("mode") !== "work") set("friends"); else document.getElementById("modes").hidden = false;
    const cw = document.getElementById("codeWrap"), ci = f.code, ok = document.getElementById("codeOk"), wl = document.getElementById("wl");
    let t; const check = () => { clearTimeout(t); const c = ci.value.trim(); if (c.length < 8) { ok.textContent = ""; return; } t = setTimeout(async () => { try { const j = await (await fetch("/api/codes/" + encodeURIComponent(c))).json(); ok.className = "ok" + (j.valid ? "" : " bad"); ok.textContent = j.valid ? (j.from ? `✓ Invited by ${j.from}. You'll follow each other.` : "✓ Code works.") : j.message || "That host code doesn't work."; } catch {} }, 250); };
    ci.addEventListener("input", check);
    if (q.get("code")) { cw.hidden = false; ci.value = q.get("code").toUpperCase(); check(); set("friends"); }
    fetch("/api/signup/config").then((r) => r.json()).then((c) => { if (c.inviteOnly) { cw.hidden = false; document.getElementById("nocodeHint").hidden = false; window.__inviteOnly = true; } else if (!wl.hidden) { wl.hidden = true; f.hidden = false; } }).catch(() => {});
    if (location.hash === "#ask") { f.hidden = true; wl.hidden = false; }
    document.getElementById("haveCode").onclick = (e) => { e.preventDefault(); wl.hidden = true; f.hidden = false; ci.focus(); };
    wl.addEventListener("submit", async (e) => { e.preventDefault(); const b = Object.fromEntries(new FormData(wl)), er = document.getElementById("wlErr"); er.textContent = "";
      try { const r = await fetch("/api/waitlist", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json().catch(() => ({}));
        if (!r.ok) { er.textContent = j.message || "Couldn't add you. Try again."; return; }
        wl.innerHTML = `<div class="brand">pottery lab</div><h1>You're on the waitlist</h1><p class="done">We'll be in touch.</p>`;
      } catch { er.textContent = "Can't reach Pottery Lab. Check your connection."; } });
    try { const br = q.get("brief"); if (br) localStorage.setItem("encore.brief", br.slice(0, 200)); } catch {}
  })();
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  try { const P = window.EncorePlace; if (P) { document.getElementById("suCities").innerHTML = P.CITIES.map((c) => `<option value="${c[0]}">`).join(""); const cur = P.get(); if (cur?.city) f.city.value = cur.city; else P.resolve({ prompt: false }).then((p) => { if (p.city && !f.city.value) f.city.value = p.city; });
    window.EncorePlaces?.attach(f.city, { citiesOnly: true }); document.getElementById("cityGps").onclick = async () => { const b = document.getElementById("cityGps"); b.textContent = "Finding you…"; const p = await P.resolve({ prompt: true }); b.textContent = "📍 Use my location"; if (p.city) f.city.value = p.city; else err.textContent = "Couldn't get your location. Type your city instead."; }; } } catch {}
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = "";
    const body = Object.fromEntries(new FormData(f)), q = new URLSearchParams(location.search);
    for (const k of ["template", "plan", "ref"]) if (q.get(k)) body[k] = q.get(k); // passed through to the welcome screen
    // first problem in the order the fields appear: code (when shown), name, email, company, password
    const stop = (msg, el) => { err.textContent = msg; el?.focus(); };
    if (window.__inviteOnly && !String(body.code || "").trim() && !q.get("regularOf")) return stop("Add your host code, or join the waitlist.", f.code);
    if (document.getElementById("codeOk").classList.contains("bad")) return stop("That host code doesn't work. Check it with the host who sent it.", f.code);
    if (!String(body.name || "").trim()) return stop("Add your name.", f.elements.name);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(body.email || "").trim())) return stop("That email doesn't look right.", f.email);
    if (body.mode === "work" && !String(body.company || "").trim()) return stop("Add your company, or pick \"With friends\".", f.company);
    if (String(body.password || "").length < 10) return stop("Password needs 10+ characters.", f.password);
    go.disabled = true;
    try {
      const r = await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = j.message || "Couldn't create your page. Try again."; go.disabled = false; return; }
      try { if (body.city && window.EncorePlace) window.EncorePlace.setManual(window.EncorePlace.find(body.city)?.[0] || body.city); } catch {}
      // a prepared storefront (e.g. /signup?mode=friends&preset=tram): set it up on the new account, then open it
      { const pre = (new URLSearchParams(location.search).get("preset") || "").replace(/[^a-z0-9-]/g, ""); if (pre) { try { const P = await (await fetch("/presets/" + pre + ".json")).json(); let r2 = await fetch("/api/host/profile", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify(P) });
        if (r2.status === 400) { const r3 = await fetch("/api/host/profile", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ ...P, handle: P.handle + "-" + Math.random().toString(36).slice(2, 5) }) }); r2 = r3; }
        const j2 = await r2.json().catch(() => ({})); if (j2?.host?.handle) { location.href = "/@" + j2.host.handle + "?welcome=1"; return; } } catch {} } }
      location.href = j.redirect || "/?welcome=1";
    } catch { err.textContent = "Can't reach Pottery Lab. Check your connection."; go.disabled = false; }
  });
</script></body></html>
