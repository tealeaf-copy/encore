<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team bookings · Pottery Lab</title><meta name="description" content="Your team's requests and bookings: status, messages with the host, approvals, invoices and reviews.">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"></head>
<body class="bb"><main class="bb-wrap bb-narrow" id="main"><p class="bb-meta" style="padding-top:24px">Loading…</p></main>
<script src="/eventart.js"></script><script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, icon, money, $, $$ } = BB; BB.top("bookings");
  const id = location.pathname.split("/")[3] || "", main = $("#main");
  const day = (d) => (d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }) : "");
  const when = (r) => (r.date ? day(r.date) : r.flexText);
  const signin = () => (main.innerHTML = `<section class="bb-xhead"><h1>Sign in to see your team's bookings</h1><a class="bb-btn primary lg" href="/login?next=${encodeURIComponent(location.pathname)}">Sign in</a></section>`);
  async function list() { let d; try { d = await api("/api/bb/requests"); } catch (e) { return e.status === 401 ? signin() : (main.innerHTML = `<p>${esc(e.message)}</p>`); }
    let rules; try { rules = await api("/api/bb/brand/rules"); } catch {}
    const waiting = d.requests.filter((r) => r.status === "approval");
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">Bookings</p><h1>Your team's <em>bookings</em></h1></section>
      ${waiting.length && d.approver ? `<div class="bb-panel ink"><h2>Waiting on you</h2>${waiting.map((r) => `<div class="bb-req"><div><b>${esc(r.pkgName)}</b> · ${esc(r.host.name)}<p class="bb-meta">${esc(r.contactName)} · ${esc(when(r))} · ${r.headcount} people · <b>${money(r.price.totalCents)}</b></p></div><div class="acts"><button class="bb-btn primary" data-ok="${r.id}">Approve</button><button class="bb-btn quiet" data-no="${r.id}">Not this time</button></div></div>`).join("")}</div>` : ""}
      <div class="bb-list">${d.requests.map((r) => `<a class="bb-req" href="/teams/bookings/${r.id}"><div><span class="bb-status ${r.status}">${esc(r.statusText)}</span><h3 style="margin-top:8px">${esc(r.pkgName)}</h3><p class="bb-meta">${esc(r.host.name)} · ${esc(when(r))} · ${r.headcount} people</p></div><div><b class="bb-mono">${money(r.price.totalCents)}</b>${r.messages.some((m) => m.from === "host") ? `<p class="bb-meta">${icon("chat")} ${r.messages.filter((m) => m.from === "host").length}</p>` : ""}</div></a>`).join("") || `<div class="bb-empty"><p>No bookings yet.</p><a class="bb-btn primary" href="/teams/discover">Find a host</a></div>`}</div>
      ${rules?.canEdit ? `<section class="bb-sec" style="margin-top:24px"><h2>Approval rule</h2><p class="bb-meta">Ask for an OK before a request goes to the host.</p>
        <div class="bb-row"><label class="bb-field"><span>When</span><select id="ap"><option value="off">No approval needed</option><option value="over">Over an amount</option><option value="always">Every booking</option></select></label><label class="bb-field"><span>Amount</span><input id="amt" inputmode="numeric" value="${rules.rules.overCents ? rules.rules.overCents / 100 : 1000}"></label></div>
        <label class="bb-field"><span>Who approves</span><input id="who" value="${esc((rules.rules.approvers || []).join(", "))}" placeholder="you@company.com"><small>Approvers' own requests go straight through.</small></label><button class="bb-btn" id="saveRule">Save the rule</button></section>` : ""}`;
    if (rules?.canEdit) { $("#ap").value = rules.rules.approval; $("#saveRule").onclick = async () => { try { await api("/api/bb/brand/rules", { approval: $("#ap").value, overCents: Math.round(+$("#amt").value.replace(/[^\d.]/g, "") * 100), approvers: $("#who").value }); BB.toast("Saved"); } catch (e) { BB.toast(e.message); } }; }
    $$("[data-ok],[data-no]").forEach((b) => (b.onclick = async () => { try { await api(`/api/bb/requests/${b.dataset.ok || b.dataset.no}/approve`, { ok: !!b.dataset.ok }); list(); } catch (e) { BB.toast(e.message); } })); }
  async function detail() { let d; try { d = await api(`/api/bb/requests/${id}`); } catch (e) { return e.status === 401 ? signin() : (main.innerHTML = `<h1>Not found</h1><p class="bb-lede">${esc(e.message)}</p>`); }
    const r = d.request, U = new URLSearchParams(location.search);
    const step = { approval: 0, requested: 1, countered: 1, accepted: 2, booked: 3, done: 4 }[r.status] ?? -1;
    main.innerHTML = `<p class="bb-meta" style="padding-top:16px"><a href="/teams/bookings">All bookings</a></p>
      <section class="bb-xhead"><span class="bb-status ${r.status}">${esc(r.statusText)}</span><h1>${esc(r.pkgName)}</h1><p class="bb-meta">with <a href="/teams/x/${esc(r.handle)}/${esc(r.pkg)}">${esc(r.host.name)}</a> · ${esc(when(r))} · ${r.headcount} people${r.instant ? " · Instant book" : ""}</p></section>
      ${step >= 0 ? `<ol class="bb-steps">${["Team OK", "Sent", "Accepted", "Booked", "Done"].map((t, i) => (i === 0 && !r.approval ? "" : `<li class="${i < step ? "done" : ""}"${i === step ? ' aria-current="step"' : ""}>${t}</li>`)).join("")}</ol>` : ""}
      ${r.status === "question" ? `<div class="bb-panel"><b>Just a question so far.</b> Nothing is held or charged.<p style="margin:8px 0 0"><a class="bb-btn primary" href="/teams/book/${esc(r.handle)}/${esc(r.pkg)}?people=${r.headcount}">Request to book</a></p></div>` : ""}
      ${U.get("paid") ? `<p class="bb-note">${icon("check")} Payment received. Thanks.</p>` : ""}
      ${r.status === "approval" && d.approver ? `<div class="bb-panel ink"><b>This needs your OK.</b> ${esc(r.approval?.rule || "")}.<div class="acts" style="display:flex;gap:8px;margin-top:8px"><button class="bb-btn primary" data-ok>Approve</button><button class="bb-btn quiet" data-no>Not this time</button></div></div>` : r.status === "approval" ? `<p class="bb-note">Waiting for ${esc((r.approval?.approvers || []).join(", "))} to approve. Then it goes to the host.</p>` : ""}
      ${r.status === "countered" && r.counter ? `<div class="bb-panel ink"><h2>${esc(r.host.name)} suggested a change</h2><p>${r.counter.date ? `New date: <b>${day(r.counter.date)}</b>. ` : ""}${r.counter.perPersonCents != null ? `New price: <b>${money(r.counter.perPersonCents)} a person</b>, ${money(r.counter.totalCents)} total for ${r.headcount}.` : ""}</p>${r.counter.note ? `<p>“${esc(r.counter.note)}”</p>` : ""}<div style="display:flex;gap:8px"><button class="bb-btn primary" data-yes>Take it</button><button class="bb-btn quiet" data-nope>No thanks</button></div></div>` : ""}
      ${r.status === "accepted" && r.deposit.state !== "charged" && r.deposit.state !== "held" ? `<div class="bb-panel ink"><b>Accepted.</b> Pay the ${money(r.deposit.cents)} deposit to hold the date.<p><button class="bb-btn primary" data-pay>Pay the deposit</button></p></div>` : ""}
      ${r.contact ? `<div class="bb-panel"><h2>${icon("check")} Contact details</h2><ul class="bb-facts"><li>${icon("people")}<span>${esc(r.contact.name)}</span></li><li>${icon("mail")}<a href="mailto:${esc(r.contact.email)}">${esc(r.contact.email)}</a></li>${r.contact.phone ? `<li>${icon("phone")}<span>${esc(r.contact.phone)}</span></li>` : ""}${r.contact.address ? `<li>${icon("pin")}<span>${esc(r.contact.address)}</span></li>` : ""}</ul>${r.coi ? `<p><a class="bb-btn quiet" href="${r.coi}">${icon("doc")} Insurance certificate</a></p>` : ""}</div>` : `<p class="bb-note">${icon("lock")} Contact details and the address appear here once you're booked.</p>`}
      <section class="bb-sec"><h2>Messages</h2><div class="bb-thread">${r.messages.map((m) => `<div class="bb-msg ${m.from === "brand" ? "me" : ""}">${esc(m.text)}<small>${esc(m.name)} · ${new Date(m.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</small></div>`).join("") || '<p class="bb-meta">No messages yet. Ask anything; the host usually replies within a day.</p>'}</div>
        ${["declined", "cancelled"].includes(r.status) ? "" : `<form class="bb-compose" id="msg"><input maxlength="1000" placeholder="Message ${esc(r.host.name)}" aria-label="Message"><button class="bb-btn" type="submit">Send</button></form>`}</section>
      <section class="bb-sec"><h2>Price</h2>${BB.priceLines(r.price)}<p class="bb-meta">Deposit ${money(r.deposit.cents)}: ${esc({ none: "not paid yet", held: "held, charged when the host accepts", charged: "paid", released: "released, not charged" }[r.deposit.state] || r.deposit.state)}.</p></section>
      <section class="bb-sec"><h2>If plans change</h2>${BB.termsList(r.terms)}${["requested", "countered", "accepted", "booked", "approval"].includes(r.status) ? `<p><button class="bb-link" data-cancel>Cancel this booking</button></p>` : ""}</section>
      ${r.invoice ? `<section class="bb-sec"><h2>Invoice</h2><div class="bb-row"><label class="bb-field"><span>Company</span><input id="bc" value="${esc(r.billing.company || r.company)}"></label><label class="bb-field"><span>VAT or tax ID</span><input id="bt" value="${esc(r.billing.taxId || "")}"></label></div><div class="bb-row"><label class="bb-field"><span>Billing address</span><textarea id="ba" style="min-height:72px">${esc(r.billing.address || "")}</textarea></label><label class="bb-field"><span>PO number</span><input id="bp" value="${esc(r.billing.po || "")}"></label></div><div style="display:flex;gap:8px"><button class="bb-btn" data-bill>Save</button><a class="bb-btn primary" href="${r.invoice}" target="_blank">${icon("doc")} Open the invoice</a></div></section>` : ""}
      ${r.status === "done" ? `<section class="bb-sec"><h2>How was it?</h2>${r.reviews.mine ? `<p>You wrote: ${BB.stars(r.reviews.mine.rating)} “${esc(r.reviews.mine.text)}”</p>${r.reviews.theirs ? `<p class="bb-meta">${esc(r.host.name)} wrote about your team: ${BB.stars(r.reviews.theirs.rating)} “${esc(r.reviews.theirs.text)}” (only your team sees this)</p>` : `<p class="bb-meta">${esc(r.host.name)}'s review of your team shows here once they've written it, or after 14 days.</p>`}` : `<p class="bb-meta">Your review goes on ${esc(r.host.name)}'s page once they've reviewed your team too, or after 14 days. Neither of you sees the other's first.</p><div class="bb-toggles" id="rate">${[1, 2, 3, 4, 5].map((n) => `<button class="bb-chip" type="button" data-r="${n}" aria-pressed="false">${n} ${icon("star")}</button>`).join("")}</div><label class="bb-field" style="margin-top:12px"><span>What should other teams know?</span><textarea id="rt" maxlength="1200"></textarea></label><label style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="rl"> Show our company name with it</label><button class="bb-btn primary" data-review>Post review</button>`}</section>` : ""}
      ${r.history.length ? `<section class="bb-sec"><h2>History</h2><ul class="bb-timeline">${r.history.map((x) => `<li>${new Date(x.at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}: ${esc(x.what)}</li>`).join("")}</ul></section>` : ""}`;
    const act = async (fn) => { try { await fn(); detail(); } catch (e) { BB.toast(e.message); } };
    $("[data-ok]")?.addEventListener("click", () => act(() => api(`/api/bb/requests/${id}/approve`, { ok: true })));
    $("[data-no]")?.addEventListener("click", () => act(() => api(`/api/bb/requests/${id}/approve`, { ok: false })));
    $("[data-yes]")?.addEventListener("click", () => act(() => api(`/api/bb/requests/${id}/respond`, { accept: true })));
    $("[data-nope]")?.addEventListener("click", () => act(() => api(`/api/bb/requests/${id}/respond`, { accept: false })));
    $("[data-pay]")?.addEventListener("click", () => act(async () => { const p = await api(`/api/bb/requests/${id}/pay`, {}); if (p.redirect) location.href = p.redirect; }));
    $("[data-cancel]")?.addEventListener("click", () => BB.sheet("Cancel this booking?", `<p>${esc(r.terms.short)}.</p>${BB.termsList(r.terms)}<div class="ft"><button class="bb-btn quiet" data-close>Keep it</button><button class="bb-btn primary" id="cx">Cancel booking</button></div>`, { onOpen: (bg, close) => (bg.querySelector("#cx").onclick = () => { close(); act(async () => { const x = await api(`/api/bb/requests/${id}/cancel`, {}); BB.toast(x.refundCents ? `${money(x.refundCents)} is on its way back.` : "Cancelled."); }); }) }));
    $("#msg")?.addEventListener("submit", (e) => { e.preventDefault(); const t = e.target.querySelector("input").value.trim(); if (t) act(async () => { const x = await api(`/api/bb/requests/${id}/messages`, { text: t }); if (x.hidden) BB.toast("Contact details are hidden until you're booked."); }); });
    $("[data-bill]")?.addEventListener("click", () => act(() => api(`/api/bb/requests/${id}/billing`, { company: $("#bc").value, taxId: $("#bt").value, address: $("#ba").value, po: $("#bp").value })));
    let rating = 0; $$("[data-r]").forEach((b) => (b.onclick = () => { rating = +b.dataset.r; $$("[data-r]").forEach((x) => x.setAttribute("aria-pressed", +x.dataset.r <= rating)); }));
    $("[data-review]")?.addEventListener("click", () => act(() => api(`/api/bb/requests/${id}/review`, { rating, text: $("#rt").value, listCompany: $("#rl").checked }))); }
  id ? detail() : list();
})();
</script></body></html>
