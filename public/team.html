<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team space · Encore</title><meta name="description" content="Your company's bookings on Encore in one place: who asked for what, what needs approval, and the results.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/playful.css">
<style>:root{--paper:#FFF8EE;--ink:#1F1A17;--smoke:#6B5F56;--ember:#C94A30;--line:#E4D9C8;--linen:#F3EADC}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 70px}header.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}header.top nav{display:flex;gap:14px}header.top nav a{text-decoration:none;color:var(--smoke)}.brand{display:flex;gap:8px;align-items:center;font:700 22px Fredoka,system-ui;text-decoration:none}
h1{font:700 clamp(30px,5vw,42px)/1.1 Fredoka,system-ui;margin:14px 0 6px}h2{font:600 20px Fredoka,system-ui;margin:24px 0 8px}.lede{color:var(--smoke);margin:0 0 16px;max-width:680px}.m{color:var(--smoke);font-size:13.5px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}label{display:grid;gap:4px;font-size:13px;font-weight:600;color:#5A4E45}input,select{padding:10px 12px;border:1px solid #DCCFBE;border-radius:12px;font:inherit;background:#fff;min-width:0;width:100%}
.btn{display:inline-block;padding:10px 18px;border-radius:999px;border:0;background:var(--ember);color:#fff;font:600 15px inherit;cursor:pointer;text-decoration:none}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tiles div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.tiles b{display:block;font:600 28px Fredoka,system-ui;line-height:1.1}.tiles span{display:block;font-weight:600;font-size:14px}.tiles small{display:block;color:var(--smoke);font-size:12.5px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #F0E7DA;vertical-align:top}th{font-size:12.5px;color:var(--smoke);font-weight:600;white-space:nowrap}td.n,th.n{text-align:right}tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}.p-pending{background:#FFF6E8;color:#7A4E12}.p-approved{background:#F1FAF4;color:#1E4D36}.p-declined{background:#F6E9E6;color:#8A2E1A}.p-none{background:var(--linen);color:#5A4E45}
@media (max-width:640px){.tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}.tw tr:first-child{display:none}.tw tr{padding:10px 12px;border-bottom:1px solid #F0E7DA}.tw td{border:0;padding:3px 0;text-align:left!important}.tw td[data-l]:not([data-l="What"])::before{content:attr(data-l) ": ";color:var(--smoke);font-size:12.5px}}
.grid2{align-items:end}
.need{background:#FFF6E8;border:1px solid #F0D9B5;border-radius:16px;padding:12px 16px;margin:12px 0;color:#7A4E12}.err{color:#A3402B;font-size:14px}</style></head><body>
<div class="wrap"><header class="top"><a class="brand" href="/"><svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#C4532F"/><circle cx="19" cy="9" r="3.2" fill="#F2D48F"/></svg>encore</a><nav><a href="/teams">Team events</a><a href="/gifts">Gifts</a><a href="/results">Results</a></nav></header>
<div id="main"><p class="m">Loading…</p></div></div>
<script src="/shell.js" defer></script>
<script>
(async function () { const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]), money = (n) => "$" + Math.round(n || 0).toLocaleString();
  const post = async (u, b) => { const r = await fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.message || "That didn't work."); return j; };
  const store = { get: () => { try { return JSON.parse(localStorage.getItem("encore.team") || "null"); } catch { return null; } }, set: (v) => { try { localStorage.setItem("encore.team", JSON.stringify(v)); } catch {} } };
  const m = location.pathname.match(/^\/team\/([a-f0-9]+)/), Q = new URLSearchParams(location.search), k = Q.get("k"), a = Q.get("a");
  if (m && k) store.set({ ...(store.get() || {}), id: m[1], k, ...(a ? { a } : {}) }); const T0 = store.get();
  if (a) history.replaceState(null, "", `/team/${m[1]}?k=${k}`);
  if (!T0?.id) return create();
  if (!m) { history.replaceState(null, "", `/team/${T0.id}?k=${T0.k}`); }
  const A = T0.a || "";
  let me = ""; try { me = localStorage.getItem("encore.teamMe") || ""; } catch {}
  async function load() { const r = await fetch(`/api/public/bteam/${T0.id}?k=${encodeURIComponent(T0.k)}&a=${encodeURIComponent(A)}`); const T = await r.json(); if (!r.ok) { $("#main").innerHTML = `<h1>Team link not valid</h1><p class="lede">${esc(T.message || "")} Ask a teammate for the link, or <a href="#" id="newT">start a new team space</a>.</p>`; $("#newT").onclick = (e) => { e.preventDefault(); store.set(null); create(); }; return; }
    store.set({ id: T.id, k: T0.k, name: T.name, ...(A ? { a: A } : {}) }); draw(T); }
  function draw(T) { const rank = (r) => (r.approval?.state === "pending" ? 0 : ["requested", "quoted"].includes(r.status) ? 1 : r.status === "booked" ? 2 : 3); const rows = T.rows.filter((r) => !(r.partOfId && T.rows.some((p) => p.id === r.partOfId))).map((r) => (r.eventCost ? { ...r, cost: r.eventCost } : r)).sort((a, b) => rank(a) - rank(b) || String(a.date || "9").localeCompare(String(b.date || "9"))), booked = rows.filter((r) => ["booked", "done"].includes(r.status)), pend = rows.filter((r) => r.approval?.state === "pending"), spend = booked.reduce((a, r) => a + (r.cost || 0), 0), asked = rows.filter((r) => !["booked", "done", "declined"].includes(r.status) && r.approval?.state !== "declined").reduce((a, r) => a + (r.cost || 0), 0);
    const done = rows.filter((r) => r.status === "done" || (r.past && ["booked", "done"].includes(r.status))), came = done.reduce((a, r) => a + (r.came || 0), 0), rated = done.filter((r) => r.againPct != null), nr = rated.reduce((a, r) => a + r.ratings, 0), again = nr ? Math.round(rated.reduce((a, r) => a + r.againPct * r.ratings, 0) / nr) : null, pipe = rows.reduce((a, r) => a + (r.campaign?.pipeline || 0), 0);
    const isApprover = !!T.me, canEdit = !!T.me, link = `${location.origin}/team/${T.id}?k=${T0.k}`, joined = (() => { try { return localStorage.getItem("encore.teamJoined." + T.id) === "1"; } catch { return false; } })();
    $("#main").innerHTML = `<h1>${esc(T.name)}</h1><p class="lede">Everything your team has asked for on Encore, from any device: who asked, what needs approval, and how it went. Anyone with this page's link is on the team.</p>
      ${!canEdit && !joined ? `<div class="box"><form id="join" class="grid2"><label>Your name<input name="name" required></label><label>Your work email<input name="email" type="email" required></label><div style="align-self:end"><button class="btn">Join ${esc(T.name)}</button></div></form><p class="m" style="margin:6px 0 0">So your teammates see who asked for what.</p></div>` : ""}
      ${T.me ? `<p class="m">Signed in to this team as <b>${esc(T.me.email)}</b> (${T.me.role}) through your private link.</p>` : ""}
      <div class="box" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><div><b>Invite your team</b><div class="m">${T.members.length} ${T.members.length === 1 ? "member" : "members"}: ${T.members.map((x) => esc(x.name)).join(", ")}</div></div><button class="btn ghost sm" id="cp">Copy the team link</button></div>
      ${pend.length ? `<div class="need"><b>${pend.length} waiting for approval</b>${T.cap ? ` (over the ${money(T.cap)} limit)` : ""}. ${isApprover ? "Approve or decline below." : `Approvers: ${T.approvers.map(esc).join(", ") || "none set"}.`}</div>` : ""}
      <div class="tiles"><div><b>${money(spend)}</b><span>booked</span><small>${asked ? `plus ${money(asked)} in open requests` : "accepted quotes"}</small></div><div><b>${rows.length}</b><span>requests</span><small>${booked.length} booked, ${pend.length} waiting on approval</small></div><div><b>${came || "—"}</b><span>people came</span><small>${done.length} events done</small></div><div><b>${again != null ? again + "%" : "—"}</b><span>would go again</span><small>${nr ? nr + " ratings" : "after the first event"}</small></div>${pipe ? `<div><b>${money(pipe)}</b><span>pipeline</span><small>recorded on bookings</small></div>` : ""}</div>
      <h2>Requests</h2>${rows.length ? `<div class="tw"><table><tr><th>What</th><th>Asked by</th><th>Date</th><th class="n">Cost</th><th>Status</th><th>Approval</th></tr>${rows.map((r) => { const a = r.approval?.state || "none"; return `<tr><td data-l="What"><a href="${esc(r.link)}">${esc(r.title || "Booking")}</a><div class="m">${esc(r.host)}${(r.parts || []).length ? ` + ${r.parts.map((p) => esc(p.title)).join(", ")}` : ""}</div></td><td data-l="Asked by">${esc(r.by)}</td><td data-l="Date">${esc(r.when || r.date || "")}${r.instant ? `<div class="m">⚡ instant booking</div>` : ""}${r.holdUntil > Date.now() && r.status !== "declined" ? `<div class="m">held until ${new Date(r.holdUntil).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}</div>` : ""}</td><td class="n" data-l="Cost">${r.cost ? money(r.cost) : "—"}${r.eventCost ? `<div class="m">whole event</div>` : ""}</td><td data-l="Status">${esc({ requested: "Requested", quoted: "Quote ready", booked: "Booked", done: "Done", declined: "Declined" }[r.status] || r.status)}${r.going || r.cant ? `<div class="m">${r.going} yes${r.cant ? `, ${r.cant} no` : ""}</div>` : ""}</td>
        <td data-l="Approval">${a === "pending" ? `<span class="pill p-pending">Waiting</span>${isApprover ? `<div style="margin-top:6px;display:flex;gap:6px"><button class="btn sm" data-ok="${esc(r.id)}">Approve</button><button class="btn ghost sm" data-no="${esc(r.id)}">Decline</button></div>` : ""}` : a === "approved" ? `<span class="pill p-approved">Approved</span><div class="m">${esc((r.approval.by || "").split("@")[0])}, ${new Date(r.approval.at).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div>` : a === "declined" ? `<span class="pill p-declined">Declined</span><div class="m">${esc((r.approval.by || "").split("@")[0])}${r.approval.note ? `: ${esc(r.approval.note)}` : ""}</div>` : `<span class="pill p-none">Not needed</span>`}</td></tr>`; }).join("")}</table></div>` : `<p class="m">No requests yet. <a href="/teams">Find a host</a>: requests you send from this browser now land here.</p>`}
      <p style="margin-top:10px"><button class="btn ghost sm" id="imp">Add my earlier requests from this device</button> <a class="btn ghost sm" href="/results">Results by campaign</a> <span class="m" id="impM"></span></p>
      <h2>Approvals and limits</h2><div class="box">${canEdit ? `<form id="set" class="grid2"><label>Approvers (emails, comma-separated)<input name="approvers" value="${esc(T.approvers.join(", "))}"></label><label>Needs approval above ($ per booking)<input name="cap" type="number" min="0" value="${T.cap || ""}" placeholder="e.g. 2500"></label><label style="align-self:end;display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="all" style="width:auto" ${T.approveAll ? "checked" : ""}> Every booking needs approval</label><div style="align-self:end"><button class="btn">Save</button> <span class="m" id="setM"></span></div></form>` : `<p style="margin:0">Approvers: <b>${T.approvers.map(esc).join(", ") || "none yet"}</b>${T.cap ? ` · approval needed above <b>${money(T.cap)}</b> per event` : ""}${T.approveAll ? " · every booking needs approval" : ""}.</p><form id="alink" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input name="email" type="email" placeholder="Approver or owner? Your work email" required style="flex:1 1 220px;width:auto"><button class="btn ghost sm">Email me my private link</button></form><p class="m" id="alM" style="margin:6px 0 0"></p>`}
        <p class="m" style="margin:8px 0 0">Requests over the limit still reach the host, marked as waiting on your approval; hosts don't confirm until it's approved. Use the 72-hour hold to keep the date meanwhile.</p></div>`;
    $("#cp").onclick = async (e) => { try { await navigator.clipboard.writeText(link); e.target.textContent = "Copied. Share it with your team."; } catch { prompt("Copy this link", link); } };
    if ($("#set")) $("#set").onsubmit = async (e) => { e.preventDefault(); const F = e.target; try { await post(`/api/public/bteam/${T.id}/settings`, { k: T0.k, a: A, approvers: F.approvers.value, cap: F.cap.value, approveAll: F.all.checked }); $("#setM").textContent = "Saved."; load(); } catch (x) { $("#setM").textContent = x.message; } };
    if ($("#alink")) $("#alink").onsubmit = async (e) => { e.preventDefault(); try { const j = await post(`/api/public/bteam/${T.id}/approver-link`, { k: T0.k, email: e.target.email.value }); $("#alM").textContent = j.message; } catch (x) { $("#alM").textContent = x.message; } };
    if ($("#join")) $("#join").onsubmit = async (e) => { e.preventDefault(); const F = e.target; try { await post(`/api/public/bteam/${T.id}/join`, { k: T0.k, email: F.email.value, name: F.name.value }); try { localStorage.setItem("encore.teamJoined." + T.id, "1"); localStorage.setItem("encore.teamMe", F.email.value.trim().toLowerCase()); localStorage.setItem("encore.teamName", F.name.value.trim()); } catch {} load(); } catch (x) { alert(x.message); } };
    document.querySelectorAll("[data-ok],[data-no]").forEach((b) => (b.onclick = async () => { const yes = !!b.dataset.ok, row = rows.find((r) => r.id === (b.dataset.ok || b.dataset.no)); if (yes && !confirm(`Approve ${row?.title || "this booking"} for ${money(row?.cost || 0)}${(row?.parts || []).length ? " (whole event)" : ""}?`)) return; try { await post(`/api/public/bteam/${T.id}/decide`, { k: T0.k, bookingId: b.dataset.ok || b.dataset.no, decision: yes ? "approve" : "decline", a: A, note: yes ? "" : (prompt("Why not? The requester and host will see this (optional).") || "") }); load(); } catch (x) { alert(x.message); } }));
    $("#imp").onclick = async () => { let L = []; try { L = JSON.parse(localStorage.getItem("encore.bookings") || "[]"); } catch {} let n = 0; for (const x of L) { const u = new URL(x.link, location.origin), mm = u.pathname.match(/^\/booking\/([A-Za-z0-9]+)/), t = u.searchParams.get("t"); if (!mm || !t || T.rows.some((r) => r.id === mm[1])) continue; try { await post(`/api/public/bteam/${T.id}/attach`, { k: T0.k, bookingId: mm[1], t, by: me }); n++; } catch {} } $("#impM").textContent = n ? `Added ${n}.` : "Nothing new on this device."; if (n) load(); }; }
  function create() { $("#main").innerHTML = `<h1>Set up a team space</h1><p class="lede">One link for your company: every booking and gift order in one place, from any device, with an approval step above a limit you set and results everyone can see.</p>
      <div class="box"><form id="mk" class="grid2"><label>Team or company name<input name="name" required placeholder="e.g. Northwind field marketing"></label><label>Your name<input name="you" required></label><label>Your work email<input name="email" type="email" required></label><label>Approvers (optional)<input name="approvers" placeholder="finance@…, your manager"></label><label>Needs approval above ($)<input name="cap" type="number" min="0" placeholder="e.g. 2500"></label><div style="align-self:end"><button class="btn">Create the team space</button></div></form><p class="err" id="mkE"></p></div>`;
    $("#mk").onsubmit = async (e) => { e.preventDefault(); const F = e.target; try { const j = await post("/api/public/bteam", { name: F.name.value, you: F.you.value, email: F.email.value, approvers: F.approvers.value, cap: F.cap.value }); try { localStorage.setItem("encore.teamMe", F.email.value.trim().toLowerCase()); } catch {} store.set({ id: j.id, k: j.key, name: F.name.value }); try { localStorage.setItem("encore.teamJoined." + j.id, "1"); } catch {} location.href = j.ownerLink || j.link; } catch (x) { $("#mkE").textContent = x.message; } }; }
  load(); })();
</script></body></html>
