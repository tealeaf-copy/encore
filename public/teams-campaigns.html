<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campaigns · Pottery Lab</title><meta name="description" content="Plan, source, book, invite, run and measure your team's in-person experiences, one campaign at a time.">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/timeline.css"><link rel="stylesheet" href="/teams-intel.css"><style>.ti-ros{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}.ti-ros li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:baseline}.ti-ros b{font-size:14px}.ti-ge{margin:12px 0}</style></head>
<body class="bb ti"><main class="bb-wrap" id="main"><p class="bb-meta" style="padding-top:24px">Loading…</p></main>
<script src="/eventart.js"></script><script src="/brandbook.js"></script><script src="/qr.js" defer></script><script src="/sharekit.js" defer></script>
<script>
(function () {
  const { esc, api, icon, money, $, $$ } = BB; BB.top("campaigns");
  const main = $("#main"), parts = location.pathname.split("/").filter(Boolean), id = parts[2] || "", TABS = [["plan", "Plan"], ["source", "Source"], ["book", "Book"], ["invite", "Invite"], ["run", "Run"], ["measure", "Measure"]];
  let tab = TABS.some(([k]) => k === parts[3]) ? parts[3] : "", C = null;
  const day = (d, o = {}) => (d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC", ...o }) : "");
  const range = (a, b) => (a && b ? `${day(a)} to ${day(b, { year: "numeric" })}` : a ? `From ${day(a)}` : b ? `Until ${day(b)}` : "");
  const pc = (v) => (v == null ? "" : v + "%");
  const today = new Date().toISOString().slice(0, 10);
  const STATUS = { approval: "Waiting on your team", requested: "Sent to the host", countered: "The host suggested a change", accepted: "Accepted, deposit due", booked: "Booked", declined: "Declined", cancelled: "Cancelled", done: "Done", question: "A question" };
  const CST = { planning: "Planning", active: "Running", done: "Wrapped up" };
  const signin = () => (main.innerHTML = `<section class="bb-xhead"><h1>Sign in to see your campaigns</h1><a class="bb-btn primary lg" href="/login?next=${encodeURIComponent(location.pathname)}">Sign in</a></section>`);
  const fail = (e) => (e.status === 401 ? signin() : e.code === "not_brand" ? (main.innerHTML = `<section class="bb-xhead"><h1>Campaigns are for brand teams</h1><p class="bb-lede">Hosting? Start from <a href="/?app=1">your Home</a>.</p></section>`) : (main.innerHTML = `<section class="bb-xhead"><h1>Not found</h1><p class="bb-lede">${esc(e.message)}</p><a class="bb-btn" href="/teams/campaigns">All campaigns</a></section>`));
  const meterHtml = (B) => { const tot = Math.max(B.budgetCents, B.committedCents + B.pendingCents, 1), c = Math.round((B.committedCents / tot) * 100), p = Math.round((B.pendingCents / tot) * 100);
    return `<div class="ti-meter${B.over ? " over" : ""}" role="img" aria-label="${money(B.committedCents)} committed of ${money(B.budgetCents)}"><i style="width:${c}%"></i><i class="p" style="left:${c}%;width:${p}%"></i></div>`; };

  // ---- the list ----
  async function list() { let d; try { d = await api("/api/campaigns"); } catch (e) { return fail(e); }
    main.innerHTML = `<header class="ti-head"><div><p class="bb-kicker">Campaigns</p><h1>Your <em>campaigns</em></h1><p class="ti-sub">One place for the work behind a goal: plan it, find hosts, book, invite, run the day and show what came of it.</p></div>
      <div class="acts"><button class="bb-btn primary" id="new">${icon("plus")}New campaign</button></div></header>
      ${d.campaigns.length ? `<div class="ti-camps">${d.campaigns.map((c) => `<a class="ti-camp" href="/teams/campaigns/${c.id}"><span class="ti-st ${c.status}">${CST[c.status]}</span>${c.role !== "owner" ? ` <span class="ti-badge soft">${c.role === "editor" ? "You can edit" : "View only"}</span>` : ""}<h3>${esc(c.title)}</h3>
        <p class="meta">${esc([c.cities.join(", "), range(c.start, c.end)].filter(Boolean).join(" · "))}</p>
        ${c.budget.budgetCents ? `${meterHtml(c.budget)}<p class="meta"><b class="bb-mono" style="color:var(--pl-ink)">${money(c.budget.committedCents)}</b> committed of ${money(c.budget.budgetCents)}${c.budget.pendingCents ? ` · ${money(c.budget.pendingCents)} waiting` : ""}</p>` : `<p class="meta" style="margin-top:10px">No budget set yet</p>`}
        <p class="meta" style="margin-top:6px">${c.events} ${c.events === 1 ? "event" : "events"} · ${c.guests} on the guest lists · ${c.attended} came${c.next ? ` · Next: ${esc(c.next.name)}, ${day(c.next.date)}` : ""}</p></a>`).join("")}</div>`
        : `<div class="ti-empty"><h3>No campaigns yet</h3><p>A campaign groups a few events behind one goal, like "Q1 developer dinners in New York".</p></div>`}`;
    $("#new").onclick = newSheet; if (new URLSearchParams(location.search).get("new")) newSheet(); }
  function newSheet() { BB.sheet("New campaign", `<form id="nf"><label class="bb-field"><span>Name it</span><input name="title" required maxlength="100" placeholder="Q1 developer dinners in NYC and SF"></label>
      <label class="bb-field"><span>The goal</span><textarea name="goal" rows="3" maxlength="400" placeholder="Meet 80 senior engineers and book 20 follow-up meetings."></textarea><small>You can change everything later.</small></label>
      <button class="bb-btn primary block" type="submit">Start planning</button><p class="bb-meta" id="nerr" role="alert"></p></form>`, { onOpen: (el, close) => { $("#nf", el).onsubmit = async (e) => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      try { const r = await api("/api/campaigns", f); location.href = r.url + "/plan"; } catch (er) { $("#nerr", el).textContent = er.message; } }; } }); }

  // ---- one campaign ----
  async function load() { const d = await api(`/api/campaigns/${id}`); C = d.campaign; return C; }
  async function detail() { try { await load(); } catch (e) { return fail(e); } if (!tab) tab = C.status === "planning" ? "plan" : C.status === "done" ? "measure" : "run"; frame(); }
  function frame() { const B = C.budget, T = C.totals;
    main.innerHTML = `<p class="bb-meta" style="padding-top:16px"><a href="/teams/campaigns">All campaigns</a></p>
      <header class="ti-head" style="padding-top:8px"><div style="min-width:0"><span class="ti-st ${C.status}">${CST[C.status]}</span>${C.role !== "owner" ? ` <span class="ti-badge soft">${C.role === "editor" ? "Editor" : "View only"}</span>` : ""}<h1>${esc(C.title)}</h1><p class="ti-sub">${esc(C.goal || "")}</p></div>
        <div class="acts">${C.can.share ? `<button class="bb-btn quiet" id="rep">${icon("doc")}Report</button>` : ""}${C.can.book ? `<a class="bb-btn primary" href="/teams/campaigns/${C.id}/source">${icon("plus")}Book a host</a>` : ""}</div></header>
      <div class="ti-tiles" style="--n:4"><div class="ti-tile"><span>Budget</span><b>${B.budgetCents ? money(B.remainingCents) : "Not set"}</b><small>${B.budgetCents ? `left of ${money(B.budgetCents)}${B.pendingCents ? `, ${money(B.pendingCents)} waiting` : ""}` : "Add one in Plan"}</small></div>
        <div class="ti-tile"><span>Events</span><b>${T.events}</b><small>${T.eventsDone} done</small></div><div class="ti-tile"><span>Came</span><b>${T.attended}</b><small>${T.showPct == null ? `${T.yes} said they're in` : `${T.showPct}% of yeses at past events`}</small></div><div class="ti-tile"><span>Would go again</span><b>${T.againPct == null ? "<span class='na'>Not yet</span>" : T.againPct + "%"}</b><small>${T.againPct == null ? "Shows at 10+ answers" : T.againAnswered + " answered"}</small></div></div>
      <nav class="ti-tabs" aria-label="Campaign">${TABS.map(([k, t]) => `<a href="/teams/campaigns/${C.id}/${k}" data-t="${k}"${tab === k ? ' aria-current="page"' : ""}>${t}${k === "book" ? `<span class="n">${C.bookings.length}</span>` : k === "invite" ? `<span class="n">${C.guests.length}</span>` : ""}</a>`).join("")}</nav><div id="pane"></div>`;
    $$("[data-t]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); tab = a.dataset.t; history.pushState(null, "", a.href); $$("[data-t]").forEach((x) => (x === a ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"))); pane(); }));
    $("#rep") && ($("#rep").onclick = report);
    pane(); }
  window.onpopstate = () => { const p = location.pathname.split("/").filter(Boolean); if (p[2] === id && p[3]) { tab = p[3]; frame(); } };
  const pane = () => ({ plan, source, book, invite, run, measure })[tab]();
  const refresh = async () => { await load(); frame(); };
  const act = (fn) => async (...a) => { try { await fn(...a); } catch (e) { BB.toast(e.message); } };
  async function report() { try { const r = await api(`/api/campaigns/${C.id}/report-link`, {}); const url = location.origin + r.url;
    BB.sheet("Share the report", `<p>One page for leadership: totals, goals, each event and what guests said. No guest names or emails are in it.</p><label class="bb-field"><span>Link</span><input readonly value="${esc(url)}" id="rl"></label>
      <div class="ti-actions"><a class="bb-btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">Open the report</a><button class="bb-btn quiet" id="cp">Copy link</button><button class="bb-link" id="off">Turn the link off</button></div>`, { onOpen: (el, close) => { $("#cp", el).onclick = () => { navigator.clipboard?.writeText(url); BB.toast("Copied"); }; $("#off", el).onclick = async () => { await api(`/api/campaigns/${C.id}/report-link`, { off: true }); close(); BB.toast("The old link no longer works"); }; } }); } catch (e) { BB.toast(e.message); } }

  // ---- Plan ----
  function plan() { const ro = !C.can.plan, dis = ro ? " disabled" : "", k = C.goals || {};
    $("#pane").innerHTML = `<div class="ti-grid two"><form class="ti-card" id="pf"><h2>The plan</h2><p class="ti-sub">${ro ? "You can see this plan. An owner can make you an editor." : "What it's for, who it's for, where, when and what good looks like."}</p>
      <div style="margin-top:16px"><label class="bb-field"><span>Name</span><input name="title" value="${esc(C.title)}"${dis}></label>
      <label class="bb-field"><span>Goal</span><textarea name="goal" rows="3"${dis}>${esc(C.goal || "")}</textarea></label>
      <label class="bb-field"><span>Who it's for</span><input name="tags" value="${esc((C.audience?.tags || []).join(", "))}" placeholder="Engineers, engineering leaders"${dis}><small>Plain words, separated by commas. Insights uses them to suggest experiences and hosts.</small></label>
      <div class="bb-row"><label class="bb-field"><span>Cities</span><input name="cities" value="${esc((C.cities || []).join(", "))}" placeholder="New York, San Francisco"${dis}></label><label class="bb-field"><span>Spend a person, about</span><input name="perPerson" inputmode="numeric" value="${C.audience?.perPersonCents ? Math.round(C.audience.perPersonCents / 100) : ""}" placeholder="$120"${dis}></label></div>
      <div class="bb-row3"><label class="bb-field"><span>Budget</span><input name="budget" inputmode="numeric" value="${C.budgetCents ? Math.round(C.budgetCents / 100) : ""}" placeholder="$24,000"${dis}></label><label class="bb-field"><span>Starts</span><input type="date" name="start" value="${esc(C.start || "")}"${dis}></label><label class="bb-field"><span>Ends</span><input type="date" name="end" value="${esc(C.end || "")}"${dis}></label></div>
      <p class="ti-k" style="margin-top:8px">Goals</p><div class="bb-row3"><label class="bb-field"><span>Guests who came</span><input name="attendees" inputmode="numeric" value="${k.attendees || ""}" placeholder="80"${dis}></label><label class="bb-field"><span>Pipeline meetings</span><input name="meetings" inputmode="numeric" value="${k.meetings || ""}" placeholder="20"${dis}></label><label class="bb-field"><span>Would go again</span><input name="againPct" inputmode="numeric" value="${k.againPct || ""}" placeholder="85%"${dis}></label></div>
      <label class="bb-field"><span>Where it's at</span><select name="status"${dis}>${Object.entries(CST).map(([v, t]) => `<option value="${v}"${C.status === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
      ${ro ? "" : `<button class="bb-btn primary" type="submit">Save the plan</button>`}</div></form>
      <div><section class="ti-card"><h2>Who does what</h2><p class="ti-sub">Owners change roles and approve spend over the budget. Editors plan, book, invite and check people in. Viewers can see everything.</p>
        <ul class="ti-kpis" style="margin-top:12px">${C.team.map((m) => `<li style="grid-template-columns:minmax(0,1fr) auto;align-items:center"><span>${esc(m.name || m.email)}<small class="bb-meta" style="display:block;margin:0">${esc(m.email)}</small></span>${C.can.roles && m.email !== C.owner ? `<select data-role="${esc(m.email)}" aria-label="Role for ${esc(m.name || m.email)}" style="min-height:40px">${["owner", "editor", "viewer"].map((r) => `<option${r === m.role ? " selected" : ""} value="${r}">${r[0].toUpperCase() + r.slice(1)}</option>`).join("")}</select>` : `<span class="ti-badge soft">${esc(m.role)}</span>`}</li>`).join("")}</ul>
        ${C.can.roles ? `<label class="bb-field" style="margin-top:14px"><span>Everyone else on your team</span><select id="mr"><option value="editor"${C.memberRole === "editor" ? " selected" : ""}>Can edit</option><option value="viewer"${C.memberRole === "viewer" ? " selected" : ""}>Can view</option></select><small>New teammates join from your workspace settings.</small></label>` : ""}</section>
      <section class="ti-card quiet" style="margin-top:16px"><h3>${icon("shield")} Spend</h3><p class="ti-sub">A booking that would take this campaign past its budget waits for an owner's OK. Your team's own approval rule still applies on top, from <a href="/teams/bookings">Bookings</a>.</p></section></div></div>`;
    if (ro) return;
    $("#pf").onsubmit = act(async (e) => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      await api(`/api/campaigns/${C.id}`, { title: f.title, goal: f.goal, audience: { tags: f.tags, perPerson: f.perPerson }, cities: f.cities, budget: f.budget, start: f.start, end: f.end, status: f.status, kpis: { attendees: f.attendees.replace(/\D/g, ""), meetings: f.meetings.replace(/\D/g, ""), againPct: f.againPct.replace(/\D/g, "") } }, "PATCH");
      BB.toast("Saved"); await refresh(); });
    $$("[data-role]").forEach((s) => (s.onchange = act(async () => { await api(`/api/campaigns/${C.id}/team`, { email: s.dataset.role, role: s.value }); BB.toast("Role changed"); await refresh(); })));
    $("#mr") && ($("#mr").onchange = act(async () => { await api(`/api/campaigns/${C.id}`, { memberRole: $("#mr").value }, "PATCH"); BB.toast("Saved"); await refresh(); }));
  }

  // ---- Source ----
  async function source() { $("#pane").innerHTML = `<p class="bb-meta">Finding what fits…</p>`; let S; try { S = await api(`/api/campaigns/${C.id}/source`); } catch (e) { $("#pane").innerHTML = `<p>${esc(e.message)}</p>`; return; }
    const people = Math.max(8, Math.round((C.goals?.attendees || 40) / Math.max(1, (C.cities || []).length * 2)));
    const bookLink = (h) => `/teams/book/${encodeURIComponent(h.handle)}/${encodeURIComponent(h.pkg)}?people=${Math.min(20, people)}&campaign=${C.id}`;
    $("#pane").innerHTML = `<p class="ti-sub" style="margin-bottom:12px">Suggestions for <b>${esc((C.audience?.tags || []).join(", ") || "everyone")}</b>${C.audience?.perPersonCents ? `, around ${money(C.audience.perPersonCents)} a person` : ""}, from <a href="/teams/insights">Insights</a>. Booking from here adds it to this campaign.</p>
      ${S.byCity.map((X) => `<section class="ti-sec" style="padding-top:8px"><h2>${esc(X.city || "Anywhere")}</h2>
        <div class="ti-grid two"><div class="ti-card"><h3>Hosts who fit</h3>${X.hosts.length ? `<ol class="ti-fit">${X.hosts.map((h) => `<li><span class="ti-score">${h.score}</span><div><h3>${esc(h.name)}${h.trusted ? `<span class="ti-badge blue">Trusted</span>` : ""}</h3><p class="bb-meta" style="margin:0">${esc(h.pkgName)} · ${esc(h.area)}${h.perPersonCents ? ` · ${money(h.perPersonCents)} a person` : ""}</p><ul class="ti-why">${h.why.slice(1).map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>
          <div class="r" style="display:grid;gap:6px">${h.pkg ? `${C.can.book ? `<a class="bb-btn primary" href="${bookLink(h)}">Request to book</a>` : ""}<a class="bb-link" href="/teams/x/${esc(h.handle)}/${esc(h.pkg)}">See it</a>` : ""}</div></li>`).join("")}</ol>` : `<p class="ti-sub">No bookable hosts here yet. <a href="/teams/discover">Browse every host</a>.</p>`}</div>
        <div class="ti-card"><h3>What resonates here</h3>${X.kinds.length ? `<ul class="ti-bars" style="margin-top:10px">${X.kinds.map((k) => `<li><span class="l">${esc(k.label)}</span><span class="b"><i style="width:${k.score}%"></i></span><span class="v">${k.score}</span></li>`).join("")}</ul><p class="bb-meta" style="margin-top:10px">Fit out of 100. ${esc(X.kinds[0].why[0] || "")}.</p>` : `<p class="ti-sub">Not enough yet here.</p>`}</div></div></section>`).join("")}
      <section class="ti-sec"><h2>Your team's shortlists</h2><p class="ti-sub">Votes from your team, most first. Link the ones that belong to this campaign.</p>
        ${S.shortlists.length ? S.shortlists.map((l) => `<div class="ti-ev"><div><h3><a href="/teams/list/${l.id}">${esc(l.title)}</a></h3><p class="meta">${l.n} options${l.items.length ? ` · top: ${l.items[0].votes} ${l.items[0].votes === 1 ? "vote" : "votes"}` : ""}</p></div>${C.can.plan ? `<button class="bb-btn ${l.linked ? "ink" : "quiet"}" data-sl="${l.id}" data-on="${l.linked ? 1 : 0}" aria-pressed="${l.linked}">${l.linked ? `${icon("check")}Linked` : "Link to this campaign"}</button>` : l.linked ? `<span class="ti-badge">Linked</span>` : ""}</div>`).join("") : `<div class="ti-empty"><p>No shortlists yet. Save options from <a href="/teams/discover">Discover hosts</a> and your team can vote.</p></div>`}</section>`;
    $$("[data-sl]").forEach((b) => (b.onclick = act(async () => { await api(`/api/campaigns/${C.id}/shortlists`, { id: b.dataset.sl, remove: b.dataset.on === "1" }); await load(); source(); })));
  }

  // ---- Book ----
  async function book() { const B = C.budget; let more = []; try { more = (await api(`/api/campaigns/${C.id}/bookable`)).bookings; } catch {}
    $("#pane").innerHTML = `<div class="ti-grid two"><div><section class="ti-card"><h2>Budget</h2>${B.budgetCents ? `${meterHtml(B)}<div class="ti-legend"><span><i></i>Committed</span><span><i class="p"></i>Waiting on a reply or an OK</span><span><i class="r"></i>Left</span></div>` : `<p class="ti-sub">No budget yet. Set one in <a href="/teams/campaigns/${C.id}/plan">Plan</a>.</p>`}
        <div class="ti-money"><div><span>Budget</span><b>${money(B.budgetCents)}</b></div><div><span>Committed</span><b>${money(B.committedCents)}</b></div><div><span>Spent so far</span><b>${money(B.spentCents)}</b></div><div><span>${B.over ? "Over by" : "Remaining"}</span><b style="${B.over ? "color:var(--pl-danger)" : ""}">${money(Math.abs(B.remainingCents))}</b></div></div>
        ${B.pendingCents ? `<p class="bb-meta" style="margin-top:8px">If everything waiting goes through: ${money(B.afterPendingCents)} left.</p>` : ""}</section>
      <section class="ti-sec"><h2>Bookings in this campaign</h2>${C.bookings.length ? C.bookings.map((r) => `<div class="ti-ev"><div><span class="bb-status ${r.status}">${esc(STATUS[r.status] || r.status)}</span><h3 style="margin-top:6px"><a href="${r.url}">${esc(r.name)}</a></h3><p class="meta">${esc(r.host)} · ${r.date ? day(r.date, { weekday: "short" }) : "Date to agree"} · ${r.headcount} people${r.area ? " · " + esc(r.area) : ""}</p>${r.approval && r.status === "approval" ? `<p class="meta">${icon("shield")} ${esc(r.approval.rule || "")}</p>` : ""}</div>
          <div class="r">${money(r.totalCents)}<small>${r.paidCents ? money(r.paidCents) + " paid" : "nothing paid yet"}</small>${C.can.book ? `<button class="bb-link" data-unlink="${r.id}" style="font-size:13px;margin-top:6px">Take out of campaign</button>` : ""}</div></div>`).join("") : `<div class="ti-empty"><p>No bookings yet. Find a host in <a href="/teams/campaigns/${C.id}/source">Source</a>.</p></div>`}</section></div>
      <div>${C.can.book ? `<section class="ti-card"><h3>Book a host</h3><p class="ti-sub">Request to book from a host's page. It joins this campaign, and your approval rules apply.</p><div class="ti-actions"><a class="bb-btn primary" href="/teams/campaigns/${C.id}/source">See hosts who fit</a><a class="bb-btn quiet" href="/teams/discover">Browse all</a></div>
        ${more.length ? `<label class="bb-field" style="margin-top:8px"><span>Or add one your team already made</span><select id="att"><option value="">Pick a booking</option>${more.map((r) => `<option value="${r.id}">${esc(r.name)}, ${esc(r.host)}${r.date ? ", " + day(r.date) : ""} (${money(r.totalCents)})</option>`).join("")}</select></label><button class="bb-btn" id="attGo">Add to this campaign</button>` : ""}</section>` : ""}
        <section class="ti-card" style="margin-top:16px"><h3>Other costs</h3><p class="ti-sub">Swag, travel, a photographer. They count toward the budget.</p>
          ${(C.costs || []).length ? `<ul class="ti-kpis" style="margin:10px 0">${C.costs.map((x) => `<li><span>${esc(x.label)}${x.paid ? ` <span class="ti-badge soft">Paid</span>` : ""}</span><span><b>${money(x.cents)}</b>${C.can.book ? ` <button class="bb-link" data-rmc="${x.id}" aria-label="Remove ${esc(x.label)}">Remove</button>` : ""}</span></li>`).join("")}</ul>` : ""}
          ${C.can.book ? `<form id="cf" class="bb-row" style="align-items:end"><label class="bb-field"><span>What for</span><input name="label" placeholder="Notebooks for every guest"></label><label class="bb-field"><span>Amount</span><input name="amount" inputmode="numeric" placeholder="$600"></label><label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" name="paid"> Already paid</label><button class="bb-btn" type="submit">Add the cost</button></form>` : ""}</section></div></div>`;
    $$("[data-unlink]").forEach((b) => (b.onclick = act(async () => { await api(`/api/campaigns/${C.id}/bookings`, { id: b.dataset.unlink, remove: true }); await refresh(); })));
    $("#attGo") && ($("#attGo").onclick = act(async () => { const v = $("#att").value; if (!v) return; await api(`/api/campaigns/${C.id}/bookings`, { id: v }); BB.toast("Added"); await refresh(); }));

      <section class="ti-sec"><h2>Each event</h2><div class="ti-scroll"><table class="ti-table"><thead><tr><th>Event</th><th>Invited</th><th>Replied</th><th>In</th><th>Came</th><th class="wide">Show rate</th><th>Would go again</th><th class="wide">Follow-ups</th><th>Cost per guest</th></tr></thead><tbody>
        ${C.events.map((e) => `<tr${["cancelled", "declined"].includes(e.status) ? ' class="hid"' : ""}><td><b>${esc(e.name)}</b><small class="bb-meta" style="display:block;margin:0">${e.date ? esc(day(e.date)) : ""} · ${esc(STATUS[e.status] || e.status)}</small></td><td class="n">${e.invited}</td><td class="n">${e.replied}</td><td class="n">${e.yes}</td><td class="n">${e.status === "done" ? e.attended : ""}</td><td class="n wide">${pc(e.showPct)}</td><td class="n">${e.againPct != null ? e.againPct + "%" : e.againAnswered ? "<small>Under 10 answers</small>" : ""}</td><td class="n wide">${e.followUps}</td><td class="n">${e.costPerAttendeeCents == null ? "" : money(e.costPerAttendeeCents)}</td></tr>`).join("")}</tbody></table></div></section>
      <div class="ti-grid halves"><section class="ti-card"><h2>What guests said</h2>${T.themes.shown ? (T.themes.themes.length ? `<ul class="ti-bars" style="margin-top:10px">${T.themes.themes.map((t) => `<li><span class="l">${esc(t.label)}</span><span class="b"><i style="width:${t.sharePct}%"></i></span><span class="v">${t.sharePct}%</span></li>`).join("")}</ul>` : "<p>No one theme stood out.</p>") : `<p class="ti-sub">Themes show once 10 or more guests have said something.</p>`}
        ${T.quotes.length ? T.quotes.map((x) => `<blockquote style="margin:14px 0 0;padding-left:14px;border-left:3px solid var(--pl-accent)">${esc(x.text)}<cite style="display:block;font-style:normal;color:var(--pl-soft);font-size:13px;margin-top:4px">${esc(x.name)}, who said you could quote them</cite></blockquote>`).join("") : ""}</section>
      <section class="ti-card"><h2>Follow-ups</h2><p class="ti-sub">Mark who you followed up with and who booked a meeting. Counts go to the report; only guests who share their details go to your CRM.</p>
        ${past.length ? `<div class="ti-scroll" style="max-height:420px;overflow:auto"><table class="ti-guests"><tbody>${past.map((g) => `<tr><td><b>${esc(g.name)}</b><small>${esc(g.company)}</small></td><td>${C.can.guests ? `<select data-fu="${g.id}" aria-label="Follow-up for ${esc(g.name)}" style="min-height:40px">${[["none", "Not yet"], ["sent", "Followed up"], ["meeting", "Meeting booked"]].map(([v, t]) => `<option value="${v}"${g.followUp === v ? " selected" : ""}>${t}</option>`).join("")}</select>` : esc({ none: "Not yet", sent: "Followed up", meeting: "Meeting booked" }[g.followUp])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="ti-sub">After an event, the people who came show here.</p>`}</section></div>
      <div class="ti-actions" style="margin-top:16px">${C.can.export ? `<a class="bb-btn" href="/api/campaigns/${C.id}/export.csv">${icon("download")}Export for your CRM</a>` : ""}${C.can.share ? `<button class="bb-btn primary" id="rep2">${icon("doc")}Share the report</button>` : ""}</div>
      <p class="ti-privacy">${icon("lock")}<span>Would go again shows once 10 or more guests answered, themes once 3 or more said the same, quotes only from people who said yes to being quoted. Feedback is never tied to a name in exports or reports.</span></p>`;
    $$("[data-fu]").forEach((s) => (s.onchange = act(async () => { const r = await api(`/api/campaigns/${C.id}/guests/${s.dataset.fu}`, { followUp: s.value }, "PATCH"); C = r.campaign; BB.toast("Saved"); })));
    $("#rep2") && ($("#rep2").onclick = report);
  }
  id ? detail() : list();
})();
</script></body></html>
