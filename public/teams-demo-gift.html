<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A gift for you · Pottery Lab</title><meta name="description" content="The demo: what a person sees when a brand sends them a gift.">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css">
<style>.gr{max-width:560px;margin:0 auto;padding:24px 0 60px}.gr .art{height:200px;border:1px solid var(--bb-ink);border-radius:var(--bb-r);overflow:hidden;margin:16px 0}.gr .art .bb-art,.gr .art svg{width:100%;height:100%;display:block}
.gr blockquote{margin:16px 0;padding:14px 16px;border-left:3px solid var(--bb-ink);background:var(--bb-card);font:400 18px/1.5 var(--bb-sans)}</style></head>
<body class="bb"><main class="bb-wrap" id="main" aria-busy="true"><p class="bb-meta" style="padding-top:24px">Loading…</p></main>
<script src="/eventart.js"></script><script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, icon, $ } = BB, main = $("#main"), id = location.pathname.split("/").pop(), U = new URLSearchParams(location.search);
  const day = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
  api(`/api/teams/demo/gift/${encodeURIComponent(id)}?k=${encodeURIComponent(U.get("k") || "")}&to=${encodeURIComponent(U.get("to") || "")}`).then((d) => { main.removeAttribute("aria-busy");
    let art = ""; try { art = window.EventArt ? window.EventArt.cover({ title: d.gift.name }, { kind: d.gift.art, title: "", label: "", exact: true }) : ""; } catch {}
    main.innerHTML = `<div class="gr"><p class="bb-kicker">A gift for you ${BB.exampleTag("Demo")}</p><h1>${esc(d.to.first)}, ${esc(d.from.company)} sent you something</h1>
      <div class="art"><span class="bb-art" role="img" aria-label="${esc(d.gift.name)}">${art}</span></div>
      <h2 style="margin:0">${esc(d.gift.name)}</h2><p class="bb-meta">Made by ${esc(d.gift.person)} at ${esc(d.gift.maker)}. ${esc(d.gift.note)}</p>
      <blockquote>${esc(d.note)}<br><small class="bb-meta">${esc(d.from.name)}, ${esc(d.from.company)}</small></blockquote>
      <ul class="bb-facts"><li>${icon("cal")}<span>Arrives by ${esc(day(d.arrive))}, ${esc(d.method.toLowerCase())}</span></li><li>${icon("lock")}<span>${esc(d.address)}</span></li></ul>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="bb-btn primary lg" type="button" data-demo>Add my address</button><button class="bb-btn lg" type="button" data-demo>No thanks</button></div>
      <p class="bb-meta" style="margin-top:14px">This is the demo, so these buttons don't do anything. In real life, saying no thanks means nothing is made or sent.</p></div>`;
    main.querySelectorAll("[data-demo]").forEach((b) => (b.onclick = () => BB.toast("In the demo, nothing is sent."))); })
    .catch((e) => { main.removeAttribute("aria-busy"); main.innerHTML = `<div class="gr"><h1>This gift link has ended</h1><p class="bb-lede">${esc(e.message)}</p><a class="bb-btn" href="/teams/demo?path=gift">Open the demo</a></div>`; });
})();
</script><script src="/teams-demo.js" defer></script></body></html>
