<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Can you still come? · Pottery Lab</title><meta name="description" content="The plan changed. Tell the hosts if you can still come."><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/teams-intel.css"><link rel="stylesheet" href="/teams-panel.css"></head>
<body class="bb ti tp"><header class="bb-top"><div class="in"><a class="bb-logo" aria-label="Pottery Lab home" href="/"><svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg><span>pottery lab</span></a></div></header>
<main class="bb-wrap bb-narrow" id="main"><p class="bb-meta" style="padding-top:24px">Loading</p></main>
<script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, icon, $ } = BB, main = $("#main"), t = location.pathname.split("/")[2] || "";
  const draw = (d) => { const said = d.answer === "yes" ? "You're in for the new plan." : d.answer === "no" ? "You said you can't go. Thanks for telling us." : "";
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">${esc(d.company)} · Change of plan</p><h1>Can you still come?</h1><p class="bb-lede">${esc(d.was.name)} can't go ahead. The new plan is ${esc(d.name)} with ${esc(d.host)}.</p></section>
      <section class="tp-box"><h2>${esc(d.dateLabel)}${d.timeLabel ? ` · ${esc(d.timeLabel)}` : ""}</h2><ul class="tp-lines">${d.changes.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
        ${d.open ? `<div class="tp-acts"><button class="bb-btn primary lg" data-a="yes"${d.answer === "yes" ? " aria-pressed=\"true\"" : ""}>I'm in</button><button class="bb-btn quiet lg" data-a="no"${d.answer === "no" ? " aria-pressed=\"true\"" : ""}>Can't go</button></div>` : ""}
        <p class="bb-meta" id="msg" role="status">${d.open ? (said ? `${icon("check")} ${esc(said)} You can change your answer.` : `Only ${esc(d.company)} sees your answer.`) : `This plan didn't go ahead. ${esc(d.company)} will be in touch.`}</p></section>`;
    main.querySelectorAll("[data-a]").forEach((b) => (b.onclick = async () => { try { draw(await api(`/api/reconfirm/${encodeURIComponent(t)}`, { answer: b.dataset.a })); } catch (er) { $("#msg").textContent = er.message; } })); };
  (async () => { try { draw(await api(`/api/reconfirm/${encodeURIComponent(t)}`)); } catch (er) { main.innerHTML = `<section class="bb-xhead"><h1>This link doesn't work</h1><p class="bb-lede">${esc(er.message)}</p></section>`; } })();
})();
</script></body></html>
