<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How was it · Pottery Lab</title><meta name="description" content="Four quick questions after a hosted event. Every answer is optional and you choose who sees what."><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/teams-intel.css"><link rel="stylesheet" href="/teams-panel.css"></head>
<body class="bb ti tp"><header class="bb-top"><div class="in"><a class="bb-logo" aria-label="Pottery Lab home" href="/"><svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="45" height="45" rx="6"/><path d="M17 11h14M19 11v4l-6 6v9a7 7 0 0 0 7 7h8a7 7 0 0 0 7-7v-9l-6-6v-4"/><circle cx="20.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/><circle cx="27.5" cy="26" r="1.9" stroke="none" style="fill:var(--pl-accent,#29489A)"/></svg><span>pottery lab</span></a></div></header>
<main class="bb-wrap bb-narrow" id="main"><p class="bb-meta" style="padding-top:24px">Loading your questions</p></main>
<script src="/eventart.js"></script><script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, icon, $, $$ } = BB, main = $("#main"), token = location.pathname.split("/")[2] || "";
  const day = (d) => (d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" }) : "");
  const yn = (name, q, v) => `<p class="tp-q">${esc(q)}</p><div class="tp-yn" role="radiogroup" aria-label="${esc(q)}"><label><input type="radio" name="${name}" value="yes"${v === true ? " checked" : ""}> Yes</label><label><input type="radio" name="${name}" value="no"${v === false ? " checked" : ""}> Not really</label></div>`;
  const scale = (name, q, v) => `<label class="bb-field"><span>${esc(q)}</span><select name="${name}"><option value="">Skip</option>${[1, 2, 3, 4, 5].map((n) => `<option value="${n}"${v === n ? " selected" : ""}>${n}${n === 1 ? ", not at all" : n === 5 ? ", very" : ""}</option>`).join("")}</select></label>`;
  const box = (name, title, sub, on) => `<label class="tp-check"><input type="checkbox" name="${name}"${on ? " checked" : ""}><span><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span></label>`;
  async function draw() { let d; try { d = await api(`/api/survey/${encodeURIComponent(token)}`); } catch (e) { main.innerHTML = `<section class="bb-xhead"><h1>This link doesn't work</h1><p class="bb-lede">${esc(e.message)}</p></section>`; return; }
    const A = d.answer || {};
    if (!d.past) { main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">${esc(d.event)}</p><h1>See you there</h1><p class="bb-lede">These questions open after the event on ${esc(day(d.date))}.</p></section>`; return; }
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">${esc(d.event)} · with ${esc(d.host)}</p><h1>${d.first ? `Thanks for coming, ${esc(d.first)}` : "Thanks for coming"}</h1><p class="bb-lede">Four quick questions, all optional. ${esc(d.company)} sees totals, never your answers by name. Each yes below is separate, and you can change it later on this page.</p></section>
      <form id="sv" class="ti-card">${yn("useful", "Did you make a useful connection?", A.useful)}${yn("back", "Want to come back to the next one?", A.back)}
        <div class="tp-row">${scale("before", `Before tonight, how much did you think of ${d.company}?`, A.before)}${scale("after", "And now?", A.after)}</div>
        <label class="bb-field" style="margin-top:12px"><span>What did you take away? (optional)</span><textarea name="takeaway" rows="3" maxlength="600">${esc(A.takeaway || "")}</textarea><small>In your own words. ${esc(d.host)} reads these first.</small></label>
        <label class="bb-field"><span>Anything else that stood out? (optional)</span><textarea name="said" rows="2" maxlength="600">${esc(A.said || "")}</textarea></label>
        ${box("quoteOk", "OK to quote me, with my first name", "Only what you wrote above.", A.quoteOk)}
        <p class="ti-k" style="margin-top:18px">You choose</p>
        ${box("listed", "Stay in touch with people from tonight", "Other guests who chose this can see your first name and ask to stay in touch. Your details pass only if you both agree.", A.listed)}
        ${box("followHost", `Follow ${d.host} and hear about their next event`, `Between you and ${d.host}. It isn't a yes to ${d.company}.`, A.followHost)}
        ${box("nextOk", `Save me a spot at ${d.host}'s next one`, "", A.nextOk)}
        ${box("similarOk", "Tell me about similar hosts' next events", "A host who runs something like this may invite you once. Nothing else is shared.", A.similarOk)}
        ${box("contactOk", `${d.company} may contact me about a follow-up`, "Leave it off and they won't get your details from us.", A.contactOk)}
        ${d.side === "host" ? `${box("matchOk", `Let ${d.company} know which company I work for`, "Only the company name, so they can count which teams came.", A.matchOk)}<label class="bb-field"><span>Company (only if you ticked that)</span><input name="company" maxlength="100" value="${esc(A.company || "")}" autocomplete="organization"></label>` : ""}
        ${d.hasEmail ? "" : `<label class="bb-field"><span>Email (only to follow ${esc(d.host)})</span><input name="email" type="email" autocomplete="email"></label>`}
        <label class="bb-field"><span>How people you connect with can reach you (optional)</span><input name="contact" maxlength="160" value="${esc(A.contact || "")}" placeholder="An email or a profile link"><small>Shown only to someone you both chose.</small></label>
        <button class="bb-btn primary lg" type="submit">${d.answer ? "Save changes" : "Send"}</button><p class="bb-meta" id="msg" role="status"></p></form>
      ${people(d)}<div id="pairs"></div>`;
    threads();
    $("#sv").onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target), b = (k) => f.get(k) === "on", y = (k) => (f.get(k) === "yes" ? true : f.get(k) === "no" ? false : null);
      try { await api(`/api/survey/${token}`, { useful: y("useful"), back: y("back"), before: f.get("before") || null, after: f.get("after") || null, said: f.get("said") || "", takeaway: f.get("takeaway") || "", similarOk: b("similarOk"), quoteOk: b("quoteOk"), listed: b("listed"), followHost: b("followHost"), nextOk: b("nextOk"), contactOk: b("contactOk"), matchOk: b("matchOk"), company: f.get("company") || "", email: f.get("email") || "", contact: f.get("contact") || "" });
        BB.toast("Thank you. Saved."); draw(); } catch (er) { $("#msg").textContent = er.message; } };
    $$("[data-ask]").forEach((b) => (b.onclick = async () => { try { await api(`/api/survey/${token}/connect`, { to: b.dataset.ask }); BB.toast("Asked. They'll see it on their page."); draw(); } catch (er) { BB.toast(er.message); } }));
    $$("[data-ans]").forEach((b) => (b.onclick = async () => { try { await api(`/api/survey/${token}/connect`, { to: b.dataset.ans, answer: b.dataset.yes === "1" }); draw(); } catch (er) { BB.toast(er.message); } }));
  }
  // a light thread with each person you both said yes to, and a nudge to meet again within two weeks
  async function threads() { const el = $("#pairs"); if (!el) return; let P; try { P = await api(`/api/survey/${encodeURIComponent(token)}/pairs`); } catch { return; } if (!P.pairs.length) { el.innerHTML = ""; return; }
    const t = (x) => new Date(x).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    el.innerHTML = P.pairs.map((p) => `<section class="ti-card tp-pair" style="margin-top:16px" data-pair="${esc(p.id)}"><h2>You and ${esc(p.with)}</h2><p class="ti-sub">You both chose to stay in touch. Two weeks is a good window to meet again.${p.contact ? ` ${esc(p.with)}: ${esc(p.contact)}` : ""}</p>
      <div class="bb-thread">${p.messages.length ? p.messages.map((m) => `<div class="bb-msg${m.mine ? " me" : ""}${m.system ? " sys" : ""}"><p>${esc(m.text)}</p><time>${esc(t(m.at))}</time></div>`).join("") : `<p class="bb-meta">Say hello, or suggest a coffee.</p>`}</div>
      <form class="tp2-send" data-send><label class="bb-field"><span>Message ${esc(p.with)}</span><input name="text" maxlength="1000" placeholder="Coffee next week?" autocomplete="off"></label><button class="bb-btn primary" type="submit">Send</button></form>
      <label class="tp-check" style="margin-top:10px"><input type="checkbox" data-met${p.met ? " checked" : ""}><span><b>We met up</b><small>${p.theyMet ? `${esc(p.with)} said you did.` : "Only counted, never shown to the brand by name."}</small></span></label></section>`).join("");
    $$("[data-pair]", el).forEach((box) => { const id = box.dataset.pair;
      box.querySelector("[data-send]").onsubmit = async (e) => { e.preventDefault(); const v = e.target.text.value.trim(); if (!v) return; try { await api(`/api/survey/${token}/pairs/${id}`, { text: v }); threads(); } catch (er) { BB.toast(er.message); } };
      box.querySelector("[data-met]").onchange = async (e) => { try { await api(`/api/survey/${token}/pairs/${id}`, { met: e.target.checked }); BB.toast(e.target.checked ? "Glad you met." : "Saved"); } catch (er) { BB.toast(er.message); } }; }); }
  function people(d) { const C = d.connections; if (!d.answer?.listed) return "";
    return `<section class="ti-card" style="margin-top:16px"><h2>Which people do you want to stay in touch with?</h2><p class="ti-sub">Only guests who chose to be listed. Nobody sees your details unless you both agree.</p>
      ${C.incoming.length ? `<p class="ti-k" style="margin-top:12px">Asked to stay in touch with you</p><ul class="tp-lines">${C.incoming.map((x) => `<li style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${esc(x.first)}</span><span style="display:flex;gap:6px"><button class="bb-btn primary" data-ans="${esc(x.from)}" data-yes="1">Yes</button><button class="bb-btn quiet" data-ans="${esc(x.from)}">No thanks</button></span></li>`).join("")}</ul>` : ""}
      ${C.mutual.length ? `<p class="ti-k" style="margin-top:12px">You both chose each other</p><ul class="tp-lines">${C.mutual.map((x) => `<li><b>${esc(x.first)}</b> · ${esc(x.contact || "No contact shared yet")}</li>`).join("")}</ul>` : ""}
      ${d.others.length ? `<p class="ti-k" style="margin-top:12px">From tonight</p><ul class="tp-lines">${d.others.filter((o) => !C.mutual.some((m) => m.token === o.token) && !C.incoming.some((i) => i.from === o.token)).map((o) => `<li style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><span><b>${esc(o.first)}</b> <span class="bb-meta">${esc(o.from)}</span></span>${C.asked.includes(o.token) ? `<span class="bb-meta">${icon("check")} Asked</span>` : `<button class="bb-btn" data-ask="${esc(o.token)}">Stay in touch</button>`}</li>`).join("")}</ul>` : `<p class="bb-meta">No one else has chosen this yet. Check back in a day or two.</p>`}</section>`; }
  draw();
})();
</script></body></html>
