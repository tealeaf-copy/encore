<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A host you might like · Pottery Lab</title><meta name="description" content="You asked to hear about hosts like one you went to. Follow this one in one tap, or don't."><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/system.css"><link rel="stylesheet" href="/brandbook.css"><link rel="stylesheet" href="/teams-intel.css"><link rel="stylesheet" href="/teams-panel.css"></head>
<body class="bb ti tp"><header class="bb-top"><div class="in"><a class="bb-logo" href="/"><svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.2h8M11.1 4.2v1.7c0 1.2-.9 1.8-.9 2.9 0 1.3-5.5 3.2-5.5 8.9 0 4.5 4.1 7.3 9.3 7.3s9.3-2.8 9.3-7.3c0-5.7-5.5-7.6-5.5-8.9 0-1.1-.9-1.7-.9-2.9V4.2M12.7 19.2c.8.55 1.8.55 2.6 0"/></svg><span>Pottery Lab</span></a></div></header>
<main class="bb-wrap bb-narrow" id="main"><p class="bb-meta" style="padding-top:24px">Loading</p></main>
<script src="/brandbook.js"></script>
<script>
(function () {
  const { esc, api, icon, $ } = BB, main = $("#main"), id = location.pathname.split("/")[2] || "", e = new URLSearchParams(location.search).get("e") || "";
  (async () => { let d; try { d = await api(`/api/xo/${encodeURIComponent(id)}`); } catch (er) { main.innerHTML = `<section class="bb-xhead"><h1>This link doesn't work</h1><p class="bb-lede">${esc(er.message)}</p></section>`; return; }
    main.innerHTML = `<section class="bb-xhead"><p class="bb-kicker">You asked to hear about hosts like this</p><h1>${esc(d.host)}</h1><p class="bb-lede">${esc(d.tagline || `${d.host} hosts in ${d.city || "your city"}.`)}</p>
      <div class="tp-acts">${e ? `<button class="bb-btn primary lg" id="fol">Follow ${esc(d.host)}</button>` : ""}<a class="bb-btn quiet lg" href="/@${esc(d.handle)}">See their page</a></div><p class="bb-meta" id="msg" role="status">You'll only hear from ${esc(d.host)} if you follow. Nothing else was shared.</p></section>`;
    $("#fol") && ($("#fol").onclick = async () => { try { await api(`/api/xo/${encodeURIComponent(id)}/follow`, { e }); $("#msg").innerHTML = `${icon("check")} You follow ${esc(d.host)} now.`; $("#fol").disabled = true; } catch (er) { $("#msg").textContent = er.message; } });
  })();
})();
</script></body></html>
